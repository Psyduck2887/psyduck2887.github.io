<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03040a">
<meta name="format-detection" content="telephone=no">
<title>我的回合</title>
<style>
:root {
  --cyan: #62f4ff; --pink: #ff4fd8; --gold: #ffe08a; --red: #ff2d55; --ink: #03040a;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --num: "Avenir Next", "Futura", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: #010103; overflow: hidden; font-family: var(--font); color: #fff;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none;
}
body { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, #0b0d22 0%, #010103 70%); }
#frame { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: var(--ink); }
/* 电脑浏览器里保持横屏比例 */
@media (max-aspect-ratio: 16/10) and (pointer: fine) { #frame { height: calc(100vw / 1.6); border-radius: 14px; } }
@media (min-aspect-ratio: 22/9) and (pointer: fine) { #frame { width: calc(100vh * 2.2); border-radius: 14px; } }
canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#scene { visibility: hidden; }
#frame.fallback #scene { visibility: visible; }
#frame.fallback #gl { display: none; }
#touch { position: absolute; inset: 0; z-index: 3; touch-action: none; }
#ui { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.screen {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; pointer-events: none;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 18px);
}
.screen.on { opacity: 1; visibility: visible; transition: opacity .35s ease; pointer-events: auto; }
button { font-family: var(--font); color: #fff; border: 0; background: none; cursor: pointer; pointer-events: auto; }

/* 标题 */
#title { justify-content: space-between; gap: 24px; background: linear-gradient(90deg, rgba(3,4,10,0.82) 0%, rgba(3,4,10,0.25) 45%, rgba(3,4,10,0.25) 60%, rgba(3,4,10,0.8) 100%); }
.title-left { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding-left: 2vw; }
.logo { font-weight: 900; font-size: clamp(44px, 11vh, 86px); letter-spacing: 0.06em; line-height: 1; white-space: nowrap; perspective: 600px; }
.logo span { display: inline-block; transform-origin: 50% 55%; animation: flip 7s infinite; color: #eaffff; text-shadow: 0 0 3px #fff, 0 0 10px var(--cyan), 0 0 26px var(--cyan), 0 0 52px var(--cyan); }
.logo span:nth-child(3), .logo span:nth-child(4) { animation-name: flipb; color: #ffe9fb; text-shadow: 0 0 3px #fff, 0 0 10px var(--pink), 0 0 26px var(--pink), 0 0 52px var(--pink); }
.logo span:nth-child(2) { animation-delay: .08s; } .logo span:nth-child(3) { animation-delay: .16s; } .logo span:nth-child(4) { animation-delay: .24s; }
@keyframes flip {
  0%, 80% { transform: rotateX(0); color: #eaffff; text-shadow: 0 0 3px #fff, 0 0 10px var(--cyan), 0 0 26px var(--cyan), 0 0 52px var(--cyan); }
  86% { transform: rotateX(90deg); }
  86.1% { color: #ffe9fb; text-shadow: 0 0 3px #fff, 0 0 10px var(--pink), 0 0 26px var(--pink), 0 0 52px var(--pink); }
  92%, 100% { transform: rotateX(0); color: #ffe9fb; text-shadow: 0 0 3px #fff, 0 0 10px var(--pink), 0 0 26px var(--pink), 0 0 52px var(--pink); }
}
@keyframes flipb {
  0%, 80% { transform: rotateX(0); color: #ffe9fb; text-shadow: 0 0 3px #fff, 0 0 10px var(--pink), 0 0 26px var(--pink), 0 0 52px var(--pink); }
  86% { transform: rotateX(90deg); }
  86.1% { color: #eaffff; text-shadow: 0 0 3px #fff, 0 0 10px var(--cyan), 0 0 26px var(--cyan), 0 0 52px var(--cyan); }
  92%, 100% { transform: rotateX(0); color: #eaffff; text-shadow: 0 0 3px #fff, 0 0 10px var(--cyan), 0 0 26px var(--cyan), 0 0 52px var(--cyan); }
}
.sub { font-family: var(--num); font-weight: 900; font-size: clamp(14px, 3.4vh, 22px); letter-spacing: 0.55em; color: #fff3c9; text-shadow: 0 0 8px rgba(255,224,138,0.9), 0 0 20px rgba(255,180,80,0.6); }
.tagline { font-size: 13px; color: rgba(255,255,255,0.62); letter-spacing: 0.08em; }
.rules { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: rgba(255,255,255,0.78); }
.rules div { display: flex; align-items: center; gap: 9px; }
.rules svg { width: 16px; height: 16px; flex: none; }
.title-right { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 230px; padding-right: 2vw; }
.btn-main {
  width: 220px; height: 58px; border-radius: 29px; font-size: 22px; font-weight: 900; letter-spacing: 0.5em; padding-left: 0.5em;
  background: linear-gradient(180deg, rgba(98,244,255,0.22), rgba(98,244,255,0.06)); border: 2px solid var(--cyan);
  box-shadow: 0 0 16px rgba(98,244,255,0.55), inset 0 0 18px rgba(98,244,255,0.25); text-shadow: 0 0 10px var(--cyan);
  animation: pulse 1.8s ease-in-out infinite;
}
.btn-main:active, .btn:active { transform: scale(0.96); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 14px rgba(98,244,255,0.45), inset 0 0 16px rgba(98,244,255,0.2); } 50% { box-shadow: 0 0 30px rgba(98,244,255,0.85), inset 0 0 22px rgba(98,244,255,0.35); } }
.btn { min-width: 120px; height: 42px; border-radius: 21px; font-size: 15px; font-weight: 800; letter-spacing: 0.12em; padding: 0 20px 0 calc(20px + 0.12em); background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.35); }
.btn.primary { border-color: var(--cyan); background: rgba(98,244,255,0.14); box-shadow: 0 0 16px rgba(98,244,255,0.35); text-shadow: 0 0 8px var(--cyan); }
.btn.gold { border-color: var(--gold); background: rgba(255,224,138,0.12); box-shadow: 0 0 14px rgba(255,224,138,0.3); }
.toggles { display: flex; gap: 10px; font-size: 12px; }
.toggle { height: 28px; padding: 0 13px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); color: rgba(255,255,255,0.75); background: rgba(0,0,0,0.25); }
.toggle b { color: var(--cyan); font-weight: 800; margin-left: 4px; }
.toggle.off b { color: rgba(255,255,255,0.4); }
.record { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.06em; }
.coin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; background: radial-gradient(circle at 35% 35%, #fff6c9, #ffd35a 45%, #c98b14); box-shadow: 0 0 6px rgba(255,211,90,0.7), inset 0 0 0 1.5px rgba(150,95,10,0.5); }
.coins { display: inline-flex; align-items: center; gap: 6px; font-family: var(--num); font-weight: 800; font-size: 15px; color: #ffe7a3; }
.title-meta { display: flex; align-items: center; gap: 12px; }
.loadout { font-size: 11.5px; color: rgba(255,255,255,0.6); letter-spacing: 0.05em; }
.btn .dot, .badge-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ff4f7a; box-shadow: 0 0 8px #ff4f7a; margin-left: 6px; vertical-align: 2px; }

/* 商店：人形 / 鬼形两个页签，每页 3 张角色卡 */
#shop { flex-direction: column; gap: 10px; background: rgba(3,4,10,0.86); justify-content: flex-start; }
.shop-top { width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 20px; }
.tab { height: 32px; min-width: 84px; border-radius: 16px; font-size: 14px; font-weight: 800; letter-spacing: 0.2em; color: rgba(255,255,255,0.6); }
.tab.on { background: rgba(98,244,255,0.16); color: #fff; box-shadow: inset 0 0 0 1.5px var(--cyan); }
.shop-cards { width: 100%; max-width: 900px; display: flex; gap: 12px; justify-content: center; flex: 1; min-height: 0; }
.scard { flex: 1; max-width: 270px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 12px; border-radius: 16px; background: rgba(10,12,28,0.9); border: 1.5px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
.scard canvas { position: static; width: 78px; height: 78px; flex: none; }
.scard .nm { font-size: 17px; font-weight: 900; }
.scard .ds { font-size: 11px; color: rgba(255,255,255,0.55); }
.scard .sk { width: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.scard .sk div { display: flex; gap: 7px; align-items: flex-start; font-size: 11px; line-height: 1.4; color: rgba(255,255,255,0.75); }
.scard .sk em { font-style: normal; color: rgba(255,255,255,0.45); margin-left: 4px; }
.scard .sk canvas { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.scard .sk b { color: #fff; font-weight: 800; margin-right: 3px; }
.scard .act { margin-top: auto; padding-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
.scard .state { font-size: 12px; font-weight: 800; letter-spacing: 0.2em; color: var(--cyan); }
.scard .cond { font-size: 10.5px; color: rgba(255,255,255,0.6); text-align: center; }
.scard .bar { width: 80%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); overflow: hidden; }
.scard .bar i { display: block; height: 100%; background: linear-gradient(90deg, #62f4ff, #ff4fd8); }
.scard .btn { height: 34px; min-width: 110px; font-size: 13px; }
.scard.equipped { border-color: var(--cyan); box-shadow: 0 0 18px rgba(98,244,255,0.35), inset 0 0 14px rgba(98,244,255,0.15); }
.scard.locked canvas { filter: grayscale(1) brightness(0.55); }
.scard.locked .nm { color: rgba(255,255,255,0.55); }
.scard.buyable { border-color: rgba(255,224,138,0.7); box-shadow: 0 0 16px rgba(255,224,138,0.25); }
.scard .new { position: absolute; top: 8px; right: 10px; font-size: 10px; font-weight: 900; letter-spacing: 0.15em; color: #ff8fb0; }
.btn:disabled { opacity: 0.45; }
.shop-tip { height: 18px; font-size: 12px; color: rgba(255,255,255,0.55); letter-spacing: 0.05em; }
.res-coins { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.res-coins .total { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.7); }
.res-coins .total .coins { font-size: 20px; }
.res-coins .lines { font-size: 11px; color: rgba(255,255,255,0.5); }
.res-coins .unlock { font-size: 12px; font-weight: 800; color: #ffd27a; }
#out .gain { font-size: 13px; color: rgba(255,255,255,0.7); }
.btn.ad { border-color: rgba(255,224,138,0.8); color: #ffe7a3; }
.ad-left { font-size: 10.5px; color: rgba(255,255,255,0.45); }
.shop-ad { display: flex; align-items: center; gap: 8px; }
/* 复活：对局冻结，写清奖励，倒计时结束自动放弃 */
#revive { background: rgba(3,4,10,0.55); }
#revive .panel { min-width: 330px; }
#revive .why { font-size: 13px; color: rgba(255,255,255,0.7); text-align: center; line-height: 1.6; }
#revive .ring { width: 54px; height: 54px; position: relative; }
#revive .ring svg { width: 54px; height: 54px; transform: rotate(-90deg); }
#revive .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--num); font-size: 18px; }
#toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translate(-50%, 20px); z-index: 8; padding: 8px 18px; border-radius: 18px; background: rgba(8,10,24,0.92); border: 1px solid rgba(255,255,255,0.2); font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
/* 右上角宿主胶囊按钮让位（宽度由平台层写进 --menu-w） */
.shop-top { padding-right: max(0px, var(--menu-w, 0px)); }

/* 阵容亮相：五张卡横排 */
#lineup { flex-direction: column; background: rgba(3,4,10,0.6); }
.lineup-title { font-size: 13px; letter-spacing: 0.4em; color: rgba(255,255,255,0.6); margin-bottom: 12px; }
.cards { display: flex; gap: 10px; justify-content: center; width: 100%; max-width: 900px; }
.card {
  flex: 1; max-width: 165px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px 10px; border-radius: 16px;
  background: rgba(10,12,28,0.85); border: 1.5px solid rgba(255,255,255,0.1);
  transform: translateY(40px); opacity: 0; transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .3s, border-color .12s, box-shadow .12s;
}
.card.in { transform: translateY(0); opacity: 1; }
.card.out { transform: translateY(-50px); opacity: 0; transition: transform .35s ease-in, opacity .35s; }
.card canvas { position: static; width: 58px; height: 58px; }
.card .nm { font-size: 16px; font-weight: 900; }
.card .ds { font-size: 11px; color: rgba(255,255,255,0.55); text-align: center; min-height: 15px; }
.card .ch { font-size: 10.5px; color: rgba(255,255,255,0.7); text-align: center; line-height: 1.5; }
.card .tg { margin-top: 2px; font-size: 14px; font-weight: 900; min-width: 28px; height: 24px; padding: 0 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.card.hl { border-color: var(--c); box-shadow: 0 0 20px var(--c), inset 0 0 14px var(--c); }
.card.ghost { border-color: var(--c); box-shadow: 0 0 34px var(--c), inset 0 0 22px var(--c); }
.card.ghost .tg { background: var(--c); color: #05030a; }
.card.you { border-color: rgba(255,255,255,0.45); }
.roulette-hint { margin-top: 14px; height: 22px; font-size: 15px; font-weight: 800; letter-spacing: 0.2em; color: #fff; text-shadow: 0 0 10px var(--red); }

/* 暂停 / 出局 / 结算 */
.panel {
  max-width: 92vw; max-height: 100%; border-radius: 22px; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  background: rgba(8,10,24,0.9); border: 1.5px solid rgba(255,255,255,0.14); box-shadow: 0 0 40px rgba(0,0,0,0.6);
}
.panel h2 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: 0.12em; }
.row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
#pause .panel { min-width: 300px; }
#out { background: rgba(3,4,10,0.35); }
#out .who { font-size: 20px; font-weight: 900; text-align: center; }
#out .place { font-family: var(--num); font-size: 15px; letter-spacing: 0.3em; color: rgba(255,255,255,0.6); }
#results { background: rgba(3,4,10,0.6); }
#results .panel { flex-direction: row; align-items: stretch; gap: 22px; padding: 18px 22px; }
.res-col { display: flex; flex-direction: column; gap: 10px; justify-content: center; min-width: 260px; }
.res-head { text-align: center; }
.res-place { font-size: 42px; font-weight: 900; letter-spacing: 0.06em; line-height: 1.1; }
.res-sub { font-size: 13px; letter-spacing: 0.3em; color: rgba(255,255,255,0.65); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 100%; }
.stat { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 7px 4px; text-align: center; }
.stat .v { font-family: var(--num); font-size: 20px; font-weight: 900; }
.stat .k { font-size: 10.5px; color: rgba(255,255,255,0.55); margin-top: 2px; }
.hl-list { width: 100%; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; max-height: 130px; overflow: hidden; }
.hl-list .it { display: flex; gap: 10px; align-items: center; opacity: 0; transform: translateY(6px); transition: all .3s; }
.hl-list .it.in { opacity: 1; transform: none; }
.hl-list .tm { font-family: var(--num); color: rgba(255,255,255,0.45); width: 34px; flex: none; font-size: 12px; }
.hl-list .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.rank { width: 100%; display: flex; justify-content: space-between; gap: 4px; }
.rank .p { flex: 1; text-align: center; font-size: 11px; color: rgba(255,255,255,0.7); }
.rank .p i { display: block; width: 22px; height: 22px; margin: 0 auto 4px; border-radius: 50%; font-style: normal; font-family: var(--num); font-weight: 900; font-size: 12px; line-height: 22px; color: #05030a; }
.label { font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.4); align-self: flex-start; }

#pauseBtn {
  position: absolute; left: calc(env(safe-area-inset-left) + 8px); top: calc(env(safe-area-inset-top) + 8px); width: 36px; height: 36px; border-radius: 18px;
  background: rgba(10,12,28,0.6); border: 1px solid rgba(255,255,255,0.18); display: none; align-items: center; justify-content: center; z-index: 5;
}
#pauseBtn.on { display: flex; }
#pauseBtn i { display: block; width: 4px; height: 12px; background: rgba(255,255,255,0.75); margin: 0 2px; border-radius: 2px; }
#rotate { position: absolute; inset: 0; z-index: 9; display: none; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: var(--ink); font-size: 18px; font-weight: 800; letter-spacing: 0.3em; }
#rotate svg { width: 64px; height: 64px; animation: tilt 2s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="frame">
  <canvas id="gl"></canvas>
  <canvas id="scene"></canvas>
  <canvas id="hud"></canvas>
  <div id="touch"></div>
  <div id="ui">
    <button id="pauseBtn" aria-label="暂停"><i></i><i></i></button>

    <section id="title" class="screen">
      <div class="title-left">
        <div class="logo"><span>我</span><span>的</span><span>回</span><span>合</span></div>
        <div class="sub">MY TURN</div>
        <div class="tagline">轮流当鬼的霓虹追逃 · 活到最后</div>
        <div class="rules">
          <div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#62f4ff" stroke-width="2.2"/><circle cx="15" cy="10" r="3" fill="#62f4ff"/></svg><span id="r0"></span></div>
          <div><svg viewBox="0 0 24 24"><path d="M12 3l3 9-3 9-3-9z" fill="#ffe08a"/></svg><span id="r1"></span></div>
          <div><svg viewBox="0 0 24 24"><path d="M6 20V11a6 6 0 0112 0v9l-2-2-2 2-2-2-2 2-2-2z" fill="none" stroke="#ff4fd8" stroke-width="2" stroke-linejoin="round"/></svg><span id="r2"></span></div>
        </div>
      </div>
      <div class="title-right">
        <button id="startBtn" class="btn-main">开始</button>
        <div class="title-meta">
          <button class="btn gold" id="shopBtn">角色</button>
          <span class="coins"><i class="coin"></i><span id="titleCoins">0</span></span>
        </div>
        <div class="loadout" id="titleLoadout"></div>
        <div class="toggles">
          <button class="toggle" id="tSound">声音<b>开</b></button>
          <button class="toggle" id="tVib">震动<b>开</b></button>
        </div>
        <div class="record" id="record"></div>
      </div>
    </section>

    <section id="lineup" class="screen">
      <div class="lineup-title">本局玩家</div>
      <div class="cards" id="cards"></div>
      <div class="roulette-hint" id="rhint"></div>
    </section>

    <section id="shop" class="screen">
      <div class="shop-top">
        <button class="btn" id="shopBack">返回</button>
        <div class="tabs"><button class="tab on" id="tabRunner">人形</button><button class="tab" id="tabGhost">鬼形</button></div>
        <div class="shop-ad">
          <button class="btn ad" id="shopAd" style="display:none">看视频 +80</button>
          <span class="ad-left" id="shopAdLeft"></span>
          <span class="coins"><i class="coin"></i><span id="shopCoins">0</span></span>
        </div>
      </div>
      <div class="shop-cards" id="shopCards"></div>
      <div class="shop-tip" id="shopTip"></div>
    </section>

    <section id="pause" class="screen">
      <div class="panel">
        <h2>暂停</h2>
        <div class="row">
          <button class="btn primary" id="pResume">继续</button>
          <button class="btn" id="pRestart">重新开始</button>
          <button class="btn" id="pHome">返回标题</button>
        </div>
        <div class="toggles">
          <button class="toggle" id="pSound">声音<b>开</b></button>
          <button class="toggle" id="pVib">震动<b>开</b></button>
        </div>
      </div>
    </section>

const REACH = { blink: 0.5, hook: 0.4, charge: 0.3, stomp: 0.2 };
function ghostReach(g) {
  let r = g.pounceCd < 0.6 ? 0.3 : 0;
  const ids = skillsOf(g);
  for (let s = 0; s < ids.length; s++) if (skillReady(g, s)) r += REACH[ids[s]] || 0;
  return r;
}

// 人对鬼的了解：看得见或在心跳范围里就知道确切位置，否则记得最后一次的位置
function senseGhost(world, a, b) {
  const g = world.ghost && world.ghost.alive ? world.ghost : null;
  if (!g) return null;
  const d = dist(a, g);
  const seen = d <= TUNE.aiVision && visibleTo(world, g, a) && rayClear(world.map, a.x, a.y, g.x, g.y, wallBlock(world));
  if (seen || d <= TUNE.heartRange) {
    b.mem.ghost = { x: g.x, y: g.y, t: world.time };
    b.lastSeenT = world.time;
    return { g, x: g.x, y: g.y, seen, fresh: true };
  }
  const mm = b.mem.ghost;
  if (mm && world.time - mm.t < 5) return { g, x: mm.x, y: mm.y, seen: false, fresh: false };
  return null;
}

const wallBlock = (world) => (i) => world.map.kind[i] === K_WALL;
const moveBlock = (world) => (i) => {
  const k = world.map.kind[i];
  if (k === K_WALL || k === K_LOW) return true;
  if (k === K_PALLET) return world.pallets[world.map.palAt[i]].state === 'down';
  return false;
};

// 结构价值：附近有能用的挡板或矮墙，逃跑时更想往那跑
function structureValue(world, x, y) {
  let v = 0;
  for (const p of world.pallets) {
    if (p.state !== 'up') continue;
    const d = palletDist(p, x, y);
    if (d < 3) v += 1.6 * (1 - d / 3);
  }
  for (const s of world.map.lowSegs) {
    if (world.segs[s.id].blockedUntil > world.time) continue;
    const d = Math.hypot(s.cx - x, s.cy - y);
    if (d < 3.5) v += 1.0 * (1 - d / 3.5);
  }
  return v;
}

// ---------- 入口 ----------
function think(world, a) {
  const b = a.brain;
  const react = b.P.react * (1 + ease(world) * 0.12);
  b.next = world.time + react * world.rng.range(0.8, 1.25);
  a.halt = false;
  if (a.ghost) thinkGhost(world, a, b);
  else thinkRunner(world, a, b);
}

function setGoal(world, a, b, cell, nav) {
  b.spot = null;
  b.goal = cell;
  b.path = cell >= 0 ? nav.path(cell) : [];
  b.pathI = 0;
}

// ---------- 逃跑者 ----------
function thinkRunner(world, a, b) {
  const VG = vgOf(world);
  const P = b.P, m = world.map;
  const gk = senseGhost(world, a, b);
  const g = gk ? gk.g : null;
  const myCell = cellOf(m, a.x, a.y);
  const gf = gk ? ghostField(world, gk.x, gk.y) : null;
  const frozen = g ? Math.max(g.t.freeze, g.t.stun) : 0;
  const gd = gf && gf[myCell] !== Infinity ? gf[myCell] : 99;
  const ed = gk ? Math.hypot(a.x - gk.x, a.y - gk.y) : 99;
  const reach = g ? ghostReach(g) : 0;
  const prev = b.mode;
  const fleeing = prev === 'flee' || prev === 'hold';
  const range = P.threat * (fleeing ? 1.35 : 1) + reach * VG;
  const eff = frozen * VG * 0.8;
  const raw = !!gf && (gd - eff < range || ed - eff < range * 0.6);
  if (raw) b.threatT = world.time;
  // 刚甩开不马上松懈，再多跑一小会儿
  const threat = raw || (fleeing && !!gf && world.time - b.threatT < 1.2);
  const z = world.zone;
  const safeR = z.warned ? z.warnR : z.shrinking ? z.to : z.r;
  const zd = (x, y) => Math.hypot(x - z.cx, y - z.cy);
  const traps = knownTraps(world, a, b);

  runnerSkills(world, a, b, g, gd, threat, frozen);

  if (threat) {
    const gfp = ghostField(world, gk.x, gk.y, true);
    // 守板：鬼最近的路就是从身边这块板穿过来，那就站在板后等它，到跟前再放
    const hp = holdPallet(world, a, g, gf, gfp, myCell, gd);
    if (hp) {
      b.mode = 'hold';
      b.holdP = hp.id;
      b.planP = hp.id;
      b.path = [];
      b.goal = -1;
      b.spot = holdSpot(hp, a);
      if (!fleeing) emote(world, a, '!');
      return;
    }
    b.mode = 'flee';
    b.holdP = -1;
    const best = fleeGoal(world, a, b, gk, gf, gfp, frozen, reach, traps, myCell, prev, safeR, zd);
    setGoal(world, a, b, best, b.nav);
    // 路线要穿过的第一块立着的挡板：穿过去以后鬼跟上来就放
    b.planP = -1;
    for (const c of b.path) if (m.kind[c] === K_PALLET && world.pallets[m.palAt[c]].state === 'up') { b.planP = m.palAt[c]; break; }
    if (!fleeing) { emote(world, a, '!'); say(world, a, 'flee', 0.3); }
    return;
  }
  b.holdP = -1;
  b.planP = -1;

  // 刚逃过一轮的几秒里更怕靠近鬼
  const calm = !gf || world.time - b.threatT > 3;
  const near = gf ? (i) => (gf[i] < 8 ? (8 - gf[i]) * (calm ? 0.8 : 1.6) : 0) : null;
  const d = b.nav.run([myCell], runnerCost(world, near, traps), 80);
  if (zd(a.x, a.y) > safeR - 1.2) {
    b.mode = 'zone';
    let best = -1, bd = 1e9;
    for (let i = 0; i < m.n; i++) {
      if (d[i] === Infinity) continue;
      const x = (i % m.w) + 0.5, y = ((i / m.w) | 0) + 0.5;
      if (zd(x, y) > safeR - 2.2) continue;
      if (d[i] < bd) { bd = d[i]; best = i; }
    }
    setGoal(world, a, b, best, b.nav);
    return;
  }

  // 苟：鬼在附近但没发现自己，就钻草丛不动
  if (gk && P.hide > 1 && gd < 10 && !visibleTo(world, a, g)) {
    if (a.inGrass) { b.mode = 'hide'; a.halt = true; b.path = []; return; }
    let best = -1, bd = 7;
    for (let i = 0; i < m.n; i++) if (m.grass[i] && d[i] < bd && (!gf || gf[i] > 4)) { bd = d[i]; best = i; }
    if (best >= 0) { b.mode = 'hide'; setGoal(world, a, b, best, b.nav); return; }
  }

  // 充能或捡光点；鬼在附近时只去比鬼早到很多的地方
  b.mode = 'collect';
  let best = -1, bs = -1e9, bestTower = null;
  for (const t of world.towers) {
    if (!t.active || t.dormant > 0 || t.energy < 0.04) continue;
    const ti = cellNear(world, t);
    if (ti < 0 || d[ti] === Infinity) continue;
    if (gf && (gf[ti] < 7 || gf[ti] / VG - d[ti] / VR < (calm ? 1.2 : 2.2))) continue;
    const others = world.actors.filter((o) => o !== a && o.alive && !o.ghost && inTower(t, o)).length;
    let s = (Math.min(t.energy, 1 - a.energy) * 30 * t.rate / 0.032) / (d[ti] * 0.35 + 3) / (1 + others * 0.6);
    if (gf) s *= Math.min(1, Math.max(0.2, (gf[ti] - 6) / 10));
    s *= P.greed;
    if (inTower(t, a)) s *= 1.6;
    if (t.id === b.goalId) s *= 1.2;
    if (s > bs) { bs = s; best = ti; bestTower = t; }
  }
  for (const sp of world.sparks) {
    if (d[sp.i] === Infinity) continue;
    if (gf && gf[sp.i] < 5) continue;
    let s = 1.1 / (d[sp.i] * 0.35 + 1.5);
    if (gf) s *= Math.min(1, Math.max(0.1, (gf[sp.i] - 4) / 8));
    if (s > bs) { bs = s; best = sp.i; bestTower = null; }
  }
  if (bestTower && inTower(bestTower, a)) {
    // 已经在塔里：站住充能，偶尔挪一下
    b.goalId = bestTower.id;
    if (!b.spot || world.rng.chance(0.05) || Math.hypot(b.spot.x - bestTower.x, b.spot.y - bestTower.y) > bestTower.r) {
      const ang = world.rng.next() * Math.PI * 2, rr = world.rng.range(0.3, bestTower.r * 0.7);
      b.spot = { x: bestTower.x + Math.cos(ang) * rr, y: bestTower.y + Math.sin(ang) * rr };
    }
    b.path = [];
    b.mode = 'charge';
    return;
  }
  b.goalId = bestTower ? bestTower.id : -1;
  b.spot = null;
  if (best < 0) {
    // 没有安全的塔：鬼在附近就往远离它的方向挪，否则随便走走
    for (let k = 0; k < 24; k++) {
      const i = world.rng.pick(m.floorCells);
      if (d[i] !== Infinity && d[i] > 5 && (!gf || gf[i] > 10)) { best = i; break; }
    }
  }
  setGoal(world, a, b, best, b.nav);
}

// 逃跑目标：只在「比鬼先到」的格里挑（穿过挡板的路线，按放板以后鬼要绕路或打板来算），
// 综合领先时间、身后还有多少安全的格可以接着跑、离鬼多远、附近有没有挡板和矮墙可以周旋
function fleeGoal(world, a, b, gk, gf, gfp, frozen, reach, traps, myCell, prev, safeR, zd) {
  const VG = vgOf(world);
  const P = b.P, m = world.map, nav = b.nav;
  const margin = 0.15 + P.buffer * 0.08 + reach * 0.6;
  const via = b.via || (b.via = new Uint8Array(m.n));
  via[myCell] = 0;
  const danger = (i) => (gf[i] < 4 ? (4 - gf[i]) * 1.5 : 0);
  const gate = (j, nd, i) => {
    const v = via[i] || (m.kind[j] === K_PALLET && world.pallets[m.palAt[j]].state === 'up' ? 1 : 0);
    const gj = v ? gfp[j] : gf[j];
    if (gj !== Infinity && nd / VR + margin >= gj / VG + frozen) return false;
    via[j] = v;
    return true;
  };
  nav.run([myCell], runnerCost(world, danger, traps), 34, gate);
  const d = nav.dist, par = nav.par, order = nav.order, cnt = nav.count;
  const sub = b.sub || (b.sub = new Float32Array(m.n));
  for (let k = 0; k < cnt; k++) sub[order[k]] = 1;
  for (let k = cnt - 1; k > 0; k--) { const i = order[k], p = par[i]; if (p >= 0) sub[p] += sub[i]; }
  const hx = a.vx, hy = a.vy, hl = Math.hypot(hx, hy) || 1;
  let best = -1, bs = -1e9;
  for (let k = 1; k < cnt; k++) {
    const i = order[k], di = d[i];
    if (di < 2) continue;
    const ki = m.kind[i];
    if (ki === K_LOW || (ki === K_PALLET && world.pallets[m.palAt[i]].state === 'down')) continue;
    const gRaw = via[i] ? gfp[i] : gf[i];
    const gi = gRaw === Infinity ? 40 : gRaw;
    const lead = gi / VG - di / VR + frozen;
    const x = (i % m.w) + 0.5, y = ((i / m.w) | 0) + 0.5;
    let s = Math.min(lead, 3) * 2.5 + Math.log2(sub[i] + 1) * 0.9 + Math.min(gi, 18) * 0.2 - di * 0.04;
    if (zd(x, y) > safeR - 0.6) continue;
    if (zd(x, y) > safeR - 1.5) s -= 30;
    if (m.grass[i] && !gk.seen) s += P.hide * 1.2;
    if (i === b.goal && prev === 'flee') s += 1.0;
    const dx = x - a.x, dy = y - a.y, dl = Math.hypot(dx, dy) || 1;
    s += ((dx * hx + dy * hy) / (dl * hl)) * 0.6;
    if (s > bs - 4) s += structureValue(world, x, y) * 0.8;
    if (s > bs) { bs = s; best = i; }
  }
  if (best >= 0) return best;
  // 没有安全的格：不设门槛，往离鬼最远的方向硬冲
  nav.run([myCell], runnerCost(world, danger, traps), 6);
  let bd = -1;
  for (let i = 0; i < m.n; i++) if (d[i] < 4 && gf[i] !== Infinity && (bd < 0 || gf[i] - d[i] * 0.5 > gf[bd] - d[bd] * 0.5)) bd = i;
  return bd;
}

// 守板条件：够得着一块立着的挡板、鬼在另一侧，而且鬼到自己最近的路就是穿过这块板
function holdPallet(world, a, g, gf, gfp, myCell, gd) {
  if (!g || g.t.freeze > 0.5 || g.t.chargeWind > 0) return null;
  const p = nearestPallet(world, a, 1.25);
  if (!p) return null;
  const gs = palletSide(p, g.x, g.y), ms = palletSide(p, a.x, a.y);
  if (!gs || !ms || gs === ms) return null;
  const detour = (gfp[myCell] === Infinity ? 60 : gfp[myCell]) - gd;
  if (detour < 3 || gd < 1.4 || gd > 10) return null;
  return p;
}

// 守板的站位：板后半格，正对缺口
function holdSpot(p, a) {
  const ms = palletSide(p, a.x, a.y) || 1;
  if (p.axis === 'x') return { x: p.cx + ms * 1.05, y: Math.max(p.y0 + 0.5, Math.min(p.y1 + 0.5, a.y)) };
  return { x: Math.max(p.x0 + 0.5, Math.min(p.x1 + 0.5, a.x)), y: p.cy + ms * 1.05 };
}

// 塔附近一个可走的格（中央方尖碑本身是墙）
function cellNear(world, t) {
  const m = world.map;
  if (!t.center) return cellOf(m, t.x, t.y);
  if (t._cell !== undefined) return t._cell;
  let best = -1, bd = 1e9;
  for (let i = 0; i < m.n; i++) {
    if (m.kind[i] !== 0) continue;
    const x = (i % m.w) + 0.5, y = ((i / m.w) | 0) + 0.5;
    const dd = Math.abs(Math.hypot(x - t.x, y - t.y) - 2.8);
    if (dd < bd) { bd = dd; best = i; }
  }
  t._cell = best;
  return best;
}

function runnerSkills(world, a, b, g, gd, threat, frozen) {
  if (!g || !skillReady(a, 0) || a.vault || frozen > 0.3) return;
  const id = skillsOf(a)[0];
  const ed = dist(a, g);
  const closing = (g.vx * (a.x - g.x) + g.vy * (a.y - g.y)) > 0;
  let use = false;
  if (id === 'dash') use = threat && closing && (gd < 5 || ((g.t.wind > 0 || g.t.chargeWind > 0 || g.t.blinkWind > 0 || g.t.hookWind > 0) && ed < 6.5));
  else if (id === 'shield') use = (ed < 1.9 && closing) || ((g.t.wind > 0 || g.t.chargeWind > 0 || g.t.blinkWind > 0) && ed < 4.5);
  else if (id === 'phantom') use = threat && gd < 5.5 && closing;
  if (use && world.rng.chance(0.85 - ease(world) * 0.1)) {
    world.actionFor(a, 'skill1');
    if (id === 'phantom') b.next = world.time; // 立刻重新决策，往和分身不同的方向跑
  }
}

// ---------- 鬼 ----------
function protectedHuman(world, r) {
  return r.isHuman && world.opts.newbie && world.time < 15;
}

function thinkGhost(world, a, b) {
  const VG = vgOf(world);
  const P = b.P, m = world.map;
  const myCell = cellOf(m, a.x, a.y);
  const d = b.nav.run([myCell], ghostCost(world));
  const cands = [];
  for (const r of world.actors) {
    if (!r.alive || r.ghost || protectedHuman(world, r)) continue;
    const ed = dist(a, r);
    let pos = null, exact = false;
    const tiny = world.zone.r < 7;
    if (r.t.reveal > 0 || (tiny && r.t.cloak <= 0)) { pos = r; exact = true; }
    else if (ed <= TUNE.aiVision && visibleTo(world, r, a) && rayClear(m, a.x, a.y, r.x, r.y, wallBlock(world))) { pos = r; exact = true; }
    else if (ed < 4 && r.t.cloak <= 0 && !(r.inGrass && Math.hypot(r.vx, r.vy) < 0.5)) { pos = r; exact = true; }
    else if (world.towers.some((t) => t.charging > 0 && inTower(t, r))) { pos = r; exact = false; }
    else if (b.mem[r.id] && world.time - b.mem[r.id].t < 4) {
      // 追到记忆里的位置还没看到人，就别在原地发呆，忘掉它去巡逻
      const mc = cellOf(m, b.mem[r.id].x, b.mem[r.id].y);
      if (mc >= 0 && d[mc] < 1.5) { delete b.mem[r.id]; continue; }
      pos = b.mem[r.id];
    }
    if (!pos) continue;
    if (exact) b.mem[r.id] = { x: r.x, y: r.y, t: world.time };
    cands.push({ r, pos, exact });
  }
  for (const dc of world.decoys) {
    if (dc.owner === a.id || !visibleTo(world, dc, a) || dist(a, dc) > TUNE.aiVision) continue;
    if (b['fool' + dc.id] === undefined) b['fool' + dc.id] = world.rng.next() > (b.persona === 'oracle' ? 0.6 : 0.3);
    if (!b['fool' + dc.id]) continue;
    const owner = world.actors.find((x) => x.id === dc.owner);
    if (owner && owner.alive && !owner.ghost) {
      const c = cands.find((c) => c.r === owner);
      if (c) { c.pos = dc; c.exact = true; c.decoy = dc; } else cands.push({ r: owner, pos: dc, exact: true, decoy: dc });
    }
  }
  let best = null, bs = -1e9;
  for (const c of cands) {
    const ci = cellOf(m, c.pos.x, c.pos.y);
    if (ci < 0 || d[ci] === Infinity) continue;
    const r = c.r;
    let s = -d[ci] + r.energy * 9;
    if (world.towers.some((t) => t.charging > 0 && inTower(t, r))) s += 3;
    if (!c.exact) s -= 3;
    if (b.persona === 'brute' && r.id === a.grudge) s += 4;
    if (b.persona === 'oracle') s += r.energy * 6;
    if (b.persona === 'showoff' && r.isHuman) s += 2;
    if (r.isHuman) s -= ease(world) * 2;
    if (r.id === b.targetId) s += 2.5;
    if (s > bs) { bs = s; best = { ...c, ci }; }
  }
  b.pounceArmed = false;
  // 圈在缩：自己快到圈外了，除非贴着目标正要抓，先往圈里走
  const z = world.zone;
  const safeR = Math.min(z.r, z.warned ? z.warnR : z.r, z.shrinking ? z.to : z.r);
  const zdOf = (i) => Math.hypot((i % m.w) + 0.5 - z.cx, ((i / m.w) | 0) + 0.5 - z.cy);
  if (Math.hypot(a.x - z.cx, a.y - z.cy) > safeR - 1 && !(best && best.exact && dist(a, best.r) < 4)) {
    let goal = -1, gd = 1e9;
    for (let i = 0; i < m.n; i++) if (d[i] < gd && zdOf(i) < safeR - 2) { gd = d[i]; goal = i; }
    if (goal >= 0) { b.mode = 'zone'; setGoal(world, a, b, goal, b.nav); return; }
  }
  if (!best) {
    if (b.targetId >= 0) emote(world, a, '?');
    b.targetId = -1;
    b.targetPos = null;
    b.mode = 'patrol';
    ghostIdleSkills(world, a, b);
    // 巡逻：先去正在充能的塔，再随机去别的塔；到了塔边就在圈里随便走走
    if (b.wander >= 0 && d[b.wander] > 1.5 && d[b.wander] !== Infinity && world.time < b.wanderUntil) { setGoal(world, a, b, b.wander, b.nav); return; }
    let goal = -1, gs = -1e9;
    for (const t of world.towers) {
      if (!t.active || Math.hypot(t.x - z.cx, t.y - z.cy) > safeR - 1) continue;
      const ti = cellNear(world, t);
      if (d[ti] === Infinity) continue;
      let s = -d[ti] * 0.5 + (t.charging > 0 ? 25 : 0) + (t.glow > 0 ? 6 : 0) + world.rng.next() * 6 - (inTower(t, a) ? 12 : 0);
      if (t.id === b.goalId) s += 4;
      if (s > gs) { gs = s; goal = ti; b.goalId = t.id; }
    }
    if (goal < 0 || d[goal] < 2) {
      for (let k = 0; k < 30; k++) {
        const i = world.rng.pick(m.floorCells);
        const x = (i % m.w) + 0.5, y = ((i / m.w) | 0) + 0.5;
        if (d[i] !== Infinity && d[i] > 4 && Math.hypot(x - z.cx, y - z.cy) < safeR - 1.5) { goal = i; break; }
      }
      b.wander = goal;
      b.wanderUntil = world.time + 4;
    }
    setGoal(world, a, b, goal, b.nav);
    return;
  }
  b.mode = 'chase';
  b.targetId = best.r.id;
  if (best.exact) b.lastSeenT = world.time;
  const tgt = best.decoy || best.r;
  let gx = best.pos.x, gy = best.pos.y;
  if (best.exact && P.predict > 0) {
    const look = Math.min(0.6, d[best.ci] / VG * 0.5) * P.predict;
    gx += (tgt.vx || 0) * look; gy += (tgt.vy || 0) * look;
  }
  let gi = cellOf(m, gx, gy);
  if (gi < 0 || d[gi] === Infinity) gi = best.ci;
  setGoal(world, a, b, gi, b.nav);
  b.targetPos = { x: tgt.x, y: tgt.y, ref: tgt, exact: best.exact };
  b.pounceArmed = best.exact && world.rng.chance(TUNE.aiPounceArm - ease(world) * 0.12);

function dropPallet(world, a) {
  if (a.ghost || a.t.stun > 0 || a.t.root > 0 || a.vault) return false;
  const p = nearestPallet(world, a);
  if (!p) return false;
  p.state = 'down';
  p.dropT = world.time;
  p.by = a.id;
  const overlaps = (e, pad) => e.x + e.r > p.x0 - pad && e.x - e.r < p.x1 + 1 + pad && e.y + e.r > p.y0 - pad && e.y - e.r < p.y1 + 1 + pad;
  const pushOut = (e, side) => {
    if (p.axis === 'x') e.x = side < 0 ? p.x0 - e.r - 0.03 : p.x1 + 1 + e.r + 0.03;
    else e.y = side < 0 ? p.y0 - e.r - 0.03 : p.y1 + 1 + e.r + 0.03;
    e.px = e.x; e.py = e.y;
  };
  const g = world.ghost;
  let stunned = false;
  if (g && g.alive && palletDist(p, g.x, g.y) < g.r + 0.08 && !g.vault) {
    const side = palletSide(p, g.x, g.y) || -palletSide(p, a.x, a.y) || 1;
    pushOut(g, side);
    cancelWind(g);
    g.forced = null; g.breaking = null;
    g.t.stun = Math.max(g.t.stun, TUNE.palletStun * passiveOf(g, 'stunMul'));
    stunned = true;
    a.stats.stuns++;
  }
  for (const r of world.actors) {
    if (!r.alive || r.ghost || !overlaps(r, -0.02)) continue;
    const gs = g ? palletSide(p, g.x, g.y) : 0;
    pushOut(r, gs ? -gs : (palletSide(p, r.x, r.y) || 1));
  }
  world.events.push({ type: 'palletDrop', id: p.id, by: a.id, x: p.cx, y: p.cy, stun: stunned, gid: g ? g.id : -1 });
  if (stunned) world.events.push({ type: 'palletStun', id: g.id, by: a.id, x: g.x, y: g.y });
  return true;
}

// ---------- 主循环 ----------
function updateWorld(world, dt) {
  if (world.phase !== 'play') return;
  world.time += dt;
  let runners = 0;
  for (const a of world.actors) if (a.alive && !a.ghost) runners++;
  world.ghostMul = TUNE.ghostSpeedMul + TUNE.ghostSpeedStep * Math.max(0, 4 - runners);
  updateZone(world);
  updatePallets(world);
  let thinks = 0;
  for (const a of world.actors) {
    a.px = a.x; a.py = a.y; a.tp = false;
    if (!a.alive) continue;
    const t = a.t;
    for (const k of TIMERS) if (t[k] > 0) t[k] = Math.max(0, t[k] - dt);
    if (a._afterWind && !winding(a)) releaseWind(world, a);
    tickCooldowns(a, dt);
    if (a.ghost) a.stats.ghostTime += dt;
    if (a.brain) {
      // 每一步最多让 2 个 AI 做决策（寻路较重），其余顺延到下一步，避免几个 AI 同一帧思考造成卡顿
      if (world.time >= a.brain.next) { if (thinks < 2) { think(world, a); thinks++; } }
      steer(world, a);
    }
    if (a.halt) { a.mx = 0; a.my = 0; }
    moveActor(world, a, dt);
    if (a.tp) { a.px = a.x; a.py = a.y; }
    const ci = Math.floor(a.y) * world.map.w + Math.floor(a.x);
    a.inGrass = ci >= 0 && ci < world.map.n && world.map.grass[ci] === 1;
  }
  updateDecoys(world, dt);
  updateSkillObjects(world, dt);
  checkVoid(world);
  if (world.phase !== 'play') return;
  checkCatches(world);
  if (world.phase !== 'play') return;
  checkCloseCalls(world);
  updateTowers(world, dt);
  updateSparks(world, dt);
}

function updateDecoys(world, dt) {
  for (const d of world.decoys) {
    d.px = d.x; d.py = d.y;
    d.life -= dt;
    decoyThink(world, d, dt);
    moveActor(world, d, dt);
    const ci = Math.floor(d.y) * world.map.w + Math.floor(d.x);
    d.inGrass = ci >= 0 && world.map.grass[ci] === 1;
    if (d.life <= 0 && d.alive) {
      d.alive = false;
      world.events.push({ type: 'decoyEnd', id: d.id, x: d.x, y: d.y, popped: false, color: d.color });
    }
  }
  world.decoys = world.decoys.filter((d) => d.alive);
}

// 碎掉的挡板过一段时间重新立起来（旁边有人时等一等，免得把人卡住）
function updatePallets(world) {
  if (!TUNE.palletRespawn) return;
  const z = world.zone;
  for (const p of world.pallets) {
    if (p.state !== 'broken') continue;
    if (p.brokenT === undefined) { p.brokenT = world.time; continue; }
    if (world.time - p.brokenT < TUNE.palletRespawn) continue;
    if (Math.hypot(p.cx - z.cx, p.cy - z.cy) > z.r - 1) continue;
    if (world.actors.some((a) => a.alive && palletDist(p, a.x, a.y) < a.r + 0.6)) continue;
    p.state = 'up';
    p.brokenT = undefined;
    world.events.push({ type: 'palletBack', id: p.id, x: p.cx, y: p.cy });
  }
}

// ---------- 缩圈 ----------
function updateZone(world) {
  const z = world.zone;
  let zt = world.time + world.zoneOffset;
  const st = ZONE_STAGES[z.next];
  if (world.duel && !z.shrinking) {
    if (st && st.warn - zt > 3) { world.zoneOffset += st.warn - zt - 3; zt = world.time + world.zoneOffset; }
    else if (!st && !z.sudden && SUDDEN.start - zt > 6) { world.zoneOffset += SUDDEN.start - zt - 6; zt = world.time + world.zoneOffset; }
  }
  if (st && !z.warned && zt >= st.warn) {
    z.warned = true;
    z.warnR = st.r;
    world.events.push({ type: 'zoneWarn', stage: z.next, r: st.r, final: z.next === ZONE_STAGES.length - 1, inSec: st.shrink - st.warn });
  }
  if (st && zt >= st.shrink) {
    z.from = z.r; z.to = st.r; z.t0 = zt; z.dur = st.dur; z.shrinking = true;
    z.next++; z.warned = false;
    z.final = z.next === ZONE_STAGES.length;
    world.events.push({ type: 'zoneShrink', stage: z.next - 1, r: st.r, final: z.final, dur: st.dur });
  }
  if (!st && !z.sudden && zt >= SUDDEN.start) {
    z.sudden = true;
    z.from = z.r; z.to = SUDDEN.r; z.t0 = zt; z.dur = SUDDEN.dur; z.shrinking = true;
    z.warnR = SUDDEN.r;
    world.events.push({ type: 'sudden' });
  }
  if (z.shrinking) {
    const k = Math.min(1, (zt - z.t0) / z.dur);
    z.r = z.from + (z.to - z.from) * (z.sudden ? k : easeInOut(k));
    if (k >= 1) { z.shrinking = false; if (!z.sudden) z.warnR = 0; }
  } else if (z.sudden && z.r > 0) {
    // 虚空吞噬结束后还分不出胜负：圈继续慢慢收，不让任何人靠躲角落拖住
    z.r = Math.max(0, SUDDEN.r - (zt - z.t0 - z.dur) * SUDDEN.collapse);
    z.to = z.r; z.warnR = z.r;
  }
  if (Math.abs(z.r - world.maskR) > 0.05) rebuildVoid(world);
}

function rebuildVoid(world) {
  const z = world.zone, m = world.map;
  world.maskR = z.r;
  for (let y = 0; y < m.h; y++) {
    for (let x = 0; x < m.w; x++) {
      world.voidMask[y * m.w + x] = Math.hypot(x + 0.5 - z.cx, y + 0.5 - z.cy) > z.r ? 1 : 0;
    }
  }
  world.passVersion++;
  world.sparks = world.sparks.filter((s) => Math.hypot(s.x - z.cx, s.y - z.cy) <= z.r - 0.4);
  world.traps = world.traps.filter((s) => Math.hypot(s.x - z.cx, s.y - z.cy) <= z.r);
}

function checkVoid(world) {
  const z = world.zone;
  const doomed = world.actors.filter((a) => a.alive && Math.hypot(a.x - z.cx, a.y - z.cy) > z.r + 0.2);
  if (!doomed.length) return;
  const alive = world.actors.filter((a) => a.alive);
  if (doomed.length >= alive.length) {
    doomed.sort((a, b) => Math.hypot(a.x - z.cx, a.y - z.cy) - Math.hypot(b.x - z.cx, b.y - z.cy));
    doomed.shift();
  }
  // 鬼放到最后淘汰，免得先把即将出局的人指定成新鬼
  doomed.sort((p, q) => (p.ghost ? 1 : 0) - (q.ghost ? 1 : 0));
  for (const a of doomed) { if (world.phase !== 'play') break; eliminate(world, a, null, 'void', null); }
}

// ---------- 抓捕与擦身而过 ----------
function ghostCanCatch(g) {
  return g && g.alive && g.ghost && g.t.freeze <= 0 && g.t.stun <= 0 && g.t.daze <= 0;
}

function checkCatches(world) {
  const g = world.ghost;
  if (!ghostCanCatch(g)) return;
  for (const d of world.decoys) {
    if (d.alive && d.owner !== g.id && dist(g, d) < g.r + d.r - TUNE.catchSlack) {
      d.alive = false;
      g.t.slow = Math.max(g.t.slow, 0.6); g.slowMul = 0.5;
      world.events.push({ type: 'decoyEnd', id: d.id, x: d.x, y: d.y, popped: true, color: d.color, gid: g.id, owner: d.owner });
    }
  }
  for (const r of world.actors) {
    if (!r.alive || r.ghost || r.t.invuln > 0) continue;
    if (dist(g, r) >= g.r + r.r - TUNE.catchSlack) continue;
    if (r.t.shield > 0) {
      // 光盾：挡下这一下，鬼被弹开并定住
      const S = SKILLS.shield;
      r.t.shield = 0;
      r.t.invuln = 0.4;
      r.t.boost = S.boost; r.boostMul = S.boostMul;
      r.stats.blocks++;
      const dx = g.x - r.x, dy = g.y - r.y, d = Math.hypot(dx, dy) || 1;
      g.vault = null; g.breaking = null; cancelWind(g);
      g.forced = { vx: (dx / d) * (S.knock / 0.18), vy: (dy / d) * (S.knock / 0.18), t: 0.18, kind: 'knock' };
      g.t.stun = Math.max(g.t.stun, S.stun + 0.18);
      world.events.push({ type: 'block', id: r.id, gid: g.id, x: r.x, y: r.y });
      return;
    }
    doCatch(world, g, r);
    return;
  }
}

function doCatch(world, g, r) {
  const special = r.energy >= TUNE.glowReveal ? 'deny' : r.id === world.lastGhostId ? 'revenge' : null;
  g.streak++;
  g.stats.catches++;
  if (special === 'deny') g.stats.deny++;
  if (special === 'revenge') g.stats.revenge++;
  g.t.frenzy = TUNE.frenzyTime;
  g.pounceCd = Math.min(g.pounceCd, 1.0);
  eliminate(world, r, g, 'catch', special);
}

function checkCloseCalls(world) {
  const g = world.ghost;
  if (!g || !g.alive) return;
  const active = ghostCanCatch(g);
  for (const r of world.actors) {
    if (!r.alive || r.ghost) continue;
    if (!active) { r.nearActive = false; continue; }
    const d = dist(g, r);
    if (d < TUNE.closeNear) { r.nearT = world.time; r.nearActive = true; }
    else if (r.nearActive) {
      if (world.time - r.nearT > TUNE.closeWindow) r.nearActive = false;
      else if (d > TUNE.closeFar) {
        r.nearActive = false;
        if (world.time - r.lastClose > TUNE.closeCd) {
          r.lastClose = world.time;
          r.stats.closeCalls++;
          world.events.push({ type: 'close', id: r.id, gid: g.id, x: r.x, y: r.y });
          if (addEnergy(world, r, TUNE.closeValue, 'close')) return;
        }
      }
    }
  }
}

// ---------- 能量塔与光点 ----------
function updateTowers(world, dt) {
  const z = world.zone;
  for (const t of world.towers) {
    t.glow = Math.max(0, t.glow - dt * 2);
    t.active = Math.hypot(t.x - z.cx, t.y - z.cy) <= z.r - (t.center ? 0 : 1);
    t.charging = 0;
    if (!t.active) continue;
    if (t.dormant > 0) {
      t.dormant -= dt;
      if (t.dormant <= 0) { t.energy = t.cap; world.events.push({ type: 'towerWake', id: t.id, x: t.x, y: t.y }); }
      continue;
    }
    const inside = world.actors.filter((r) => r.alive && !r.ghost && !r.vault && inTower(t, r));
    if (!inside.length) continue;
    t.charging = inside.length;
    t.glow = 1;
    const per = Math.min(t.rate * dt, t.energy / inside.length);
    for (const r of inside) {
      r.lastTower = world.time;
      if (addEnergy(world, r, per, 'tower')) break;
    }
    t.energy -= per * inside.length;
    if (t.energy <= 1e-4) {
      t.energy = 0;
      t.dormant = TUNE.towerDormant;
      world.events.push({ type: 'towerDormant', id: t.id, x: t.x, y: t.y });
    }
  }
}

function spawnSpark(world) {
  const z = world.zone, m = world.map;
  const cap = Math.max(4, Math.round(TUNE.sparkCap * Math.min(1, (z.r * z.r) / 600)));
  if (world.sparks.length >= cap) return;
  for (let tries = 0; tries < 16; tries++) {
    const i = world.rng.pick(m.floorCells);
    const x = (i % m.w) + 0.5, y = ((i / m.w) | 0) + 0.5;
    if (Math.hypot(x - z.cx, y - z.cy) > z.r - 1) continue;
    if (world.sparks.some((s) => s.i === i)) continue;
    if (world.towers.some((t) => Math.hypot(t.x - x, t.y - y) < t.r + 0.5)) continue;
    if (world.actors.some((a) => a.alive && Math.hypot(a.x - x, a.y - y) < 2.5)) continue;
    world.sparks.push({ i, x, y, born: world.time });
    return;
  }
}

function updateSparks(world, dt) {
  world.sparkTimer -= dt;
  if (world.sparkTimer <= 0) {
    world.sparkTimer = world.duel ? TUNE.sparkIntervalDuel : TUNE.sparkInterval;
    spawnSpark(world);
  }
  for (const a of world.actors) {
    if (!a.alive || a.ghost) continue;
    for (let k = world.sparks.length - 1; k >= 0; k--) {
      const s = world.sparks[k];
      if (Math.abs(s.x - a.x) > 0.75 || Math.abs(s.y - a.y) > 0.75) continue;
      if (Math.hypot(s.x - a.x, s.y - a.y) > 0.7) continue;
      world.sparks.splice(k, 1);
      a.stats.pickups++;
      world.events.push({ type: 'pickup', kind: 'spark', id: a.id, x: s.x, y: s.y });
      if (addEnergy(world, a, TUNE.sparkValue, 'spark')) return;
    }
  }
}

function addEnergy(world, a, v, src) {
  if (!a.alive || a.ghost) return false;
  const before = a.energy;
  a.energy = Math.min(1, a.energy + v);
  if (before < TUNE.glowReveal && a.energy >= TUNE.glowReveal && a.energy < 1) world.events.push({ type: 'charged', id: a.id, x: a.x, y: a.y });
  if (a.energy >= 1) { flip(world, a, src); return true; }
  return false;
}

// 调试用：直接给能量（满了会触发翻身）
function grantEnergy(world, a, v) {
  return addEnergy(world, a, v, 'debug');
}

// ---------- 翻身：我的回合 ----------
// 打断正在蓄力的技能
function cancelWind(a) {
  a.t.wind = 0; a.t.chargeWind = 0; a.t.stompWind = 0; a.t.blinkWind = 0; a.t.hookWind = 0;
  a._afterWind = null; a.blinkTo = null;
}

function clearBuffs(a) {
  const t = a.t;
  t.dash = 0; t.boost = 0; t.shield = 0; t.cloak = 0; t.reveal = 0; t.root = 0; t.slow = 0;
  t.frenzy = 0; t.pounce = 0; t.recover = 0; t.charging = 0; t.stun = 0; t.daze = 0;
  cancelWind(a);
  a.forced = null; a.breaking = null;
}

// 清掉某个鬼留下的光网和丝线（它不再是鬼了）
function clearOwned(world, a) {
  world.traps = world.traps.filter((t) => t.owner !== a.id);
  world.hooks = world.hooks.filter((h) => h.owner !== a.id);
}

function flip(world, ng, cause) {
  const old = world.ghost;
  if (old) clearOwned(world, old);
  // 新鬼当人时放的分身收掉，免得追自己的分身
  for (const d of world.decoys) {
    if (d.owner !== ng.id || !d.alive) continue;
    d.alive = false;
    world.events.push({ type: 'decoyEnd', id: d.id, x: d.x, y: d.y, popped: false, color: d.color });
  }
  if (old && old.alive) {
    old.ghost = false;
    old.r = TUNE.runnerR;
    old.energy = 0;
    clearBuffs(old);
    old.streak = 0;
    old.grudge = ng.id;
    resetCooldowns(old, 0);
  }
  ng.ghost = true;
  ng.r = TUNE.ghostR;
  ng.energy = 0;
  clearBuffs(ng);
  ng.vault = null;
  ng.t.freeze = TUNE.flipFreeze;
  ng.streak = 0;
  ng.stats.flips++;
  resetCooldowns(ng, 0.3);
  for (const a of world.actors) if (a !== ng) a.energy = 0;
  // 新鬼的体型更大，卡进墙里时挪到附近的空地
  if (!spotFree(world, ng.x, ng.y, ng.r)) nudgeFree(world, ng);
  world.lastGhostId = old ? old.id : -1;
  world.ghost = ng;
  world.reignStart = world.time;
  world.events.push({ type: 'flip', id: ng.id, old: old ? old.id : -1, cause, x: ng.x, y: ng.y });
}

function nudgeFree(world, a) {
  for (let rad = 0.2; rad < 2; rad += 0.2) {
    for (let k = 0; k < 12; k++) {
      const ang = (k / 12) * Math.PI * 2;
      const x = a.x + Math.cos(ang) * rad, y = a.y + Math.sin(ang) * rad;
      if (spotFree(world, x, y, a.r)) { a.x = a.px = x; a.y = a.py = y; return; }
    }
  }
}

function eliminate(world, a, by, cause, special) {
  if (!a.alive) return;
  const before = world.actors.filter((x) => x.alive).length;
  a.alive = false;
  a.place = before;
  a.outT = world.time;
  a.outBy = by ? by.id : -1;
  a.outCause = cause;
  a.vault = null; a.forced = null; a.breaking = null;
  cancelWind(a);
  a.mx = 0; a.my = 0; a.vx = 0; a.vy = 0;
  world.placements.push(a.id);
  world.events.push({ type: cause === 'catch' ? 'catch' : 'fall', id: a.id, by: by ? by.id : -1, special, streak: by ? by.streak : 0, x: a.x, y: a.y, energy: a.energy, place: a.place, aliveAfter: before - 1 });
  const wasGhost = a.ghost;
  if (wasGhost) { a.ghost = false; a.r = TUNE.runnerR; world.ghost = null; clearOwned(world, a); }
  const alive = world.actors.filter((x) => x.alive);
  if (alive.length <= 1) {
    world.winner = alive[0] || a;
    if (alive[0]) alive[0].place = 1;
    world.phase = 'over';
    world.events.push({ type: 'win', id: world.winner.id });
    return;
  }
  if (wasGhost) {
    // 接任的新鬼：圈内能量最高的人
    const z = world.zone;
    const safe = alive.filter((x) => Math.hypot(x.x - z.cx, x.y - z.cy) <= z.r + 0.2);
    const pool = safe.length ? safe : alive;
    let best = pool[0];
    for (const x of pool) if (x.energy > best.energy) best = x;
    flip(world, best, 'void');
  }
  if (alive.length === 2 && !world.duel) startDuel(world, alive);
}

// 最终对决：双方定格亮相，鬼收起狂暴，逃跑方拿到一截能量
function startDuel(world, alive) {
  world.duel = true;
  for (const x of alive) {
    if (x.ghost) { x.t.freeze = Math.max(x.t.freeze, TUNE.duelFreeze); x.t.frenzy = 0; x.forced = null; x.breaking = null; cancelWind(x); x.pounceCd = TUNE.duelFreeze; }
    else { x.t.invuln = TUNE.duelFreeze; x.energy = Math.max(x.energy, TUNE.duelEnergy); }
  }
  world.events.push({ type: 'duel', ids: alive.map((x) => x.id), gid: world.ghost ? world.ghost.id : -1 });
}

// 复活候选：圈内（缩圈预警或收缩中按缩完后的圈算）、离所有活人 4 格以外的格，按到鬼的路程从远到近排
function reviveSpots(world) {
  const m = world.map, g = world.ghost, z = world.zone;
  const safeR = Math.min(z.r, z.warned ? z.warnR : z.r, z.shrinking ? z.to : z.r);
  const cost = (i) => (m.kind[i] === K_WALL || world.voidMask[i] ? Infinity : 0);
  const gi = g ? Math.floor(g.y) * m.w + Math.floor(g.x) : Math.floor(m.cy) * m.w + Math.floor(m.cx);
  const d = world.nav.run([gi], cost);
  const cands = [];
  for (const i of m.floorCells) {
    const x = (i % m.w) + 0.5, y = ((i / m.w) | 0) + 0.5;
    if (d[i] === Infinity || Math.hypot(x - z.cx, y - z.cy) > safeR - 1.5) continue;
    if (world.actors.some((o) => o.alive && Math.hypot(o.x - x, o.y - y) < 4)) continue;
    cands.push({ i, x, y, d: d[i] });
  }
  cands.sort((p, q) => q.d - p.d);
  return cands;
}

  const dx = (x - v.cx) * v.s, dy = (y - v.cy) * v.s;
  const c = Math.cos(v.rot), s = Math.sin(v.rot);
  return { x: v.ox + dx * c - dy * s, y: v.oy + dx * s + dy * c };
}

const inView = (v, x, y, pad = 1) => x > v.x0 - pad && x < v.x1 + pad && y > v.y0 - pad && y < v.y1 + pad;

function actorView(R, a) {
  let v = R.actors.get(a.id);
  if (!v) { v = { trail: [], sq: 0, blinkT: 1 + Math.random() * 3, blink: 0, happy: 0, emberT: 0, look: { x: 0, y: 1 }, lastFx: 0, lastFy: 1, rippleT: Math.random() }; R.actors.set(a.id, v); }
  return v;
}

// game: { viewer, wallColor, isYouId, focusId }
function renderScene(R, world, game, fx, alpha, dt) {
  const { ctx } = R, map = world.map;
  if (R.mapRef !== map) buildStatic(R, map);
  R.time += dt;
  const t = R.time, v = R.cam.view, pr = R.pxRatio, wc = game.wallColor;
  ctx.setTransform(pr, 0, 0, pr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, R.cssW, R.cssH);
  const bg = ctx.createRadialGradient(R.cssW / 2, R.cssH / 2, 10, R.cssW / 2, R.cssH / 2, R.cssW * 0.7);
  bg.addColorStop(0, rgba(wc, 0.06));
  bg.addColorStop(1, rgba(wc, 0));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, R.cssW, R.cssH);
  ctx.translate(v.ox, v.oy);
  ctx.rotate(v.rot);
  ctx.scale(v.s, v.s);
  ctx.translate(-v.cx, -v.cy);

  // 地面与网格
  ctx.fillStyle = rgba(wc, 0.022);
  ctx.fillRect(0, 0, map.w, map.h);
  ctx.strokeStyle = rgba(wc, 0.06);
  ctx.lineWidth = 0.025;
  ctx.beginPath();
  for (let x = Math.max(0, Math.floor(v.x0 / 2) * 2); x <= Math.min(map.w, v.x1); x += 2) { ctx.moveTo(x, Math.max(0, v.y0)); ctx.lineTo(x, Math.min(map.h, v.y1)); }
  for (let y = Math.max(0, Math.floor(v.y0 / 2) * 2); y <= Math.min(map.h, v.y1); y += 2) { ctx.moveTo(Math.max(0, v.x0), y); ctx.lineTo(Math.min(map.w, v.x1), y); }
  ctx.stroke();
  // 草丛底色
  ctx.fillStyle = 'rgba(10,60,52,0.35)';
  for (let y = Math.max(0, Math.floor(v.y0)); y < Math.min(map.h, v.y1); y++) for (let x = Math.max(0, Math.floor(v.x0)); x < Math.min(map.w, v.x1); x++) if (map.grass[y * map.w + x]) ctx.fillRect(x, y, 1, 1);

  for (const tw of world.towers) if (inView(v, tw.x, tw.y, tw.r + 1)) drawTower(ctx, tw, t, wc);
  drawZoneWarnBand(R, world, t);

  // 墙：翻身时一圈换色波从新鬼扩散出去
  const wave = fx.wave;
  if (wave) {
    drawWalls(R, wave.from, t);
    ctx.save();
    ctx.beginPath(); ctx.arc(wave.x, wave.y, wave.r, 0, TAU); ctx.clip();
    drawWalls(R, wave.to, t);
    ctx.restore();
    const fade = clamp(1 - wave.r / 40, 0, 1);
    ctx.strokeStyle = rgba(mixHex(wave.to, '#ffffff', 0.5), 0.75 * fade);
    ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.arc(wave.x, wave.y, wave.r, 0, TAU); ctx.stroke();
  } else drawWalls(R, wc, t);

  for (const s of map.lowSegs) if (inView(v, s.cx, s.cy, 2)) drawLowWall(ctx, s, world.segs[s.id].blockedUntil > world.time, t, COLORS.low);
  for (const p of world.pallets) if (inView(v, p.cx, p.cy, 2)) drawPallet(ctx, p, t, world.time);
  drawBreaks(R, dt);
  for (const s of world.sparks) if (inView(v, s.x, s.y)) drawSpark(ctx, s.x, s.y, t, world.time - s.born);
  drawTraps(R, world, game, t);
  drawHooks(R, world);

  const viewer = game.viewer;
  const list = [];
  for (const a of world.actors) if (a.alive || (a.outCause === 'void' && world.time - a.outT < 1)) list.push(a);
  for (const d of world.decoys) list.push(d);
  list.sort((p, q) => p.y - q.y);
  ctx.globalCompositeOperation = 'lighter';
  for (const a of list) drawTrail(R, world, a, alpha, viewer, v);
  ctx.globalCompositeOperation = 'source-over';
  for (const a of list) drawActor(R, world, a, alpha, viewer, game, fx, dt, v);
  drawGrass(R, world, t, dt, v);
  drawVoid(R, world, t);
  drawParticles(R, fx, v);
}

function drawWalls(R, color, t) {
  const ctx = R.ctx;
  ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(6,7,16,0.95)';
  ctx.fill(R.wallFill);
  ctx.strokeStyle = rgba(color, 0.2);
  ctx.lineWidth = 0.3;
  ctx.stroke(R.wallPath);
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.075;
  ctx.stroke(R.wallPath);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 0.022;
  ctx.stroke(R.wallPath);
  // 中央方尖碑
  const p = 0.5 + 0.5 * Math.sin(t * 2.2);
  ctx.fillStyle = rgba('#fff1c8', 0.1 + 0.08 * p);
  ctx.fill(R.obeliskPath);
  ctx.strokeStyle = rgba('#ffe9a8', 0.35);
  ctx.lineWidth = 0.4;
  ctx.stroke(R.obeliskPath);
  ctx.strokeStyle = '#fff4d6';
  ctx.lineWidth = 0.09;
  ctx.stroke(R.obeliskPath);
}

function drawZoneWarnBand(R, world, t) {
  const z = world.zone, ctx = R.ctx;
  if (!z.warned && !z.shrinking && !z.sudden) return;
  const inner = z.warned ? z.warnR : z.to;
  if (inner >= z.r) return;
  const p = 0.5 + 0.5 * Math.sin(t * 7);
  ctx.save();
  ctx.beginPath();
  ctx.arc(z.cx, z.cy, z.r, 0, TAU);
  ctx.arc(z.cx, z.cy, inner, 0, TAU, true);
  ctx.fillStyle = rgba(COLORS.zone, 0.06 + 0.08 * p);
  ctx.fill('evenodd');
  ctx.restore();
  ctx.setLineDash([0.35, 0.25]);
  ctx.lineDashOffset = -t * 0.8;
  ctx.strokeStyle = rgba('#ffffff', 0.5);
  ctx.lineWidth = 0.06;
  ctx.beginPath(); ctx.arc(z.cx, z.cy, inner, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
}

function drawVoid(R, world, t) {
  const z = world.zone, ctx = R.ctx, map = world.map;
  if (z.r > 34) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(-40, -40, map.w + 80, map.h + 80);
  ctx.arc(z.cx, z.cy, z.r, 0, TAU, true);
  ctx.fillStyle = 'rgba(2,2,6,0.88)';
  ctx.fill('evenodd');
  ctx.restore();
  ctx.strokeStyle = rgba(COLORS.zone, 0.22);
  ctx.lineWidth = 0.55;
  ctx.beginPath(); ctx.arc(z.cx, z.cy, z.r, 0, TAU); ctx.stroke();
  ctx.setLineDash([0.5, 0.3]);
  ctx.lineDashOffset = t * 1.2;
  ctx.strokeStyle = COLORS.zone;
  ctx.lineWidth = 0.12;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,200,215,0.6)';
  ctx.lineWidth = 0.03;
  ctx.stroke();
}

function drawGrass(R, world, t, dt, v) {
  const ctx = R.ctx, map = world.map, rus = R.rustle;
  for (const a of world.actors) {
    if (!a.alive || !a.inGrass) continue;
    if (Math.hypot(a.vx, a.vy) > 0.5) rus[Math.floor(a.y) * map.w + Math.floor(a.x)] = 1;
  }
  ctx.lineCap = 'round';
  for (const b of R.blades) {
    if (b.x < v.x0 || b.x > v.x1 || b.y < v.y0 || b.y > v.y1 + 1) continue;
    if (world.voidMask[b.i]) continue;
    if (rus[b.i] > 0) rus[b.i] = Math.max(0, rus[b.i] - dt * 0.4);
    const r = rus[b.i];
    const sway = Math.sin(t * 1.7 + b.ph + b.x * 0.8) * 0.06 + Math.sin(t * 13 + b.ph) * 0.1 * r + b.lean;
    const tipX = b.x + sway, tipY = b.y - b.h;
    ctx.strokeStyle = rgba(COLORS.grass, 0.6 + 0.3 * r);
    ctx.lineWidth = 0.08;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(b.x + sway * 0.3, b.y - b.h * 0.6, tipX, tipY); ctx.stroke();
    ctx.strokeStyle = rgba('#b8fff0', 0.35 + 0.4 * r);
    ctx.lineWidth = 0.025;
    ctx.beginPath(); ctx.moveTo(b.x + sway * 0.5, b.y - b.h * 0.65); ctx.lineTo(tipX, tipY); ctx.stroke();
  }
}

function drawTraps(R, world, game, t) {
  const ctx = R.ctx, viewer = game.viewer;
  for (const tr of world.traps) {
    let a = 0.25;
    if (viewer && viewer.ghost) a = 0.75;
    else if (viewer) { const d = Math.hypot(viewer.x - tr.x, viewer.y - tr.y); a = d < 2.6 ? 0.55 * (1 - d / 2.6) + 0.12 : 0.08; }
    if (!viewer) a = 0.5;
    if (tr.armed > 0) a *= 0.5;
    ctx.save();
    ctx.translate(tr.x, tr.y);
    ctx.rotate(t * 0.3);
    ctx.strokeStyle = rgba('#e9e4ff', a);
    ctx.lineWidth = 0.03;
    for (let k = 0; k < 6; k++) { const ang = (k / 6) * TAU; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ang) * 0.7, Math.sin(ang) * 0.7); ctx.stroke(); }
    for (const rr of [0.3, 0.55]) { ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.stroke(); }
    ctx.restore();
  }
}

function drawHooks(R, world) {
  const ctx = R.ctx;
  for (const h of world.hooks) {
    const g = world.actors.find((x) => x.id === h.owner);
    if (!g) continue;
    ctx.strokeStyle = rgba('#efe9ff', 0.85);
    ctx.lineWidth = 0.04;
    ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(h.x, h.y); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, h.x, h.y, 0.45, g.color, 0.9);
    ctx.globalCompositeOperation = 'source-over';
  }
}

// 打碎的挡板碎片
function addBreak(R, p) { R.breaks.push({ x: p.cx, y: p.cy, axis: p.axis, life: 1.2 }); }
function drawBreaks(R, dt) {
  const ctx = R.ctx;
  for (const b of R.breaks) {
    b.life -= dt;
    const k = Math.max(0, b.life / 1.2);
    ctx.fillStyle = rgba('#ffd27a', 0.6 * k);
    for (let i = 0; i < 5; i++) {
      const ox = Math.sin(i * 2.1) * 0.6 * (1.4 - k), oy = Math.cos(i * 1.7) * 0.6 * (1.4 - k);
      ctx.fillRect(b.x + ox - 0.12, b.y + oy - 0.05, 0.24, 0.1);
    }
  }
  R.breaks = R.breaks.filter((b) => b.life > 0);
}

function drawTrail(R, world, a, alpha, viewer, view) {
  const v = actorView(R, a);
  const x = a.px + (a.x - a.px) * alpha, y = a.py + (a.y - a.py) * alpha;
  const last = v.trail[v.trail.length - 1];
  if (!last || Math.hypot(last.x - x, last.y - y) > 1.5) v.trail.length = 0;
  if (!last || Math.hypot(last.x - x, last.y - y) > 0.08) v.trail.push({ x, y });
  const maxLen = a.ghost ? 14 : a.t && a.t.dash > 0 ? 18 : 9;
  while (v.trail.length > maxLen) v.trail.shift();
  if (!a.alive || v.trail.length < 2 || !inView(view, x, y, 3)) return;
  if (viewer && viewer.alive && !visibleTo(world, a, viewer)) return;
  const ctx = R.ctx, n = v.trail.length, w0 = a.ghost ? 0.5 : 0.32;
  ctx.lineCap = 'round';
  for (let i = 1; i < n; i++) {
    const k = i / n;
    ctx.strokeStyle = rgba(a.color, 0.26 * k * (a.ghost ? 1.2 : 1));
    ctx.lineWidth = w0 * k;
    ctx.beginPath(); ctx.moveTo(v.trail[i - 1].x, v.trail[i - 1].y); ctx.lineTo(v.trail[i].x, v.trail[i].y); ctx.stroke();
  }
}

function drawActor(R, world, a, alpha, viewer, game, fx, dt, view) {
  const ctx = R.ctx, v = actorView(R, a);
  const x = a.px + (a.x - a.px) * alpha, y = a.py + (a.y - a.py) * alpha;
  if (!inView(view, x, y, 2)) return;
  const t = R.time;
  const isYou = game.isYouId === a.id && !a.isDecoy;
  let vis = true;
  if (viewer && viewer.alive) vis = visibleTo(world, a, viewer);
  // 鬼的夜视和陷阱揭示：看不见的人也会冒出心跳波纹
  if (!vis && viewer && viewer.ghost && !a.ghost && a.alive && !a.isDecoy && Math.hypot(a.x - viewer.x, a.y - viewer.y) < 4.5) {
    v.rippleT += dt;
    for (let k = 0; k < 2; k++) {
      const ph = ((v.rippleT + k * 0.42) % 0.85) / 0.85;
      ctx.strokeStyle = rgba(a.color, 0.8 * (1 - ph));
      ctx.lineWidth = 0.07 * (1 - ph * 0.5);
      ctx.beginPath(); ctx.arc(x, y, 0.12 + ph * 1.0, 0, TAU); ctx.stroke();
    }
    return;
  }
  if (!vis && !isYou) return;
  v.blinkT -= dt;
  if (v.blinkT <= 0) { v.blink = 0.12; v.blinkT = 2 + Math.random() * 3.5; }
  v.blink = Math.max(0, v.blink - dt);
  v.happy = Math.max(0, v.happy - dt);
  const sp = Math.hypot(a.vx || 0, a.vy || 0);
  const fxv = a.fx || 0, fyv = a.fy || 1;
  if (Math.abs(fxv - v.lastFx) + Math.abs(fyv - v.lastFy) > 0.8) v.sq = 1;
  v.lastFx = fxv; v.lastFy = fyv;
  v.sq = Math.max(0, v.sq - dt * 6);
  let look = { x: fxv, y: fyv };
  const g = world.ghost;
  const scared = !a.ghost && !a.isDecoy && g && g.alive && g !== a && Math.hypot(g.x - a.x, g.y - a.y) < 3.2 && a.alive;
  if (scared) { const dx = g.x - a.x, dy = g.y - a.y, d = Math.hypot(dx, dy) || 1; look = { x: dx / d, y: dy / d }; }
  v.look.x = approach(v.look.x, look.x, 14, dt);
  v.look.y = approach(v.look.y, look.y, 14, dt);
  const st = clamp(sp / 30, 0, 0.16) + v.sq * 0.1;
  const squash = { sx: 1 + st, sy: 1 - st * 0.7, rot: Math.atan2(fyv, fxv) };
  let alphaA = 1, fallK = 0;
  if (!a.alive && a.outCause === 'void') { fallK = clamp((world.time - a.outT) / 1, 0, 1); alphaA = 1 - fallK; }
  if (a.inGrass && isYou && !(viewer && viewer.ghost)) alphaA *= 0.6;
  if (a.t && a.t.cloak > 0) alphaA *= isYou ? 0.35 + 0.15 * Math.sin(t * 30) : 0.4;
  let hop = 0;
  if (a.vault) { const k = a.vault.t / a.vault.dur; hop = Math.sin(k * Math.PI) * 0.35; }
  ctx.save();
  if (fallK > 0) { ctx.translate(x, y); ctx.rotate(fallK * 6); ctx.scale(1 - fallK * 0.9, 1 - fallK * 0.9); ctx.translate(-x, -y); }
  if (hop) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(x, y + 0.35, 0.35, 0.12, 0, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  glow(ctx, x, y - hop, a.ghost ? 3.2 : 2.0, a.color, a.ghost ? 0.18 : 0.09);
  ctx.globalCompositeOperation = 'source-over';
  if (a.ghost) {
    const since = world.time - world.reignStart;
    const morph = a.t.freeze > 0 && since < TUNE.flipFreeze + 0.05 ? clamp(since / TUNE.flipFreeze, 0, 1) : 1;
    if (morph < 1) {
      for (let k = 0; k < 6; k++) {
        const ang = t * 6 + (k * TAU) / 6, rr = 1.4 * (1 - morph);
        ctx.fillStyle = rgba(a.color, 0.8);
        ctx.beginPath(); ctx.arc(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr, 0.06, 0, TAU); ctx.fill();
      }
    }
    drawGhost(ctx, {
      x, y: y - hop, color: a.color, look: CHARS[a.ghostChar].look, t: t + a.id, lookDir: v.look, morph: 0.35 + 0.65 * (1 - Math.pow(1 - morph, 3)),
      stun: a.t.stun > 0, frenzy: a.t.frenzy > 0, wind: a.t.wind > 0 || a.t.chargeWind > 0 || a.t.stompWind > 0 || a.t.blinkWind > 0 || a.t.hookWind > 0, dash: !!(a.forced && (a.forced.kind === 'pounce' || a.forced.kind === 'charge')),
      alpha: alphaA, cd: isYou ? 1 - a.pounceCd / TUNE.pounceCd : undefined, facing: { x: fxv, y: fyv }, breaking: !!a.breaking,
    });
    // 瞬影蓄力：落点先亮出标记，圈越缩越小就是快到了
    if (a.t.blinkWind > 0 && a.blinkTo) {
      const k = 1 - a.t.blinkWind / SKILLS.blink.wind;
      const bx = a.blinkTo.x, by = a.blinkTo.y;
      ctx.strokeStyle = rgba(a.color, 0.35 + 0.5 * k);
      ctx.lineWidth = 0.06;
      ctx.setLineDash([0.18, 0.14]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = rgba(mixHex(a.color, '#ffffff', 0.4), 0.9);
      ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(bx, by, 1.1 - 0.6 * k, 0, TAU); ctx.stroke();
      ctx.fillStyle = rgba(a.color, 0.25 + 0.35 * k);
      ctx.beginPath(); ctx.arc(bx, by, 0.35, 0, TAU); ctx.fill();
    }
    // 牵丝蓄力：沿锁定的方向画出瞄准线
    if (a.t.hookWind > 0) {
      ctx.strokeStyle = rgba('#efe9ff', 0.55 + 0.3 * Math.sin(t * 40));
      ctx.lineWidth = 0.05;
      ctx.setLineDash([0.25, 0.18]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + fxv * SKILLS.hook.range, y + fyv * SKILLS.hook.range); ctx.stroke();
      ctx.setLineDash([]);
    }
    // 冲锋蓄力：地上画出冲撞线，给被追的人看清方向
    if (a.t.chargeWind > 0) {
      ctx.strokeStyle = rgba('#ff5577', 0.5 + 0.4 * Math.sin(t * 30));
      ctx.lineWidth = 0.5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + fxv * 7, y + fyv * 7); ctx.stroke();
    }
    if (a.t.stompWind > 0) {
      const sr = SKILLS.stomp.r;
      ctx.fillStyle = rgba('#ff5577', 0.08);
      ctx.beginPath(); ctx.arc(x, y, sr, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba('#ff5577', 0.7);
      ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(x, y, sr * (1 - a.t.stompWind / SKILLS.stomp.wind), 0, TAU); ctx.stroke();
    }
    if (a.breaking) {
      const k = 1 - a.breaking.t / a.breaking.dur;
      ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(x, y - 0.9, 0.22, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
    }
  } else {
    const charged = !a.isDecoy && a.energy >= TUNE.glowReveal;
    if (charged && a.alive) {
      v.emberT -= dt;
      if (v.emberT <= 0) {
        v.emberT = 0.07;
        fx.parts.push({ x: x + (Math.random() - 0.5) * 0.6, y: y + (Math.random() - 0.5) * 0.5, vx: (Math.random() - 0.5) * 0.5, vy: -1.4 - Math.random(), life: 0.6, max: 0.6, size: 0.05, color: a.color, kind: 'ember', rot: 0, vr: 0, drag: 1, grav: 0, delay: 0, target: null, glow: 1 });
      }
    }
    let ox = 0;
    if (a.isDecoy && Math.floor(t * 7) % 5 === 0) ox = 0.06 * Math.sin(t * 90);
    drawRunner(ctx, {
      x: x + ox, y: y - hop, color: a.color, look: CHARS[a.runnerChar].look, lookDir: v.look, squash, energy: a.energy, alpha: alphaA,
      blink: v.blink > 0, isYou, t: t + a.id * 1.3, scared, charged, happy: v.happy > 0, shield: a.t && a.t.shield > 0, rooted: a.t && a.t.root > 0,
    });
    if (viewer && viewer.ghost && a.t && a.t.reveal > 0) {
      ctx.strokeStyle = rgba(a.color, 0.6 + 0.4 * Math.sin(t * 12));
      ctx.lineWidth = 0.05;
      ctx.beginPath(); ctx.arc(x, y, 0.85, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawParticles(R, fx, view) {
  const ctx = R.ctx;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of fx.parts) {
    if (p.delay > 0 || !inView(view, p.x, p.y, 1)) continue;
    const k = p.life / p.max;
    if (p.kind === 'shard') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = rgba(p.color, Math.min(1, k * 1.4));
      ctx.beginPath(); ctx.moveTo(0, -p.size * 1.4); ctx.lineTo(p.size, p.size); ctx.lineTo(-p.size, p.size * 0.6); ctx.closePath(); ctx.fill();
