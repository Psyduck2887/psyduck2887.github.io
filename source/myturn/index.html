  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  const hot = x0 + (x1 - x0) * TUNE.glowReveal;
  const g = ctx.createLinearGradient(hot, 0, crownX, 0);
  g.addColorStop(0, 'rgba(255,90,120,0.15)'); g.addColorStop(1, rgba(game.wallColor, 0.9));
  ctx.strokeStyle = g;
  ctx.beginPath(); ctx.moveTo(hot, y); ctx.lineTo(crownX - 16, y); ctx.stroke();
  const gh = world.ghost;
  const gc = gh ? gh.color : '#666a80';
  ctx.save();
  ctx.shadowColor = gc; ctx.shadowBlur = 14;
  ctx.fillStyle = 'rgba(8,6,16,0.9)';
  ctx.beginPath(); ctx.arc(crownX, y, 16, 0, TAU); ctx.fill();
  ctx.strokeStyle = gc; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
  if (gh) miniFace(ctx, crownX, y + 1, 9, gh.color, true);
  crown(ctx, crownX, y - 17, 8, '#ffe9a8');
  ctx.font = `700 9px ${FONT}`;
  ctx.textAlign = 'left';
  ctx.fillStyle = gh ? mixHex(gh.color, '#ffffff', 0.5) : '#888';
  ctx.fillText(gh ? (gh.id === game.isYouId ? '你是鬼' : gh.name) : '', crownX + 20, y + 4);
  const items = world.actors.filter((a) => a.alive && !a.ghost).map((a) => {
    let s = H.track.get(a.id);
    if (!s) { s = { x: a.energy }; H.track.set(a.id, s); }
    s.x = approach(s.x, a.energy, a.energy < s.x ? 5 : 9, dt);
    return { a, px: x0 + (x1 - x0) * clamp(s.x, 0, 1) };
  }).sort((p, q) => p.px - q.px || p.a.id - q.a.id);
  for (let it = 0; it < 6; it++) {
    for (let i = 1; i < items.length; i++) { const d = items[i].px - items[i - 1].px; if (d < 22) { const push = (22 - d) / 2; items[i].px += push; items[i - 1].px -= push; } }
    for (const q of items) q.px = clamp(q.px, x0, x1 - 6);
  }
  items.forEach((it, idx) => {
    const { a, px } = it;
    const isYou = a.id === game.isYouId, charged = a.energy >= TUNE.glowReveal;
    const r = isYou ? 10 : 8.5;
    ctx.save();
    if (charged) { ctx.shadowColor = a.color; ctx.shadowBlur = 10 + 6 * Math.sin(H.time * 14); }
    miniFace(ctx, px, y, r, a.color, false);
    ctx.restore();
    if (isYou) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, y, r + 2.5, 0, TAU); ctx.stroke(); }
    ctx.font = `${isYou ? 800 : 600} ${isYou ? 10 : 9}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = isYou ? '#ffffff' : mixHex(a.color, '#ffffff', 0.45);
    ctx.fillText(isYou ? STR.you : a.name, px, idx % 2 ? y - r - 5 : y + r + 11);
  });
}

function drawStatus(H, world, game) {
  const ctx = H.ctx, L = game.L;
  const y = L.track.y + 38;
  const z = world.zone, zt = world.time + world.zoneOffset, st = ZONE_STAGES[z.next];
  let txt = '', col = 'rgba(255,255,255,0.6)';
  if (world.duel) { txt = STR.duel; col = '#ffd27a'; }
  if (z.warned && st) { txt = `缩圈 ${Math.max(0, Math.ceil(st.shrink - zt))}`; col = Math.floor(H.time * 4) % 2 ? '#ff5577' : '#ffb3c1'; }
  else if (z.shrinking) { txt = z.sudden ? STR.sudden : '缩圈中'; col = '#ff5577'; }
  else if (st && !world.duel) txt = `下次缩圈 ${fmtTime(st.shrink - zt)}`;
  else if (!st && !z.sudden && !world.duel) txt = `虚空吞噬 ${fmtTime(SUDDEN.start - zt)}`;
  else if (z.sudden && !world.duel) { txt = STR.sudden; col = '#ff5577'; }
  const alive = world.actors.filter((a) => a.alive).length;
  ctx.font = `600 11px ${FONT}`;
  ctx.textAlign = 'center';
  const label = `${txt}   ·   ${STR.alive(alive, world.actors.length)}`;
  const tw = ctx.measureText(label).width, cx = (L.track.x0 + L.track.x1) / 2;
  ctx.fillStyle = 'rgba(6,8,18,0.6)';
  roundRect(ctx, cx - tw / 2 - 10, y - 13, tw + 20, 18, 9);
  ctx.fill();
  ctx.fillStyle = col;
  ctx.fillText(label, cx, y);
}

// 小地图：墙体预渲染一次，之后只叠加动态内容
function drawMinimap(H, world, game, R) {
  const ctx = H.ctx, M = game.L.minimap, map = world.map;
  const sc = Math.min(M.w / map.w, M.h / map.h);
  if (!H.mini || H.mini.w !== M.w) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(map.w * sc * H.pr); c.height = Math.ceil(map.h * sc * H.pr);
    const g = c.getContext('2d');
    g.scale(sc * H.pr, sc * H.pr);
    g.fillStyle = 'rgba(160,175,255,0.55)';
    for (let i = 0; i < map.n; i++) if (map.kind[i] === K_WALL) g.fillRect(i % map.w, (i / map.w) | 0, 1, 1);
    g.fillStyle = 'rgba(30,180,150,0.35)';
    for (let i = 0; i < map.n; i++) if (map.grass[i]) g.fillRect(i % map.w, (i / map.w) | 0, 1, 1);
    H.mini = { c, w: M.w };
  }
  ctx.save();
  ctx.fillStyle = 'rgba(6,8,20,0.72)';
  roundRect(ctx, M.x - 4, M.y - 4, map.w * sc + 8, map.h * sc + 8, 8);
  ctx.fill();
  ctx.strokeStyle = rgba(game.wallColor, 0.5); ctx.lineWidth = 1; ctx.stroke();
  ctx.drawImage(H.mini.c, M.x, M.y, map.w * sc, map.h * sc);
  const P = (x, y) => ({ x: M.x + x * sc, y: M.y + y * sc });
  // 安全区
  const z = world.zone, zc = P(z.cx, z.cy);
  ctx.save();
  ctx.beginPath(); ctx.rect(M.x, M.y, map.w * sc, map.h * sc); ctx.clip();
  ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(zc.x, zc.y, z.r * sc, 0, TAU); ctx.stroke();
  if (z.warned) { ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(zc.x, zc.y, z.warnR * sc, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
  // 能量塔：正在充能的塔会闪
  for (const t of world.towers) {
    const p = P(t.x, t.y);
    const ch = t.charging > 0;
    ctx.fillStyle = !t.active ? '#333' : t.dormant > 0 ? '#556' : ch ? (Math.floor(H.time * 6) % 2 ? '#fff6d0' : '#ffb84a') : '#ffe08a';
    ctx.beginPath(); ctx.arc(p.x, p.y, ch ? 3.6 : 2.6, 0, TAU); ctx.fill();
  }
  const viewer = game.viewer, v = R.cam.view;
  const onScreen = (a) => v && a.x > v.x0 && a.x < v.x1 && a.y > v.y0 && a.y < v.y1;
  for (const a of world.actors) {
    if (!a.alive) continue;
    const me = a.id === game.isYouId;
    let show = me || !viewer;
    if (!show && viewer) show = (onScreen(a) && visibleTo(world, a, viewer)) || (viewer.ghost && a.t.reveal > 0);
    // 鬼进入心跳范围就在小地图上显示（和 AI 能「听到」鬼的范围一致）
    if (!show && viewer && !viewer.ghost && a.ghost && Math.hypot(a.x - viewer.x, a.y - viewer.y) <= TUNE.heartRange) show = true;
    if (!show) continue;
    const p = P(a.x, a.y);
    if (a.ghost) {
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.moveTo(p.x, p.y - 4.5); ctx.lineTo(p.x + 4, p.y + 3.5); ctx.lineTo(p.x - 4, p.y + 3.5); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = me ? '#ffffff' : a.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, me ? 3.2 : 2.4, 0, TAU); ctx.fill();
      if (me) { ctx.strokeStyle = a.color; ctx.lineWidth = 1.2; ctx.stroke(); }
    }
  }
  if (v) {
    const a0 = P(v.x0 + 1, v.y0 + 1), a1 = P(v.x1 - 1, v.y1 - 1);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.strokeRect(a0.x, a0.y, a1.x - a0.x, a1.y - a0.y);
  }
  ctx.restore();
}

function drawFeed(H, game, dt) {
  const ctx = H.ctx, L = game.L;
  let y = L.track.y + 62;
  for (const f of H.feed) f.t += dt;
  H.feed = H.feed.filter((f) => f.t < 3.4);
  ctx.textAlign = 'left';
  ctx.font = `600 11px ${FONT}`;
  for (const f of H.feed) {
    const a = clamp(Math.min(f.t * 5, (3.4 - f.t) * 2), 0, 1);
    let w = 0;
    for (const p of f.parts) w += ctx.measureText(p.text).width;
    let x = (L.track.x0 + L.track.x1) / 2 - w / 2;
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(6,8,18,0.6)';
    roundRect(ctx, x - 9, y - 13, w + 18, 18, 9); ctx.fill();
    for (const p of f.parts) { ctx.fillStyle = p.color || 'rgba(255,255,255,0.75)'; ctx.fillText(p.text, x, y); x += ctx.measureText(p.text).width; }
    ctx.globalAlpha = 1;
    y += 21;
  }
}

// 鬼在屏幕外但在心跳范围内：屏幕边缘出现指向它的箭头
function drawEdgeArrows(H, world, game, R) {
  const viewer = game.viewer, g = world.ghost;
  if (!viewer || !viewer.alive || viewer.ghost || !g || !g.alive) return;
  const d = Math.hypot(g.x - viewer.x, g.y - viewer.y);
  if (d > TUNE.heartRange) return;
  const p = worldToScreen(R, g.x, g.y);
  const m = 34;
  if (p.x > m && p.x < H.cssW - m && p.y > m && p.y < H.cssH - m) return;
  const cx = H.cssW / 2, cy = H.cssH / 2;
  const ang = Math.atan2(p.y - cy, p.x - cx);
  const ex = Math.cos(ang), ey = Math.sin(ang);
  const k = Math.min((H.cssW / 2 - m) / Math.abs(ex || 1e-6), (H.cssH / 2 - m) / Math.abs(ey || 1e-6));
  const ax = cx + ex * k, ay = cy + ey * k;
  const ctx = H.ctx;
  const pulse = 0.6 + 0.4 * Math.sin(H.time * (6 + (1 - d / TUNE.heartRange) * 8));
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(ang);
  ctx.globalAlpha = pulse;
  ctx.shadowColor = g.color; ctx.shadowBlur = 14;
  ctx.fillStyle = g.color;
  const s = 10 + (1 - d / TUNE.heartRange) * 8;
  ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.6, -s * 0.7); ctx.lineTo(-s * 0.3, 0); ctx.lineTo(-s * 0.6, s * 0.7); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// 右下角按钮：图标、冷却扇形、剩余秒数、可用时的呼吸光
function drawButtons(H, world, game) {
  const h = game.human;
  if (!h || !h.alive || game.mode !== 'play') return;
  const ctx = H.ctx, L = game.L;
  const palletNear = !h.ghost && !!nearestPallet(world, h);
  const btns = activeButtons(L, h.ghost ? 'ghost' : 'runner', palletNear);
  const chr = CHARS[h.ghost ? h.ghostChar : h.runnerChar];
  for (const b of btns) {
    let icon, cdLeft = 0, cdMax = 1, color = h.color, label = '';
    if (b.kind === 'main' && h.ghost) { icon = 'pounce'; cdLeft = h.pounceCd; cdMax = TUNE.pounceCd; label = STR.btnPounce; }
    else if (b.kind === 'main') { icon = 'pallet'; color = '#ffd27a'; label = STR.btnPallet; }
    else {
      const id = chr.skills[b.kind === 'skill1' ? 0 : 1];
      icon = id; cdLeft = h.cds[id] || 0; cdMax = SKILLS[id].cd; label = SKILLS[id].name;
    }
    const ready = cdLeft <= 0;
    const press = H.press[b.id] || 0;
    const r = b.r * (1 - press * 0.6);
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(8,10,24,0.72)';
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    if (ready) { ctx.shadowColor = color; ctx.shadowBlur = 10 + 6 * Math.sin(H.time * 5); }
    ctx.strokeStyle = ready ? color : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.shadowBlur = 0;
    skillIcon(ctx, icon, b.x, b.y - (b.id === 'big' ? 3 : 2), r * 0.42, ready ? '#ffffff' : 'rgba(255,255,255,0.45)');
    if (!ready) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, r - 1, -Math.PI / 2, -Math.PI / 2 + TAU * (cdLeft / cdMax)); ctx.closePath(); ctx.fill();
      ctx.font = `800 ${Math.round(r * 0.5)}px ${NUM}`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(Math.ceil(cdLeft)), b.x, b.y + r * 0.18);
    }
    ctx.font = `700 ${b.id === 'big' ? 11 : 10}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = ready ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)';
    ctx.fillText(label, b.x, b.y + r + 13);
    ctx.restore();
  }
}

function drawWorldOverlays(H, world, game, fx, R, dt) {
  const ctx = H.ctx, viewer = game.viewer;
  const find = (id) => world.actors.find((a) => a.id === id);
  ctx.textAlign = 'center';
  for (const t of fx.texts) {
    const p = worldToScreen(R, t.x, t.y);
    const k = t.life / t.max, pop = easeOutBack(clamp((t.max - t.life) / 0.22, 0, 1));
    const size = t.size * (0.6 + 0.4 * pop);
    ctx.globalAlpha = clamp(k * 2.5, 0, 1);
    ctx.font = `900 ${size}px ${FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(4,4,12,0.85)';
    ctx.strokeText(t.str, p.x, p.y);
    ctx.save(); ctx.shadowColor = t.color; ctx.shadowBlur = t.big ? 18 : 8;
    ctx.fillStyle = t.big ? '#ffffff' : t.color; ctx.fillText(t.str, p.x, p.y);
    ctx.restore();
    if (t.sub) { ctx.font = `800 ${size * 0.62}px ${FONT}`; ctx.strokeText(t.sub, p.x, p.y + size * 0.85); ctx.fillStyle = t.color; ctx.fillText(t.sub, p.x, p.y + size * 0.85); }
    ctx.globalAlpha = 1;
  }
  for (const b of H.bubbles) b.t += dt;
  H.bubbles = H.bubbles.filter((b) => b.t < b.dur);
  ctx.font = `700 11px ${FONT}`;
  for (const b of H.bubbles) {
    const a = find(b.id);
    if (!a || !a.alive || (viewer && viewer.alive && !visibleTo(world, a, viewer))) continue;
    const p = worldToScreen(R, a.x, a.y), s = R.cam.view.s;
    const k = easeOutBack(clamp(b.t / 0.18, 0, 1)), al = clamp((b.dur - b.t) * 4, 0, 1);
    const tw = ctx.measureText(b.text).width;
    const by = p.y - s * (a.ghost ? 1.3 : 1.1) - 22;
    ctx.globalAlpha = al;
    ctx.save();
    ctx.translate(p.x, by + 10); ctx.scale(k, k); ctx.translate(-p.x, -(by + 10));
    ctx.fillStyle = 'rgba(8,8,20,0.88)';
    roundRect(ctx, p.x - tw / 2 - 8, by, tw + 16, 20, 10); ctx.fill();
    ctx.strokeStyle = a.color; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
    ctx.fillText(b.text, p.x, by + 14);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  for (const e of H.emotes) e.t += dt;
  H.emotes = H.emotes.filter((e) => e.t < e.dur);
  for (const e of H.emotes) {
    const a = find(e.id);
    if (!a || !a.alive || (viewer && viewer.alive && !visibleTo(world, a, viewer))) continue;
    const p = worldToScreen(R, a.x, a.y), s = R.cam.view.s;
    const k = easeOutBack(clamp(e.t / 0.2, 0, 1));
    ctx.globalAlpha = clamp((e.dur - e.t) * 5, 0, 1);
    ctx.font = `900 ${20 * k}px ${NUM}`;
    ctx.textAlign = 'center';
    const hasBubble = H.bubbles.some((b) => b.id === e.id);
    const yy = p.y - s * 1.0 - 6 - Math.sin(e.t * 12) * 2 - (hasBubble ? 28 : 0);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(4,4,12,0.9)'; ctx.strokeText(e.kind, p.x, yy);
    ctx.fillStyle = e.kind === '!' ? '#ffe36b' : '#ffffff'; ctx.fillText(e.kind, p.x, yy);
    ctx.globalAlpha = 1;
  }
}

function drawBanners(H, game, dt) {
  const ctx = H.ctx;
  for (const b of H.banners) b.t += dt;
  H.banners = H.banners.filter((b) => b.t < b.dur);
  for (const b of H.banners) {
    const cy = b.slot === 'top' ? game.L.track.y + 100 : H.cssH * 0.4;
    const kin = clamp(b.t / 0.28, 0, 1), kout = clamp((b.dur - b.t) / 0.3, 0, 1);
    const s = b.style === 'flip' ? (b.t < 0.28 ? 2.2 - 1.2 * easeOutBack(kin) : 1) : easeOutBack(kin);
    const big = b.style === 'flip' ? 60 : b.style === 'big' ? 42 : b.style === 'warn' ? 24 : 28;
    ctx.save();
    ctx.globalAlpha = kout;
    ctx.translate(H.cssW / 2, cy);
    ctx.font = `900 ${big}px ${FONT}`;
    const fit = Math.min(1, (H.cssW * 0.8) / Math.max(1, ctx.measureText(b.text).width));
    ctx.scale(s * fit, s * fit);
    ctx.textAlign = 'center';
    if (b.style === 'flip' || b.style === 'big') {
      const sp = (1 - kin) * 10 + 2;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,40,90,0.55)'; ctx.fillText(b.text, -sp, 0);
      ctx.fillStyle = 'rgba(40,200,255,0.55)'; ctx.fillText(b.text, sp, 0);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.lineWidth = b.style === 'warn' ? 4 : 7;
    ctx.strokeStyle = 'rgba(3,3,10,0.9)';
    ctx.strokeText(b.text, 0, 0);
    ctx.shadowColor = b.color; ctx.shadowBlur = 24;
    ctx.fillStyle = b.style === 'warn' ? b.color : '#ffffff';
    ctx.fillText(b.text, 0, 0);
    ctx.shadowBlur = 0;
    if (b.style !== 'warn') { ctx.strokeStyle = b.color; ctx.lineWidth = 1.5; ctx.strokeText(b.text, 0, 0); }
    if (b.sub) {
      const sy = big * 0.62 + 8;
      ctx.font = `800 ${Math.round(big * 0.26 + 7)}px ${FONT}`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(3,3,10,0.92)';
      ctx.strokeText(b.sub, 0, sy);
      ctx.fillStyle = mixHex(b.color, '#ffffff', 0.55);
      ctx.fillText(b.sub, 0, sy);
    }
    ctx.restore();
  }
}

function drawCountdown(H, dt) {
  const c = H.countdown;
  if (!c) return;
  c.t += dt;
  const n = Math.ceil(c.total - c.t);
  if (c.t > c.total + 0.7) { H.countdown = null; return; }
  const ctx = H.ctx, frac = c.t % 1;
  const label = n > 0 ? String(n) : '跑！';
  const k = easeOutBack(clamp(frac / 0.25, 0, 1));
  ctx.save();
  ctx.globalAlpha = n > 0 ? 1 - Math.max(0, frac - 0.6) / 0.4 : clamp((c.total + 0.7 - c.t) / 0.4, 0, 1);
  ctx.translate(H.cssW / 2, H.cssH * 0.42);
  ctx.scale(k, k);
  ctx.textAlign = 'center';
  ctx.font = `900 ${n > 0 ? 76 : 54}px ${n > 0 ? NUM : FONT}`;
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(3,3,10,0.85)'; ctx.strokeText(label, 0, 0);
  ctx.shadowColor = c.color; ctx.shadowBlur = 30; ctx.fillStyle = '#ffffff'; ctx.fillText(label, 0, 0);
  ctx.restore();
}

function drawVs(H, dt) {
  const v = H.vs;
  if (!v) return;
  v.t += dt;
  if (v.t > v.dur) { H.vs = null; return; }
  const ctx = H.ctx;
  const kin = easeOutBack(clamp(v.t / 0.35, 0, 1)), kout = clamp((v.dur - v.t) / 0.35, 0, 1);
  const cy = H.cssH * 0.5;
  ctx.save();
  ctx.globalAlpha = kout;
  ctx.fillStyle = 'rgba(4,4,12,0.55)';
  ctx.fillRect(0, cy - 56, H.cssW, 112);
  const side = (a, dir) => {
    const x = H.cssW / 2 + dir * (H.cssW * 0.2) - dir * (1 - kin) * H.cssW * 0.6;
    ctx.save(); ctx.shadowColor = a.color; ctx.shadowBlur = 22;
    miniFace(ctx, x, cy - 8, 24, a.color, a.ghost);
    ctx.restore();
    ctx.font = `900 15px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
    ctx.fillText(a.isHuman ? STR.you : a.name, x, cy + 36);
    if (a.ghost) { ctx.font = `800 10px ${FONT}`; ctx.fillStyle = a.color; ctx.fillText(STR.ghostTag, x, cy - 38); }
  };
  side(v.a, -1); side(v.b, 1);
  ctx.font = `900 ${36 * kin}px ${NUM}`;

function layout() {
  const w = frame.clientWidth, h = frame.clientHeight;
  const cs = getComputedStyle($('safe'));
  const safe = { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0, t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
  G.L = computeLayout(w, h, safe);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pr = dpr * G.quality;
  resizeRenderer(R, w, h, pr);
  if (post.ok) post.resize(Math.round(w * pr), Math.round(h * pr));
  resizeHud(H, w, h, Math.min(window.devicePixelRatio || 1, 2.5));
  R.cam.init = false;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();

// ---------------- 流程 ----------------
function goTitle() {
  G.matchId++;
  G.mode = 'title';
  G.paused = false;
  G.reviveOffer = null;
  G.shopFrom = null;
  if (!G.adPlaying) audioSuspend(false);
  uiHideAll(ui);
  uiPauseButton(false);
  hudReset(H);
  fxClear(fx);
  input.reset();
  uiRecord(G.save);
  uiTitleMeta(G.save);
  uiShow(ui, 'title', true);
  startAttract();
  musicSet('menu');
}

function startAttract() {
  G.world = createWorld({ human: false, seed: (Math.random() * 1e9) | 0 });
  G.human = null;
  G.wallColor = G.world.ghost.color;
  startWorld(G.world);
  G.attractT = 0;
  R.cam.init = false;
}

function newMatch() {
  G.matchId++;
  uiHideAll(ui);
  hudReset(H);
  fxClear(fx);
  input.reset();
  G.paused = false; G.outShown = false; G.hl = []; G.danger = 0; G.acc = 0; G.settle = null;
  G.reviveOffer = null; G.reviveUsed = false; G.shopFrom = null;
  uiRevive(ui, false);
  if (!G.adPlaying) audioSuspend(false);
  const first = G.save.played === 0 ? 'brute' : AI_ORDER[(Math.random() * AI_ORDER.length) | 0];
  const seed = params.has('seed') ? +params.get('seed') : (Math.random() * 1e9) | 0;
  G.world = createWorld({ human: true, seed, firstGhost: first, newbie: !G.save.tutorialDone, skill: G.save.skill, loadout: G.save.loadout });
  G.human = G.world.human;
  if (AUTOPLAY) G.human.brain = createBrain(G.world, G.human, 'drifter');
  G.wallColor = COLORS.neutral;
  G.tut = G.save.tutorialDone ? null : { moved: 0, tower: false, ghost: false, pallet: false, vault: false, skill: false, full: false, hunt: false };
  G.mode = 'lineup';
  R.cam.init = false;
  musicSet('menu');
  uiPauseButton(false);
  uiLineup(ui, G.world.actors, G.world.ghost.id, (last) => sfx.tick(last ? 1 : 2), startMatch);
}

function startMatch() {
  if (G.mode !== 'lineup') return;
  G.mode = 'play';
  startWorld(G.world);
  const g = G.world.ghost;
  fx.wave = { x: g.x, y: g.y, r: 0, from: COLORS.neutral, to: g.color };
  G.wallColor = g.color;
  H.countdown = { t: 0, total: TUNE.startFreeze, color: g.color };
  G.cdLast = 4;
  musicSet('run', true);
  uiPauseButton(true);
  if (G.tut) hint(H, 'move', STR.hintMove, { anchor: 'left', dur: 30 });
  G.last = performance.now();
}

function togglePause(on) {
  if (G.mode !== 'play' && on) return;
  // 问复活的那几秒对局本来就冻结着，不进暂停
  if (on && G.reviveOffer) return;
  G.paused = on;
  // 恢复时按住的摇杆立刻生效，不用等手指再动一下
  if (G.human && !AUTOPLAY) setMove(G.world, G.human, on ? 0 : input.vec.x, on ? 0 : input.vec.y);
  uiShow(ui, 'pause', on);
  audioSuspend(on);
  G.last = performance.now();
}

// 手机转成竖屏时会被提示层盖住，对局自动暂停
const portraitMq = window.matchMedia ? window.matchMedia('(orientation: portrait) and (pointer: coarse)') : null;
if (portraitMq) {
  const onOrient = () => { if (portraitMq.matches && G.mode === 'play' && !G.paused) togglePause(true); };
  if (portraitMq.addEventListener) portraitMq.addEventListener('change', onOrient);
  else if (portraitMq.addListener) portraitMq.addListener(onOrient);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    input.reset();
    if (G.mode === 'play' && !G.paused && !G.reviveOffer) togglePause(true);
    else audioSuspend(true);
  } else if (!G.paused && !G.adPlaying) audioSuspend(false);
});

// 只在当前这局里生效的延时回调
function later(ms, fn) { const id = G.matchId; setTimeout(() => { if (id === G.matchId) fn(); }, ms); }

// ---------------- 事件 → 演出 ----------------
const byId = (id) => G.world.actors.find((a) => a.id === id);
const isYou = (a) => a && a.isHuman;
function rel(x) { const v = R.cam.view; return v ? clamp((x - v.cx) / 12, -0.9, 0.9) : 0; }
function near(x, y) {
  const f = G.human && G.human.alive ? G.human : R.cam.view ? { x: R.cam.view.cx, y: R.cam.view.cy } : { x, y };
  return clamp(1 - Math.hypot(f.x - x, f.y - y) / 16, 0.1, 1);
}
function rgb01(hex) { const c = hexToRgb(hex); return [c[0] / 255, c[1] / 255, c[2] / 255]; }
function addHl(t, color) { G.hl.push({ t: G.world.time, text: t, color }); }
// 表现层自己的随机数：不能消耗规则层的 world.rng，否则同一个种子在浏览器和 Node 里会跑出不同的对局
const uiRng = { next: () => Math.random() };

function aiSay(a, kind, p = 1) {
  if (!a || a.isHuman || !a.alive || Math.random() > p) return;
  const l = lineFor(a.persona, kind, uiRng);
  if (l) bubble(H, a.id, l);
}

function handleEvent(e) {
  const W = G.world;
  switch (e.type) {
    case 'pickup': {
      const a = byId(e.id);
      burst(fx, e.x, e.y, '#ffe9a8', isYou(a) ? 7 : 4, { speed: 2.4, life: 0.35, size: 0.06 });
      if (isYou(a)) { sfx.spark(rel(e.x)); text(fx, e.x, e.y - 0.5, '+3', '#ffe08a', { size: 12, life: 0.6, vy: -1.4 }); }
      else sfx.sparkOther(rel(e.x), near(e.x, e.y) * 0.5);
      break;
    }
    case 'charged': {
      const a = byId(e.id);
      ring(fx, a.x, a.y, a.color, 0.4, 1.6, 0.6, 0.1);
      if (isYou(a)) { sfx.charged(); text(fx, a.x, a.y - 0.9, '快轮到你了！', a.color, { size: 16, life: 1.3, big: true }); vib(20); }
      else text(fx, a.x, a.y - 0.9, '快翻身！', a.color, { size: 13, life: 1.2 });
      break;
    }
    case 'flip': onFlip(e); break;
    case 'catch': onCatch(e); break;
    case 'fall': onFall(e); break;
    case 'close': {
      const a = byId(e.id), g = byId(e.gid);
      ring(fx, a.x, a.y, '#ffffff', 0.3, 1.5, 0.45, 0.07);
      if (isYou(a)) {
        slowmo(fx, 0.3, 0.35); sfx.close(rel(a.x)); aberr(fx, 0.5);
        text(fx, a.x, a.y - 0.8, STR.close, '#ffffff', { size: 19, life: 1.2, big: true, sub: '+10%' });
        noteHappy(R, a.id); vib(18); addHl(STR.hl.close(g ? g.name : ''), a.color);
      } else { text(fx, a.x, a.y - 0.8, STR.close, a.color, { size: 12, life: 0.9 }); aiSay(a, 'close', 0.5); }
      break;
    }
    case 'palletDrop': {
      const p = W.pallets[e.id];
      burst(fx, p.cx, p.cy, '#ffd27a', 14, { speed: 3.5, life: 0.4, size: 0.06 });
      sfx.palletDrop(rel(p.cx), near(p.cx, p.cy));
      if (isYou(byId(e.by))) { shake(fx, 0.12); vib(15); }
      break;
    }
    case 'palletStun': {
      const g = byId(e.id), by = byId(e.by);
      hitstop(fx, isYou(by) || isYou(g) ? 0.1 : 0.04);
      ring(fx, g.x, g.y, '#ffd27a', 0.3, 2.2, 0.5, 0.14);
      burst(fx, g.x, g.y, '#fff6b0', 18, { kind: 'shard', speed: 4, life: 0.6, size: 0.08 });
      text(fx, g.x, g.y - 1.1, '砸中！', '#ffd27a', { size: isYou(by) ? 22 : 15, life: 1.1, big: isYou(by) });
      sfx.palletStun(rel(g.x), near(g.x, g.y));
      if (isYou(by)) { shake(fx, 0.35); punch(fx, 0.7, g.x, g.y); vib([30, 30, 60]); addHl(STR.hl.stun(g.name), '#ffd27a'); }
      if (isYou(g)) { shake(fx, 0.4); vib(60); }
      if (!g.isHuman) later(300, () => aiSay(g, 'stun', 0.8));
      if (by && !by.isHuman) later(400, () => aiSay(by, 'close', 0.5));
      break;
    }
    case 'palletBreakStart': sfx.palletCrack(rel(e.x), near(e.x, e.y)); break;
    case 'palletBreak': {
      const p = W.pallets[e.id];
      addBreak(R, p);
      burst(fx, p.cx, p.cy, '#ffd27a', 16, { kind: 'shard', speed: 4.5, life: 0.7, size: 0.08 });
      sfx.palletBreak(rel(p.cx), near(p.cx, p.cy));
      if (isYou(byId(e.by))) shake(fx, 0.2);
      break;
    }
    case 'palletBack': ring(fx, e.x, e.y, '#ffd27a', 0.3, 1.4, 0.5, 0.08); if (near(e.x, e.y) > 0.6) sfx.towerOff(rel(e.x)); break;
    case 'vault': {
      const a = byId(e.id);
      if (a && (isYou(a) || near(a.x, a.y) > 0.5)) sfx.vault(rel(a.x), a.ghost);
      if (a) burst(fx, a.x, a.y, '#cfe0ff', 5, { speed: 1.5, life: 0.3, size: 0.04 });
      if (isYou(a) && G.tut && !G.tut.vault) { G.tut.vault = true; clearHint(H, 'vault'); }
      break;
    }
    case 'segBlock': ring(fx, e.x, e.y, '#ff4d6d', 0.3, 1.6, 0.5, 0.08); break;
    case 'block': {
      const r = byId(e.id), g = byId(e.gid);
      hitstop(fx, 0.08);
      ring(fx, r.x, r.y, '#dff8ff', 0.4, 2.4, 0.5, 0.16);
      burst(fx, r.x, r.y, '#dff8ff', 20, { kind: 'shard', speed: 5, life: 0.6, size: 0.07 });
      text(fx, r.x, r.y - 1, '挡住了！', '#dff8ff', { size: isYou(r) ? 22 : 14, life: 1.1, big: isYou(r) });
      sfx.shieldBlock(rel(r.x));
      if (isYou(r)) { shake(fx, 0.3); vib([20, 20, 50]); addHl(STR.hl.block(g.name), r.color); }
      if (isYou(g)) shake(fx, 0.35);
      break;
    }
    case 'skill': onSkill(e); break;
    case 'blink': {
      const a = byId(e.id);
      burst(fx, e.fx, e.fy, a.color, 14, { speed: 2, life: 0.5, size: 0.07 });
      ring(fx, e.tx, e.ty, a.color, 0.2, 1.4, 0.35, 0.1);
      for (let k = 1; k <= 5; k++) { const t = k / 6; burst(fx, e.fx + (e.tx - e.fx) * t, e.fy + (e.ty - e.fy) * t, a.color, 2, { speed: 0.5, life: 0.4, size: 0.06 }); }
      break;
    }
    case 'blinkWind': {
      const a = byId(e.id);
      ring(fx, e.tx, e.ty, a.color, 1.2, 0.3, 0.3, 0.08);
      if (isYou(a) || near(e.tx, e.ty) > 0.4) sfx.blinkWind(rel(e.tx), isYou(a) ? 1 : near(e.tx, e.ty));
      break;
    }
    case 'hookWind': if (isYou(byId(e.id)) || near(e.x, e.y) > 0.4) sfx.hookWind(rel(e.x)); break;
    case 'hook': sfx.hook(rel(e.x), isYou(byId(e.id)) ? 1 : near(e.x, e.y)); break;
    case 'nightvision': {
      const g = byId(e.id);
      if (isYou(g)) { flash(fx, 0.18, rgb01(g.color)); banner(H, '夜视', { sub: '所有人都暴露了', color: g.color, style: 'warn', slot: 'top', dur: 1.4 }); }
      else if (G.human && G.human.alive && !G.human.ghost) { text(fx, G.human.x, G.human.y - 1.1, '你被看见了！', g.color, { size: 14, life: 1.2 }); vib(25); }
      break;
    }
    case 'trap': if (isYou(byId(e.id))) ring(fx, e.x, e.y, '#e9e4ff', 0.2, 0.8, 0.4, 0.05); break;
    case 'trapHit': {
      const r = byId(e.id);
      ring(fx, e.x, e.y, '#e9e4ff', 0.3, 1.4, 0.5, 0.1);
      text(fx, r.x, r.y - 0.9, '被网住了', '#e9e4ff', { size: isYou(r) ? 17 : 12, life: 1.1, big: isYou(r) });
      sfx.trapHit(rel(e.x), near(e.x, e.y));
      if (isYou(r)) { shake(fx, 0.25); vib(50); }
      break;
    }
    case 'hookHit': {
      const r = byId(e.id);
      text(fx, r.x, r.y - 0.9, '被拉住了', '#efe9ff', { size: isYou(r) ? 17 : 12, life: 1 });
      sfx.hookHit(rel(r.x), near(r.x, r.y));
      if (isYou(r)) { shake(fx, 0.25); vib(40); }
      break;
    }
    case 'chargeWind': if (G.human && G.human.alive && near(e.x, e.y) > 0.4) sfx.chargeWind(rel(e.x)); break;
    case 'charge': burst(fx, e.x, e.y, '#ff8a3c', 10, { kind: 'streak', speed: 6, life: 0.4, size: 0.06 }); break;
    case 'chargeWall': {
      const a = byId(e.id);
      ring(fx, e.x, e.y, '#ffffff', 0.3, 1.6, 0.4, 0.12);
      text(fx, e.x, e.y - 1.1, '撞墙！', a.color, { size: 14, life: 0.9 });
      sfx.palletStun(rel(e.x), near(e.x, e.y));
      shake(fx, isYou(a) ? 0.4 : 0.15);
      break;
    }
    case 'stompWind': break;
    case 'stomp': {
      const a = byId(e.id);
      ring(fx, e.x, e.y, a.color, 0.5, e.r, 0.45, 0.2, { fill: 0.1 });
      shockwave(fx, e.x, e.y, 0.4, 0.6, 1.5);
      sfx.stomp(rel(e.x), near(e.x, e.y));
      shake(fx, isYou(a) ? 0.35 : 0.2 * near(e.x, e.y));
      break;
    }
    case 'decoyEnd': {
      burst(fx, e.x, e.y, e.color, e.popped ? 18 : 8, { speed: e.popped ? 4 : 1.5, life: 0.45, size: 0.06 });
      if (e.popped) { sfx.decoyPop(rel(e.x)); text(fx, e.x, e.y - 0.8, '上当了！', e.color, { size: 15, life: 1, big: true }); const g = byId(e.gid); if (g && !g.isHuman && Math.random() < 0.6) bubble(H, g.id, '假的？！'); }
      break;
    }
    case 'pounceWind': {
      const g = byId(e.id);
      ring(fx, g.x, g.y, g.color, 0.9, 0.35, 0.16, 0.09);
      if (isYou(g) || near(g.x, g.y) > 0.4) sfx.pounceWind(rel(g.x), isYou(g) ? 1 : near(g.x, g.y));
      break;
    }
    case 'pounce': {
      const g = byId(e.id);
      burst(fx, g.x, g.y, g.color, 10, { kind: 'streak', speed: 5, life: 0.3, size: 0.06 });
      sfx.pounce(rel(g.x), isYou(g) ? 1 : near(g.x, g.y));
      if (isYou(g)) shake(fx, 0.1);
      break;
    }
    case 'towerDormant': ring(fx, e.x, e.y, '#9aa0b8', 0.5, 2.2, 0.6, 0.08); if (near(e.x, e.y) > 0.6) sfx.towerOff(rel(e.x)); break;
    case 'towerWake': ring(fx, e.x, e.y, '#fff1c8', 0.4, 2.4, 0.8, 0.1); break;
    case 'zoneWarn':
      sfx.zoneWarn();
      banner(H, e.final ? '决赛圈即将形成' : STR.zoneWarn, { sub: `${e.inSec} 秒后收缩`, color: '#ff5577', style: 'warn', slot: 'top', dur: 2.6 });
      vib([20, 60, 20]);
      break;
    case 'zoneShrink':
      sfx.zoneShrink(e.dur || 6);
      shake(fx, 0.1);
      if (e.final) banner(H, STR.zoneFinal, { sub: '无处可藏', color: '#ff5577', style: 'big', dur: 2 });
      break;
    case 'sudden': banner(H, STR.sudden, { color: '#ff5577', style: 'warn', slot: 'top', dur: 2.6 }); sfx.zoneWarn(); break;
    case 'duel': {
      const [a, b] = e.ids.map(byId);
      hitstop(fx, 0.08); slowmo(fx, 0.3, 1.2); flash(fx, 0.2, [1, 0.85, 0.6]);
      const g = a.ghost ? a : b, r = a.ghost ? b : a;
      H.banners = [];
      showVs(H, g, r);
      sfx.duel();
      musicSet('final', true);
      musicDuck(0.15, 0.6, 1.4);
      vib([30, 50, 30]);
      break;
    }
    case 'win': onWin(e); break;
    case 'say': { const a = byId(e.id); if (a) bubble(H, a.id, e.text); break; }
    case 'emote': { const a = byId(e.id); if (a) { emote(H, a.id, e.kind); if (near(a.x, a.y) > 0.6) sfx.emote(rel(a.x), 76 + a.id * 2); } break; }
    default: break;
  }
}

function onSkill(e) {
  const a = byId(e.id);
  if (!a) return;
  const you = isYou(a), vol = you ? 1 : near(a.x, a.y);
  const nm = SKILLS[e.skill].name;
  switch (e.skill) {
    case 'dash': burst(fx, a.x, a.y, a.color, 14, { kind: 'streak', speed: 6, life: 0.4, size: 0.05 }); sfx.dash(rel(a.x), vol); break;
    case 'shield': ring(fx, a.x, a.y, '#dff8ff', 0.3, 1.1, 0.35, 0.08); sfx.shieldUp(rel(a.x), vol); break;
    case 'phantom': burst(fx, a.x, a.y, a.color, 16, { speed: 3, life: 0.5, size: 0.06 }); sfx.decoy(rel(a.x), vol); break;
    case 'blink': sfx.blink(rel(a.x), vol); if (you) shake(fx, 0.1); break;
    case 'nightvision': sfx.nightvision(); break;
    case 'trap': sfx.trapSet(rel(a.x), vol); break;
    case 'hook': break;
    case 'charge': sfx.charge(rel(a.x), vol); break;
    case 'stomp': break;
    default: break;
  }
  if (!you && vol > 0.5 && a.ghost) text(fx, a.x, a.y - 1.2, nm, a.color, { size: 12, life: 0.8 });
}

function onFlip(e) {
  const W = G.world;
  const ng = byId(e.id), old = e.old >= 0 ? byId(e.old) : null;
  const you = isYou(ng), wasYou = isYou(old);
  fx.wave = { x: ng.x, y: ng.y, r: 0, from: G.wallColor, to: ng.color };
  G.wallColor = ng.color;
  hitstop(fx, you ? 0.13 : 0.07);
  slowmo(fx, you ? 0.18 : 0.35, you ? 1.15 : 0.75);
  shockwave(fx, ng.x, ng.y, you ? 1.0 : 0.6, 1.3, 0.9);
  flash(fx, you ? 0.55 : 0.22, rgb01(ng.color));
  aberr(fx, you ? 1.1 : 0.5);
  focus(fx, ng.x, ng.y, you ? 1.35 : 1.12, you ? 1.4 : 0.9);
  shake(fx, you ? 0.5 : 0.22);
  burst(fx, ng.x, ng.y, ng.color, you ? 46 : 28, { speed: 8, life: 1, size: 0.09 });
  burst(fx, ng.x, ng.y, '#ffffff', 14, { kind: 'streak', speed: 11, life: 0.5, size: 0.05 });
  ring(fx, ng.x, ng.y, ng.color, 0.3, 5, 1, 0.22);
  if (old && old.alive) {
    burst(fx, old.x, old.y, old.color, 22, { kind: 'shard', speed: 5.5, life: 0.9, size: 0.1 });
    text(fx, old.x, old.y - 0.9, wasYou ? '你变回人了' : '变回人了', old.color, { size: wasYou ? 16 : 12, life: 1.3, big: wasYou });
  }
  for (const a of W.actors) if (a.alive && a !== ng) burst(fx, a.x, a.y, a.color, 6, { speed: 3.5, life: 0.5, size: 0.05 });
  sfx.flip(you, rel(ng.x));
  musicDuck(0.15, 0.25, 1.1);
  const finalMusic = W.duel || W.zone.final;
  const gName = CHARS[ng.ghostChar].name;
  if (you) {
    if (!finalMusic) musicSet('ghost', true);
    banner(H, STR.flipYou, { sub: `变身${gName} · 去抓他们`, color: ng.color, style: 'flip', dur: 2.1 });
    vib([60, 40, 140]);
    addHl(STR.hl.flip, ng.color);
    if (G.tut && !G.tut.hunt) { G.tut.hunt = true; later(1300, () => hint(H, 'hunt', STR.hintHunt, { anchor: 'right', dur: 4 })); }
  } else {
    if (wasYou && !finalMusic) musicSet('run', true);
    banner(H, STR.flipOther(ng.name), { sub: wasYou ? '你变回人了，快跑！' : `${gName}来了 · ${STR.flipOtherSub}`, color: ng.color, style: 'big', dur: 1.7 });
    vib(30);
  }
  feed(H, [{ text: ng.isHuman ? STR.you : ng.name, color: ng.color }, { text: e.cause === 'void' ? ' 接任成为新鬼' : ' 的回合开始了' }]);
  let k = 0;
  for (const a of W.actors) if (a.alive && a !== ng && !a.isHuman) later(120 + 90 * k++, () => { if (a.alive && !a.ghost) emote(H, a.id, '!'); });
  if (!ng.isHuman) later(450, () => aiSay(ng, 'flip', 0.9));
}

function onCatch(e) {
  const W = G.world;
  const v = byId(e.id), g = byId(e.by);
  const youCaught = isYou(g), youDied = isYou(v);
  hitstop(fx, youCaught ? 0.11 : youDied ? 0.16 : 0.05);
  burst(fx, v.x, v.y, v.color, youCaught || youDied ? 26 : 16, { kind: 'shard', speed: 5, life: 0.9, size: 0.09 });
  burst(fx, v.x, v.y, v.color, 16, { speed: 2.5, life: 1.3, size: 0.07, delay: 0.18, target: g, drag: 3 });
  ring(fx, v.x, v.y, v.color, 0.3, 2.2, 0.55, 0.14);
  shockwave(fx, v.x, v.y, youCaught || youDied ? 0.5 : 0.25, 0.7, 1.4);
  sfx.catch(rel(v.x), youCaught || youDied ? 1 : near(v.x, v.y), youCaught && e.streak >= 2);
  const gName = g.isHuman ? STR.you : g.name, vName = v.isHuman ? STR.you : v.name;
  const tag = e.special === 'deny' ? '（截杀）' : e.special === 'revenge' ? '（复仇）' : '';
  feed(H, [{ text: gName, color: g.color }, { text: ' 抓住了 ' }, { text: vName, color: v.color }, { text: tag, color: '#ffd27a' }]);
  if (youCaught) {
    shake(fx, 0.45); punch(fx, 1, v.x, v.y); flash(fx, 0.18, rgb01(g.color)); aberr(fx, 0.7);
    vib([40, 30, 80]);
    const multi = STR.multi[Math.min(e.streak, STR.multi.length - 1)];
    if (e.special === 'deny') banner(H, STR.deny, { sub: `${v.name} 差一点就翻身了`, color: '#ffd27a', style: 'big', dur: 1.6 });
    else if (e.special === 'revenge') banner(H, STR.revenge, { sub: `${v.name} 刚才追过你`, color: '#ff6b8a', style: 'big', dur: 1.6 });
    else if (multi) banner(H, multi, { color: g.color, style: 'big', dur: 1.4 });
    else text(fx, g.x, g.y - 1.1, '抓到了！', g.color, { size: 20, life: 1, big: true });
    addHl(e.special === 'deny' ? STR.hl.deny(v.name) : e.special === 'revenge' ? STR.hl.revenge(v.name) : STR.hl.catch(v.name), g.color);
  } else if (youDied) {
    slowmo(fx, 0.22, 1.3); focus(fx, v.x, v.y, 1.3, 1.5); shake(fx, 0.6); flash(fx, 0.35, [1, 0.15, 0.3]); aberr(fx, 1.2);
    sfx.caughtYou();
    vib([100, 50, 220]);
    addHl(STR.hl.out(g.name), '#ff5577');
    if (!g.isHuman) later(500, () => aiSay(g, e.special === 'revenge' ? 'revenge' : 'catch', 1));
    outOrRevive(STR.caughtYou(g.name), v.place, e.aliveAfter);
  } else {
    const line = lineFor(v.persona, 'caught', uiRng);
    if (line) text(fx, v.x, v.y - 0.8, line, v.color, { size: 12, life: 1.4 });
    aiSay(g, e.special === 'revenge' ? 'revenge' : 'catch', 0.55);
  }
}

function onFall(e) {
  const v = byId(e.id);
  burst(fx, v.x, v.y, '#ff4466', 16, { speed: 2, life: 0.9, size: 0.06 });
  sfx.fall(rel(v.x));
  feed(H, [{ text: v.isHuman ? STR.you : v.name, color: v.color }, { text: ' 坠入虚空' }]);
  if (isYou(v)) {
    slowmo(fx, 0.25, 1.0); focus(fx, v.x, v.y, 1.3, 1.2); flash(fx, 0.3, [1, 0.15, 0.3]);
    sfx.caughtYou(); vib([80, 40, 160]);
    addHl(STR.hl.fall, '#ff5577');
    outOrRevive(STR.fellYou, v.place, e.aliveAfter);
  }
}

// 一局的金币和成绩只结算一次：人出局时按当时的名次结算，活到最后的在对局结束时结算
function settleOnce(place) {
  if (G.settle || !G.human) return G.settle;
  const h = G.human, s = G.save;
  G.settle = settleMatch(s, { place, catches: h.stats.catches, flips: h.stats.flips, stuns: h.stats.stuns });
  // 难度自适应：输得多就让 AI 松一点，赢了就收紧
  if (place >= 4) s.skill = Math.max(-2, s.skill - 1);
  else if (place === 1) s.skill = Math.min(2, s.skill + 1);
  else s.skill = s.skill > 0 ? s.skill - 0.5 : s.skill < 0 ? s.skill + 0.5 : 0;
  s.tutorialDone = true;
  persist();
  return G.settle;
}

// ---------- 复活 ----------
// 被抓后对局冻结，问要不要看视频复活；被抓后只剩 2 人（直接进入或结束对决）、本局已复活过、首局都不提供
function outOrRevive(msg, place, aliveAfter) {
  if (!G.reviveUsed && aliveAfter >= 3 && G.world.phase === 'play' && adsAllowed('revive') && canRevive(G.world, G.human)) {
    G.reviveOffer = { msg, place, t: 0, wait: 1.1, dur: 8, busy: false };
    uiPauseButton(false);
    musicSet('out');
    for (const h of H.hints) h.done = true;
  } else humanOut(msg, place);
}

async function reviveYes() {
  const o = G.reviveOffer;
  if (!o || o.busy) return;
  o.busy = true;
  sfx.ui('confirm');
  uiRevive(ui, false);
  const r = await playAd();
  if (G.reviveOffer !== o) return;
  if (r === 'rewarded' && reviveActor(G.world, G.human)) {
    G.reviveOffer = null;
    G.reviveUsed = true;
    const h = G.human;
    R.cam.init = false;
    ring(fx, h.x, h.y, h.color, 0.3, 2.4, 0.7, 0.16);
    burst(fx, h.x, h.y, h.color, 30, { speed: 5, life: 0.9, size: 0.08 });
    banner(H, '复活！', { sub: '能量清零 · 小心鬼', color: h.color, style: 'big', dur: 1.6 });
    sfx.flip(false, 0);
    vib([30, 40, 60]);
    uiPauseButton(true);
    musicSet('run', true);
    G.last = performance.now();
    return;
  }
  uiToast(r === 'rewarded' ? '找不到安全的重生位置' : r === 'closed' ? '没有看完，不能复活' : '暂时没有广告');
  o.busy = false;
  declineRevive();
}

function declineRevive() {
  const o = G.reviveOffer;
  if (!o) return;
  G.reviveOffer = null;
  uiRevive(ui, false);
  humanOut(o.msg, o.place, 200);
}

function humanOut(msg, place, delay = 1400) {
  musicSet('out');
  for (const h of H.hints) h.done = true;
  const st = settleOnce(place);
  if (G.world.phase === 'over') return;
  later(delay, () => {
    if (G.mode === 'play' && G.world.phase === 'play' && !G.outShown) {
      G.outShown = true;
      uiPauseButton(false);
      uiOutGain(st ? `本局金币 +${st.coins}` : '');
      uiOut(ui, msg, place);
      if (st && st.coins) sfx.coins();
    }
  });
}

function onWin(e) {
  const w = byId(e.id);
  G.mode = 'over';
  G.reviveOffer = null;
  uiRevive(ui, false);
  slowmo(fx, 0.35, 1.6);
  focus(fx, w.x, w.y, 1.3, 2.6);
  uiPauseButton(false);
  uiShow(ui, 'out', false);
  const h = G.human;
  if (isYou(w)) {
    sfx.win();
    banner(H, STR.win, { sub: STR.winSub, color: '#ffe08a', style: 'big', dur: 2.6 });
    for (let i = 0; i < 4; i++) later(i * 220, () => burst(fx, w.x, w.y, ['#ffe08a', '#62f4ff', '#ff5fc9', '#ffffff'][i], 30, { speed: 7, life: 1.4, size: 0.08, grav: 2 }));
    addHl(STR.hl.win, '#ffe08a');
    vib([60, 60, 60, 60, 160]);
  } else {
    banner(H, `${w.name} 获胜`, { sub: h && h.place ? STR.place(h.place) : '', color: w.color, style: 'big', dur: 2.4 });
    sfx.lose();
  }
  const place = h ? (h.alive ? 1 : h.place) : 5;
  settleOnce(place);
  musicSetWin(place === 1);
  later(2500, () => showResults(place));
}

function showResults(place) {
  if (G.mode !== 'over') return;
  const W = G.world, h = G.human;
  musicSet('results');
  const rank = W.actors.slice().sort((a, b) => (a.alive ? 1 : a.place) - (b.alive ? 1 : b.place)).map((a) => ({ name: a.isHuman ? STR.you : a.name, color: a.color, place: a.alive ? 1 : a.place }));
  uiResults(ui, {
    place, win: place === 1,
    sub: h && h.outCause === 'void' ? '坠入了虚空' : h && h.outBy >= 0 ? `被 ${byId(h.outBy).name} 抓住` : '',
    stats: h.stats, survived: h.alive ? W.time : h.outT, hl: G.hl, rank, coins: G.settle,
  });
  refreshCoinAd();
}

// ---------------- 每帧氛围：危险、心跳、音乐、教学 ----------------
function ambience(dt) {
  const W = G.world, h = G.human;
  let target = 0;
  // 在塔里充能的进度声：每涨 10% 一声
  if (G.mode === 'play' && h && h.alive && !h.ghost) {
    const step = Math.floor(h.energy * 10);
    if (step > G.energyStep && W.towers.some((t) => t.charging > 0 && inTower(t, h))) sfx.towerTick(step);
    G.energyStep = step;
  } else G.energyStep = 0;
  if (G.mode === 'play' && h && h.alive && !h.ghost && W.ghost && W.ghost.alive) {
    G.dangerT -= dt;
    if (G.dangerT <= 0) {
      G.dangerT = 0.15;
      const g = W.ghost, m = W.map;
      const d = nav.run([Math.floor(g.y) * m.w + Math.floor(g.x)], (i) => (m.kind[i] === K_WALL ? Infinity : 0), TUNE.heartRange + 2);
      const hi = Math.floor(h.y) * m.w + Math.floor(h.x);
      G.dangerRaw = d[hi] !== Infinity ? d[hi] : 99;
    }
    const g = W.ghost;
    const idle = g.t.freeze > 0.3 || g.t.stun > 0.3;
    target = clamp(1 - (G.dangerRaw - 2) / (TUNE.heartRange - 2), 0, 1) * (idle ? 0.35 : 1);
  }
  G.danger = approach(G.danger, target, 5, dt);
  musicDanger(G.mode === 'play' ? G.danger : 0);
  G.pulse = Math.max(0, G.pulse - dt * 2.5);
  if (G.danger > 0.08 && !G.paused) {
    G.heartT -= dt;
    if (G.heartT <= 0) { G.heartT = 1.15 - 0.75 * G.danger; sfx.heartbeat(G.danger); G.pulse = 1; if (G.danger > 0.7) vib(12); }
  }
  if (G.mode === 'play' && W) {
    let st = 'run';
    if (!h || !h.alive) st = 'out';
    else if (W.duel || W.zone.final) st = 'final';
    else if (h.ghost) st = 'ghost';
    if (musicState() !== st) musicSet(st);
  }
  if (G.tut && G.mode === 'play' && h && h.alive && !h.ghost) {
    const T = G.tut;
    if (T.moved > 40 && !T.tower && W.time > 4) { T.tower = true; hint(H, 'tower', STR.hintTower, { anchor: 'actor', id: h.id, dur: 4 }); }
    if (!T.ghost && G.danger > 0.35) { T.ghost = true; hint(H, 'ghost', STR.hintGhost, { anchor: 'actor', id: h.id, dur: 3 }); }
    if (!T.pallet && G.danger > 0.25 && nearestPallet(W, h, 3)) { T.pallet = true; hint(H, 'pallet', STR.hintPallet, { anchor: 'right', dur: 4 }); }
    if (!T.skill && W.time > 20 && G.danger > 0.3) { T.skill = true; hint(H, 'skill', STR.hintSkill(SKILLS[CHARS[h.runnerChar].skills[0]].name), { anchor: 'right', dur: 4 }); }
    if (!T.vaultHint && W.time > 30) { T.vaultHint = true; hint(H, 'vault', STR.hintVault, { anchor: 'center', dur: 4 }); }
    if (!T.full && h.energy >= 0.6) { T.full = true; hint(H, 'full', STR.hintFull, { anchor: 'track', dur: 3.5 }); }
  }
  if (H.countdown) {
    const n = Math.ceil(H.countdown.total - H.countdown.t);
    if (n !== G.cdLast && n >= 0) { G.cdLast = n; sfx.tick(n); }
  }
}

function postParams() {
  const h = G.human;
  const shocks = fx.shocks.map((s) => { const p = worldToScreen(R, s.x, s.y), k = s.t / s.dur; return { x: p.x / R.cssW, y: 1 - p.y / R.cssH, r: k * 1.25, s: s.s * (1 - k) }; });
  let vig = 0, vigColor = [0, 0, 0], darken = 0, sat = 1;
  if (G.mode === 'play' || G.mode === 'over') {
    if (h && h.alive && h.ghost) { vig = 0.5; vigColor = rgb01(h.color); darken = 0.5; sat = 0.85; }
    else if (h && h.alive) { vig = G.danger * 0.95; vigColor = rgb01(G.world.ghost ? G.world.ghost.color : '#ff2d55'); sat = 1 - G.danger * 0.25; }
    else if (h && !h.alive) { sat = 0.55; darken = 0.2; }
  }
  if (G.mode === 'title') { darken = 0.35; sat = 0.9; }
  return { time: R.time, shocks, aberr: fx.aberr * 0.9, bloom: 1.15, vig, vigColor, darken, sat, flash: fx.flash, flashColor: fx.flashColor, grain: 0.035, pulse: G.pulse };
}

// 镜头焦点：自己；出局后跟着鬼；标题页跟着鬼巡游
function cameraFocus() {
  const W = G.world;
  if (G.human && G.human.alive) return G.human;
  if (G.mode === 'over' && W.winner) return W.winner;
  return W.ghost || W.actors.find((a) => a.alive);
}

// ---------------- 主循环 ----------------
function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  const t0 = performance.now();
  frameBody(now);
  const cost = performance.now() - t0;
  const pf = G.perf || (G.perf = { n: 0, sum: 0, max: 0 });
  pf.n++; pf.sum += cost; pf.max = Math.max(pf.max, cost);
}

function frameBody(now) {
  let dtReal = (now - G.last) / 1000;
  G.last = now;
  if (!(dtReal > 0)) dtReal = 0.016;
  dtReal = Math.min(dtReal, 0.05);
  const W = G.world;
  if (!W) return;
  const ts = G.paused ? 0 : timeScale(fx);
  const dtGame = dtReal * ts;
  if (G.reviveOffer && !G.reviveOffer.busy && !G.paused) {
    const o = G.reviveOffer;
    o.t += dtReal;
    if (o.t >= o.wait) {
      const left = o.dur - (o.t - o.wait);
      if (left <= 0) declineRevive();
      else uiRevive(ui, true, left, left / o.dur);
    }
  }
  if (!G.paused && !G.reviveOffer && W.phase === 'play' && (G.mode === 'play' || G.mode === 'title' || G.mode === 'over')) {
    G.acc += dtGame;
    let n = 0;
    while (G.acc >= STEP && n < 6) {
      updateWorld(W, STEP);
      G.acc -= STEP;
      n++;
      const evs = drainEvents(W);
      if (G.mode !== 'title') for (const e of evs) handleEvent(e);
      else for (const e of evs) if (e.type === 'flip') { const a = byId(e.id); fx.wave = { x: a.x, y: a.y, r: 0, from: G.wallColor, to: a.color }; G.wallColor = a.color; }
      // 问复活时立刻冻结，这一帧剩下的步数也不再推进
      if (G.reviveOffer) { G.acc = 0; break; }
    }
  }
  if (G.mode === 'title' && W.phase === 'over') { G.attractT += dtReal; if (G.attractT > 2.5) startAttract(); }
  const alpha = G.acc / STEP;
  if (!G.paused) fxUpdate(fx, dtReal, dtGame);
  if (!G.paused) ambience(dtReal);
  updateCamera(R, W, cameraFocus(), G.L, fx, dtReal);
  const gv = {
    viewer: (G.mode === 'play' || G.mode === 'over') && G.human && G.human.alive ? G.human : null,
    wallColor: G.wallColor, isYouId: G.human ? G.human.id : -1, L: G.L, postOk: G.postOk,
    danger: G.danger, dangerColor: W.ghost ? W.ghost.color : '#ff2d55', mode: G.mode, joy: input, human: G.human,
  };
  renderScene(R, W, gv, fx, G.paused ? 1 : alpha, G.paused ? 0 : dtGame);
  if (G.postOk) post.render(sceneCanvas, postParams());
  drawHud(H, W, gv, fx, R, G.paused ? 0 : dtReal);
  adaptQuality(dtReal);
}

function adaptQuality(dt) {
  if (G.paused || document.hidden) return;
  const ft = G.frameTimes;
  ft.push(dt);
  if (ft.length < 120) return;
  const avg = ft.reduce((s, v) => s + v, 0) / ft.length;
  ft.length = 0;
  if (avg > 0.024 && G.quality > 0.6) { G.quality = Math.max(0.6, G.quality - 0.15); layout(); }
}

// 测试钩子
function placeNear(a, target, dist) {
  const W = G.world, m = W.map;
  const d = nav.run([Math.floor(target.y) * m.w + Math.floor(target.x)], (i) => (m.kind[i] === K_WALL ? Infinity : 0));
  for (const i of m.floorCells) if (Math.abs(d[i] - dist) < 0.5 && !m.grass[i]) { a.x = a.px = (i % m.w) + 0.5; a.y = a.py = ((i / m.w) | 0) + 0.5; a.vx = 0; a.vy = 0; return; }
}
window.__fg = {
  G,
  debug: {
    energy: (v) => grantEnergy(G.world, G.human, v),
    ghostNear: (d = 3) => placeNear(G.world.ghost, G.human, d),
    runnerNear: (d = 3) => { const r = G.world.actors.find((a) => a.alive && !a.ghost && !a.isHuman); if (r) placeNear(r, G.human, d); },
    cooldowns: () => { if (G.human) { for (const k in G.human.cds) G.human.cds[k] = 0; G.human.pounceCd = 0; } },
  },
  state: () => {
    const W = G.world, h = G.human;
    return {
      mode: G.mode, phase: W && W.phase, time: W && +W.time.toFixed(1), alive: W && W.actors.filter((a) => a.alive).length,
      human: h && { alive: h.alive, ghost: h.ghost, energy: +h.energy.toFixed(2), place: h.place, x: +h.x.toFixed(2), y: +h.y.toFixed(2), mx: +h.mx.toFixed(2), my: +h.my.toFixed(2), runnerChar: h.runnerChar, ghostChar: h.ghostChar, cds: h.cds },
      ghost: W && W.ghost && W.ghost.name, zone: W && +W.zone.r.toFixed(2), post: G.postOk, quality: G.quality,
      audio: SND.ctx ? SND.ctx.state : 'none', music: musicState(),
      perf: G.perf && { avg: +(G.perf.sum / Math.max(1, G.perf.n)).toFixed(2), max: +G.perf.max.toFixed(1), n: G.perf.n },
      buttons: currentButtons().map((b) => ({ id: b.id, kind: b.kind, x: Math.round(b.x), y: Math.round(b.y), r: Math.round(b.r) })),
      revive: !!G.reviveOffer, reviveUsed: !!G.reviveUsed, ads: !!ads, coins: G.save.coins,
    };
  },
};

goTitle();
G.last = performance.now();
requestAnimationFrame(frameLoop);

return {  };
})();
})();
</script>
