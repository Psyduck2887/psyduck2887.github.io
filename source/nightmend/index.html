// 把精灵画到小画布并导出成图片地址（界面里用）
function spriteURL(s, scale = 4, outline = true) {
  const pad = outline ? 1 : 0;
  const c = document.createElement('canvas');
  c.width = (s.w + pad * 2) * scale; c.height = (s.h + pad * 2) * scale;
  const g = c.getContext('2d');
  const put = (x, y, col) => { g.fillStyle = cssOf(col); g.fillRect((x + pad) * scale, (y + pad) * scale, scale, scale); };
  if (outline) for (let i = 0; i < s.out.length; i += 2) put(s.out[i], s.out[i + 1], PAL.ink);
  for (let i = 0; i < s.opq.length; i += 3) put(s.opq[i], s.opq[i + 1], s.opq[i + 2]);
  return c.toDataURL();
}

// ==== 05_audio.js ====
// 音频引擎：Web Audio 实时合成。拨弦用 Karplus-Strong 预渲染成缓冲，铃用 FM，鼓与沙沙声用滤波噪声；不用方波

const AU = {
  ctx: null, ready: false,
  // 总线节点（buildBus 填充）
  sum: null, comp: null, master: null, sfxBus: null, musicBus: null, musicLP: null, revSend: null,
  noiseBuf: null,
  ks: new Map(),          // 拨弦缓冲缓存：键为 音高|音色
  voices: 0, maxVoices: 46,
  last: Object.create(null), // 节流记录
  vol: { master: 0.85, music: 0.55, sfx: 0.85 },
};

// MIDI 音高转频率
function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// 调式：D 小调五声（D F G A C）；chord 是背景音乐当前小节的和弦音级（0 = C），旋律性音效跟着它取音
const KEY = { root: 50, scale: [0, 3, 5, 7, 10], chord: [2, 5, 9] };
// 当前和弦的第 i 个和弦音（从 base 往上数，跨八度）
function chordNote(i, base = 50) {
  const pcs = KEY.chord.slice().sort((a, b) => ((a - base) % 12 + 12) % 12 - ((b - base) % 12 + 12) % 12);
  const n = pcs.length, o = Math.floor(i / n), k = ((i % n) + n) % n;
  return base + ((pcs[k] - base) % 12 + 12) % 12 + 12 * o;
}
// 取五声音阶第 deg 级（可跨八度）
function scaleNote(deg, base = KEY.root) {
  const s = KEY.scale, n = s.length;
  const o = Math.floor(deg / n), i = ((deg % n) + n) % n;
  return base + o * 12 + s[i];
}

// 生成混响冲激响应：指数衰减的立体声噪声
function makeIR(ctx, seconds, decay) {
  const sr = ctx.sampleRate, len = Math.floor(sr * seconds);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      lp += 0.35 * (w - lp); // 稍微压暗，避免刺耳的混响尾巴
      d[i] = lp * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

// 搭建总线：音效与音乐 → 求和 → 高架衰减 → 压缩 → 主音量 → 输出；附带混响发送
function buildBus(ctx, dest, target) {
  const sum = ctx.createGain();
  const shelf = ctx.createBiquadFilter(); shelf.type = 'highshelf'; shelf.frequency.value = 5200; shelf.gain.value = -7;
  const lowcut = ctx.createBiquadFilter(); lowcut.type = 'highpass'; lowcut.frequency.value = 28;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
  const master = ctx.createGain(); master.gain.value = target.vol ? target.vol.master : 0.85;
  sum.connect(lowcut); lowcut.connect(shelf); shelf.connect(comp); comp.connect(master); master.connect(dest);
  const rev = ctx.createConvolver(); rev.buffer = makeIR(ctx, 2.4, 3.2);
  const revOut = ctx.createGain(); revOut.gain.value = 0.42;
  rev.connect(revOut); revOut.connect(sum);
  const revSend = ctx.createGain(); revSend.connect(rev);
  const sfxBus = ctx.createGain(); sfxBus.gain.value = target.vol ? target.vol.sfx : 0.85; sfxBus.connect(sum);
  const musicLP = ctx.createBiquadFilter(); musicLP.type = 'lowpass'; musicLP.frequency.value = 16000; musicLP.Q.value = 0.5;
  const musicBus = ctx.createGain(); musicBus.gain.value = target.vol ? target.vol.music : 0.55;
  musicBus.connect(musicLP); musicLP.connect(sum);
  Object.assign(target, { sum, comp, master, sfxBus, musicBus, musicLP, revSend });
  // 噪声缓冲（两秒白噪声）
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  target.noiseBuf = nb;
}

// 首次用户交互时初始化（浏览器要求）
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    AU.ctx = new AC({ latencyHint: 'interactive' });
    buildBus(AU.ctx, AU.ctx.destination, AU);
    AU.ready = true;
    applyVolumes();
    // 空闲时预生成常用音高，避免第一次打结时卡顿
    let m = 38;
    const warm = () => { for (let k = 0; k < 3 && m <= 86; k++, m++) { getKS(m, 'koto'); } if (m <= 86) setTimeout(warm, 16); };
    setTimeout(warm, 50);
  } catch (e) { console.warn('audio init failed', e); }
}
// 根据设置刷新音量
function applyVolumes() {
  if (!AU.ctx) return;
  const t = AU.ctx.currentTime;
  AU.master.gain.setTargetAtTime(AU.vol.master, t, 0.05);
  AU.musicBus.gain.setTargetAtTime(AU.vol.music, t, 0.05);
  AU.sfxBus.gain.setTargetAtTime(AU.vol.sfx, t, 0.05);
}
function auNow() { return AU.ctx ? AU.ctx.currentTime : 0; }
// 节流：同一类音效最短间隔 gap 秒
function auGate(key, gap) {
  const t = auNow();
  if (AU.last[key] !== undefined && t - AU.last[key] < gap) return false;
  AU.last[key] = t;
  return true;
}

// 拨弦音色参数
const KS_KIND = {
  koto: { t60: 1.5, bright: 0.55, dur: 1.8 },  // 筝一样的拨弦
  soft: { t60: 2.4, bright: 0.25, dur: 2.6 },  // 柔和长音（音乐用）
  mute: { t60: 0.22, bright: 0.7, dur: 0.4 },  // 闷音（拾取、轻击）
  harp: { t60: 2.2, bright: 0.4, dur: 2.4 },   // 竖琴感
};
// Karplus-Strong：生成一根弦被拨动后的声音
function getKS(midi, kind = 'koto', sr) {
  sr = sr || (AU.ctx ? AU.ctx.sampleRate : 48000);
  const key = `${midi}|${kind}|${sr}`;
  let buf = AU.ks.get(key);
  if (buf) return buf;
  const k = KS_KIND[kind] || KS_KIND.koto;
  const f = mtof(midi);
  const n = Math.floor(sr * k.dur);
  const out = new Float32Array(n);
  const D = sr / f - 0.5;                    // 环路延迟（扣除平均滤波的半个采样）
  const fb = Math.pow(0.001, 1 / (k.t60 * f)); // 每周期衰减，得到期望的 T60
  const exN = Math.ceil(D) + 1;
  let lp = 0, peak = 0;
  for (let i = 0; i < n; i++) {
    let x = 0;
    if (i < exN) { const w = Math.random() * 2 - 1; lp += k.bright * (w - lp); x = lp * (1 - i / exN * 0.3); }
    let y = x;
    const d = i - D;
    if (d >= 1) {
      const i0 = Math.floor(d), fr = d - i0;
      const a = out[i0] + (out[i0 + 1] - out[i0]) * fr;
      const b = out[i0 - 1] + (out[i0] - out[i0 - 1]) * fr;
      y += fb * 0.5 * (a + b);
    }
    out[i] = y;
    const ay = y < 0 ? -y : y; if (ay > peak) peak = ay;
  }
  const g = peak > 0 ? 0.9 / peak : 1;
  const fade = Math.floor(sr * 0.05);
  for (let i = 0; i < n; i++) out[i] *= g * (i > n - fade ? (n - i) / fade : 1);
  // 起音处加 2ms 淡入，去掉咔哒声
  const fin = Math.floor(sr * 0.002);
  for (let i = 0; i < fin; i++) out[i] *= i / fin;
  if (AU.ctx && sr === AU.ctx.sampleRate) { buf = AU.ctx.createBuffer(1, n, sr); }
  else { buf = new AudioBuffer({ length: n, sampleRate: sr, numberOfChannels: 1 }); }
  buf.getChannelData(0).set(out);
  AU.ks.set(key, buf);
  return buf;
}

// 连接到目标：可选声像与混响发送
function auOut(node, o, vel) {
  const ctx = AU.ctx;
  const g = ctx.createGain(); g.gain.value = vel;
  node.connect(g);
  let tail = g;
  if (o.pan) { const p = ctx.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); tail = p; }
  tail.connect(o.music ? AU.musicBus : AU.sfxBus);
  if (o.rev) { const s = ctx.createGain(); s.gain.value = o.rev; tail.connect(s); s.connect(AU.revSend); }
  return g;
}
// 计数声部，超过上限时丢弃不重要的音效
function voiceStart(src, essential) {
  if (!essential && AU.voices >= AU.maxVoices) return false;
  AU.voices++;
  src.onended = () => { AU.voices--; };
  return true;
}

// 拨弦
function pluck(midi, t, vel, o = {}) {
  if (!AU.ready) return;
  const ctx = AU.ctx;
  const buf = getKS(Math.round(midi), o.kind || 'koto');
  const src = ctx.createBufferSource();
  src.buffer = buf;
  if (o.detune) src.detune.value = o.detune;
  if (o.bend) { src.playbackRate.setValueAtTime(1, t); src.playbackRate.exponentialRampToValueAtTime(o.bend, t + (o.bendT || 0.25)); }
  if (!voiceStart(src, o.essential)) return;
  let node = src;
  if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; src.connect(f); node = f; }
  auOut(node, o, vel);
  const dur = o.len ? Math.min(buf.duration, o.len) : buf.duration;
  src.start(t);
  src.stop(t + dur);
}

// FM 铃
function bell(midi, t, vel, o = {}) {
  if (!AU.ready) return;
  const ctx = AU.ctx, f = mtof(midi);
  const dec = o.dec || 1.4;
  const car = ctx.createOscillator(); car.frequency.value = f;
  const mod = ctx.createOscillator(); mod.frequency.value = f * (o.ratio || 3.5);
  const mg = ctx.createGain();
  mg.gain.setValueAtTime(f * (o.index || 2.2), t);
  mg.gain.exponentialRampToValueAtTime(f * 0.02 + 0.01, t + (o.mdec || dec * 0.4));
  mod.connect(mg); mg.connect(car.frequency);
  if (!voiceStart(car, o.essential)) return;
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(1, t + (o.att || 0.004));
  env.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  car.connect(env);
  auOut(env, o, vel);
  car.start(t); mod.start(t);
  car.stop(t + dec + 0.05); mod.stop(t + dec + 0.05);
}

// 滤波噪声：type 滤波类型，f 起始频率，f2 结束频率
function noise(t, dur, vel, o = {}) {
  if (!AU.ready) return;
  const ctx = AU.ctx;
  const src = ctx.createBufferSource(); src.buffer = AU.noiseBuf;
  if (!voiceStart(src, o.essential)) return;
  const fl = ctx.createBiquadFilter();
  fl.type = o.type || 'bandpass';
  fl.frequency.setValueAtTime(o.f || 1200, t);
  if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
  fl.Q.value = o.q || 1;
  const env = ctx.createGain();
  const a = o.att || 0.002;
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(1, t + a);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(fl); fl.connect(env);
  auOut(env, o, vel);
  src.start(t, Math.random() * 1.6, dur + 0.05);
}

// 低频闷击（鼓、撞击）
function thump(t, vel, f0 = 110, f1 = 42, dur = 0.32, o = {}) {
  if (!AU.ready) return;
  const ctx = AU.ctx;
  const osc = ctx.createOscillator(); osc.type = 'sine';
  if (!voiceStart(osc, o.essential)) return;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.55);
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(1, t + 0.004);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(env);
  auOut(env, o, vel);
  osc.start(t); osc.stop(t + dur + 0.02);
}

// 木鱼声：短促正弦 + 带通噪声
function wood(t, vel, f = 880, o = {}) {
  if (!AU.ready) return;
  const ctx = AU.ctx;
  const osc = ctx.createOscillator(); osc.type = 'sine';
  if (!voiceStart(osc, o.essential)) return;
  osc.frequency.setValueAtTime(f * 1.3, t);
  osc.frequency.exponentialRampToValueAtTime(f, t + 0.012);
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(1, t + 0.002);
  env.gain.exponentialRampToValueAtTime(0.0001, t + (o.dec || 0.09));
  osc.connect(env);
  auOut(env, o, vel);
  osc.start(t); osc.stop(t + 0.15);
  noise(t, 0.02, vel * 0.35, { type: 'bandpass', f: f * 2.6, q: 3, pan: o.pan, music: o.music });
}

// 柔和铺底：三角波双振荡器 + 低通 + 慢起慢落
function padNote(midi, t, dur, vel, o = {}) {
  if (!AU.ready) return;
  const ctx = AU.ctx, f = mtof(midi);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(o.cut || 900, t); lp.Q.value = 0.6;
  const env = ctx.createGain();
  const att = o.att || 0.7, rel = o.rel || 1.2;
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(1, t + att);
  env.gain.setValueAtTime(1, t + Math.max(att, dur - 0.01));
  env.gain.linearRampToValueAtTime(0.0001, t + dur + rel);
  for (const det of [-7, 7]) {
    const osc = ctx.createOscillator(); osc.type = 'triangle';
    osc.frequency.value = f; osc.detune.value = det;
    if (!voiceStart(osc, false)) continue;
    osc.connect(lp);
    osc.start(t); osc.stop(t + dur + rel + 0.05);
  }
  lp.connect(env);
  auOut(env, o, vel);
}

// 贝斯：正弦 + 高八度三角，低通
function bassNote(midi, t, dur, vel, o = {}) {
  if (!AU.ready) return;
  const ctx = AU.ctx, f = mtof(midi);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.cut || 420;
  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(1, t + 0.006);
  env.gain.exponentialRampToValueAtTime(0.55, t + 0.12);
  env.gain.setValueAtTime(0.55, t + Math.max(0.13, dur - 0.04));
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.08);
  const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
  const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2;
  const g2 = ctx.createGain(); g2.gain.value = 0.18;
  if (!voiceStart(o1, false)) return;
  o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(env);
  auOut(env, o, vel);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.12); o2.stop(t + dur + 0.12);
}

// ---------- 触觉反馈 ----------
const Haptics = {
  on: true,
  // 手机震动与手柄震动，ms 为时长，s 为强度 0..1
  buzz(ms, s = 0.5) {
    if (!this.on) return;
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* 部分环境不允许 */ }
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) if (p && p.vibrationActuator && p.vibrationActuator.playEffect) {
        p.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: s, weakMagnitude: s * 0.6 }).catch(() => {});
      }
    } catch (e) { /* 忽略 */ }
  },
};

// ---------- 游戏音效 ----------
// 所有音高都取自 D 小调五声；连续打结时音阶逐级上行
const SFX = {
  // 打结：拨弦和弦，combo 决定音高，n 为圈住的敌人数，moon 为接近正圆
  knot(n, combo, moon, pan = 0) {
    if (!AU.ready) return;
    const t = auNow() + 0.005;
    // 连续打结时沿当前和弦一路往上走
    const c = Math.min(combo, 9);
    pluck(chordNote(c, 48), t, 0.42, { pan, rev: 0.22, essential: true });
    pluck(chordNote(c + 1, 48), t + 0.014, 0.26, { pan, rev: 0.2 });
    pluck(chordNote(c + 2, 48), t + 0.028, 0.2, { pan, rev: 0.25 });
    noise(t, 0.09, 0.1, { type: 'bandpass', f: 700, f2: 2600, q: 1.4, pan });
    if (n >= 4) bell(chordNote(c + 6, 48), t + 0.03, 0.06, { rev: 0.4, dec: 1.2, pan });
    if (moon) for (let i = 0; i < 4; i++) bell(chordNote(i + 7, 48), t + 0.05 + i * 0.045, 0.045, { rev: 0.5, dec: 1.0, ratio: 2.0 });
  },
  // 勒紧落地：低频闷击 + 木鱼，敌人越多越重
  cinch(n, pan = 0) {
    if (!AU.ready) return;
    const t = auNow();
    const v = Math.min(0.75, 0.32 + n * 0.06);
    thump(t, v, 130, 44, 0.34, { essential: true });
    wood(t + 0.004, 0.22, 620, { pan });
    if (n >= 3) noise(t, 0.22, 0.12 + Math.min(0.12, n * 0.015), { type: 'lowpass', f: 900, f2: 200, q: 0.7, pan });
  },
  // 普通命中：闷响
  hit(pan = 0) {
    if (!AU.ready || !auGate('hit', 0.03)) return;
    noise(auNow(), 0.06, 0.13, { type: 'lowpass', f: 1400, f2: 400, q: 0.8, pan });
  },
  // 敌人散开：短促下行拨弦 + 噗
  pop(i = 0, pan = 0, big = false) {
    if (!AU.ready || !auGate('pop', 0.022)) return;
    const t = auNow();
    const m = chordNote(3 + (i % 5), 50);
    pluck(m, t, big ? 0.3 : 0.18, { kind: 'mute', pan, bend: 0.75, bendT: 0.12 });
    noise(t, big ? 0.16 : 0.08, big ? 0.16 : 0.09, { type: 'bandpass', f: 1100, f2: 300, q: 0.9, pan });
  },
  // 冲刺：呼啸 + 很轻的金属声
  dash(pan = 0) {
    if (!AU.ready) return;
    const t = auNow();
    noise(t, 0.16, 0.16, { type: 'bandpass', f: 500, f2: 2600, q: 1.2, pan, att: 0.01 });
    bell(scaleNote(14, 50), t + 0.01, 0.025, { ratio: 1.41, index: 1.2, dec: 0.35, pan });
  },
  // 穿刺命中
  pierce(pan = 0) {
    if (!AU.ready || !auGate('pierce', 0.025)) return;
    const t = auNow();
    noise(t, 0.04, 0.16, { type: 'highpass', f: 2200, q: 0.7, pan });
    thump(t, 0.22, 160, 70, 0.12);
  },
  // 受伤：闷击 + 低音小二度，并让音乐短暂发闷
  hurt() {
    if (!AU.ready) return;
    const t = auNow();
    thump(t, 0.7, 90, 34, 0.5, { essential: true });
    pluck(38, t, 0.32, { kind: 'soft', lp: 900, essential: true });
    pluck(39, t + 0.01, 0.24, { kind: 'soft', lp: 900 });
    noise(t, 0.3, 0.16, { type: 'lowpass', f: 600, f2: 120 });
    Music.duck(0.7);
  },
  // 线被剪断
  cut(pan = 0) {
    if (!AU.ready || !auGate('cut', 0.06)) return;
    const t = auNow();
    noise(t, 0.025, 0.2, { type: 'highpass', f: 4200, q: 0.8, pan });
    noise(t + 0.045, 0.025, 0.16, { type: 'highpass', f: 3600, q: 0.8, pan });
    pluck(scaleNote(8, 50), t + 0.02, 0.2, { bend: 0.5, bendT: 0.3, pan });
  },
  // 拾取纽扣：木声 + 小铃，连拾时音阶上行
  coin(streak = 0, pan = 0) {
    if (!AU.ready || !auGate('coin', 0.028)) return;
    const t = auNow();
    wood(t, 0.1, 1400, { pan, dec: 0.05 });
    bell(chordNote(6 + (streak % 6), 50), t, 0.05, { ratio: 2.0, index: 1.4, dec: 0.5, pan });
  },
  // 拾取月丝
  silk(pan = 0) {
    if (!AU.ready || !auGate('silk', 0.04)) return;
    bell(scaleNote(15, 50), auNow(), 0.06, { ratio: 3.01, index: 0.8, dec: 0.9, rev: 0.4, pan });
  },
  // 回心
  heal() {
    if (!AU.ready) return;
    const t = auNow();
    [0, 1, 2].forEach((d, i) => pluck(chordNote(d + 3, 50), t + i * 0.06, 0.3, { kind: 'harp', rev: 0.35 }));
  },
  // 缝一针（破洞）
  stitch(k = 0) {
    if (!AU.ready) return;
    pluck(chordNote(4 + k, 50), auNow(), 0.3, { kind: 'harp', rev: 0.3 });
  },
  // 破洞补好
  mended() {
    if (!AU.ready) return;
    const t = auNow();
    [0, 1, 2, 3].forEach((d, i) => bell(chordNote(d + 5, 50), t + i * 0.05, 0.07, { ratio: 2.0, index: 1.6, dec: 1.4, rev: 0.45 }));
    thump(t, 0.25, 90, 50, 0.3);
  },
  // 敌人射击：轻轻的噗
  shoot(pan = 0) {
    if (!AU.ready || !auGate('shoot', 0.05)) return;
    noise(auNow(), 0.07, 0.07, { type: 'bandpass', f: 1600, f2: 700, q: 1.6, pan });
  },
  // 预警：上滑的柔音
  warn() {
    if (!AU.ready || !auGate('warn', 0.2)) return;
    const t = auNow();
    pluck(scaleNote(3, 50), t, 0.16, { kind: 'soft', bend: 1.5, bendT: 0.5, lp: 1800 });
  },
  // 爆炸：低频 + 噪声
  boom(pan = 0) {
    if (!AU.ready || !auGate('boom', 0.04)) return;
    const t = auNow();
    thump(t, 0.5, 120, 36, 0.45);
    noise(t, 0.35, 0.2, { type: 'lowpass', f: 1200, f2: 150, q: 0.6, pan });
  },
  // 雷：带通噪声颤动
  zap(pan = 0) {
    if (!AU.ready || !auGate('zap', 0.05)) return;
    const t = auNow();
    for (let i = 0; i < 3; i++) noise(t + i * 0.025, 0.04, 0.09, { type: 'bandpass', f: 2400 + i * 500, q: 4, pan });
    bell(scaleNote(12, 50), t, 0.03, { ratio: 7.1, index: 3, dec: 0.25 });
  },
  // 冰冻：玻璃感高铃
  freeze(pan = 0) {
    if (!AU.ready || !auGate('freeze', 0.06)) return;
    const t = auNow();
    bell(scaleNote(17, 50), t, 0.05, { ratio: 4.2, index: 1.5, dec: 0.8, pan, rev: 0.4 });
    noise(t, 0.12, 0.05, { type: 'highpass', f: 5000, q: 0.5, pan });
  },
  // 碎冰：几声细碎的高铃
  shatter(pan = 0) {
    if (!AU.ready || !auGate('shatter', 0.06)) return;
    const t = auNow();
    for (let i = 0; i < 4; i++) bell(scaleNote(15 + ((i * 3) % 5), 50), t + i * 0.025, 0.035, { ratio: 5.3, index: 1.2, dec: 0.4, pan });
  },
  // 点燃
  ignite(pan = 0) {
    if (!AU.ready || !auGate('ignite', 0.08)) return;
    noise(auNow(), 0.25, 0.07, { type: 'bandpass', f: 600, f2: 1800, q: 0.8, pan, att: 0.03 });
  },
  // 界面：轻点、确认、返回
  ui(kind = 'tick') {
    if (!AU.ready) return;
    const t = auNow();
    if (kind === 'tick') wood(t, 0.12, 1250, { dec: 0.05 });
    else if (kind === 'ok') { pluck(scaleNote(5, 50), t, 0.26, { kind: 'harp' }); pluck(scaleNote(7, 50), t + 0.05, 0.22, { kind: 'harp' }); }
    else if (kind === 'back') pluck(scaleNote(3, 50), t, 0.2, { kind: 'mute' });
    else if (kind === 'buy') { wood(t, 0.18, 1100); bell(scaleNote(12, 50), t + 0.02, 0.08, { ratio: 2, dec: 0.7 }); }
    else if (kind === 'deny') { pluck(38, t, 0.2, { kind: 'mute' }); pluck(39, t + 0.04, 0.16, { kind: 'mute' }); }
  },
  // 获得绣片
  gain() {
    if (!AU.ready) return;
    const t = auNow();
    [0, 2, 4, 5].forEach((d, i) => pluck(scaleNote(d + 7, 50), t + i * 0.055, 0.26, { kind: 'harp', rev: 0.35 }));
  },
  // 合绣点亮：明亮琶音
  combo() {
    if (!AU.ready) return;
    const t = auNow();
    for (let i = 0; i < 7; i++) bell(scaleNote(i + 8, 50), t + i * 0.05, 0.06, { ratio: 2, index: 1.8, dec: 1.2, rev: 0.5 });
  },
  // 立约：低音嗡鸣 + 蜘蛛的嗒嗒
  pact() {
    if (!AU.ready) return;
    const t = auNow();
    padNote(38, t, 0.6, 0.12, { cut: 500, att: 0.1, rel: 1.0 });
    for (let i = 0; i < 4; i++) wood(t + 0.1 + i * 0.07, 0.08, 1900 - i * 120);
  },
  // 约成：上行竖琴 + 铃
  pactWin() {
    if (!AU.ready) return;
    const t = auNow();
    for (let i = 0; i < 10; i++) pluck(scaleNote(i + 5, 50), t + i * 0.04, 0.24, { kind: 'harp', rev: 0.4, essential: true });
    [12, 14, 17].forEach((d, i) => bell(scaleNote(d, 50), t + 0.42 + i * 0.03, 0.07, { ratio: 2, dec: 1.8, rev: 0.6 }));
  },
  // 断约：弦崩断（下滑）+ 低沉的和声
  pactLose() {
    if (!AU.ready) return;
    const t = auNow();
    noise(t, 0.03, 0.25, { type: 'highpass', f: 3000, q: 0.7, essential: true });
    pluck(scaleNote(9, 50), t, 0.4, { bend: 0.4, bendT: 0.6, essential: true });
    padNote(38, t + 0.05, 1.2, 0.12, { cut: 600, att: 0.05, rel: 1.4 });
    padNote(41, t + 0.05, 1.2, 0.1, { cut: 600, att: 0.05, rel: 1.4 });
  },
  // Boss 登场：太鼓 + 低音
  bossIntro() {
    if (!AU.ready) return;
    const t = auNow();
    [0, 0.32, 0.5, 0.9].forEach((d, i) => thump(t + d, 0.65 - i * 0.08, 150, 52, 0.5));
    padNote(38, t, 1.6, 0.14, { cut: 500, att: 0.3, rel: 1.4 });
  },
  // 胜利：上行琶音 + 和弦
  victory() {
    if (!AU.ready) return;
    const t = auNow();
    for (let i = 0; i < 8; i++) pluck(scaleNote(i + 5, 50), t + i * 0.07, 0.28, { kind: 'harp', rev: 0.45, essential: true });
    [[50, 57, 62, 65], [53, 57, 60, 65]].forEach((ch, k) => ch.forEach((m) => padNote(m, t + 0.6 + k * 0.9, 0.8, 0.07, { cut: 1500, att: 0.08, rel: 1.6 })));
    bell(scaleNote(17, 50), t + 0.6, 0.08, { ratio: 2, dec: 2.4, rev: 0.6 });
  },
  // 失败：缓慢下行
  defeat() {
    if (!AU.ready) return;
    const t = auNow();
    [9, 7, 5, 4, 2, 0].forEach((d, i) => pluck(scaleNote(d, 50), t + i * 0.18, 0.26 - i * 0.025, { kind: 'soft', rev: 0.5, essential: true }));
    padNote(38, t + 0.2, 2.2, 0.1, { cut: 500, att: 0.4, rel: 2 });
  },
};

// ==== 06_music.js ====
// 音乐：逐小节程序化生成的配乐。分标题、地图、战斗、Boss 四段，强度决定叠加的声部

// 和弦音级（0 = C）
const CHORDS = {
  Dm: [2, 5, 9], Bb: [10, 2, 5], F: [5, 9, 0], C: [0, 4, 7], Gm: [7, 10, 2], A: [9, 1, 4], Am: [9, 0, 4], Eb: [3, 7, 10],
};
// 五声音阶（D F G A C）的音级
const PENTA = [2, 5, 7, 9, 0];

const SECTIONS = {
  title: { bpm: 70, prog: ['F', 'C', 'Dm', 'Bb'], drums: 0, arp: 'slow', mel: 'bell', bass: 'pedal', pad: 0.055 },
  map: { bpm: 84, prog: ['Dm', 'Bb', 'F', 'C'], drums: 1, arp: 'eighth', mel: 'koto', bass: 'roots', pad: 0.045 },
  battle: { bpm: 104, prog: ['Dm', 'Bb', 'F', 'C', 'Dm', 'Bb', 'Gm', 'A'], drums: 2, arp: 'sixteenth', mel: 'koto', bass: 'drive', pad: 0.035 },
  boss: { bpm: 118, prog: ['Dm', 'Bb', 'Gm', 'A', 'Dm', 'Eb', 'Gm', 'A'], drums: 3, arp: 'sixteenth', mel: 'koto', bass: 'ostinato', pad: 0.04 },
  calm: { bpm: 76, prog: ['Bb', 'F', 'C', 'Dm'], drums: 0, arp: 'eighth', mel: 'bell', bass: 'pedal', pad: 0.05 },
};

// 音级 pc 放到 near 附近的 MIDI 音高（不低于 near-5）
function pcNear(pc, near) {
  let m = near - 5 + ((pc - (near - 5)) % 12 + 12) % 12;
  return m;
}

const Music = {
  sec: null, def: null, want: null, next: null,
  step: 0, bar: 0, t: 0, inten: 0.3, target: 0.3,
  rng: makeRng(7), mel: null, timer: null,

  // 请求播放某一段（会在下一个小节线切换）
  play(name) {
    this.want = name;
    if (!AU.ready) return;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
    if (this.sec === name && !this.next) return;
    if (!this.sec) this.begin(name); else this.next = name;
  },
  // 立即开始某一段
  begin(name) {
    this.sec = name; this.def = SECTIONS[name]; this.next = null;
    this.step = 0; this.bar = 0;
    this.t = Math.max(this.t, auNow() + 0.06);
    this.rng = makeRng((Math.random() * 1e9) >>> 0);
    this.mel = null;
  },
  stop() { this.sec = null; this.next = null; this.want = null; KEY.chord = CHORDS.Dm; },
  setIntensity(v) { this.target = clamp(v, 0, 1); },
  // 受伤时让音乐短暂发闷
  duck(depth = 0.7) {
    if (!AU.ready) return;
    const f = AU.musicLP.frequency, t = auNow();
    f.cancelScheduledValues(t);
    f.setTargetAtTime(16000 * (1 - depth) + 380, t, 0.015);
    f.setTargetAtTime(16000, t + 0.4, 0.3);
  },
  // 调度器：提前 0.15 秒排好音符
  tick() {
    if (!AU.ready || !this.sec) { if (AU.ready && this.want && !this.sec) this.begin(this.want); return; }
    if (document.hidden) return;
    const ahead = auNow() + 0.15;
    if (this.t < auNow() - 0.25) this.t = auNow() + 0.05; // 卡顿后追上
    this.inten = approach(this.inten, this.target, 0.012);
    let guard = 0;
    while (this.t < ahead && guard++ < 32) {
      this.playStep(this.step % 16, this.t);
      this.t += 60 / this.def.bpm / 4;
      this.step++;
      if (this.step % 16 === 0) {
        this.bar++;
        if (this.next) { const n = this.next; this.begin(n); }
      }
    }
  },
  // 生成两小节旋律（每小节 16 格，null 为休止）
  genMelody(bar) {
    const d = this.def, r = this.rng;
    const rhythms = [[0, 3, 6, 8, 11, 14], [0, 2, 4, 7, 10, 12], [0, 4, 6, 8, 12], [0, 6, 8, 10, 14], [0, 3, 8, 11], [0, 2, 6, 8, 12, 14]];
    const rh = r.pick(rhythms);
    let deg = r.int(0, 4) + 5; // 五声音阶上的位置
    const notes = [];
    for (let b = 0; b < 2; b++) {
      const chord = CHORDS[d.prog[(bar + b) % d.prog.length]];
      const row = new Array(16).fill(null);
      rh.forEach((s, i) => {
        if (b === 1 && i === rh.length - 1 && r.chance(0.5)) return;
        deg += r.pick([-2, -1, -1, 0, 1, 1, 2]);
        deg = clamp(deg, 3, 11);
        let pc = PENTA[deg % 5];
        // 强拍落在和弦音上
        if (s % 8 === 0 && !chord.includes(pc)) pc = chord[r.int(0, 2)];
        const oct = Math.floor(deg / 5);
        row[s] = 62 + 12 * (oct - 1) + ((pc - 2 + 12) % 12);
      });
      notes.push(row);
    }
    return notes;
  },
  // 播放一格（十六分音符）
  playStep(s, t) {
    const d = this.def, I = this.inten, bar = this.bar;
    const chord = CHORDS[d.prog[bar % d.prog.length]];
    const sd = 60 / d.bpm / 4;
    const M = { music: true };
    // 铺底：每小节一个和弦；同时告诉音效当前的和弦（按播放时刻生效）
    if (s === 0) {
      chord.forEach((pc) => padNote(pcNear(pc, 57), t, sd * 16, d.pad, { music: true, rev: 0.35, cut: 650 + I * 700 }));
      const delay = Math.max(0, (t - auNow()) * 1000);
      setTimeout(() => { KEY.chord = chord; }, delay);
    }
    // 贝斯
    const root = pcNear(chord[0], 40);
    if (d.bass === 'pedal' && s === 0) bassNote(root, t, sd * 14, 0.2, M);
    if (d.bass === 'roots' && (s === 0 || s === 8)) bassNote(root, t, sd * 7, 0.22, M);
    if (d.bass === 'drive' && I > 0.15) {
      if (s === 0 || s === 8) bassNote(root, t, sd * 3, 0.26, M);
      else if (s === 6 || (s === 14 && I > 0.5)) bassNote(root + 7, t, sd * 2, 0.18, M);
      else if (s === 11 && I > 0.6) bassNote(root + 12, t, sd * 2, 0.14, M);
    }
    if (d.bass === 'ostinato' && s % 2 === 0) bassNote(root + (s % 8 === 6 ? 12 : 0), t, sd * 1.6, s % 4 === 0 ? 0.27 : 0.18, M);
    // 打击乐
    if (d.drums === 1) {
      if (s % 4 === 2) noise(t, 0.035, 0.03, { type: 'highpass', f: 6500, q: 0.6, music: true });
      if (s === 12 && bar % 2 === 1) wood(t, 0.06, 760, M);
    } else if (d.drums === 2 && I > 0.12) {
      if (s === 0 || s === 8 || (s === 10 && I > 0.6)) thump(t, 0.36, 110, 42, 0.26, M);
      if ((s === 4 || s === 12) && I > 0.38) { noise(t, 0.12, 0.08, { type: 'bandpass', f: 1800, q: 0.8, music: true }); thump(t, 0.06, 220, 140, 0.08, M); }
      if (I > 0.25 && (s % 2 === 0 || I > 0.75)) noise(t, 0.03, s % 4 === 2 ? 0.035 : 0.02, { type: 'highpass', f: 6800, q: 0.6, music: true });
      if (s === 14 && bar % 4 === 3) wood(t, 0.08, 900, M);
    } else if (d.drums === 3) {
      if ([0, 3, 6, 8, 11, 14].includes(s)) thump(t, s === 0 || s === 8 ? 0.42 : 0.24, 150, 60, 0.32, M);
      if (s === 4 || s === 12) { noise(t, 0.13, 0.09, { type: 'bandpass', f: 1600, q: 0.8, music: true }); thump(t, 0.07, 230, 140, 0.09, M); }
      noise(t, 0.028, s % 2 ? 0.018 : 0.03, { type: 'highpass', f: 7000, q: 0.6, music: true });
    }
    // 琶音
    const arpOn = (d.arp === 'sixteenth' && I > 0.45) || (d.arp === 'sixteenth' && I > 0.2 && s % 2 === 0) || (d.arp === 'eighth' && s % 2 === 0) || (d.arp === 'slow' && s % 4 === 0);
    if (arpOn) {
      const pat = [0, 1, 2, 3, 2, 1, 0, 1];
      const idx = pat[(s >> (d.arp === 'slow' ? 2 : d.arp === 'eighth' ? 1 : 0)) % pat.length];
      const pc = chord[idx % 3];
      const m = pcNear(pc, 62) + (idx === 3 ? 12 : 0);
      pluck(m, t, (d.arp === 'slow' ? 0.09 : 0.06) + I * 0.03, { music: true, len: d.arp === 'slow' ? 1.6 : 0.42, pan: s % 2 ? 0.28 : -0.28, rev: 0.25, kind: d.arp === 'slow' ? 'harp' : 'koto' });
    }
    // 旋律：每两小节生成一句，八小节内重复一次
    if (I > 0.32 || d.mel === 'bell') {
      if (s === 0 && bar % 2 === 0) {
        if (!this.mel || bar % 8 === 0 || (bar % 4 === 0 && this.rng.chance(0.4))) this.mel = this.genMelody(bar);
      }
      if (this.mel) {
        const n = this.mel[bar % 2][s];
        if (n) {
          if (d.mel === 'bell') bell(n, t, 0.05, { music: true, ratio: 2.0, index: 1.4, dec: 1.6, rev: 0.5 });
          else pluck(n, t, 0.11 + I * 0.04, { music: true, kind: 'koto', rev: 0.35, len: 1.2 });
        }
      }
    }
  },
};

// ==== 07_input.js ====
// 输入：键盘、鼠标、触屏（浮动摇杆 + 按钮）、手柄，统一成移动向量与边沿触发的动作

const Input = {
  keys: new Set(),
  move: { x: 0, y: 0 },
  dashQ: false, skillQ: false, pauseQ: false,
  device: 'kb',         // 最近使用的设备：kb / mouse / touch / pad
  touchSeen: false,
  mouse: { x: 0, y: 0, down: false },     // CSS 像素
  joy: { id: null, ox: 0, oy: 0, x: 0, y: 0, vx: 0, vy: 0 },
  btnTouch: { dash: null, skill: null },
  // 触屏按钮位置（CSS 像素），由布局写入
  btn: { dash: { x: 0, y: 0, r: 0 }, skill: { x: 0, y: 0, r: 0 }, pause: { x: 0, y: 0, r: 0 } },
  pad: { prev: [], axes: [0, 0], idx: -1 },
  uiHandler: null,      // 界面打开时接管按键：返回 true 表示已处理
  joyR: 44,             // 摇杆半径（CSS 像素）
};

const KEY_UP = ['KeyW', 'ArrowUp'], KEY_DOWN = ['KeyS', 'ArrowDown'], KEY_LEFT = ['KeyA', 'ArrowLeft'], KEY_RIGHT = ['KeyD', 'ArrowRight'];
const KEY_DASH = ['Space', 'ShiftLeft', 'ShiftRight', 'KeyJ', 'KeyK'];
const KEY_SKILL = ['KeyE', 'KeyL', 'KeyQ'];
const KEY_PAUSE = ['Escape', 'KeyP'];

// 绑定所有输入事件
function inputInit(canvas) {
  window.addEventListener('keydown', (e) => {
    auInit();
    Input.device = 'kb';
    if (Input.uiHandler && Input.uiHandler(e)) { e.preventDefault(); return; }
    if (e.repeat) { if (KEY_DASH.includes(e.code) || KEY_UP.concat(KEY_DOWN, KEY_LEFT, KEY_RIGHT).includes(e.code)) e.preventDefault(); return; }
    Input.keys.add(e.code);
    if (KEY_DASH.includes(e.code)) { Input.dashQ = true; e.preventDefault(); }
    if (KEY_SKILL.includes(e.code)) Input.skillQ = true;
    if (KEY_PAUSE.includes(e.code)) Input.pauseQ = true;
    if (KEY_UP.concat(KEY_DOWN, KEY_LEFT, KEY_RIGHT).includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { Input.keys.delete(e.code); });
  window.addEventListener('blur', () => { Input.keys.clear(); Input.mouse.down = false; releaseTouches(); });

  canvas.addEventListener('mousedown', (e) => {
    auInit();
    Input.device = 'mouse';
    Input.mouse.x = e.clientX; Input.mouse.y = e.clientY;
    if (e.button === 0) {
      if (hitBtn(Input.btn.pause, e.clientX, e.clientY)) { Input.pauseQ = true; return; }
      Input.mouse.down = true;
    }
    if (e.button === 2) Input.dashQ = true;
    if (e.button === 1) { Input.skillQ = true; e.preventDefault(); }
  });
  window.addEventListener('mousemove', (e) => { Input.mouse.x = e.clientX; Input.mouse.y = e.clientY; });
  window.addEventListener('mouseup', (e) => { if (e.button === 0) Input.mouse.down = false; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  const opt = { passive: false };
  canvas.addEventListener('touchstart', (e) => {
    auInit();
    Input.device = 'touch'; Input.touchSeen = true;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY;
      if (hitBtn(Input.btn.pause, x, y)) { Input.pauseQ = true; continue; }
      if (hitBtn(Input.btn.dash, x, y)) { Input.btnTouch.dash = t.identifier; Input.dashQ = true; Haptics.buzz(8, 0.2); continue; }
      if (hitBtn(Input.btn.skill, x, y)) { Input.btnTouch.skill = t.identifier; Input.skillQ = true; Haptics.buzz(8, 0.2); continue; }
      if (Input.joy.id === null) { const j = Input.joy; j.id = t.identifier; j.ox = j.x = x; j.oy = j.y = y; }
    }
  }, opt);
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const j = Input.joy;
      if (t.identifier === j.id) {
        j.x = t.clientX; j.y = t.clientY;
        // 手指拖得太远时，摇杆中心跟着走，方向切换更跟手
        const dx = j.x - j.ox, dy = j.y - j.oy, d = Math.hypot(dx, dy), R = Input.joyR * 1.25;
        if (d > R) { j.ox = j.x - (dx / d) * R; j.oy = j.y - (dy / d) * R; }
      }
    }
  }, opt);
  const end = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === Input.joy.id) { Input.joy.id = null; }
      if (t.identifier === Input.btnTouch.dash) Input.btnTouch.dash = null;
      if (t.identifier === Input.btnTouch.skill) Input.btnTouch.skill = null;
    }
  };
  canvas.addEventListener('touchend', end, opt);
  canvas.addEventListener('touchcancel', end, opt);
  window.addEventListener('gamepadconnected', () => { Input.device = 'pad'; });
}

function releaseTouches() { Input.joy.id = null; Input.btnTouch.dash = Input.btnTouch.skill = null; }
function hitBtn(b, x, y) { return b && b.r > 0 && (x - b.x) * (x - b.x) + (y - b.y) * (y - b.y) <= b.r * b.r; }

// 每帧汇总移动向量；返回值里 mouseTarget 由游戏层换算
function inputPoll() {
  let x = 0, y = 0;
  const k = Input.keys;
  if (KEY_LEFT.some((c) => k.has(c))) x -= 1;
  if (KEY_RIGHT.some((c) => k.has(c))) x += 1;
  if (KEY_UP.some((c) => k.has(c))) y -= 1;
  if (KEY_DOWN.some((c) => k.has(c))) y += 1;
  if (x || y) { const l = Math.hypot(x, y); x /= l; y /= l; }
  // 触屏摇杆
  const j = Input.joy;
  if (j.id !== null) {
    let dx = (j.x - j.ox) / Input.joyR, dy = (j.y - j.oy) / Input.joyR;
    const l = Math.hypot(dx, dy);
    if (l < 0.12) { dx = 0; dy = 0; } else if (l > 1) { dx /= l; dy /= l; }
    j.vx = dx; j.vy = dy;
    if (dx || dy) { x = dx; y = dy; }
  } else { j.vx = j.vy = 0; }
  // 手柄
  pollPad();
  const pa = Input.pad.axes;
  if (Math.hypot(pa[0], pa[1]) > 0) { x = pa[0]; y = pa[1]; }
  Input.move.x = x; Input.move.y = y;
}

// 读取手柄；菜单打开时把方向键与 A/B 转成按键事件交给界面
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let p = null;
  for (const g of pads) if (g && g.connected) { p = g; break; }
  if (!p) { Input.pad.axes[0] = Input.pad.axes[1] = 0; return; }
  let ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  const l = Math.hypot(ax, ay);
  if (l < 0.2) { ax = ay = 0; } else { const s = Math.min(1, (l - 0.2) / 0.7) / l; ax *= s; ay *= s; }
  const b = p.buttons.map((x) => x.pressed);
  const prev = Input.pad.prev;
  const down = (i) => b[i] && !prev[i];
  if (b.some((x) => x) || ax || ay) Input.device = 'pad';
  if (Input.uiHandler) {
    const send = (code) => { if (Input.uiHandler) Input.uiHandler({ code, key: code, preventDefault() {}, fromPad: true }); };
    if (down(12)) send('ArrowUp'); if (down(13)) send('ArrowDown'); if (down(14)) send('ArrowLeft'); if (down(15)) send('ArrowRight');
    if (down(0)) send('Enter'); if (down(1)) send('Escape'); if (down(9)) send('Escape');
    // 摇杆也能在菜单里移动焦点
    const st = Input.pad.stick || 0;
    const dir = ay < -0.6 ? 'ArrowUp' : ay > 0.6 ? 'ArrowDown' : ax < -0.6 ? 'ArrowLeft' : ax > 0.6 ? 'ArrowRight' : null;
    if (dir && !st) send(dir);
    Input.pad.stick = dir ? 1 : 0;
    Input.pad.axes[0] = Input.pad.axes[1] = 0;
  } else {
    if (down(0) || down(5) || down(7)) Input.dashQ = true;
    if (down(2) || down(1) || down(4) || down(6)) Input.skillQ = true;
    if (down(9)) Input.pauseQ = true;
    Input.pad.axes[0] = ax; Input.pad.axes[1] = ay;
  }
  Input.pad.prev = b;
}

// 取走一次性动作
function takeDash() { const v = Input.dashQ; Input.dashQ = false; return v; }
function takeSkill() { const v = Input.skillQ; Input.skillQ = false; return v; }
function takePause() { const v = Input.pauseQ; Input.pauseQ = false; return v; }
function clearActions() { Input.dashQ = Input.skillQ = Input.pauseQ = false; }

// ==== 08_save.js ====
// 存档：localStorage 持久化，读写全部容错；读不到或损坏时使用默认存档

const SAVE_KEY = 'nightmend.save.v1';

// 默认存档（内容模块定义的初始解锁表在调用时已存在）
function defaultSave() {
  return {
    v: 1,
    silk: 0, silkTotal: 0,
    unlocked: { threads: STARTER.threads.slice(), skills: STARTER.skills.slice(), charms: STARTER.charms.slice(), books: [] },
    seen: {},                 // 图鉴：'类别:id' → 1 见过 / 2 用过
    stats: { runs: 0, wins: 0, kills: 0, knots: 0, bestCatch: 0, pactsWon: 0, pactsLost: 0, fastest: 0, time: 0, bossKills: {} },
    night: { max: 1, best: 0 }, // 已解锁到第几更、通关过的最深一更
    pouch: [],                // 香囊 [{id, lvl}]
    lost: [],                 // 遗落的香囊 [{id, lvl}]，拾遗蛾叼着最早的一个
    gallery: [],              // 拼布被 [{t, win, night, img, boss}]
    settings: { master: 0.85, music: 0.55, sfx: 0.85, shake: 1, flash: 1, haptics: 1, hand: 'right' },
    tut: {},                  // 新手提示进度
    last: { thread: 'plain', skill: 'overlock', night: 1, sachet: -1 },
    run: null,                // 断点续玩
    ach: {},                  // 成就
  };
}

const Save = {
  data: null,
  // 读取并与默认值合并，保证新增字段有默认值
  load() {
    const def = defaultSave();
    let d = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || d.v !== 1) d = def;
    for (const k in def) {
      if (d[k] === undefined || d[k] === null && def[k] !== null) d[k] = def[k];
      else if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k]) && typeof d[k] === 'object') {
        for (const kk in def[k]) if (d[k][kk] === undefined) d[k][kk] = def[k][kk];
      }
    }
    if (!Array.isArray(d.lost)) d.lost = d.lost ? [d.lost] : [];
    // 初始解锁表可能随版本增加，保证都在
    for (const cat of ['threads', 'skills', 'charms']) for (const id of STARTER[cat]) if (!d.unlocked[cat].includes(id)) d.unlocked[cat].push(id);
    this.data = d;
    return d;
  },
  // 立即写入
  write() {
    // 写不进去（配额满）时先丢掉最旧的拼布图再试，保证进度本身不丢
    for (let tries = 0; tries < 8; tries++) {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); return true; }
      catch (e) { const g = this.data && this.data.gallery; if (g && g.length) g.pop(); else return false; }
    }
    return false;
  },
  _t: 0,
  // 合并短时间内的多次写入
  soon() { clearTimeout(this._t); this._t = setTimeout(() => this.write(), 300); },
  // 清空存档
  reset() { this.data = defaultSave(); this.write(); },
};

// 记录图鉴：level 1 见过，2 用过；首次发现返回 true
function discover(cat, id, level = 1) {
  const s = Save.data.seen, key = cat + ':' + id;
  const old = s[key] || 0;
  if (old >= level) return false;
  s[key] = level;
  Save.soon();
  return old === 0;
}
function seenLevel(cat, id) { return (Save.data && Save.data.seen[cat + ':' + id]) || 0; }

// ==== 10_fx.js ====
// 表现层特效：粒子、伤害数字、扩散环、横幅、震动、顿帧、慢镜头、闪屏

const FX = {
  parts: [], texts: [], rings: [], banners: [], arcs: [], strands: [],
  shakeAmp: 0, sx: 0, sy: 0,
  stop: 0,              // 顿帧剩余帧数
  slowT: 0, slowScale: 1,
  flashA: 0, flashCss: '#ffffff',
  shakeMul: 1, flashMul: 1,
};
const MAX_PARTS = 520;

// 清空战斗特效
function fxClear() {
  FX.parts.length = 0; FX.texts.length = 0; FX.rings.length = 0; FX.banners.length = 0; FX.arcs.length = 0; FX.strands.length = 0;
  FX.shakeAmp = 0; FX.stop = 0; FX.slowT = 0; FX.slowScale = 1; FX.flashA = 0;
}

// 生成一个粒子
function part(x, y, vx, vy, life, c, o = {}) {
  if (FX.parts.length >= MAX_PARTS) FX.parts.shift();
  FX.parts.push({ x, y, vx, vy, life, max: life, c, c2: o.c2 || 0, g: o.g || 0, drag: o.drag === undefined ? 3 : o.drag, kind: o.kind || 'px', size: o.size || 1 });
}
// 向四周迸散
function burst(x, y, n, c, spd = 60, life = 0.4, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = frand(0, TAU), s = frand(0.35, 1) * spd;
    part(x, y, Math.cos(a) * s, Math.sin(a) * s, life * frand(0.6, 1.2), Array.isArray(c) ? c[i % c.length] : c, o);
  }
}
// 棉絮：慢慢飘落的浅色团
function fluff(x, y, n, tint) {
  for (let i = 0; i < n; i++) {
    const a = frand(0, TAU), s = frand(20, 70);
    part(x, y, Math.cos(a) * s, Math.sin(a) * s - 10, frand(0.5, 1.0), i % 3 === 0 && tint ? tint : PAL.moon, { kind: 'fluff', drag: 5, g: 18, c2: PAL.moonDim, size: FX_RNG.chance(0.4) ? 2 : 1 });
  }
}
// 线头碎屑：带颜色的短线段
function shreds(x, y, n, c) {
  for (let i = 0; i < n; i++) {
    const a = frand(0, TAU), s = frand(30, 110);
    part(x, y, Math.cos(a) * s, Math.sin(a) * s, frand(0.25, 0.6), c, { kind: 'thread', drag: 4, g: 30 });
  }
}
// 扩散环
function ring(x, y, r0, r1, dur, c, o = {}) { FX.rings.push({ x, y, r0, r1, t: 0, dur, c, dash: o.dash || null, fill: o.fill || false }); }
// 伤害数字
function numPop(x, y, v, c = PAL.moon, big = false) {
  if (FX.texts.length > 40) FX.texts.shift();
  FX.texts.push({ x, y, s: String(Math.max(1, Math.round(v))), c, t: 0, dur: big ? 0.9 : 0.6, big, vy: big ? -22 : -30 });
}
// 文字飘字（英文与数字）
function wordPop(x, y, s, c = PAL.gold, dur = 0.9) { FX.texts.push({ x, y, s, c, t: 0, dur, big: true, vy: -16 }); }
// 大横幅（中文）：y 为相对场地的位置
function banner(str, o = {}) {
  FX.banners.push({ str, t: 0, dur: o.dur || 1.3, c: o.c || PAL.moon, shade: o.shade || PAL.moonDim, size: o.size || 18, y: o.y === undefined ? 62 : o.y, sub: o.sub || '', subC: o.subC || PAL.gold });
}
// 闪电弧
function arc(x0, y0, x1, y1, c = PAL.thunderLight, dur = 0.16) { FX.arcs.push({ x0, y0, x1, y1, c, t: 0, dur, seed: FX_RNG.next() }); }
// 脱落的线段（被剪断时）
function fallStrand(pts, c) { if (pts.length > 1) FX.strands.push({ pts: pts.map((p) => ({ x: p.x, y: p.y, s: p.s })), c, t: 0, dur: 0.7 }); }

// 震动（游戏像素）、顿帧（帧数）、慢镜头、闪屏
function shake(a) { FX.shakeAmp = Math.min(7, Math.max(FX.shakeAmp, a * FX.shakeMul)); }
function hitstop(frames) { FX.stop = Math.max(FX.stop, Math.round(frames)); }
function slowmo(dur, scale) { FX.slowT = Math.max(FX.slowT, dur); FX.slowScale = Math.min(FX.slowT > 0 ? FX.slowScale : 1, scale); }
function flash(css, a) { FX.flashCss = css; FX.flashA = Math.max(FX.flashA, a * FX.flashMul); }

// 实时更新（不受顿帧影响）：震动、闪屏、慢镜头计时
function fxRealtime(rdt) {
  FX.shakeAmp = Math.max(0, FX.shakeAmp - rdt * 22);
  if (FX.shakeAmp > 0.3) { FX.sx = Math.round(frand(-FX.shakeAmp, FX.shakeAmp)); FX.sy = Math.round(frand(-FX.shakeAmp, FX.shakeAmp)); }
  else { FX.sx = FX.sy = 0; }
  FX.flashA = Math.max(0, FX.flashA - rdt * 3.2);
  if (FX.slowT > 0) { FX.slowT -= rdt; if (FX.slowT <= 0) FX.slowScale = 1; }
}

// 模拟时间更新
function fxUpdate(dt) {
  const ps = FX.parts;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.life -= dt;
    if (p.life <= 0) { ps.splice(i, 1); continue; }
    const k = Math.max(0, 1 - p.drag * dt);
    p.vx *= k; p.vy = p.vy * k + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (const arr of [FX.texts, FX.rings, FX.banners, FX.arcs, FX.strands]) {
    for (let i = arr.length - 1; i >= 0; i--) { const o = arr[i]; o.t += dt; if (o.t >= o.dur) arr.splice(i, 1); }
  }
  for (const t of FX.texts) { t.y += t.vy * dt; t.vy *= 1 - 2.5 * dt; }
  for (const s of FX.strands) for (const p of s.pts) { p.y += 26 * dt * (s.t + 0.2); }
}

// 地面层特效（在敌人下方）
function fxDrawGround() {
  for (const s of FX.strands) {
    const lv = 1 - s.t / s.dur;
    for (let i = 1; i < s.pts.length; i++) {
      const a = s.pts[i - 1], b = s.pts[i];
      const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y)));
      for (let k = 0; k < n; k++) {
        const u = k / n, ss = a.s + (b.s - a.s) * u;
        if ((ss % 5 + 5) % 5 < 3) pdither(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u, s.c, lv * 0.8);
      }
    }
  }
}

// 上层特效
function fxDraw() {
  for (const r of FX.rings) {
    const u = r.t / r.dur, rad = r.r0 + (r.r1 - r.r0) * Ease.outCubic(u);
    if (r.fill) circleDither(r.x, r.y, rad, r.c, (1 - u) * 0.5);
    else if (u < 0.5) circleStroke(r.x, r.y, rad, r.c, r.dash);
    else { const n = Math.max(8, Math.round(TAU * rad)); for (let i = 0; i < n; i++) { const a = (i / n) * TAU; pdither(r.x + Math.cos(a) * rad, r.y + Math.sin(a) * rad, r.c, (1 - u) * 2); } }
  }
  for (const a of FX.arcs) {
    // 折线闪电：中间点随机偏移
    const rng = makeRng((a.seed * 1e9) >>> 0);
    const n = Math.max(2, Math.round(Math.hypot(a.x1 - a.x0, a.y1 - a.y0) / 6));
    let px = a.x0, py = a.y0;
    const nx = -(a.y1 - a.y0), ny = a.x1 - a.x0, nl = Math.hypot(nx, ny) || 1;
    for (let i = 1; i <= n; i++) {
      const u = i / n, off = i === n ? 0 : rng.range(-3.5, 3.5);
      const qx = a.x0 + (a.x1 - a.x0) * u + (nx / nl) * off, qy = a.y0 + (a.y1 - a.y0) * u + (ny / nl) * off;
      line(px, py, qx, qy, a.t < a.dur * 0.5 ? PAL.white : a.c);
      px = qx; py = qy;
    }
  }
  for (const p of FX.parts) {
    const lv = p.life / p.max;
    if (p.kind === 'thread') {
      const l = Math.hypot(p.vx, p.vy) || 1;
      pset(p.x, p.y, p.c); pset(p.x - (p.vx / l) * 1.5, p.y - (p.vy / l) * 1.5, p.c);
    } else if (p.kind === 'fluff') {
      const c = lv < 0.4 && p.c2 ? p.c2 : p.c;
      if (p.size > 1) { pdither(p.x, p.y, c, lv * 2); pdither(p.x + 1, p.y, c, lv * 2); pdither(p.x, p.y + 1, c, lv * 2); }
      else pdither(p.x, p.y, c, lv * 2);
    } else if (p.size > 1) {
      rectDither(p.x - 1, p.y - 1, 2, 2, p.c, lv * 1.5);
    } else pdither(p.x, p.y, p.c, lv * 1.6);
  }
  for (const t of FX.texts) {
    const u = t.t / t.dur;
    if (u > 0.75 && Math.floor(t.t * 30) % 2) continue; // 消失前闪烁
    const sc = t.big && u < 0.12 ? 2 : 1;
    textC(t.s, t.x, Math.round(t.y) - (sc === 2 ? 4 : 2), t.c, PAL.ink, sc);
  }
}

// 横幅单独画（在最上层，可越出场地）
function fxDrawBanners() {
  for (const b of FX.banners) {
    const u = b.t / b.dur;
    const lv = u < 0.12 ? u / 0.12 : u > 0.8 ? (1 - u) / 0.2 : 1;
    const cy = b.y + (u < 0.12 ? (1 - u / 0.12) * 4 : 0);
    const m = glyphC(b.str, b.size, ARENA / 2, cy, b.c, PAL.ink, b.shade, b.size >= 30, lv, b.size >= 30 ? 0 : 1);
    if (b.sub) glyphC(b.sub, 11, ARENA / 2, cy + m.h / 2 + 9, b.subC, PAL.ink, 0, false, lv, 1);
  }
}

// ==== 11_world.js ====
// 战斗世界核心：玩家、线、打结、伤害、状态与钩子系统

// 玩家基础属性；绣片与线通过 stats 钩子在此基础上修改
const BASE_STATS = {
  maxHearts: 4, speed: 76, accel: 1500,
  threadLen: 250, minArea: 30,
  knotDmg: 10, dmgMul: 1, multiCatch: 0.15,
  dashDist: 40, dashTime: 0.12, dashCD: 1.05, dashCharges: 1, dashDmg: 7, dashInv: 0.08,
  magnet: 16, invHurt: 1.0,
  skillMul: 1,
  burnMul: 1, rotMul: 1.3, linkShare: 0.5, mirrorMul: 0.6,
  cutImmune: false, guardThread: 0, threadDps: 0, threadSlow: 0, threadBurn: 0,
  frozenMul: 1.6, pickupLife: 10,
};
const S = Object.assign({}, BASE_STATS);

// 战斗世界状态（每块布重置）
const W = {
  active: false, t: 0, seq: 0,
  enemies: [], eproj: [], pproj: [], pickups: [], holes: [], zones: [], allies: [], knots: [], tele: [], later: [],
  lastKnot: null,
  bg: null, cloth: null, threadEmb: 0,
  combo: 0, lastKnotT: -9,
  pst: null,            // 本块布统计
  ending: false, endT: 0,
  bosses: [],
  cap: 34,
};
// 玩家（每块布重置位置与线；心数等在 Run 里）
const P = {
  x: 90, y: 90, vx: 0, vy: 0, face: -Math.PI / 2, r: 2.5,
  inv: 0, hurtT: 0, hurtLock: 0, dead: false,
  dashT: 0, dashVX: 0, dashVY: 0, dashCharges: 1, dashCD: 0, dashHits: null, dashFirst: false,
  skillCharge: 0, shield: 0, slowMul: 1, moved: 0,
};

// ---------- 钩子系统 ----------
const HK = {};
const HOOKS = ['lootMul', 'onKnot', 'preCinch', 'onCinch', 'onKill', 'onDash', 'onDashEnd', 'onPierce', 'onHurt', 'onThreadCut', 'onPatchStart', 'onPatchClear', 'onPickup', 'tick', 'knotMult', 'dashMult', 'dmgTaken', 'onDamage', 'onSkill', 'onBurnDeath', 'drawUnder', 'drawOver'];
// 当前构筑里的所有条目（线、针法、绣片、合绣）
function buildItems() { return Run.items || []; }
// 按当前构筑重建钩子表
function rebuildHooks() {
  for (const k in HK) delete HK[k];
  for (const it of buildItems()) for (const name of HOOKS) if (typeof it.def[name] === 'function') (HK[name] || (HK[name] = [])).push(it);
}
function fire(name, a, b, c) { const l = HK[name]; if (!l) return; for (let i = 0; i < l.length; i++) l[i].def[name](l[i], a, b, c); }
function hookMult(name, a, b, c) { const l = HK[name]; if (!l) return 1; let m = 1; for (let i = 0; i < l.length; i++) m *= l[i].def[name](l[i], a, b, c); return m; }
// 构筑里是否有某个条目
function has(id) { return !!(Run.itemMap && Run.itemMap[id]); }
function itemOf(id) { return Run.itemMap ? Run.itemMap[id] : null; }

// 重新计算属性（构筑变化时调用）
function recomputeStats() {
  Object.assign(S, BASE_STATS);
  for (const it of buildItems()) if (it.def.stats) it.def.stats(it, S);
  if (Run.night) nightStats(S, Run.night);
  S.maxHearts += Run.bonusHearts || 0;
  S.maxHearts = Math.max(1, Math.round(S.maxHearts));
  S.dashCharges = Math.max(1, Math.round(S.dashCharges));
  if (Run.hearts > S.maxHearts) Run.hearts = S.maxHearts;
  P.dashCharges = Math.min(P.dashCharges, S.dashCharges);
  rebuildHooks();
}

// ---------- 线 ----------
function makeThread(kind) { return { kind, pts: [], len: 0, odo: 0 }; }
const TH = makeThread('player');
const MTH = makeThread('mirror');

function threadLength(pts) { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return s; }
function threadReset(th, x, y) { th.pts = [{ x, y, s: th.odo }]; th.len = 0; }

// 收回线尾，保持总长不超过 maxLen
function threadTrim(th, maxLen) {
  const pts = th.pts;
  while (th.len > maxLen && pts.length > 2) {
    const a = pts[0], b = pts[1];
    const l = Math.hypot(b.x - a.x, b.y - a.y);
    const ex = th.len - maxLen;
    if (l <= ex) { pts.shift(); th.len -= l; }
    else { const u = ex / l; a.x += (b.x - a.x) * u; a.y += (b.y - a.y) * u; a.s += (b.s - a.s) * u; th.len -= ex; break; }
  }
}

// 把新位置接到线上；检测自交，成圈时调用 onKnot(poly)
function threadPush(th, x, y, maxLen, minArea, onKnot, gate) {
  const pts = th.pts;
  if (!pts.length) { pts.push({ x, y, s: th.odo }); return; }
  const last = pts[pts.length - 1];
  const seg = Math.hypot(x - last.x, y - last.y);
  if (seg < 2) return;
  th.odo += seg;
  const n = pts.length;
  const lx0 = Math.min(last.x, x), lx1 = Math.max(last.x, x), ly0 = Math.min(last.y, y), ly1 = Math.max(last.y, y);
  let hit = null, hi = -1;
  // 从新到旧检查（跳过相邻段），取最近的交点，即最小的圈
  for (let i = n - 2; i >= 1; i--) {
    const a = pts[i - 1], b = pts[i];
    if ((a.x < lx0 && b.x < lx0) || (a.x > lx1 && b.x > lx1) || (a.y < ly0 && b.y < ly0) || (a.y > ly1 && b.y > ly1)) continue;
    const r = segIntersect(last.x, last.y, x, y, a.x, a.y, b.x, b.y);
    if (r) { hit = r; hi = i; break; }
  }
  if (hit) {
    const poly = [hit.x, hit.y];
    for (let k = hi; k < n; k++) poly.push(pts[k].x, pts[k].y);
    if (Math.abs(polyArea(poly)) >= minArea && (!gate || gate())) {
      const keep = pts.slice(0, hi);
      keep.push({ x: hit.x, y: hit.y, s: th.odo - seg * (1 - hit.t) });
      keep.push({ x, y, s: th.odo });
      th.pts = keep;
      th.len = threadLength(keep);
      threadTrim(th, maxLen);
      onKnot(poly, th);
      return;
    }
  }
  pts.push({ x, y, s: th.odo });
  th.len += seg;
  threadTrim(th, maxLen);
}

// 用线段 a→b 去剪线（含最后一点到针的活动段）；剪断返回 true
function threadCut(th, ax, ay, bx, by, hx, hy) {
  const pts = th.pts, n = pts.length;
  if (n < 1) return false;
  if (hx !== undefined) {
    const l = pts[n - 1];
    const r = segIntersect(ax, ay, bx, by, l.x, l.y, hx, hy);
    if (r && th.len > 4) {
      fallStrand(pts.concat([{ x: r.x, y: r.y, s: th.odo }]), threadColor(0));
      th.pts = [{ x: hx, y: hy, s: th.odo }]; th.len = 0;
      return true;
    }
  }
  for (let i = n - 1; i >= 1; i--) {
    const a = pts[i - 1], b = pts[i];
    const r = segIntersect(ax, ay, bx, by, a.x, a.y, b.x, b.y);
    if (r) {
      const cs = a.s + (b.s - a.s) * r.u;
      const fallen = pts.slice(0, i); fallen.push({ x: r.x, y: r.y, s: cs });
      fallStrand(fallen, threadColor(0));
      th.pts = [{ x: r.x, y: r.y, s: cs }].concat(pts.slice(i));
      th.len = threadLength(th.pts);
      return true;
    }
  }
  return false;
}

// 点到线的距离是否小于 r
function threadNear(th, x, y, r) {
  const pts = th.pts, r2 = r * r;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if ((a.x < x - r && b.x < x - r) || (a.x > x + r && b.x > x + r) || (a.y < y - r && b.y < y - r) || (a.y > y + r && b.y > y + r)) continue;
    if (distToSeg2(x, y, a.x, a.y, b.x, b.y) <= r2) return true;
  }
  return false;
}

// 当前线的颜色（合股时两色交替）
function threadColor(i) {
  const th = Run.threads || ['plain'];
  const def = THREADS[th[i % th.length]] || THREADS.plain;
  return PAL[def.color];
}

// ---------- 打结 ----------
function panOf(x) { return clamp((x - ARENA / 2) / (ARENA / 2), -1, 1) * 0.6; }

// 由多边形生成一个结：圈住敌人、清除敌弹、收走拾取物
function makeKnot(poly, src, o = {}) {
  const area = Math.abs(polyArea(poly)), perim = polyPerimeter(poly);
  const c = polyCentroid(poly), circ = circularity(area, perim);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < poly.length; i += 2) { const px = poly[i], py = poly[i + 1]; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
  const inside = (x, y) => x >= x0 && x <= x1 && y >= y0 && y <= y1 && pointInPoly(x, y, poly);
  const k = {
    id: ++W.seq, poly, area, perim, cx: c[0], cy: c[1], circ, moon: circ >= 0.8 && area >= 160,
    src, t: 0, dur: 0.09, resolved: false, caught: [], n: 0, dmgMul: o.dmgMul || 1,
    dash: P.dashT > 0, inside, bbox: [x0, y0, x1, y1], color: o.color || threadColor(0),
  };
  for (const e of W.enemies) if (e.alive && e.emerge <= 0 && inside(e.x, e.y)) { k.caught.push(e); e.bound = Math.max(e.bound, k.dur + 0.04); }
  let cleared = 0;
  for (const b of W.eproj) if (!b.dead && inside(b.x, b.y)) { b.dead = true; cleared++; burst(b.x, b.y, 3, PAL.dangerLight, 30, 0.25); }
  for (const p of W.pickups) if (inside(p.x, p.y)) p.pull = 1;
  W.knots.push(k);
  if (src !== 'echo') { W.combo = W.t - W.lastKnotT < 1.6 ? W.combo + 1 : 0; W.lastKnotT = W.t; }
  fire('onKnot', k);
  SFX.knot(k.caught.length, W.combo, k.moon, panOf(k.cx));
  if (cleared >= 3) wordPop(k.cx, k.cy, '-' + cleared, PAL.dangerLight, 0.6);
  return k;
}

// 结算一个结：勒紧落地，造成伤害、缝补破洞、反馈
function resolveKnot(k) {
  k.resolved = true;
  const caught = k.caught.filter((e) => e.alive);
  k.n = caught.length;
  // 先登记蛛约进度：这一结可能补完最后一针或打倒 Boss，随即触发结算
  pactEvent('knot', k);
  fire('preCinch', k, caught);
  let total = 0;
  for (const e of caught) total += damageEnemy(e, knotDamage(k, e), { kind: 'knot', knot: k, x: k.cx, y: k.cy });
  if (k.n >= 3 && total > 0) { numPop(k.cx, k.cy - 4, total, PAL.goldLight, true); }
  for (const h of W.holes) if (!h.mended && k.inside(h.x, h.y)) stitchHole(h, k);
  if (k.n > 0) {
    hitstop(Math.min(9, 2 + k.n * 1.3));
    shake(Math.min(5, 0.9 + k.n * 0.55));
    Haptics.buzz(Math.min(45, 10 + k.n * 5), 0.45);
    if (k.n >= 4) flash('#fff6dc', Math.min(0.16, 0.04 + k.n * 0.012));
    // 勒紧时针被线往回拽一下
    if (k.src === 'player' || k.src === 'skill') { const dx = k.cx - P.x, dy = k.cy - P.y, d = Math.hypot(dx, dy) || 1; P.tugX = (dx / d) * 2; P.tugY = (dy / d) * 2; P.tugT = 0.08; }
  }
  SFX.cinch(k.n, panOf(k.cx));
  if (k.n >= 6) { slowmo(0.3, 0.35); wordPop(k.cx, k.cy + 6, 'x' + k.n, PAL.gold, 1.0); }
  if (k.moon) ring(k.cx, k.cy, 3, Math.sqrt(k.area / Math.PI) + 6, 0.45, PAL.goldLight, { dash: [2, 2] });
  embroiderKnot(k);
  if (k.src !== 'echo') W.lastKnot = { poly: k.poly, bbox: k.bbox, time: W.t };
  if (W.pst) {
    W.pst.knots++; if (k.n > W.pst.maxCatch) W.pst.maxCatch = k.n; if (k.moon) W.pst.moons++;
    if (k.src === 'player' && P.dashT > 0) W.pst.dashKnots++;
  }
  Run.stats.knots++;
  if (k.moon) Run.stats.moons = (Run.stats.moons || 0) + 1;
  if (k.n > Run.stats.bestCatch) Run.stats.bestCatch = k.n;
  if (k.src !== 'echo') P.skillCharge = Math.min(skillCost(), P.skillCharge + 1);
  fire('onCinch', k, caught);
  tutorialEvent('knot', k);
}

// 单个敌人受到的结伤害
function knotDamage(k, e) {
  let d = S.knotDmg * S.dmgMul;
  d *= 1 + Math.min(1.2, S.multiCatch * Math.max(0, k.n - 1));
  d *= hookMult('knotMult', k, e);
  if (e.freeze > 0) d *= S.frozenMul;
  if (k.src === 'mirror') d *= S.mirrorMul;
  // 圈住大家伙更难，结的力道也更足
  if (e.boss) d *= 2.5; else if (e.elite) d *= 1.5;
  return d * k.dmgMul;
}

// 结的勒紧动画推进
function updateKnots(dt) {
  for (const k of W.knots) {
    k.t += dt;
    if (!k.resolved) {
      const pull = Math.min(1, dt * 9);
      for (const e of k.caught) if (e.alive && !e.boss && !e.heavy) { e.x += (k.cx - e.x) * pull * 0.35; e.y += (k.cy - e.y) * pull * 0.35; }
      if (k.t >= k.dur) resolveKnot(k);
    }
  }
  W.knots = W.knots.filter((k) => k.t < k.dur + 0.35);
}

// 把结的轮廓以低对比度绣进底布
function embroiderKnot(k) {
  if (!W.bg || !W.cloth) return;
  setTarget(W.bg, ARENA, ARENA);
  const col = mixC(W.cloth.pb, k.color, 0.3 + Math.min(0.12, k.n * 0.02));
  const p = k.poly, n = p.length;
  let s = 0;
  for (let i = 0; i < n; i += 2) {
    const ax = p[i], ay = p[i + 1], bx = p[(i + 2) % n], by = p[(i + 3) % n];
    const l = Math.hypot(bx - ax, by - ay), m = Math.max(1, Math.ceil(l));
    for (let j = 0; j < m; j++, s++) if (s % 4 < 2) pset(ax + ((bx - ax) * j) / m, ay + ((by - ay) * j) / m, col);
  }
  if (k.n > 0) { pset(k.cx, k.cy, col); pset(k.cx - 1, k.cy - 1, col); pset(k.cx + 1, k.cy + 1, col); pset(k.cx - 1, k.cy + 1, col); pset(k.cx + 1, k.cy - 1, col); }
  resetTarget();
}

// 结的绘制：勒紧时轮廓向中心收缩，结算后淡出
function drawKnots() {
  for (const k of W.knots) {
    const p = k.poly, n = p.length;
    if (!k.resolved || k.t < k.dur) {
      const u = Ease.inCubic(Math.min(1, k.t / k.dur));
      const sc = 1 - 0.55 * u;
      const col = k.t < 0.03 ? PAL.white : k.moon ? PAL.goldLight : k.color;
      for (let i = 0; i < n; i += 2) {
        const ax = k.cx + (p[i] - k.cx) * sc, ay = k.cy + (p[i + 1] - k.cy) * sc;
        const bx = k.cx + (p[(i + 2) % n] - k.cx) * sc, by = k.cy + (p[(i + 3) % n] - k.cy) * sc;
        line(ax, ay, bx, by, col);
      }
    } else {
      const u = (k.t - k.dur) / 0.35;
      const sc = 0.45 + 0.1 * u;
      for (let i = 0; i < n; i += 4) {
        const ax = k.cx + (p[i] - k.cx) * sc, ay = k.cy + (p[i + 1] - k.cy) * sc;
        pdither(ax, ay, k.color, (1 - u) * 1.2);
      }
      // 中心的小结
      if (u < 0.8) { pset(k.cx - 1, k.cy, PAL.white); pset(k.cx + 1, k.cy, PAL.white); pset(k.cx, k.cy - 1, k.color); pset(k.cx, k.cy + 1, k.color); }
    }
  }
}

// ---------- 伤害与状态 ----------
// 对敌人造成伤害，返回实际伤害
function damageEnemy(e, amt, src) {
  if (!e.alive || amt <= 0 || e.emerge > 0 || e.intro > 0) return 0;
  if (e.def.immune && e.def.immune(e, src)) {
    if (src.kind === 'dash' || src.kind === 'needle') { burst(e.x, e.y, 3, PAL.steelLight, 40, 0.2); if (auGate('clank', 0.08)) wood(auNow(), 0.14, 1700); }
    return 0;
  }
  let a = amt;
  if (e.rot > 0) a *= S.rotMul;
  if (e.hoop > 0) a *= 1.5;
  if (e.warded > 0) a *= 0.4;
  if (e.elite && e.elite.has('slippery') && src.kind === 'knot') {
    if (!(e.loose > 0)) { e.loose = 1.6; wordPop(e.x, e.y - e.r - 4, '?', PAL.lilacLight, 0.5); return 0; }
    a *= 2; e.loose = 0;
  }
  a *= hookMult('dmgTaken', e, src);
  e.hp -= a;
  e.flash = 0.07; e.squash = 0.14;
  if (src.x !== undefined && !e.boss && !e.heavy && src.kind !== 'burn') {
    const dx = e.x - src.x, dy = e.y - src.y, d = Math.hypot(dx, dy) || 1;
    const kb = src.kind === 'knot' ? 30 : src.kind === 'dash' ? 90 : 50;
    e.kx += (dx / d) * kb; e.ky += (dy / d) * kb;
  }
  if (e.link > 0 && src.kind !== 'link' && e.linkG) {
    const share = a * S.linkShare;
    for (const o of W.enemies) if (o !== e && o.alive && o.link > 0 && o.linkG === e.linkG) {
      if (FX_RNG.chance(0.5)) arc(e.x, e.y, o.x, o.y, PAL.crimsonLight, 0.12);
      damageEnemy(o, share, { kind: 'link' });
    }
  }
  const grouped = src.kind === 'knot' && src.knot && src.knot.n >= 3;
  if (!grouped && (src.kind === 'knot' || src.kind === 'dash' || src.kind === 'shock' || a >= 14)) numPop(e.x, e.y - e.r - 3, a, src.kind === 'knot' ? PAL.moon : src.kind === 'shock' ? PAL.iceLight : PAL.moonDim, a >= 30);
  if (src.kind !== 'burn' && src.kind !== 'link' && src.kind !== 'knot') SFX.hit(panOf(e.x));
  fire('onDamage', e, a, src);
  if (e.hp <= 0) killEnemy(e, src);
  return a;
}

// 敌人死亡：散成棉絮、掉落、触发钩子
function killEnemy(e, src) {
  if (!e.alive) return;
  e.alive = false;
  if (W.pst) W.pst.kills++;
  Run.stats.kills++;
  const col = PAL[e.def.color] || PAL.moon;
  fluff(e.x, e.y, e.boss ? 40 : Math.round(3 + e.r * 1.4), col);
  ring(e.x, e.y, 1, e.r + 4, 0.16, PAL.white);
  shreds(e.x, e.y, e.boss ? 24 : 3 + (e.r >> 1), col);
  SFX.pop(W.pst ? W.pst.kills : 0, panOf(e.x), e.r >= 6);
  if (!(src && src.kind === 'unravel' && FX_RNG.chance(0.5))) dropLoot(e);
  if (e.def.onDeath) e.def.onDeath(e, src);
  if (e.elite && e.elite.has('splitting') && !e.split) splitElite(e);
  if (e.burn && e.burn.t > 0) { fire('onBurnDeath', e); if (e.rot > 0) for (const o of W.enemies) if (o.alive && dist2(o.x, o.y, e.x, e.y) < 400) applyBurn(o, e.burn.dps, 2.5); }
  fire('onKill', e, src);
  if (e.boss) bossDown(e);
}

// 敌人的掉落
function dropLoot(e) {
  const d = e.def;
  let btn = 0;
  if (FX_RNG.chance(d.btn === undefined ? 0.5 : d.btn)) btn++;
  if (e.carry) btn += e.carry;
  if (Patch.cell && Patch.cell.mod === 'gilded' && !e.boss) btn++;
  if (e.elite) btn += 4 + (e.elite.has('gilded') ? 10 : 0);
  btn += Math.round(hookMult('lootMul', e) - 1);
  for (let i = 0; i < btn; i++) spawnPickup('btn', e.x, e.y);
  if (e.elite || (d.silk && FX_RNG.chance(d.silk))) spawnPickup('silk', e.x, e.y);
  if (e.elite && FX_RNG.chance(e.elite.has('gilded') ? 0.5 : 0.2)) spawnPickup('pattern', e.x, e.y);
  if (FX_RNG.chance(0.02 + (e.elite ? 0.3 : 0))) spawnPickup('heart', e.x, e.y);
}

// 点燃（与冰相遇则冷热碎裂）
function applyBurn(e, dps, dur) {
  if (!e.alive || e.def.fireproof) return;
  if (e.freeze > 0 || e.chill > 0.3) { thermalShock(e); return; }
  if (!e.burn) e.burn = { t: 0, dps: 0, acc: 0 };
  if (e.burn.t <= 0) SFX.ignite(panOf(e.x));
  e.burn.t = Math.max(e.burn.t, dur);
  e.burn.dps = Math.max(e.burn.dps, dps * S.burnMul * (e.rot > 0 ? 2 : 1));
}
function applyChill(e, dur) {
  if (!e.alive) return;
  if (e.burn && e.burn.t > 0) { thermalShock(e); return; }
  e.chill = Math.max(e.chill, dur);
}
function applyFreeze(e, dur) {
  if (!e.alive) return;
  if (e.burn && e.burn.t > 0) { thermalShock(e); return; }
  if (e.boss) dur = Math.min(dur, 0.45);
  if (e.freeze <= 0) SFX.freeze(panOf(e.x));
  e.freeze = Math.max(e.freeze, dur);
  e.chill = Math.max(e.chill, dur + 1);
}
// 冷热碎裂：燃烧与冰冻相遇
function thermalShock(e) {
  const d = (14 + Math.min(36, e.maxHp * 0.12)) * S.dmgMul;
  if (e.burn) e.burn.t = 0;
  e.chill = 0; e.freeze = 0;
  burst(e.x, e.y, 10, [PAL.iceLight, PAL.fireLight, PAL.white], 70, 0.4);
  ring(e.x, e.y, 2, 12, 0.25, PAL.iceLight);
  SFX.shatter(panOf(e.x));
  if (discover('status', 'thermal')) toast('相生：燃 + 冻 = 冷热碎裂');
  damageEnemy(e, d, { kind: 'shock', x: e.x, y: e.y });
}
function applyRot(e, dur) { if (e.alive) e.rot = Math.max(e.rot, dur); }
function applyStun(e, dur) { if (!e.alive) return; if (e.boss) dur = Math.min(dur, 0.18); e.stun = Math.max(e.stun, dur); }
function applyRoot(e, dur) { if (!e.alive || e.boss) return; e.root = Math.max(e.root, dur); }
function linkEnemies(list, dur) { if (list.length < 2) return; const g = ++W.seq; for (const e of list) { e.link = dur; e.linkG = g; } }

// 连锁闪电：从 (x,y) 出发跳 jumps 次
function lightning(x, y, dmg, jumps, range, exclude) {
  exclude = exclude || new Set();
  let cx = x, cy = y, extra = 0;
  for (let j = 0; j < jumps + extra && j < 12; j++) {
    let best = null, bd = range * range;
    for (const e of W.enemies) if (e.alive && e.emerge <= 0 && !exclude.has(e)) { const d = dist2(cx, cy, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    if (!best) break;
    exclude.add(best);
    arc(cx, cy, best.x, best.y);
    if (best.freeze > 0 && extra < 3) { extra++; if (discover('status', 'conduct')) toast('相生：冻 + 雷 = 导电'); }
    damageEnemy(best, dmg, { kind: 'zap', x: cx, y: cy });
    applyStun(best, 0.22);
    cx = best.x; cy = best.y;
  }
  SFX.zap(panOf(x));
}

// 爆炸：半径 r 内造成伤害
function explode(x, y, r, dmg, o = {}) {
  ring(x, y, 2, r, 0.28, o.color || PAL.fireLight);
  circleBurst(x, y, r, o.color || PAL.fire);
  SFX.boom(panOf(x));
  shake(Math.min(4, 1 + r / 12));
  for (const e of W.enemies) if (e.alive && dist2(x, y, e.x, e.y) <= (r + e.r) * (r + e.r)) {
    damageEnemy(e, dmg, { kind: o.kind || 'boom', x, y });
    if (o.ignite) applyBurn(e, S.burnDps || 4, 2.5);
  }
}
function circleBurst(x, y, r, c) { burst(x, y, Math.round(6 + r * 0.6), [c, PAL.fireLight, PAL.white], r * 4, 0.35); }

// ---------- 玩家受伤 ----------
function hurtPlayer(src, o = {}) {
  if (P.dead || W.ending || Run.godMode) return;
  if (P.inv > 0 && !o.ignoreInv) return;
  if (P.hurtLock > 0) return;
  if (P.shield > 0) {
    P.shield--; P.inv = 0.5;
    ring(P.x, P.y, 2, 14, 0.3, PAL.copperLight);
    wood(auNow(), 0.3, 900);
    return;
  }
  Run.hearts -= 1;
  P.inv = S.invHurt; P.hurtT = S.invHurt; P.hurtLock = 0.25;
  if (src && src.x !== undefined) { const dx = P.x - src.x, dy = P.y - src.y, d = Math.hypot(dx, dy) || 1; P.vx = (dx / d) * 140; P.vy = (dy / d) * 140; }
  hitstop(7); shake(4); flash('#ff4f8f', 0.32);
  SFX.hurt(); Haptics.buzz(70, 0.9);
  burst(P.x, P.y, 10, [PAL.crimson, PAL.moon], 80, 0.4);
  if (W.pst) { W.pst.hurt++; const k = src ? (src.type || (src.kind ? 'shot:' + src.kind : 'zone')) : '?'; W.pst.hurtBy[k] = (W.pst.hurtBy[k] || 0) + 1; }
  fire('onHurt', src);
  pactEvent('hurt');
  if (Run.hearts <= 0) {
    const saved = reviveCheck();
    if (!saved) playerDie();
  }
}
// 玩家倒下
function playerDie() {
  P.dead = true;
  slowmo(1.2, 0.25);
  flash('#000000', 0.5);
  for (let i = 0; i < 3; i++) setTimeout(() => burst(P.x, P.y, 14, [PAL.moon, PAL.white, PAL.moonDim], 90, 0.7), i * 120);
  fallStrand(TH.pts, threadColor(0));
  TH.pts = [];
  SFX.defeat();
  Music.stop();
  banner('线断了', { size: 24, y: 80, c: PAL.crimsonLight, shade: PAL.crimson, dur: 2.2, sub: '这一夜没能补完', subC: PAL.moonDim });
  W.ending = true; W.endT = 0; W.endKind = 'dead';
  // 胜负一定就落盘，动画期间刷新页面也抹不掉这次失败
  Run.result = finalizeRun(false);
}

// ==== 12_entities.js ====
// 战斗实体：玩家移动与冲刺、敌人通用更新、子弹、拾取物、破洞、区域、随从、预警线及其绘制

// ---------- 玩家 ----------
function updatePlayer(dt) {
  if (P.dead) { P.dashT = 0; return; }
  P.inv -= dt; P.hurtLock -= dt; P.hurtT -= dt;
  if (P.dashCharges < S.dashCharges) { P.dashCD += dt; if (P.dashCD >= S.dashCD) { P.dashCD = 0; P.dashCharges++; } } else P.dashCD = 0;
  let mx = Input.move.x, my = Input.move.y;
  if (Bot.on) { const b = Bot.steer(dt); mx = b.x; my = b.y; if (b.dash) Input.dashQ = true; if (b.skill) Input.skillQ = true; }
  else if (Input.mouse.down && Input.device === 'mouse' && !mx && !my) {
    const g = screenToArena(Input.mouse.x, Input.mouse.y);
    const dx = g.x - P.x, dy = g.y - P.y, d = Math.hypot(dx, dy);
    if (d > 2) { const s = Math.min(1, d / 8); mx = (dx / d) * s; my = (dy / d) * s; }
  }
  P.inputX = mx; P.inputY = my;
  if (takeDash()) tryDash(mx, my);
  if (takeSkill()) useSkill();
  const px = P.x, py = P.y;
  if (P.dashT > 0) {
    P.dashT -= dt;
    P.x += P.dashVX * dt; P.y += P.dashVY * dt;
    P.x = clamp(P.x, 3, ARENA - 3); P.y = clamp(P.y, 3, ARENA - 3);
    if (FX_RNG.chance(0.7)) part(px, py, 0, 0, 0.16, PAL.moonDim, { drag: 0 });
    const r2b = 2.5;
    for (const e of W.enemies) if (e.alive && e.emerge <= 0 && !P.dashHits.has(e) && distToSeg2(e.x, e.y, px, py, P.x, P.y) <= (e.r + r2b) * (e.r + r2b)) pierce(e);
    if (P.dashT <= 0) { P.vx = P.dashVX * 0.2; P.vy = P.dashVY * 0.2; fire('onDashEnd'); }
  } else {
    const spd = S.speed * P.slowMul * speedBonus();
    const a = S.accel * dt;
    P.vx = approach(P.vx, mx * spd, a); P.vy = approach(P.vy, my * spd, a);
    P.x += P.vx * dt; P.y += P.vy * dt;
    P.x = clamp(P.x, 3, ARENA - 3); P.y = clamp(P.y, 3, ARENA - 3);
  }
  const moved = Math.hypot(P.x - px, P.y - py);
  P.moved += moved;
  if (moved > 0.05) P.face = angLerp(P.face, Math.atan2(P.y - py, P.x - px), Math.min(1, dt * 20));
  P.slowMul = 1;
  threadPush(TH, P.x, P.y, S.threadLen, S.minArea, (poly) => { P.lastKnotT = W.t; makeKnot(poly, 'player'); }, knotGate);
  if (has('mirrorNeedle')) {
    const mx2 = ARENA - P.x, my2 = ARENA - P.y;
    threadPush(MTH, mx2, my2, S.threadLen, S.minArea, (poly) => makeKnot(poly, 'mirror', { color: PAL.lilac }));

}
// 一笔：两次打结至少间隔 1 秒
function knotGate() { return !has('oneStroke') || W.t - (P.lastKnotT || -9) >= 1; }
// 速度加成（来自状态与绣片）
function speedBonus() {
  let m = 1;
  if (P.hurtT > 0 && S.hurtBoost) m *= S.hurtBoost;
  if (Run.hearts === 1 && has('backToRiver')) m *= 1.2;
  if (Run.pact && Run.pact.active && has('redBind')) m *= 1.1;
  return m;
}

// 冲刺
function tryDash(mx, my) {
  if (P.dead || P.dashT > 0 || P.dashCharges < 1 || W.ending) return false;
  let dx = mx, dy = my;
  if (!dx && !dy) { dx = Math.cos(P.face); dy = Math.sin(P.face); }
  const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  P.dashCharges--;
  P.dashT = S.dashTime;
  P.dashVX = (dx * S.dashDist) / S.dashTime; P.dashVY = (dy * S.dashDist) / S.dashTime;
  P.face = Math.atan2(dy, dx);
  P.inv = Math.max(P.inv, S.dashTime + S.dashInv);
  P.dashHits = new Set(); P.dashFirst = true;
  if (W.pst) W.pst.dashes++;
  pactEvent('dash');
  tutorialEvent('dash');
  SFX.dash(panOf(P.x));
  fire('onDash', dx, dy);
  return true;
}
// 冲刺刺穿敌人
function pierce(e) {
  P.dashHits.add(e);
  if (e.elite && e.elite.has('thorny')) { hurtPlayer(e, { ignoreInv: true }); return; }
  const dmg = S.dashDmg * S.dmgMul * hookMult('dashMult', e);
  const got = damageEnemy(e, dmg, { kind: 'dash', x: P.x - P.dashVX * 0.01, y: P.y - P.dashVY * 0.01 });
  if (got > 0) {
    if (P.dashFirst) { hitstop(2); P.dashFirst = false; }
    shake(1.2);
    SFX.pierce(panOf(e.x));
    burst(e.x, e.y, 5, [PAL.white, PAL[e.def.color] || PAL.moon], 70, 0.25);
    fire('onPierce', e);
  }
}

// ---------- 敌人 ----------
// 生成敌人；o.emerge 为从破洞爬出的时间
function spawnEnemy(type, x, y, o = {}) {
  const def = ENEMIES[type];

  const e = {
    id: ++W.seq, type, def, x, y, vx: 0, vy: 0, kx: 0, ky: 0, r: def.r, hp: def.hp * hpMul, maxHp: def.hp * hpMul,
    alive: true, t: 0, st: 0, timer: frand(0.3, 1.2), face: 1, flash: 0, squash: 0,
    emerge: o.emerge === undefined ? 0 : o.emerge, fresh: o.emerge ? 0.35 : 0,
    bound: 0, stun: 0, freeze: 0, chill: 0, burn: null, rot: 0, link: 0, linkG: 0, root: 0, threaded: 0, hoop: 0, loose: 0, warded: 0,
    slowT: 0, slowAmt: 0, thT: 0, sm: 1, boss: false, heavy: !!def.heavy, elite: null, carry: def.carry || 0,

  if (o.elite) makeElite(e, o.elite);

// 敌人朝目标移动
function seek(e, tx, ty, spd) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) || 1;
  e.vx = (dx / d) * spd * e.sm; e.vy = (dy / d) * spd * e.sm;
  if (Math.abs(dx) > 0.5) e.face = dx < 0 ? -1 : 1;
  return d;
}

function updateEnemies(dt) {
  const list = W.enemies;
  const ns = Patch.speedMul || 1;
  for (const e of list) {
    if (!e.alive) continue;
    e.t += dt; e.anim += dt;
    if (e.emerge > 0) { e.emerge -= dt; continue; }
    e.fresh -= dt; e.flash -= dt; e.squash -= dt; e.bound -= dt; e.stun -= dt; e.freeze -= dt; e.chill -= dt; e.rot -= dt;
    e.link -= dt; e.root -= dt; e.threaded -= dt; e.hoop -= dt; e.loose -= dt; e.warded -= dt; e.slowT -= dt;
    if (e.burn && e.burn.t > 0) {
      e.burn.t -= dt; e.burn.acc += dt;
      if (e.burn.acc >= 0.25) {
        e.burn.acc -= 0.25;
        damageEnemy(e, e.burn.dps * 0.25, { kind: 'burn' });
        if (FX_RNG.chance(0.6)) part(e.x + frand(-e.r, e.r), e.y - e.r * 0.5, frand(-6, 6), -24, 0.4, FX_RNG.chance(0.5) ? PAL.fire : PAL.fireLight, { drag: 1 });
      }
      if (!e.alive) continue;
    }
    let sm = ns;
    if (e.chill > 0) sm *= 0.5;
    if (e.slowT > 0) sm *= 1 - e.slowAmt;
    if (e.hoop > 0) sm *= 0.5;
    if (e.elite && e.elite.has('swift')) sm *= 1.45;
    e.sm = sm;
    const disabled = e.bound > 0 || e.stun > 0 || e.freeze > 0;
    const px = e.x, py = e.y;
    if (!disabled) {
      e.def.update(e, dt);
      if (e.root > 0 && !e.boss) { e.vx = 0; e.vy = 0; }
      e.x += e.vx * dt; e.y += e.vy * dt;
    }
    e.x += e.kx * dt; e.y += e.ky * dt;
    const kd = Math.max(0, 1 - 9 * dt); e.kx *= kd; e.ky *= kd;
    if (!e.def.free && !(e.intro > 0)) { e.x = clamp(e.x, e.r, ARENA - e.r); e.y = clamp(e.y, e.r, ARENA - e.r); }
    if (e.def.cuts && !disabled && TH.pts.length && !S.cutImmune) {
      if (threadCut(TH, px, py, e.x, e.y, P.x, P.y)) onThreadCut(e);
    }
    if (!disabled && !P.dead && !e.def.harmless && !(e.intro > 0) && !(e.fresh > 0) && dist2(e.x, e.y, P.x, P.y) < (e.r * 0.85 + P.r) * (e.r * 0.85 + P.r)) hurtPlayer(e);
    if (S.threadDps || S.threadSlow || S.threadBurn) threadContact(e, dt);
    if (e.elite && e.elite.has('warden')) for (const o of list) if (o !== e && o.alive && dist2(o.x, o.y, e.x, e.y) < 1600) o.warded = 0.2;
  }
  // 分离，避免叠成一团
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    if (!a.alive || a.emerge > 0) continue;
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j];
      if (!b.alive || b.emerge > 0 || a.def.ghost || b.def.ghost) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = (a.r + b.r) * 0.9;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 < 1e-4) continue;
      const d = Math.sqrt(d2), push = (rr - d) * 0.5, ux = dx / d, uy = dy / d;
      const wa = a.boss ? 0 : b.boss ? 2 : 1, wb = b.boss ? 0 : a.boss ? 2 : 1;
      a.x -= ux * push * wa; a.y -= uy * push * wa; b.x += ux * push * wb; b.y += uy * push * wb;
    }
  }
  W.enemies = list.filter((e) => e.alive);
}

// 敌人碰到线：减速、割伤、点燃
function threadContact(e, dt) {
  if (e.emerge > 0 || !threadNear(TH, e.x, e.y, e.r + 1)) return;
  if (S.threadSlow) { e.slowT = 0.25; e.slowAmt = S.threadSlow; }

    if (S.threadBurn) applyBurn(e, S.threadBurn, 2);

}

// 线被剪断

// ---------- 子弹 ----------
// 敌弹：kind 为 orb/pin/spore/dust；cuts 表示会剪线
function enemyShot(x, y, ang, spd, o = {}) {
  W.eproj.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: o.r || 1.6, t: 0, life: o.life || 6, kind: o.kind || 'orb', cuts: !!o.cuts, acc: o.acc || 0, dead: false, curve: o.curve || 0 });
}
function updateEProj(dt) {
  for (const b of W.eproj) {
    if (b.dead) continue;

    b.t += dt;
    if (b.acc) { const s = Math.hypot(b.vx, b.vy), ns = Math.max(4, s + b.acc * dt); b.vx *= ns / s; b.vy *= ns / s; }
    if (b.curve) { const a = Math.atan2(b.vy, b.vx) + b.curve * dt, s = Math.hypot(b.vx, b.vy); b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.t > b.life || b.x < -6 || b.y < -6 || b.x > ARENA + 6 || b.y > ARENA + 6) { b.dead = true; continue; }
    if (b.cuts && !S.cutImmune && TH.pts.length && threadCut(TH, px, py, b.x, b.y, P.x, P.y)) onThreadCut(b);
    if (S.guardThread && TH.pts.length > 1 && threadNear(TH, b.x, b.y, 1.2)) {
      b.dead = true; burst(b.x, b.y, 3, PAL.moon, 30, 0.2);
      if (S.guardThread > 1) playerShot(b.x, b.y, Math.atan2(-b.vy, -b.vx), 150, 8, 1, PAL.moon);
      continue;
    }
    if (!P.dead && dist2(b.x, b.y, P.x, P.y) <= (b.r + P.r) * (b.r + P.r)) { hurtPlayer(b); if (P.inv > 0.3 || P.shield >= 0) b.dead = true; }
  }

}
// 玩家子弹（针、冰片、纽扣等）
function playerShot(x, y, ang, spd, dmg, pierceN, color, o = {}) {
  W.pproj.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, dmg, pierce: pierceN, color: color || PAL.moon, t: 0, life: o.life || 1.2, hit: new Set(), r: o.r || 1.5, kind: o.kind || 'needle', homing: o.homing || 0, onHit: o.onHit || null, look: o.look || 'needle', dead: false });
}
function updatePProj(dt) {
  for (const b of W.pproj) {
    if (b.dead) continue;
    b.t += dt;
    if (b.homing) {
      let best = null, bd = 90 * 90;
      for (const e of W.enemies) if (e.alive && e.emerge <= 0 && !b.hit.has(e)) { const d = dist2(b.x, b.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
      if (best) {
        const s = Math.hypot(b.vx, b.vy), a = Math.atan2(b.vy, b.vx), ta = Math.atan2(best.y - b.y, best.x - b.x);
        const na = a + clamp(angDiff(a, ta), -b.homing * dt, b.homing * dt);
        b.vx = Math.cos(na) * s; b.vy = Math.sin(na) * s;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.t > b.life || b.x < -4 || b.y < -4 || b.x > ARENA + 4 || b.y > ARENA + 4) { b.dead = true; continue; }
    for (const e of W.enemies) {
      if (!e.alive || e.emerge > 0 || b.hit.has(e)) continue;
      if (dist2(b.x, b.y, e.x, e.y) > (e.r + b.r) * (e.r + b.r)) continue;
      b.hit.add(e);
      damageEnemy(e, b.dmg, { kind: b.kind, x: b.x - b.vx * 0.02, y: b.y - b.vy * 0.02 });
      if (b.onHit) b.onHit(b, e);
      if (--b.pierce < 0) { b.dead = true; break; }
    }

}

// ---------- 拾取物 ----------
function spawnPickup(kind, x, y) {

}
function updatePickups(dt) {
  for (const p of W.pickups) {

    const k = Math.max(0, 1 - 5 * dt); p.vx *= k; p.vy *= k;
    const dx = P.x - p.x, dy = P.y - p.y, d = Math.hypot(dx, dy) || 1;
    const mag = S.magnet + (p.kind === 'silk' ? 8 : 0);

      p.vx += (dx / d) * sp * dt * 8; p.vy += (dy / d) * sp * dt * 8;

let coinStreak = 0, coinStreakT = 0;

// 回心
