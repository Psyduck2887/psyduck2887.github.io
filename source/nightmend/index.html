// ---------- 地图 ----------
const MAP_CELL = 38, MAP_GAP = 3;
function mapOrigin() {
  const C = Run.map.C, R = Run.map.R;
  const w = C * MAP_CELL + (C - 1) * MAP_GAP, h = R * MAP_CELL + (R - 1) * MAP_GAP;
  return { x: Math.floor((ARENA - w) / 2), y: Math.floor((ARENA - h) / 2), w, h };
}
function cellRect(c, r) { const o = mapOrigin(); return { x: o.x + c * (MAP_CELL + MAP_GAP), y: o.y + r * (MAP_CELL + MAP_GAP), w: MAP_CELL, h: MAP_CELL }; }
// 从当前位置还能不能走到这块布
function reachable(c, r) { return c >= Run.pos.c && r <= Run.pos.r; }
function drawMap(rt) {
  if (!Scene.quiltBG) Scene.quiltBG = genQuiltBG(5);
  B.set(Scene.quiltBG);
  setOrigin(Gfx.ax, Gfx.ay);
  const o = mapOrigin();
  rectFill(o.x - 4, o.y - 4, o.w + 8, o.h + 8, PAL.ink);
  const next = nextCells();
  const isNext = (c) => next.includes(c);
  const t = Scene.t;
  for (const row of Run.map.cells) for (const c of row) {
    const r = cellRect(c.c, c.r);
    const cl = c.type === 'boss' ? CLOTH_BOSS : CLOTHS.find((x) => x.id === c.cloth) || CLOTHS[0];
    const reach = reachable(c.c, c.r) || c.done;
    const thumb = Run.quilt[c.c + ',' + c.r];
    if (thumb) {
      for (let y = 0; y < MAP_CELL; y++) for (let x = 0; x < MAP_CELL; x++) pset(r.x + x, r.y + y, thumb[Math.min(35, Math.floor((y * 36) / MAP_CELL)) * 36 + Math.min(35, Math.floor((x * 36) / MAP_CELL))]);
    } else {
      rectFill(r.x, r.y, r.w, r.h, reach ? cl.pb : mixC(cl.pb, PAL.outer, 0.6));
      for (let y = 4; y < r.h; y += 6) for (let x = 2; x < r.w; x += 1) if ((Math.floor(x / 6) + (y / 6)) % 2 === 0 && x % 6) pset(r.x + x, r.y + y, reach ? cl.pl : mixC(cl.pl, PAL.outer, 0.6));
    }
    // 布块字
    const info = CELL_INFO[c.type];
    const gm = glyphMask(info.name, 14, true);
    const gc = c.type === 'boss' ? PAL.crimsonLight : c.type === 'elite' ? PAL.gold : c.type === 'spider' ? PAL.crimsonLight : PAL.moon;
    if (!thumb) drawGlyph(gm, r.x + r.w / 2 - gm.w / 2, r.y + r.h / 2 - gm.h / 2, reach ? gc : PAL.hudDim, PAL.ink, reach ? mixC(gc, PAL.ink, 0.3) : 0);
    if (c.gleaner) blit(SPR.sachet, r.x + r.w - 6, r.y + 6, {});
    if (c.mod && !c.done) { const ic = c.mod === 'moonlit' ? SPR.iconMoon : c.mod === 'gilded' ? SPR.iconBtn : SPR.iconFlame; rectFill(r.x + r.w - ic.w - 4, r.y + 1, ic.w + 3, ic.h + 3, PAL.ink); blit(ic, r.x + r.w - ic.w / 2 - 2.5, r.y + 2.5 + ic.h / 2, { noOutline: true }); }
    if (c.done && !thumb) { line(r.x + 4, r.y + 4, r.x + r.w - 5, r.y + r.h - 5, PAL.moonDim, [2, 2]); }
    // 可走的下一块：闪烁的针脚边
    if (isNext(c)) {
      const hov = Scene.mapHover && Scene.mapHover.c === c.c && Scene.mapHover.r === c.r;
      const col = hov ? PAL.gold : Math.floor(t * 3) % 2 ? PAL.moon : PAL.moonDim;
      const ph = Math.floor(t * 12);
      for (let i = 0; i < r.w; i++) { if ((i + ph) % 4 < 2) { pset(r.x + i, r.y - 2, col); pset(r.x + i, r.y + r.h + 1, col); } }
      for (let i = 0; i < r.h; i++) { if ((i + ph) % 4 < 2) { pset(r.x - 2, r.y + i, col); pset(r.x + r.w + 1, r.y + i, col); } }
      if (hov) rectStroke(r.x - 1, r.y - 1, r.w + 2, r.h + 2, PAL.goldDark);
    }
  }
  // 走过的路：红线缝起来
  const path = Run.path;
  for (let i = 1; i < path.length; i++) {
    const a = cellRect(path[i - 1].c, path[i - 1].r), b = cellRect(path[i].c, path[i].r);
    line(a.x + a.w / 2 + 1, a.y + a.h / 2 + 1, b.x + b.w / 2 + 1, b.y + b.h / 2 + 1, PAL.ink, [3, 2]);
    line(a.x + a.w / 2, a.y + a.h / 2, b.x + b.w / 2, b.y + b.h / 2, PAL.crimson, [3, 2]);
  }
  // 当前位置的针
  const cur = cellRect(Run.pos.c, Run.pos.r);
  drawNeedle(cur.x + cur.w / 2, cur.y + cur.h / 2 + Math.sin(t * 3) * 1.5, -Math.PI / 4 + Math.sin(t * 2) * 0.2, 11, PAL.moon);
  setOrigin(0, 0);
  drawHud(true);
}
// 地图上点布块
function mapPointer(gx, gy) {
  if (Scene.name !== 'map' || UI.screen !== 'map') return;
  for (const c of nextCells()) {
    const r = cellRect(c.c, c.r);
    if (gx >= r.x - 2 && gx <= r.x + r.w + 2 && gy >= r.y - 2 && gy <= r.y + r.h + 2) {
      if (Scene.mapHover && Scene.mapHover.c === c.c && Scene.mapHover.r === c.r) { SFX.ui('ok'); hideScreen(); enterCell(c); }
      else { Scene.mapHover = { c: c.c, r: c.r }; SFX.ui('tick'); const b = document.querySelector(`[data-cell="${c.c},${c.r}"]`); if (b) b.focus({ preventScroll: true }); }
      return;
    }
  }
}

// ---------- 结算拼布图 ----------
function quiltImage(win) {
  const C = Run.map.C, R = Run.map.R, cs = 36, gap = 2, pad = 6;
  const w = C * cs + (C - 1) * gap + pad * 2, h = R * cs + (R - 1) * gap + pad * 2;
  const buf = new Uint32Array(w * h).fill(PAL.ink);
  setTarget(buf, w, h);
  for (const row of Run.map.cells) for (const c of row) {
    const x0 = pad + c.c * (cs + gap), y0 = pad + c.r * (cs + gap);
    const thumb = Run.quilt[c.c + ',' + c.r];
    const visited = Run.path.some((p) => p.c === c.c && p.r === c.r);
    const cl = c.type === 'boss' ? CLOTH_BOSS : CLOTHS.find((x) => x.id === c.cloth) || CLOTHS[0];
    if (thumb) { for (let y = 0; y < cs; y++) for (let x = 0; x < cs; x++) pset(x0 + x, y0 + y, thumb[y * 36 + x]); }
    else {
      const base = visited ? cl.pb : mixC(cl.pb, PAL.ink, 0.55), ln = visited ? cl.pl : mixC(cl.pl, PAL.ink, 0.55);
      rectFill(x0, y0, cs, cs, base);
      for (let y = 3; y < cs; y += 6) for (let x = 0; x < cs; x++) if ((Math.floor(x / 6) + y) % 2 && x % 6) pset(x0 + x, y0 + y, ln);
      if (visited && c.type !== 'boss') { const m = glyphMask(CELL_INFO[c.type].name, 12, true); drawGlyph(m, x0 + cs / 2 - m.w / 2, y0 + cs / 2 - m.h / 2, mixC(base, PAL.moon, 0.6), 0); }
    }
    if (c.type === 'boss' && visited) {
      const cx = x0 + cs / 2, cy = y0 + cs / 2;
      if (win) { for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; line(cx, cy, cx + Math.cos(a) * 12, cy + Math.sin(a) * 12, i % 2 ? PAL.gold : PAL.goldLight); } circleFill(cx, cy, 3, PAL.crimson); }
      else { for (let yy = -9; yy <= 9; yy++) for (let xx = -9; xx <= 9; xx++) if (xx * xx + yy * yy < 70 + Math.sin(xx * 2) * 10) pset(cx + xx, cy + yy, PAL.shadow); }
    }
  }
  // 路线
  for (let i = 1; i < Run.path.length; i++) {
    const a = Run.path[i - 1], b = Run.path[i];
    line(pad + a.c * (cs + gap) + cs / 2, pad + a.r * (cs + gap) + cs / 2, pad + b.c * (cs + gap) + cs / 2, pad + b.r * (cs + gap) + cs / 2, PAL.crimson, [3, 2]);
  }
  resetTarget();
  // 按原尺寸存成 PNG（几 KB），显示时再用像素化放大，避免撑爆本地存储
  const small = document.createElement('canvas'); small.width = w; small.height = h;
  small.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf.buffer), w, h), 0, 0);
  try { return small.toDataURL('image/png'); } catch (e) { return ''; }
}

// ---------- 新手引导 ----------
const TUT = { step: -1, t: 0 };
function tutorialStart() {
  if (Save.data.tut.done) { TUT.step = -1; setHint(''); return; }
  TUT.step = 0; TUT.t = 0;
  setHint(Input.device === 'touch' ? '左手按住拖动来移动。针身后会拖出一根线，绕着虫子转一圈，让线交叉就能打结。' : 'WASD 或方向键移动（也可以按住鼠标左键）。绕着虫子转一圈，让线交叉就能打结。');
}
function tutorialEvent(kind) {
  if (TUT.step < 0) return;
  if (TUT.step === 0 && kind === 'knot') { TUT.step = 1; TUT.t = 0; setHint('圈住破洞再打结，就能缝上一针。缝满三针，洞就补好了。'); }
  else if (TUT.step === 1 && kind === 'mend') { TUT.step = 2; TUT.t = 0; setHint(Input.device === 'touch' ? '右下的大按钮是穿刺：冲出去的瞬间无敌，还能刺穿虫子。' : '空格是穿刺：冲出去的瞬间无敌，还能刺穿虫子。'); }
  else if (TUT.step === 2 && kind === 'dash') { TUT.step = 3; TUT.t = 0; setHint(Input.device === 'touch' ? '打结会给针法充能，满了点右侧的小按钮释放。' : '打结会给针法充能，满了按 E 释放。'); }
  else if (TUT.step === 3 && kind === 'skill') { TUT.step = 4; setHint(''); Save.data.tut.done = true; Save.soon(); }
  if (kind === 'pact') Save.data.tut.pact = 1;
}
function tutorialTick(dt) {
  if (TUT.step < 0) return;
  TUT.t += dt;
  if (TUT.step === 3 && TUT.t > 14) { TUT.step = 4; setHint(''); Save.data.tut.done = true; Save.soon(); }
  if (W.ending && W.endKind === 'clear' && TUT.step >= 1) { if (TUT.step < 4) setHint(''); if (TUT.step >= 2) { Save.data.tut.done = true; Save.soon(); } }
}

// 场景切换：从夜色里抖动着显现
function drawTransition(rdt) {
  if (Scene.trans <= 0) return;
  Scene.trans -= rdt;
  const lv = clamp(Scene.trans / 0.32, 0, 1);
  setOrigin(0, 0);
  const n = SBW * SBH;
  for (let i = 0; i < n; i++) {
    const x = i % SBW, y = (i / SBW) | 0;
    const th = BAYER[((y & 3) << 2) | (x & 3)] * 0.7 + ((x + y) / (SBW + SBH)) * 0.3;
    if (lv > th) B[i] = PAL.outer;
  }
}

// 新手示范：第一块布上，围着最近的破洞画一个会转的虚线圈，提示「绕着它转」
function drawTutorialGhost() {
  if (TUT.step !== 0 && TUT.step !== 1) return;
  const holes = W.holes.filter((h) => !h.mended);
  if (!holes.length) return;
  holes.sort((a, b) => dist2(a.x, a.y, P.x, P.y) - dist2(b.x, b.y, P.x, P.y));
  const h = holes[0], r = 17, t = W.t;
  const n = 48;
  for (let i = 0; i < n; i++) {
    if ((i + Math.floor(t * 10)) % 4 >= 2) continue;
    const a = (i / n) * TAU;
    pdither(h.x + Math.cos(a) * r, h.y + Math.sin(a) * r, PAL.gold, 0.7);
  }
  // 沿圈跑的小光点，示意方向
  for (let k = 0; k < 3; k++) { const a = t * 2.6 - k * 0.18; pset(h.x + Math.cos(a) * r, h.y + Math.sin(a) * r, k ? PAL.goldDark : PAL.goldLight); }
}

// ==== 23_bot.js ====
// 自动驾驶：测试、数值模拟与演示用。绕着目标画圈，预判躲闪，危险时冲刺，充满就放针法

const Bot = {
  on: false, dir: 1, swapT: 0, stuck: 0, lastX: 0, lastY: 0, tgt: null, tgtT: 0,
  // 选一个画圈的中心与半径
  pickTarget() {
    if (W.bosses.length) {
      const b = W.bosses.filter((x) => x.alive).sort((a, c) => dist2(a.x, a.y, P.x, P.y) - dist2(c.x, c.y, P.x, P.y))[0];
      if (b) return { x: b.x, y: b.y, r: b.type === 'shears' ? 27 : b.type === 'blade' ? 24 : Math.max(26, b.r + 16) };
    }
    const holes = W.holes.filter((h) => !h.mended);
    if (Patch.elite && Patch.elite.alive && (!holes.length || Patch.elite.hp < Patch.elite.maxHp * 0.9)) return { x: Patch.elite.x, y: Patch.elite.y, r: Patch.elite.r + 13 };
    if (holes.length) {
      // 洞附近虫多就画大一点的圈，把它们一起勒住
      holes.sort((a, c) => dist2(a.x, a.y, P.x, P.y) - dist2(c.x, c.y, P.x, P.y));
      const h = holes[0];
      let near = 0;
      for (const e of W.enemies) if (e.alive && dist2(e.x, e.y, h.x, h.y) < 900) near++;
      return { x: h.x, y: h.y, r: near >= 3 ? 22 : 16 };
    }
    if (W.enemies.length) { let sx = 0, sy = 0; for (const e of W.enemies) { sx += e.x; sy += e.y; } return { x: sx / W.enemies.length, y: sy / W.enemies.length, r: 20 }; }
    return { x: ARENA / 2, y: ARENA / 2, r: 20 };
  },
  steer(dt) {
    this.tgtT -= dt;
    if (!this.tgt || this.tgtT <= 0) { this.tgt = this.pickTarget(); this.tgtT = 0.25; }
    const t = this.tgt;
    let dx = P.x - t.x, dy = P.y - t.y;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;
    let mx = -dy * this.dir, my = dx * this.dir;
    const rad = clamp((t.r - d) / t.r, -1.2, 1.2);
    mx += dx * rad * 1.4; my += dy * rad * 1.4;
    // 预判 0.18 秒后敌人的位置来躲
    let ax = 0, ay = 0, danger = 0, threatX = 0, threatY = 0;
    for (const e of W.enemies) {
      if (!e.alive || e.emerge > 0 || e.def.harmless) continue;
      const fx = e.x + e.vx * 0.18, fy = e.y + e.vy * 0.18;
      const ex = P.x - fx, ey = P.y - fy, ed = Math.hypot(ex, ey) || 1, rr = e.r + 10;
      if (ed < rr) {
        const w = (rr - ed) / rr;
        ax += (ex / ed) * w * 2.2; ay += (ey / ed) * w * 2.2; danger += w * (e.r + 3 > ed ? 2 : 1);
        threatX += ex / ed; threatY += ey / ed;
      }
    }
    for (const b of W.eproj) {
      const fx = b.x + b.vx * 0.12, fy = b.y + b.vy * 0.12;
      const ex = P.x - fx, ey = P.y - fy, ed = Math.hypot(ex, ey) || 1;
      if (ed < 20) {
        const vl = Math.hypot(b.vx, b.vy) || 1;
        const side = (ex * -b.vy + ey * b.vx) / vl >= 0 ? 1 : -1;
        const w = (20 - ed) / 20;
        ax += (-b.vy / vl) * side * w * 3.2; ay += (b.vx / vl) * side * w * 3.2;
        danger += w * 1.2;
      }
    }
    for (const z of W.zones) if ((z.kind === 'dust' || z.kind === 'heat' || z.kind === 'mildew') && dist2(z.x, z.y, P.x, P.y) < (z.r + 7) * (z.r + 7)) { ax += (P.x - z.x) * 0.25; ay += (P.y - z.y) * 0.25; }
    for (const tl of W.tele) {
      if (tl.kind === 'line') {
        const w2 = ((tl.w || 2) + 7) * ((tl.w || 2) + 7);
        if (distToSeg2(P.x, P.y, tl.x0, tl.y0, tl.x1, tl.y1) < w2) { const lx = tl.x1 - tl.x0, ly = tl.y1 - tl.y0, ll = Math.hypot(lx, ly) || 1; const sd = ((P.x - tl.x0) * -ly + (P.y - tl.y0) * lx) >= 0 ? 1 : -1; ax += (-ly / ll) * sd * 2.4; ay += (lx / ll) * sd * 2.4; danger += 0.6; }
      } else if (tl.kind === 'circle' && dist2(P.x, P.y, tl.x, tl.y) < (tl.r + 6) * (tl.r + 6)) { ax += (P.x - tl.x) * 0.2; ay += (P.y - tl.y) * 0.2; }
    }
    mx += ax; my += ay;
    if (P.x < 10) mx += 1; if (P.x > ARENA - 10) mx -= 1; if (P.y < 10) my += 1; if (P.y > ARENA - 10) my -= 1;
    const l = Math.hypot(mx, my) || 1;
    this.swapT -= dt;
    if (this.swapT <= 0) { this.swapT = 6 + Math.random() * 4; if (Math.random() < 0.3) this.dir = -this.dir; }
    const moved = Math.hypot(P.x - this.lastX, P.y - this.lastY);
    this.lastX = P.x; this.lastY = P.y;
    this.stuck = moved < 0.2 ? this.stuck + dt : 0;
    if (this.stuck > 0.6) { this.dir = -this.dir; this.stuck = 0; }
    const pactNoDash = Run.pact && Run.pact.active && Run.pact.cond === 'grounded';
    return { x: mx / l, y: my / l, dash: !pactNoDash && danger > 1.4 && P.dashCharges > 0 && P.inv <= 0, skill: P.skillCharge >= skillCost() };
  },
};

const Game = { paused: false, time: 0, last: 0, acc: 0, booted: false, fps: 60, frameMs: 0 };

// 布局：按屏幕选择整数放大倍数，摆放场地、抬头信息与触屏按键
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  Gfx.dpr = dpr;
  const cw = Math.max(200, Math.round(vw * dpr)), ch = Math.max(200, Math.round(vh * dpr));
  const touch = Input.touchSeen || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  LAY.touch = touch;
  const portrait = vh > vw * 1.08;
  LAY.portrait = portrait;
  let ps;
  if (portrait) ps = Math.floor(Math.min(cw / (ARENA + 8), ch / (ARENA + 32 + (touch ? 64 : 8))));
  else ps = Math.floor(Math.min(ch / (ARENA + 20), cw / (ARENA + (touch ? 150 : 110))));
  ps = Math.max(2, ps);
  gfxResize(cw, ch, ps);
  Gfx.canvas.style.width = vw + 'px';
  Gfx.canvas.style.height = vh + 'px';
  const toB = (v) => (v * dpr) / ps; // CSS → 缓冲
  const sa = safeAreas();
  const safeT = toB(sa.t), safeB = toB(sa.b);
  if (portrait) {
    Gfx.ax = Math.floor((SBW - ARENA) / 2);
    const free = SBH - ARENA - 30;
    Gfx.ay = Math.round(touch ? Math.max(16 + safeT, Math.min(free * 0.25, 34) + safeT) : 16 + Math.max(0, free / 2 - 4));
    LAY.top = { x: Gfx.ax, y: Gfx.ay - 11, w: ARENA };
    LAY.bottom = { x: Gfx.ax, y: Gfx.ay + ARENA + 5, w: ARENA };
    LAY.left = LAY.right = null;
  } else {
    Gfx.ax = Math.floor((SBW - ARENA) / 2);
    Gfx.ay = Math.floor((SBH - ARENA) / 2);
    const side = Gfx.ax - 8;
    LAY.left = { x: 4, y: Gfx.ay + 2, w: side };
    LAY.right = { x: Gfx.ax + ARENA + 8, y: Gfx.ay + 2, w: side };
    LAY.top = { x: Gfx.ax, y: Gfx.ay - 11, w: ARENA };
    LAY.bottom = { x: Gfx.ax, y: Gfx.ay + ARENA + 5, w: ARENA };
  }
  // 触屏按键（缓冲坐标）
  const left = Save.data && Save.data.settings.hand === 'left';
  const R = Math.max(14, Math.min(26, toB(40)));
  if (portrait) {
    const by = SBH - safeB - R - Math.max(8, toB(22));
    LAY.dash = { x: left ? R + 10 : SBW - R - 10, y: by, r: R };
    LAY.skill = { x: left ? R * 2 + 26 : SBW - R * 2 - 26, y: by - R * 0.9, r: Math.round(R * 0.7) };
    LAY.joyHome = { x: left ? SBW - toB(90) : toB(90), y: by - 4 };
  } else {
    const by = SBH - safeB - R - 10;
    LAY.dash = { x: left ? R + 12 : SBW - R - 12, y: by, r: R };
    LAY.skill = { x: left ? R + 12 : SBW - R - 12, y: by - R * 2.4, r: Math.round(R * 0.7) };
    LAY.joyHome = { x: left ? SBW - toB(110) : toB(110), y: by - 10 };
  }
  LAY.pause = { x: SBW - 10, y: 10 + safeT, r: 7 };
  if (!touch) { LAY.dash.r = 0; LAY.skill.r = 0; }
  // 写回 CSS 像素供输入命中
  const toC = (v) => (v * ps) / dpr;
  for (const k of ['dash', 'skill', 'pause']) Input.btn[k] = { x: toC(LAY[k].x), y: toC(LAY[k].y), r: LAY[k].r ? toC(LAY[k].r) * 1.15 : 0 };
  // 暂停键画得小，但点按热区至少 48 像素直径
  Input.btn.pause.r = Math.max(24, Input.btn.pause.r);
  Input.joyR = Math.max(30, Math.min(56, toC(R) * 1.1));
  // 场地的 CSS 位置，界面用来避让
  const root = document.documentElement.style;
  root.setProperty('--al', toC(Gfx.ax) + 'px');
  root.setProperty('--at', toC(Gfx.ay) + 'px');
  root.setProperty('--as', toC(ARENA) + 'px');
  root.setProperty('--ar', (vw - toC(Gfx.ax + ARENA)) + 'px');
  root.setProperty('--ab', (vh - toC(Gfx.ay + ARENA)) + 'px');
  const cssRight = vw - toC(Gfx.ax + ARENA), cssBottom = vh - toC(Gfx.ay + ARENA);
  const mode = cssRight >= 250 ? 'side-ui' : cssBottom >= 190 ? 'below-ui' : 'over-ui';
  document.body.classList.remove('side-ui', 'below-ui', 'over-ui');
  document.body.classList.add(mode);
  document.body.classList.toggle('portrait', portrait);
  document.body.classList.toggle('landscape', !portrait);
  document.body.classList.toggle('touch', touch);
  genOuterBG();
  Scene.titleBG = null; Scene.quiltBG = null;
  rebuildOverlays();
  positionHud();
}
// 读取刘海、底部横条等安全区（CSS 像素）
function safeAreas() {
  let el = document.getElementById('safe-probe');
  if (!el) { el = document.createElement('div'); el.id = 'safe-probe'; document.body.appendChild(el); }
  const cs = getComputedStyle(el);
  return { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
}

// 屏幕坐标 → 场地坐标
function screenToArena(cx, cy) {
  const k = Gfx.dpr / Gfx.ps;
  return { x: cx * k - Gfx.ax, y: cy * k - Gfx.ay };
}

// 每帧
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.1, Math.max(0, (now - Game.last) / 1000));
  Game.last = now;
  const t0 = performance.now();
  inputPoll();
  if (takePause()) {
    if (UI.screen === 'pause') { /* 交给界面处理 */ }
    else if (W.active || Scene.name === 'map') openPause();
  }
  if (!Game.paused && !document.hidden) {
    Game.time += rdt;
    Scene.t += rdt;
    if (Run.active) Run.time += rdt;
    fxRealtime(rdt);
    if (Scene.name === 'combat' && W.active) {
      const scale = FX.slowT > 0 ? FX.slowScale : 1;
      Game.acc += rdt * scale * (Game.speed || 1);
      let steps = 0;
      while (Game.acc >= DT && steps < 8) {
        if (FX.stop > 0) FX.stop--;
        else worldStep(DT);
        Game.acc -= DT; steps++;
        if (!W.active) break;
      }
      if (steps >= 8) Game.acc = 0;
    } else {
      fxUpdate(rdt);
    }
  }
  render(rdt);
  Game.frameMs = Game.frameMs * 0.95 + (performance.now() - t0) * 0.05;
}

// 绘制当前场景
function render(rdt) {
  resetTarget();
  setOrigin(0, 0);
  const sn = Scene.name;
  if (sn === 'combat' && W.bg) {
    B.set(Gfx.outer);
    drawWorld();
    drawHud();
  } else if (sn === 'map' && Run.map) {
    drawMap(rdt);
  } else {
    drawTitle(Game.paused ? 0 : rdt);
  }
  drawTransition(Math.min(rdt, 0.05));
  const low = sn === 'combat' && W.active && Run.hearts === 1 && !P.dead ? 0.1 + 0.08 * Math.sin(Game.time * 5) : 0;
  present(FX.flashCss, FX.flashA, low);
}

// 自动暂停：切后台、失焦
function autoPause() {
  if (W.active && !Game.paused && Scene.name === 'combat') openPause();
}

// 启动
function boot() {
  if (Game.booted) return;
  Game.booted = true;
  buildSprites();
  Save.load();
  try { if (!Save.data.tut.motionAsked && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { Save.data.settings.shake = 0; Save.data.settings.flash = 0; } Save.data.tut.motionAsked = 1; } catch (e) { /* 忽略 */ }
  gfxInit(document.getElementById('screen'));
  inputInit(Gfx.canvas);
  applySettings();
  layout();
  window.addEventListener('resize', () => { clearTimeout(Game.rz); Game.rz = setTimeout(layout, 60); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { autoPause(); if (AU.ctx) AU.ctx.suspend(); } else if (AU.ctx) AU.ctx.resume(); });
  window.addEventListener('blur', autoPause);
  // 首次触屏后切换为触屏布局
  window.addEventListener('touchstart', () => { if (!LAY.touch) { Input.touchSeen = true; layout(); } }, { passive: true });
  // 地图与标题上的点击
  Gfx.canvas.addEventListener('click', (e) => { const g = screenToArena(e.clientX, e.clientY); if (Scene.name === 'map') mapPointer(g.x, g.y); });
  // 首次交互后开始放音乐
  const kick = () => { auInit(); if (AU.ready) Music.play(Music.want || (Scene.name === 'title' ? 'title' : 'map')); };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('touchend', kick);
  window.addEventListener('click', kick);
  window.addEventListener('keydown', kick);
  Music.want = 'title';
  UI.title();
  if (location.search.includes('debug')) installDebug();
  Game.last = performance.now();
  requestAnimationFrame(frame);
}

// ---------- 调试接口（地址带 ?debug 时才有） ----------
function installDebug() {
  window.__worldStep = worldStep;
  window.__render = render;
  window.__fxRealtime = fxRealtime;
  Object.assign(window, { __useSkill: useSkill, __spawnEnemy: spawnEnemy, __AFFIXES: AFFIXES, __EVENTS: EVENTS, __makeRng: makeRng, __nextCombatIsBoss: nextCombatIsBoss });
  const NM = {
    Run, W, P, S, Save, Patch, Bot, Game, Scene, UI, FX, AU, Music, LAY, Gfx, CHARMS, THREADS, SKILLS, COMBOS, ENEMIES,
    // 直接开一场战斗：type 为 battle/elite/boss
    combat(type = 'battle', o = {}) {
      hideScreen();
      newRun(Object.assign({ seed: 12345 }, o));
      if (o.depth) Run.depth = o.depth;
      for (const c of o.charms || []) addCharm(c, { quiet: true });
      const cell = type === 'boss' ? cellAt(2, 0) : Object.assign({}, cellAt(0, 3), { type });
      Run.pos = { c: cell.c, r: cell.r };
      startCombat(cell);
      return NM.state();
    },
    // 模拟若干秒（不渲染）；bot 为真时自动驾驶
    ff(sec, bot = true) {
      Bot.on = bot;
      const n = Math.round(sec * 60);
      for (let i = 0; i < n && W.active; i++) { if (FX.stop > 0) FX.stop--; else worldStep(DT); if (FX.slowT > 0) FX.slowT -= DT; else FX.slowScale = 1; Run.time += DT; }
      return NM.state();
    },
    bot(on = true) { Bot.on = on; },
    god(on = true) { Run.godMode = on; },
    state() {
      return {
        scene: Scene.name, ui: UI.screen, active: W.active, t: +W.t.toFixed(2), hearts: Run.hearts, max: S.maxHearts, buttons: Run.buttons, silk: Run.silk,
        enemies: W.enemies.length, holes: W.holes.filter((h) => !h.mended).length, knots: W.pst ? W.pst.knots : 0, kills: W.pst ? W.pst.kills : 0,
        ending: W.ending, endKind: W.endKind, boss: bossBar(), depth: Run.depth, pos: Run.pos, runActive: Run.active, pact: Run.pact, fms: +Game.frameMs.toFixed(2),
      };
    },
    // 点界面上第 i 个可选按钮（或按 data-act）
    click(sel) {
      const root = document.getElementById('ui');
      const items = [...root.querySelectorAll('[data-nav]')].filter((x) => !x.disabled && !x.classList.contains('disabled'));
      const el = typeof sel === 'number' ? items[sel] : root.querySelector(`[data-act="${sel}"]:not(.disabled)`);
      if (el) { el.click(); return true; }
      return false;
    },
    buttons() { return [...document.querySelectorAll('#ui [data-nav]')].map((x) => (x.dataset.act || '') + ':' + x.textContent.trim().slice(0, 16)); },
    // 整局同步模拟（不渲染）：机器人自动战斗，界面按简单策略选择；返回每块布的数据
    simRun(o = {}) {
      const rng = makeRng(o.seed || 1);
      hideScreen();
      if (o.fresh) Save.reset();
      newRun({ seed: o.seed || 1, thread: o.thread || 'plain', skill: o.skill || 'overlock', night: o.night || 1 });
      Run.godMode = !!o.god;
      startFirstPatch();
      const patches = [];
      let guard = 0;
      const pick = (sel) => { const items = [...document.querySelectorAll('#ui ' + sel)].filter((x) => !x.disabled && !x.classList.contains('disabled')); if (!items.length) return false; rng.pick(items).click(); return true; };
      while (guard++ < 400) {
        if (UI.screen === 'results' || (!Run.active && !W.active)) break;
        if (Scene.name === 'combat' && W.active) {
          const type = Patch.type, h0 = Run.hearts;
          Bot.on = true;
          let n = 0;
          while (W.active && n++ < 60 * 400) { if (FX.stop > 0) FX.stop--; else worldStep(DT); Run.time += DT; }
          patches.push({ type, by: W.pst.hurtBy, elite: Patch.elite ? Patch.elite.type + ':' + [...(Patch.elite.elite || [])].join('/') : '', boss: Patch.type === 'boss' ? Run.boss : '', t: +W.pst.time.toFixed(1), hurt: W.pst.hurt, knots: W.pst.knots, kills: W.pst.kills, maxCatch: W.pst.maxCatch, end: W.endKind, hearts: Run.hearts, h0, depth: Run.depth });
          continue;
        }
        const s = UI.screen;
        if (s === 'map') { pick('[data-act="go"]'); continue; }
        if (s === 'reward') { if (!pick('[data-act="take"]')) NM.click('skip'); continue; }
        if (s === 'shop') { for (let i = 0; i < 3; i++) { const b = [...document.querySelectorAll('#ui [data-act="buy"]')].find((x) => !x.classList.contains('disabled') && !x.classList.contains('sold')); if (!b) break; b.click(); if (UI.screen !== 'shop') NM.click(0); } NM.click('leave'); continue; }
        if (s === 'rest') { if (Run.hearts < S.maxHearts - 1) NM.click('heal'); else if (!NM.click('gold')) NM.click('sleep'); if (UI.screen === 'pick') NM.click(0); continue; }
        if (s === 'event') { if (!NM.click(0)) NM.click('opt'); if (UI.screen === 'event') NM.click('ok'); continue; }
        if (s === 'pact') { if (o.pacts !== false && rng.chance(o.pactRate || 0.5) && NM.click('make')) continue; NM.click('leave'); continue; }
        if (s === 'pick') { NM.click(0); continue; }
        if (s === 'confirm') { NM.click('yes'); continue; }
        break;
      }
      Bot.on = false;
      return { win: Save.data.gallery[0] && Save.data.gallery[0].win, patches, time: +Run.time.toFixed(1), charms: Run.charms.map((c) => c.id), combos: Run.combos.slice(), pactsWon: Run.stats.pactsWon, pactsLost: Run.stats.pactsLost, boss: Run.boss, ui: UI.screen };
    },
    // 离线渲染一个音效，返回峰值、均方根与高频能量占比
    async renderSfx(name, args = []) {
      const sr = 48000, len = sr * 2;
      const oc = new OfflineAudioContext(2, len, sr);
      const saved = { ctx: AU.ctx, ready: AU.ready, sum: AU.sum, sfxBus: AU.sfxBus, musicBus: AU.musicBus, musicLP: AU.musicLP, revSend: AU.revSend, master: AU.master, comp: AU.comp, noiseBuf: AU.noiseBuf, voices: AU.voices, last: AU.last, ks: AU.ks };
      AU.ctx = oc; AU.ready = true; AU.voices = 0; AU.last = Object.create(null); AU.ks = new Map();
      buildBus(oc, oc.destination, AU);
      try { if (name === 'music') { Music.begin(args[0] || 'battle'); Music.inten = Music.target = args[1] || 0.8; Music.t = 0.05; for (let i = 0; i < 64; i++) { Music.playStep(i % 16, Music.t); Music.t += 60 / Music.def.bpm / 4; if (i % 16 === 15) Music.bar++; } } else SFX[name](...args); } catch (e) { Object.assign(AU, saved); throw e; }
      const buf = await oc.startRendering();
      Object.assign(AU, saved);
      Music.sec = null;
      const d = buf.getChannelData(0);
      let peak = 0, sum = 0, hf = 0, prev = 0, nan = 0;
      for (let i = 0; i < d.length; i++) { const v = d[i]; if (Number.isNaN(v)) nan++; const a = Math.abs(v); if (a > peak) peak = a; sum += v * v; const df = v - prev; hf += df * df; prev = v; }
      return { peak: +peak.toFixed(4), rms: +Math.sqrt(sum / d.length).toFixed(5), hfRatio: sum > 0 ? +(hf / sum).toFixed(4) : 0, nan };
    },
  };
  Object.assign(NM, {
    __makePact: makePact, __pactResolve: pactResolve, __pactEvent: pactEvent, __pactBreak: pactBreak,
    __addCharm: addCharm, __upgradeCharm: upgradeCharm, __plyThread: plyThread, __newRun: newRun, __endRun: endRun,
    __recoverSachet: recoverSachet, __startFirstPatch: startFirstPatch, __resumeRun: resumeRun,
    __damageAll() { for (const b of W.bosses.slice()) if (b.alive) damageEnemy(b, 9999, { kind: 'knot' }); },
    __killPlayer() { Run.hearts = 0; P.dead = false; P.inv = 0; P.hurtLock = 0; Run.hearts = 1; hurtPlayer({ x: P.x + 1, y: P.y }); },
    __makeKnot: makeKnot, __activatePact: activatePact,
  });
  window.NM = NM;
}

// Artifact 预览环境的热更新钩子：有就用，没有就直接启动
(function () {
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ v: 1 })); } catch (e) { /* 忽略 */ }
  if (hot && typeof hot.ready === 'function') { try { hot.ready(() => boot()); } catch (e) { boot(); } setTimeout(boot, 1500); }
  else boot();
})();

})();</script>
