<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1020">
<title>补夜 NIGHTMEND</title>
<style>/* 补夜：界面样式。整体是深靛蓝的夜里一块块缝起来的布标签：虚线是针脚，宋体是绣出来的字 */
:root {
  --night: #0b0f1d;      /* 夜色底 */
  --panel: rgba(18, 24, 49, 0.95);
  --panel-2: #151c38;
  --moon: #f3ecd9;       /* 月白：玩家与正文 */
  --moon-dim: #a9a395;
  --ink: #080b15;
  --gold: #ffcc4d;       /* 金：纽扣、稀有、强调 */
  --gold-dark: #b98428;
  --jade: #5fd39a;
  --crimson: #e5463e;
  --lilac: #c3a6ff;
  --stitch: rgba(243, 236, 217, 0.38);
  --f-serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --f-sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --al: 0px; --at: 0px; --as: 360px; --ar: 0px; --ab: 0px;
  color-scheme: dark;
}
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--moon);
  font-family: var(--f-sans); -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: none;
}
#screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#safe-probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* ---------- 界面层 ---------- */
#ui { position: fixed; inset: 0; display: none; z-index: 10; pointer-events: none; }
#ui.on { display: block; }
#ui.dim { background: rgba(5, 7, 13, 0.62); pointer-events: auto; }
.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; pointer-events: none; }
.screen > * { pointer-events: auto; }

.panel { background: var(--panel); border: 2px dashed var(--stitch); outline: 4px solid var(--panel); box-shadow: 0 0 0 6px var(--ink), 0 18px 40px rgba(0, 0, 0, 0.55);
  border-radius: 3px; padding: 18px 20px; width: 100%; max-width: 560px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
.panel.wide { max-width: 880px; }
.panel.narrow { max-width: 360px; }
.panel.scroll { max-height: 100%; overflow-y: auto; }
h2 { font-family: var(--f-serif); font-size: 24px; font-weight: 700; letter-spacing: 0.12em; margin: 0; text-wrap: balance; }
h2 small { display: block; font-family: var(--f-sans); font-size: 13px; letter-spacing: 0.02em; color: var(--moon-dim); font-weight: 400; margin-top: 4px; }
h3 { font-family: var(--f-serif); font-size: 15px; letter-spacing: 0.1em; margin: 6px 0 0; color: var(--moon-dim); font-weight: 700; }
h3 small { font-family: var(--f-sans); font-weight: 400; letter-spacing: 0; margin-left: 8px; }
.lead { font-size: 15px; line-height: 1.7; margin: 0; color: var(--moon); }
.note { font-size: 13px; line-height: 1.6; margin: 0; color: var(--moon-dim); }
.hintline { min-height: 2.6em; font-size: 13px; line-height: 1.5; color: var(--moon-dim); margin: 2px 0 0; }
.gold-line { color: var(--gold); margin: 0; font-size: 14px; }

/* 按钮：月白布标签，内侧一圈针脚 */
.btn { position: relative; appearance: none; border: 0; border-radius: 3px; background: var(--moon); color: var(--ink); font: 600 15px/1.2 var(--f-sans);
  padding: 11px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; letter-spacing: 0.05em; min-height: 44px; justify-content: center; }
.btn::after { content: ""; position: absolute; inset: 3px; border: 1px dashed rgba(8, 11, 21, 0.28); border-radius: 2px; pointer-events: none; }
.btn small { font-weight: 400; font-size: 11px; opacity: 0.7; letter-spacing: 0; }
.btn.primary { background: var(--gold); }
.btn.ghost { background: transparent; color: var(--moon); border: 1px dashed var(--stitch); }
.btn.ghost::after { display: none; }
.btn.danger { background: var(--crimson); color: var(--moon); }
.btn.danger.ghost { background: transparent; color: #ff8f7f; }
.btn.small { min-height: 36px; padding: 8px 12px; font-size: 13px; }
.btn.disabled, .chip.disabled, .card.disabled { opacity: 0.42; cursor: not-allowed; }
.btn:hover:not(.disabled), .btn:focus-visible { filter: brightness(1.06); }
[data-nav]:focus { outline: 2px dashed var(--gold); outline-offset: 3px; }
[data-nav]:focus:not(:focus-visible) { outline: none; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; }
.row2 > * { flex: 1 1 140px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.menu-col { display: flex; flex-direction: column; gap: 10px; width: 100%; }

/* 选项片 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; min-height: 40px; border: 1px dashed var(--stitch); border-radius: 3px;
  background: rgba(243, 236, 217, 0.03); color: var(--moon); font: 14px var(--f-sans); cursor: pointer; }
.chip b { font-weight: 600; }
.chip small { color: var(--gold); font-size: 12px; }
.chip.on { border: 1px solid var(--gold); background: rgba(255, 204, 77, 0.13); }
.chip.night { padding: 8px 14px; }
.sel-row { display: flex; flex-direction: column; gap: 6px; }

/* 徽章：带针脚边的圆章 */
.badge { --bc: #6e7690; --br: #a9a395; flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box;
  background: color-mix(in srgb, var(--bc) 62%, #0b0f1d); border: 2px dashed var(--br); color: var(--moon); font: 700 15px/1 var(--f-serif); text-shadow: 0 1px 0 #080b15; }
.badge.big { width: 46px; height: 46px; font-size: 22px; border-width: 3px; }
.badge.gold { box-shadow: 0 0 0 2px rgba(255, 204, 77, 0.35), 0 0 12px rgba(255, 204, 77, 0.35); }
.badge.locked { opacity: 0.5; }
img.spr { image-rendering: pixelated; width: 30px; height: auto; flex: none; }

/* 卡片 */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.card { appearance: none; text-align: left; background: var(--panel-2); border: 2px dashed rgba(243, 236, 217, 0.35); border-radius: 3px; padding: 12px; color: var(--moon);
  display: flex; flex-direction: column; gap: 6px; cursor: pointer; font-family: var(--f-sans); transition: transform 0.12s ease, border-color 0.12s ease; min-width: 0; }
.card:hover:not(.disabled), .card:focus { transform: translateY(-2px); border-color: var(--gold); }
.card.r2 { border-color: rgba(95, 211, 154, 0.65); }
.card.r3 { border-color: rgba(255, 204, 77, 0.75); box-shadow: inset 0 0 18px rgba(255, 204, 77, 0.08); }
.card.up { border-color: var(--gold); }
.card.ply { border-color: rgba(195, 166, 255, 0.7); }
.card-top { display: flex; align-items: center; gap: 10px; }
.card .rar { font-size: 12px; color: var(--moon-dim); letter-spacing: 0.08em; }
.card h4 { font-family: var(--f-serif); font-size: 18px; margin: 2px 0 0; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
.card p { margin: 0; font-size: 13px; line-height: 1.55; color: #d6cfbd; }
.card .new { font-style: normal; font-family: var(--f-sans); font-size: 11px; background: var(--crimson); color: var(--moon); padding: 1px 5px; border-radius: 2px; letter-spacing: 0; }
.combo-hint { font-size: 12px; color: var(--gold); line-height: 1.4; }
.price { margin-top: auto; padding-top: 4px; font-weight: 700; color: var(--gold); }
.card.sold { opacity: 0.35; }

/* 蛛约 */
.pact .spider-head { display: flex; align-items: center; gap: 14px; }
.pact img.spider { image-rendering: pixelated; width: 56px; height: auto; animation: dangle 2.4s ease-in-out infinite; }
@keyframes dangle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
.outcome { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.outcome > div { padding: 10px 12px; border-radius: 3px; font-size: 14px; line-height: 1.5; }
.outcome .win { background: rgba(255, 204, 77, 0.12); border: 1px dashed var(--gold); color: #ffe7a6; }
.outcome .lose { background: rgba(229, 70, 62, 0.12); border: 1px dashed var(--crimson); color: #ffb3a8; }

/* 奇遇 */
.opts { display: flex; flex-direction: column; gap: 10px; }
.btn.opt { align-items: flex-start; text-align: left; }

/* 列表行（构筑、图鉴、绣坊） */
.item-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; border-bottom: 1px dashed rgba(243, 236, 217, 0.12); text-align: left; background: none; color: var(--moon); font-family: var(--f-sans); border-left: 0; border-right: 0; border-top: 0; min-width: 0; }
.item-row b { font-family: var(--f-serif); font-size: 15px; letter-spacing: 0.05em; }
.item-row p { margin: 3px 0 0; font-size: 13px; line-height: 1.55; color: #cfc8b7; }
.item-row.dimrow { opacity: 0.55; }
.buyrow { cursor: pointer; border-radius: 3px; }
.buyrow:hover:not(.disabled), .buyrow:focus { background: rgba(255, 204, 77, 0.07); }
.buyrow.owned { opacity: 0.55; }
.buyrow .cost { color: var(--gold); font-weight: 700; white-space: nowrap; font-size: 13px; }
.codex-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { appearance: none; background: transparent; border: 1px dashed var(--stitch); color: var(--moon-dim); padding: 6px 12px; border-radius: 3px; font: 14px var(--f-sans); cursor: pointer; min-height: 36px; }
.tab.on { color: var(--ink); background: var(--moon); border-style: solid; }
.stats-line { font-size: 12px; color: var(--moon-dim); line-height: 1.6; font-variant-numeric: tabular-nums; }

/* 标题与地图：菜单避开场地 */
.screen.title, .screen.map { align-items: flex-start; }
body.side-ui .screen.title, body.side-ui .screen.map { justify-content: flex-start; align-items: center; padding-left: calc(var(--al) + var(--as) + 28px); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.below-ui .screen.title, body.below-ui .screen.map { padding-top: calc(var(--at) + var(--as) + 22px); }
body.over-ui .screen.title, body.over-ui .screen.map { align-items: flex-end; }
.title-wrap { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
.title-space { display: none; }
.title-wrap .foot { font-size: 12px; color: var(--moon-dim); text-align: center; margin: 4px 0 0; }
.map-panel { background: var(--panel); border: 2px dashed var(--stitch); box-shadow: 0 0 0 4px var(--ink); border-radius: 3px; padding: 14px; width: 100%; max-width: 360px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.map-head { display: flex; flex-direction: column; gap: 2px; }
.map-head b { font-family: var(--f-serif); font-size: 20px; letter-spacing: 0.12em; }
.map-head span { font-size: 12px; color: var(--moon-dim); }
.pact-pending { margin: 0; font-size: 13px; color: var(--gold); }
.cell-list { display: flex; flex-direction: column; gap: 8px; }
.btn.cell-btn { flex-direction: row; justify-content: flex-start; text-align: left; gap: 12px; align-items: center; }
.cell-glyph { font: 700 24px/1 var(--f-serif); width: 36px; height: 36px; display: grid; place-items: center; background: var(--ink); color: var(--moon); border-radius: 50%; flex: none; }
.cell-btn b { display: block; font-size: 15px; }
.cell-btn em { font-style: normal; color: var(--crimson); margin-left: 6px; font-size: 12px; }
.cell-btn em.mod { color: #8a5a00; background: rgba(255, 204, 77, 0.45); padding: 1px 5px; border-radius: 2px; }
.cell-btn small { display: block; font-weight: 400; font-size: 12px; opacity: 0.72; line-height: 1.4; margin-top: 2px; }
body.below-ui .map-panel, body.below-ui .title-wrap { max-width: min(560px, 100%); margin: 0 auto; }
body.below-ui .cell-list { flex-direction: row; }
body.below-ui .cell-list > * { flex: 1 1 0; min-width: 0; }

/* 设置 */
.slider { display: grid; grid-template-columns: 5em 1fr; align-items: center; gap: 10px; font-size: 14px; }
.slider input { width: 100%; accent-color: var(--gold); }
.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.help-grid div { display: flex; flex-direction: column; gap: 4px; padding: 10px; border: 1px dashed rgba(243, 236, 217, 0.18); border-radius: 3px; }
.help-grid span { font-size: 13px; line-height: 1.55; color: #cfc8b7; }

/* 结算 */
.results.win h2 { color: var(--gold); }
.results.lose h2 { color: #ff8f7f; }
.quilt-img { display: flex; justify-content: center; }
.quilt-img img { image-rendering: pixelated; width: min(100%, 230px); height: auto; box-shadow: 0 0 0 3px var(--ink), 0 10px 30px rgba(0, 0, 0, 0.5); }
.res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.res-grid div { display: flex; flex-direction: column; gap: 2px; padding: 8px 4px; border: 1px dashed rgba(243, 236, 217, 0.18); border-radius: 3px; }
.res-grid b { font-size: 20px; font-variant-numeric: tabular-nums; }
.res-grid span { font-size: 12px; color: var(--moon-dim); }
.silk-line { margin: 0; font-size: 14px; }
.silk-line b { color: var(--gold); font-size: 16px; }
.finds { display: flex; flex-wrap: wrap; gap: 6px; }
.find { font-size: 12px; padding: 3px 8px; border: 1px dashed rgba(255, 204, 77, 0.5); color: #ffe7a6; border-radius: 2px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.gallery figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.gallery img { width: 100%; image-rendering: pixelated; }
.gallery figcaption { font-size: 12px; color: var(--moon-dim); text-align: center; }
.gallery .lose img { filter: saturate(0.7) brightness(0.85); }

/* 战斗中的文字条 */
#hud { position: fixed; z-index: 5; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#hud.side { align-items: flex-start; }
#hud.side .hud-hint { text-align: left; max-width: 100%; }
.hud-pact { font-size: clamp(12px, calc(var(--as) * 0.026), 17px); padding: 3px 10px; border: 1px dashed rgba(229, 70, 62, 0.7); background: rgba(8, 11, 21, 0.78); color: #ffd0c8; border-radius: 2px; font-variant-numeric: tabular-nums; }
.hud-pact.good { border-color: var(--gold); color: #ffe7a6; }
.hud-pact.bad { border-color: #6e7690; color: #a9a395; text-decoration: line-through; }
.hud-hint { font-size: clamp(13px, calc(var(--as) * 0.03), 19px); line-height: 1.5; padding: 6px 12px; background: rgba(8, 11, 21, 0.82); border: 1px dashed var(--stitch); border-radius: 3px; max-width: 92%; text-align: center; color: var(--moon); }

/* 提示 */
#toasts { position: fixed; z-index: 30; left: 50%; top: max(10px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { background: rgba(8, 11, 21, 0.92); border: 1px dashed var(--stitch); color: var(--moon); font-size: 13px; line-height: 1.5; padding: 7px 12px; border-radius: 3px; animation: tin 0.18s ease-out; text-align: center; }
.toast.gold { border-color: var(--gold); color: #ffe7a6; }
.toast.red { border-color: var(--crimson); color: #ffb3a8; }
.toast.out { opacity: 0; transition: opacity 0.5s; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (max-width: 520px) {
  .panel { padding: 14px; }
  h2 { font-size: 21px; }
  .cards { grid-template-columns: 1fr; }
  .card { padding: 10px; }
  .res-grid { grid-template-columns: repeat(2, 1fr); }
  .outcome { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="screen" aria-label="补夜游戏画面"></canvas>
<div id="hud"></div>
<div id="ui"></div>
<script>(function(){
'use strict';
// ==== 01_util.js ====
// 通用工具：数学、缓动、可复现随机数、几何计算、事件总线

const TAU = Math.PI * 2;
const DT = 1 / 60;

// 把数值限制在 [a, b]
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
// 线性插值
function lerp(a, b, t) { return a + (b - a) * t; }
// 让 v 朝 target 移动不超过 d
function approach(v, target, d) { return v < target ? Math.min(v + d, target) : Math.max(v - d, target); }
// 两点距离平方
function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }
// 两点距离
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }
// 角度差（-π..π）
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
// 角度插值
function angLerp(a, b, t) { return a + angDiff(a, b) * t; }
// 平滑阶梯
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

// 缓动函数集合
const Ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inCubic: (t) => t * t * t,
  outQuad: (t) => 1 - (1 - t) * (1 - t),
  inQuad: (t) => t * t,
  outBack: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: (t) => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
};

// 字符串哈希成 32 位种子
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// 可复现随机数（sfc32），用于地图、奖励等需要同种子同结果的地方
function makeRng(seed) {
  let a = 0x9e3779b9 ^ (seed >>> 0), b = 0x243f6a88, c = 0xb7e15162, d = (Math.imul(seed >>> 0, 31) ^ 0x5bd1e995) >>> 0;
  function next() {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  }
  for (let i = 0; i < 15; i++) next();
  return {
    seed,
    next,
    range(lo, hi) { return lo + (hi - lo) * next(); },
    int(lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },
    pick(arr) { return arr[Math.floor(next() * arr.length)]; },
    chance(p) { return next() < p; },
    sign() { return next() < 0.5 ? -1 : 1; },
    // 按权重挑选：items 为数组，wf 返回权重
    weighted(items, wf) {
      let total = 0;
      for (const it of items) total += Math.max(0, wf(it));
      if (total <= 0) return items[Math.floor(next() * items.length)];
      let r = next() * total;
      for (const it of items) { r -= Math.max(0, wf(it)); if (r <= 0) return it; }
      return items[items.length - 1];
    },
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      return arr;
    },
  };
}

// 表现层随机数（不要求可复现）
const FX_RNG = makeRng((Date.now() ^ 0xa5a5a5) >>> 0);
function frand(lo = 0, hi = 1) { return lo + (hi - lo) * FX_RNG.next(); }

// ---------- 几何 ----------

// 线段 ab 与 cd 求交；相交返回 {t, u, x, y}，否则 null
function segIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  const rX = bx - ax, rY = by - ay, sX = dx - cx, sY = dy - cy;
  const den = rX * sY - rY * sX;
  if (den > -1e-9 && den < 1e-9) return null;
  const qX = cx - ax, qY = cy - ay;
  const t = (qX * sY - qY * sX) / den;
  if (t < 0 || t > 1) return null;
  const u = (qX * rY - qY * rX) / den;
  if (u < 0 || u > 1) return null;
  return { t, u, x: ax + t * rX, y: ay + t * rY };
}

// 点是否在多边形内（pts 为扁平数组 [x0,y0,x1,y1,...]）
function pointInPoly(x, y, pts) {
  let inside = false;
  const n = pts.length;
  for (let i = 0, j = n - 2; i < n; j = i, i += 2) {
    const yi = pts[i + 1], yj = pts[j + 1];
    if ((yi > y) !== (yj > y)) {
      const xi = pts[i], xj = pts[j];
      if (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
  }
  return inside;
}

// 多边形有向面积
function polyArea(pts) {
  let s = 0;
  const n = pts.length;
  for (let i = 0, j = n - 2; i < n; j = i, i += 2) s += pts[j] * pts[i + 1] - pts[i] * pts[j + 1];
  return s / 2;
}

// 多边形周长
function polyPerimeter(pts) {
  let s = 0;
  const n = pts.length;
  for (let i = 0, j = n - 2; i < n; j = i, i += 2) s += Math.hypot(pts[i] - pts[j], pts[i + 1] - pts[j + 1]);
  return s;
}

// 多边形质心；面积过小时退化为顶点平均
function polyCentroid(pts) {
  const n = pts.length;
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = n - 2; i < n; j = i, i += 2) {
    const f = pts[j] * pts[i + 1] - pts[i] * pts[j + 1];
    a += f; cx += (pts[j] + pts[i]) * f; cy += (pts[j + 1] + pts[i + 1]) * f;
  }
  if (Math.abs(a) < 1e-6) {
    let sx = 0, sy = 0;
    for (let i = 0; i < n; i += 2) { sx += pts[i]; sy += pts[i + 1]; }
    return [sx / (n / 2), sy / (n / 2)];
  }
  return [cx / (3 * a), cy / (3 * a)];
}

// 圆度：正圆为 1，越扁越接近 0
function circularity(area, perim) { return perim > 0 ? clamp((4 * Math.PI * Math.abs(area)) / (perim * perim), 0, 1) : 0; }

// 点到线段的距离平方
function distToSeg2(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const l2 = vx * vx + vy * vy;
  let t = l2 > 0 ? ((px - ax) * vx + (py - ay) * vy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const dx = ax + vx * t - px, dy = ay + vy * t - py;
  return dx * dx + dy * dy;
}

}

// 当前绘制目标与状态（模块级变量，便于热路径直接访问）

// 4×4 Bayer 抖动阈值
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);

// 设置绘制原点（之后的坐标都相对它）
function setOrigin(x, y) { OX = Math.round(x); OY = Math.round(y); }
// 设置裁剪矩形（缓冲坐标）
function setClip(x0, y0, x1, y1) { CX0 = Math.max(0, x0 | 0); CY0 = Math.max(0, y0 | 0); CX1 = Math.min(BW, x1 | 0); CY1 = Math.min(BH, y1 | 0); }
function resetClip() { CX0 = 0; CY0 = 0; CX1 = BW; CY1 = BH; }
// 把绘制目标切到另一块缓冲（例如场地底布），用完 resetTarget
function setTarget(buf, w, h) { B = buf; BW = w; BH = h; OX = 0; OY = 0; resetClip(); }
function resetTarget() { B = SB; BW = SBW; BH = SBH; OX = 0; OY = 0; resetClip(); }

// 画一个像素
function pset(x, y, c) {
  x = Math.floor(x + OX); y = Math.floor(y + OY);
  if (x < CX0 || y < CY0 || x >= CX1 || y >= CY1) return;
  B[y * BW + x] = c;
}
// 按透明度混合一个像素
function pblend(x, y, c, a) {
  x = Math.floor(x + OX); y = Math.floor(y + OY);
  if (x < CX0 || y < CY0 || x >= CX1 || y >= CY1) return;
  const i = y * BW + x;
  B[i] = mixC(B[i], c, a);
}
// 有序抖动画像素：level 0..1 表示覆盖率
function pdither(x, y, c, level) {
  x = Math.floor(x + OX); y = Math.floor(y + OY);
  if (x < CX0 || y < CY0 || x >= CX1 || y >= CY1) return;
  if (level < BAYER[((y & 3) << 2) | (x & 3)]) return;
  B[y * BW + x] = c;
}
// 读像素（缓冲坐标外返回 0）
function pget(x, y) {
  x = Math.floor(x + OX); y = Math.floor(y + OY);
  if (x < 0 || y < 0 || x >= BW || y >= BH) return 0;
  return B[y * BW + x];
}

// 填充矩形
function rectFill(x, y, w, h, c) {
  let x0 = Math.floor(x + OX), y0 = Math.floor(y + OY), x1 = x0 + Math.round(w), y1 = y0 + Math.round(h);
  if (x0 < CX0) x0 = CX0; if (y0 < CY0) y0 = CY0; if (x1 > CX1) x1 = CX1; if (y1 > CY1) y1 = CY1;
  for (let yy = y0; yy < y1; yy++) B.fill(c, yy * BW + x0, yy * BW + x1);
}
// 抖动填充矩形
function rectDither(x, y, w, h, c, level) {
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) pdither(x + xx, y + yy, c, level);
}
// 混合填充矩形
function rectBlend(x, y, w, h, c, a) {
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) pblend(x + xx, y + yy, c, a);
}
// 矩形描边
function rectStroke(x, y, w, h, c) {
  for (let i = 0; i < w; i++) { pset(x + i, y, c); pset(x + i, y + h - 1, c); }
  for (let i = 1; i < h - 1; i++) { pset(x, y + i, c); pset(x + w - 1, y + i, c); }
}

// Bresenham 直线；dash 为 [实, 虚] 长度，phase 为起始偏移
function line(x0, y0, x1, y1, c, dash, phase) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, k = phase || 0;
  const on = dash ? dash[0] : 0, per = dash ? dash[0] + dash[1] : 0;
  for (let guard = 0; guard < 2000; guard++) {
    if (!dash || (k % per) < on) pset(x0, y0, c);
    k++;
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// 粗线：用多条平移直线近似
function thickLine(x0, y0, x1, y1, c, w) {
  const r = (w - 1) / 2;
  for (let oy = -Math.floor(r); oy <= Math.ceil(r); oy++) for (let ox = -Math.floor(r); ox <= Math.ceil(r); ox++) line(x0 + ox, y0 + oy, x1 + ox, y1 + oy, c);
}

// 圆描边（中点画圆）
function circleStroke(cx, cy, r, c, dash) {
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  if (r <= 0) { pset(cx, cy, c); return; }
  if (dash) {
    // 虚线圆：按角度采样，保证虚线均匀
    const n = Math.max(8, Math.round(TAU * r));
    for (let i = 0; i < n; i++) {
      if ((i % (dash[0] + dash[1])) >= dash[0]) continue;
      const a = (i / n) * TAU;
      pset(cx + Math.round(Math.cos(a) * r), cy + Math.round(Math.sin(a) * r), c);
    }
    return;
  }
  let x = r, y = 0, err = 1 - r;
  while (x >= y) {
    pset(cx + x, cy + y, c); pset(cx + y, cy + x, c); pset(cx - y, cy + x, c); pset(cx - x, cy + y, c);
    pset(cx - x, cy - y, c); pset(cx - y, cy - x, c); pset(cx + y, cy - x, c); pset(cx + x, cy - y, c);
    y++;
    if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }
}
// 实心圆
function circleFill(cx, cy, r, c) {
  cx = Math.round(cx); cy = Math.round(cy);
  const rr = r * r + r * 0.8;
  const ri = Math.ceil(r);
  for (let y = -ri; y <= ri; y++) {
    const w = Math.floor(Math.sqrt(Math.max(0, rr - y * y)));
    let x0 = cx - w + OX, x1 = cx + w + 1 + OX; const yy = cy + y + OY;
    if (yy < CY0 || yy >= CY1) continue;
    if (x0 < CX0) x0 = CX0; if (x1 > CX1) x1 = CX1;
    if (x1 > x0) B.fill(c, yy * BW + x0, yy * BW + x1);
  }
}
// 抖动实心圆
function circleDither(cx, cy, r, c, level) {
  cx = Math.round(cx); cy = Math.round(cy);
  const ri = Math.ceil(r), rr = r * r + r * 0.8;
  for (let y = -ri; y <= ri; y++) for (let x = -ri; x <= ri; x++) if (x * x + y * y <= rr) pdither(cx + x, cy + y, c, level);
}
// 混合实心圆
function circleBlend(cx, cy, r, c, a) {
  cx = Math.round(cx); cy = Math.round(cy);
  const ri = Math.ceil(r), rr = r * r + r * 0.8;
  for (let y = -ri; y <= ri; y++) for (let x = -ri; x <= ri; x++) if (x * x + y * y <= rr) pblend(cx + x, cy + y, c, a);
}

// 由字符画生成精灵：rows 每行一个字符串，map 把字符映射到打包颜色；'.' 与空格为透明
function makeSprite(rows, map) {
  const h = rows.length, w = Math.max(...rows.map((r) => r.length));
  const px = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch && ch !== '.' && ch !== ' ') {
      if (map[ch] === undefined) throw new Error('sprite char ' + ch);
      px[y * w + x] = map[ch];
    }
  }
  return finishSprite(w, h, px);
}
// 计算描边偏移，返回精灵对象
function finishSprite(w, h, px) {
  const out = [];
  const solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && px[y * w + x] !== 0;
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    if (solid(x, y)) continue;
    if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) out.push(x, y);
  }
  // 预先压缩出不透明像素列表，加快绘制
  const opq = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (px[y * w + x]) opq.push(x, y, px[y * w + x]);
  return { w, h, px, out, opq, x2: null };
}
// 精灵放大两倍（精英用），结果缓存
function sprite2x(s) {
  if (s.x2) return s.x2;
  const w = s.w * 2, h = s.h * 2, px = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px[y * w + x] = s.px[(y >> 1) * s.w + (x >> 1)];
  s.x2 = finishSprite(w, h, px);
  return s.x2;
}
// 精灵水平翻转版本，结果缓存
function spriteFlip(s) {
  if (s.fl) return s.fl;
  const px = new Uint32Array(s.w * s.h);
  for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) px[y * s.w + x] = s.px[y * s.w + (s.w - 1 - x)];
  s.fl = finishSprite(s.w, s.h, px);
  s.fl.fl = s;
  return s.fl;
}

// 绘制精灵（以中心对齐）。o: {flip, flash, tint, tintAmt, outline, dither, noOutline}
function blit(s, cx, cy, o) {
  if (o && o.flip) s = spriteFlip(s);
  const x = Math.round(cx - s.w / 2), y = Math.round(cy - s.h / 2);
  const outline = o && o.outline !== undefined ? o.outline : PAL.ink;
  const dither = o && o.dither !== undefined ? o.dither : 1;
  if (!(o && o.noOutline)) {
    const out = s.out;
    for (let i = 0; i < out.length; i += 2) dither >= 1 ? pset(x + out[i], y + out[i + 1], outline) : pdither(x + out[i], y + out[i + 1], outline, dither);
  }
  const opq = s.opq;
  const flash = o && o.flash, tint = o && o.tint, ta = o && o.tintAmt;
  for (let i = 0; i < opq.length; i += 3) {
    let c = opq[i + 2];
    if (flash) c = flash === true ? PAL.white : flash;
    else if (tint) c = mixC(c, tint, ta);
    dither >= 1 ? pset(x + opq[i], y + opq[i + 1], c) : pdither(x + opq[i], y + opq[i + 1], c, dither);
  }
}
// 只画精灵剪影（单色）
function blitSil(s, cx, cy, c, flip) {
  if (flip) s = spriteFlip(s);
  const x = Math.round(cx - s.w / 2), y = Math.round(cy - s.h / 2);
  const opq = s.opq;
  for (let i = 0; i < opq.length; i += 3) pset(x + opq[i], y + opq[i + 1], c);
}

  'W': '101101111111101', 'Y': '101101010010010', 'J': '001001001101010', 'Q': '010101101110011', 'Z': '111001010100111',
  '*': '000101010101000', '<': '001010100010001', '>': '100010001010100', '=': '000111000111000',
};
// 文字宽度（像素）
function textW(str, sc = 1) { return str.length * 4 * sc - sc; }
// 画 3×5 文字；outline 为 0 时不描边
function text(str, x, y, c, outline = PAL.ink, sc = 1) {
  str = String(str).toUpperCase();
  const draw = (col, ox, oy) => {
    for (let i = 0; i < str.length; i++) {
      const g = FONT3[str[i]] || FONT3['?'];
      for (let k = 0; k < 15; k++) if (g[k] === '1') {
        const gx = x + i * 4 * sc + (k % 3) * sc + ox, gy = y + Math.floor(k / 3) * sc + oy;
        if (sc === 1) pset(gx, gy, col); else rectFill(gx, gy, sc, sc, col);
      }
    }
  };
  if (outline) for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) if (ox || oy) draw(outline, ox, oy);
  draw(c, 0, 0);
}
// 居中画文字
function textC(str, cx, y, c, outline, sc = 1) { text(str, Math.round(cx - textW(String(str), sc) / 2), y, c, outline, sc); }

// ---------- 系统字体转像素字（中文标题、横幅） ----------
const FONT_SANS = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif';
const FONT_SERIF = '"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const glyphCache = new Map();
// 把字符串渲染成二值掩码，结果缓存
function glyphMask(str, size, serif = false, bold = true, thick = 0) {
  const key = `${str}|${size}|${serif ? 1 : 0}${bold ? 1 : 0}|${thick}`;
  if (glyphCache.has(key)) return glyphCache.get(key);
  const c = document.createElement('canvas');
  const g = c.getContext('2d', { willReadFrequently: true });
  const font = `${bold ? '700 ' : ''}${size}px ${serif ? FONT_SERIF : FONT_SANS}`;
  g.font = font;
  const w = Math.ceil(g.measureText(str).width) + 4, h = Math.ceil(size * 1.4) + 4;
  c.width = w; c.height = h;
  g.font = font; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText(str, 2, h / 2);
  const d = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  const raw = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) if (d[i * 4 + 3] > (thick ? 70 : 120)) raw[i] = 1;
  // 加粗：把笔画向右、向下各扩一像素，小字号的细笔画不再断成点
  if (thick) {
    const src = raw.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!src[y * w + x] && ((x > 0 && src[y * w + x - 1]) || (thick > 1 && y > 0 && src[(y - 1) * w + x]))) raw[y * w + x] = 1;
  }
  for (let i = 0; i < w * h; i++) if (raw[i]) { const x = i % w, y = (i / w) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  let m;
  if (x1 < 0) m = { w: 0, h: 0, mask: new Uint8Array(0), out: [] };
  else {
    const mw = x1 - x0 + 1, mh = y1 - y0 + 1, mask = new Uint8Array(mw * mh);
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) mask[y * mw + x] = raw[(y + y0) * w + x + x0];
    const out = [];
    const solid = (x, y) => x >= 0 && y >= 0 && x < mw && y < mh && mask[y * mw + x];
    for (let y = -1; y <= mh; y++) for (let x = -1; x <= mw; x++) if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1) || solid(x - 1, y - 1) || solid(x + 1, y + 1) || solid(x - 1, y + 1) || solid(x + 1, y - 1))) out.push(x, y);
    m = { w: mw, h: mh, mask, out };
  }
  glyphCache.set(key, m);
  return m;
}
// 画掩码文字（左上对齐）；shade 为下半部分的暗色，制造丝线光泽
function drawGlyph(m, x, y, c, outline = PAL.ink, shade = 0, dither = 1) {
  x = Math.round(x); y = Math.round(y);
  if (outline) for (let i = 0; i < m.out.length; i += 2) dither >= 1 ? pset(x + m.out[i], y + m.out[i + 1], outline) : pdither(x + m.out[i], y + m.out[i + 1], outline, dither);
  for (let yy = 0; yy < m.h; yy++) for (let xx = 0; xx < m.w; xx++) if (m.mask[yy * m.w + xx]) {
    const col = shade && yy > m.h * 0.6 ? shade : c;
    dither >= 1 ? pset(x + xx, y + yy, col) : pdither(x + xx, y + yy, col, dither);
  }
}
// 居中画中文
function glyphC(str, size, cx, cy, c, outline, shade, serif, dither, thick) {
  const m = glyphMask(str, size, serif, true, thick || 0);
  drawGlyph(m, cx - m.w / 2, cy - m.h / 2, c, outline, shade, dither);
  return m;
}

// ---------- 画布与合成 ----------

// 生成单个针脚纹理块：每个游戏像素看起来像布上的一针十字绣
function makeStitchTile(ps) {
  const t = document.createElement('canvas');
  t.width = t.height = ps;
  const g = t.getContext('2d');
  if (ps < 3) return t;
  const id = g.createImageData(ps, ps), d = id.data;
  const half = (ps - 1) / 2, sw = Math.max(1, ps * 0.2);
  for (let y = 0; y < ps; y++) for (let x = 0; x < ps; x++) {
    let a = 0, v = 0; // v>0 提亮，v<0 压暗
    const dA = Math.abs(x + y - (ps - 1)); // "/" 上层丝
    const dB = Math.abs(x - y);            // "\" 下层丝
    if (dA < sw) { v = 1; a = 0.08 * (1 - dA / sw) + 0.03; }
    else if (dB < sw) { v = -1; a = 0.07; }
    // 四角针孔
    const cx = Math.min(x, ps - 1 - x), cy = Math.min(y, ps - 1 - y);
    if (cx + cy < Math.max(1, ps * 0.18)) { v = -1; a = 0.26; }
    // 格边
    if (x === ps - 1 || y === ps - 1) { v = -1; a = Math.max(a, 0.09); }
    if (Math.abs(x - half) + Math.abs(y - half) < 0.5 && v === 0) { v = 1; a = 0.03; }
    const i = (y * ps + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = v > 0 ? 255 : 0;
    d[i + 3] = Math.round(a * 255);
  }
  g.putImageData(id, 0, 0);
  return t;
}

// 按当前画布尺寸重建纹理层与暗角层
function rebuildOverlays() {
  const { cw, ch, ps } = Gfx;
  const tile = makeStitchTile(ps);
  const ov = document.createElement('canvas');
  ov.width = cw; ov.height = ch;
  const og = ov.getContext('2d');
  if (ps >= 3) { og.fillStyle = og.createPattern(tile, 'repeat'); og.fillRect(0, 0, cw, ch); }
  Gfx.overlay = ov;
  const vg = document.createElement('canvas');
  vg.width = cw; vg.height = ch;
  const vgc = vg.getContext('2d');
  const cx = (Gfx.ax + ARENA / 2) * ps, cy = (Gfx.ay + ARENA / 2) * ps;
  const r0 = ARENA * ps * 0.55, r1 = Math.max(cw, ch) * 0.85;
  const grad = vgc.createRadialGradient(cx, cy, r0, cx, cy, r1);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  vgc.fillStyle = grad; vgc.fillRect(0, 0, cw, ch);
  Gfx.vignette = vg;
}

// 按布局重建缓冲（ps：放大倍数；cw/ch：画布像素尺寸）
function gfxResize(cw, ch, ps) {
  Gfx.cw = cw; Gfx.ch = ch; Gfx.ps = ps;
  Gfx.canvas.width = cw; Gfx.canvas.height = ch;
  SBW = Math.ceil(cw / ps); SBH = Math.ceil(ch / ps);
  SB = new Uint32Array(SBW * SBH);
  Gfx.low.width = SBW; Gfx.low.height = SBH;
  Gfx.img = new ImageData(new Uint8ClampedArray(SB.buffer), SBW, SBH);
  Gfx.outer = new Uint32Array(SBW * SBH);
  resetTarget();
}

// 把缓冲送上屏幕：放大、叠纹理、闪光与暗角
function present(flashCss, flashA, dangerPulse) {
  const { ctx, ps, cw, ch } = Gfx;
  Gfx.lctx.putImageData(Gfx.img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(Gfx.low, 0, 0, SBW, SBH, 0, 0, SBW * ps, SBH * ps);
  if (Gfx.overlay) ctx.drawImage(Gfx.overlay, 0, 0);
  if (flashA > 0.004) { ctx.globalAlpha = Math.min(1, flashA); ctx.fillStyle = flashCss; ctx.fillRect(0, 0, cw, ch); ctx.globalAlpha = 1; }
  if (Gfx.vignette) ctx.drawImage(Gfx.vignette, 0, 0);
  if (dangerPulse > 0.004) {
    ctx.globalAlpha = Math.min(1, dangerPulse);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = '#ff6a8a';
    ctx.fillRect(0, 0, cw, ch);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

// 初始化画布
function gfxInit(canvas) {
  Gfx.canvas = canvas;
  Gfx.ctx = canvas.getContext('2d', { alpha: false });
  Gfx.low = document.createElement('canvas');
  Gfx.lctx = Gfx.low.getContext('2d');
}

// 把一块场地大小的底布拷进屏幕缓冲（sx, sy 为抖动偏移）
function blitArenaBG(bg, sx, sy) {
  const ax = Gfx.ax + sx, ay = Gfx.ay + sy;
  for (let y = 0; y < ARENA; y++) {
    const by = ay + y;
    if (by < 0 || by >= BH) continue;
    let x0 = ax, s0 = y * ARENA, len = ARENA;
    if (x0 < 0) { s0 -= x0; len += x0; x0 = 0; }
    if (x0 + len > BW) len = BW - x0;
    if (len > 0) B.set(bg.subarray(s0, s0 + len), by * BW + x0);
  }
}
