      }
    } else if (t.kind === 'circle') {
      circleStroke(t.x, t.y, t.r * (t.grow ? u : 1), c, [3, 2]);
      if (u > 0.5) circleDither(t.x, t.y, t.r * (t.grow ? u : 1), PAL.dangerDark, 0.18);
    } else if (t.kind === 'x') {
      for (const a of [t.a + Math.PI / 4, t.a - Math.PI / 4]) {
        line(t.x - Math.cos(a) * t.len, t.y - Math.sin(a) * t.len, t.x + Math.cos(a) * t.len, t.y + Math.sin(a) * t.len, c, [3, 3], ph);
      }
    }
  }
}

// ---------- 绘制 ----------
// 画针：针尖指向朝向，尾部是金色针眼；两像素粗、带深色描边，混战里也一眼能认出来
function drawNeedle(x, y, ang, len, col, o = {}) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const tx = x + dx * len * 0.55, ty = y + dy * len * 0.55;
  const ex = x - dx * len * 0.45, ey = y - dy * len * 0.45;
  const thick = o.thin ? 1 : 2;
  const steps = Math.max(2, Math.ceil(len * 2));
  const pts = [];
  for (let i = 0; i <= steps; i++) { const u = i / steps; pts.push(Math.round(ex + (tx - ex) * u), Math.round(ey + (ty - ey) * u), u); }
  if (!o.noOutline) for (let i = 0; i < pts.length; i += 3) { const w = thick === 2 && pts[i + 2] < 0.78 ? 2 : 1; rectFill(pts[i] - 1, pts[i + 1] - 1, w + 2, w + 2, PAL.ink); }
  for (let i = 0; i < pts.length; i += 3) { const u = pts[i + 2], w = thick === 2 && u < 0.78 ? 2 : 1; rectFill(pts[i], pts[i + 1], w, w, u > 0.86 ? PAL.white : col); }
  // 针眼
  pset(Math.round(ex + dx * 1.3), Math.round(ey + dy * 1.3), o.eye || PAL.gold);
  return { ex, ey };
}
function drawPlayer() {
  if (P.dead) return;
  const len = P.dashT > 0 ? 14 : 11;
  let px = P.x, py = P.y;
  if (P.tugT > 0) { P.tugT -= DT; px += P.tugX; py += P.tugY; }
  // 受伤后的无敌时间里闪烁
  const hurtBlink = P.hurtT > 0 && Math.floor(P.hurtT * 14) % 2 === 0;
  circleDither(px, py, 6, PAL.moonDeep, 0.2);
  circleStrokeDither(px, py, 7 + Math.sin(W.t * 4) * 0.6, PAL.moonDim, 0.25);
  if (hurtBlink) { line(px - Math.cos(P.face) * 4, py - Math.sin(P.face) * 4, px + Math.cos(P.face) * 5, py + Math.sin(P.face) * 5, PAL.crimsonLight); return; }
  const e = drawNeedle(px, py, P.face, len, PAL.moon);
  P.eyeX = e.ex; P.eyeY = e.ey;
  if (P.shield > 0) circleStroke(P.x, P.y, 6, PAL.copperLight, [2, 2]);
}

// 画线（running stitch）：s 为里程，保证针脚固定在布上
function drawThreadLine(th, hx, hy, cols, dim) {
  const pts = th.pts, n = pts.length;
  if (!n) return;
  const tailS = pts[0].s, headS = th.odo + (hx !== undefined ? Math.hypot(hx - pts[n - 1].x, hy - pts[n - 1].y) : 0);
  const L = Math.max(1, headS - tailS);
  for (let pass = 0; pass < 2; pass++) {
    const each = (ax, ay, as, bx, by, bs) => {
      const l = Math.hypot(bx - ax, by - ay), m = Math.max(1, Math.ceil(l));
      for (let j = 0; j < m; j++) {
        const u = j / m, s = as + (bs - as) * u;
        if (((s % 5) + 5) % 5 >= 3) continue;
        const x = ax + (bx - ax) * u, y = ay + (by - ay) * u;
        const along = (s - tailS) / L;
        const lv = (along < 0.25 ? 0.3 + 2.8 * along : 1) * (dim || 1);
        if (pass === 0) pdither(x + 1, y + 1, PAL.ink, lv);
        else pdither(x, y, cols[Math.floor(s / 5) % cols.length], lv);
      }
    };
    for (let i = 1; i < n; i++) each(pts[i - 1].x, pts[i - 1].y, pts[i - 1].s, pts[i].x, pts[i].y, pts[i].s);
    if (hx !== undefined) each(pts[n - 1].x, pts[n - 1].y, pts[n - 1].s, hx, hy, headS);
  }
}
function drawThreads() {
  const cols = (Run.threads || ['plain']).map((id) => PAL[THREADS[id].color]);
  if (has('mirrorNeedle') && MTH.pts.length) {
    drawThreadLine(MTH, ARENA - P.x, ARENA - P.y, [PAL.lilac], 0.75);
    drawNeedle(ARENA - P.x, ARENA - P.y, P.face + Math.PI, 8, PAL.lilacLight);
  }
  if (!P.dead) drawThreadLine(TH, P.x, P.y, cols);
}

// 敌人
function drawEnemy(e) {
  if (e.def.draw) { e.def.draw(e); return; }
  const spr = e.def.sprite(e);
  const s = e.elite ? sprite2x(spr) : spr;
  let x = e.x, y = e.y;
  // 影子
  const sw = Math.max(2, Math.round(s.w * 0.35));
  for (let i = -sw; i <= sw; i++) pdither(x + i, y + s.h / 2 + 1, PAL.shadow, 0.5);
  const o = { flip: e.face < 0 };
  if (e.emerge > 0) { o.dither = clamp(1 - e.emerge / 0.5, 0.1, 1); y += Math.round(e.emerge * 6); }
  if (e.flash > 0) o.flash = true;
  else if (e.freeze > 0) { o.tint = PAL.iceLight; o.tintAmt = 0.65; }
  else if (e.chill > 0) { o.tint = PAL.ice; o.tintAmt = 0.35; }
  else if (e.burn && e.burn.t > 0) { o.tint = PAL.fire; o.tintAmt = 0.18 + 0.12 * Math.sin(e.anim * 20); }
  else if (e.rot > 0) { o.tint = PAL.rot; o.tintAmt = 0.3; }
  if (e.squash > 0) x += e.squash > 0.07 ? 1 : -1;
  if (e.elite) {
    const r = s.w / 2 + 3;
    const n = Math.round(TAU * r);
    for (let i = 0; i < n; i++) { const a = (i / n) * TAU + e.anim; if ((i + Math.floor(e.anim * 8)) % 4 < 2) pset(x + Math.cos(a) * r, y + Math.sin(a) * r, e.elite.has('gilded') ? PAL.gold : PAL.goldDark); }
  }
  if (e.loose > 0) o.tint = PAL.lilacLight, o.tintAmt = 0.4;
  blit(s, x, y, o);
  drawStatusMarks(e, x, y, s);
}
// 状态小标记：串珠、红线、晕眩
function drawStatusMarks(e, x, y, s) {
  const top = y - s.h / 2 - 3;
  if (e.threaded > 0) { pset(x, top, PAL.moon); pset(x - 1, top + 1, PAL.moonDim); pset(x + 1, top + 1, PAL.moonDim); }
  if (e.link > 0) { pset(x - 2, top, PAL.crimson); pset(x + 2, top, PAL.crimson); }
  if (e.stun > 0 && !e.boss) { const a = e.anim * 10; pset(x + Math.cos(a) * 3, top + Math.sin(a), PAL.thunderLight); }
  if (e.warded > 0) { pset(x - 3, y, PAL.steelLight); pset(x + 3, y, PAL.steelLight); }
  if ((e.elite || e.def.bar) && e.hp < e.maxHp) {
    const w = Math.max(8, s.w), f = Math.max(0, Math.round((e.hp / e.maxHp) * w));
    rectFill(x - w / 2, top - 2, w, 1, PAL.ink);
    rectFill(x - w / 2, top - 2, f, 1, e.elite ? PAL.gold : PAL.moon);
  }
}
function drawEnemies() { for (const e of W.enemies) drawEnemy(e); }

// 敌弹：胭脂色，白芯，深色描边，混乱中也一眼可辨
function drawEProj() {
  for (const b of W.eproj) {
    const x = b.x, y = b.y;
    if (b.kind === 'pin') {
      const s = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / s, uy = b.vy / s;
      line(x - ux * 3 + 1, y - uy * 3 + 1, x + ux * 1 + 1, y + uy * 1 + 1, PAL.ink);
      line(x - ux * 3, y - uy * 3, x + ux, y + uy, PAL.danger);
      pset(x + ux * 1.5, y + uy * 1.5, PAL.white);
    } else {
      const big = b.r >= 2.4;
      circleFill(x, y, big ? 3 : 2, PAL.ink);
      circleFill(x, y, big ? 2 : 1, PAL.danger);
      pset(x, y, Math.floor(b.t * 12) % 2 ? PAL.white : PAL.dangerLight);
    }
  }
}
function drawPProj() {
  for (const b of W.pproj) {
    if (b.look === 'button') { blit(SPR.button, b.x, b.y); continue; }
    if (b.look === 'shard') { pset(b.x, b.y, PAL.iceLight); pset(b.x - b.vx * 0.01, b.y - b.vy * 0.01, PAL.ice); continue; }
    const s = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / s, uy = b.vy / s;
    line(b.x - ux * 3, b.y - uy * 3, b.x, b.y, b.color);
    pset(b.x, b.y, PAL.white);
  }
}
function drawPickups() {
  for (const p of W.pickups) {
    const blinkOut = p.life - p.t < 2.5 && Math.floor(p.t * 10) % 2 === 0;
    if (blinkOut) continue;
    const bob = Math.round(Math.sin(p.anim * 5) * 0.8);
    if (p.kind === 'btn') blit(SPR.button, p.x, p.y + bob);
    else if (p.kind === 'silk') blit(Math.floor(p.anim * 4) % 2 ? SPR.silk0 : SPR.silk1, p.x, p.y + bob, { noOutline: true });
    else if (p.kind === 'heart') blit(SPR.heart, p.x, p.y + bob);
    else if (p.kind === 'pattern') { blit(SPR.pattern, p.x, p.y + bob); if (Math.floor(p.anim * 3) % 2) pset(p.x + 3, p.y - 4 + bob, PAL.white); }
  }
}
// 破洞：深色不规则的洞，边缘有毛线头；快吐怪时会冒出两只眼睛
function drawHoles() {
  for (const h of W.holes) {
    if (h.mended) continue;
    const pulse = h.pulse > 0 ? 1 : 0;
    const R = h.r + pulse;
    for (let yy = -R - 2; yy <= R + 2; yy++) for (let xx = -R - 2; xx <= R + 2; xx++) {
      const a = Math.atan2(yy, xx), d = Math.hypot(xx, yy);
      const idx = ((a / TAU) * 12 + 12) % 12, i0 = Math.floor(idx), fr = idx - i0;
      const rr = R * (h.shape[i0] * (1 - fr) + h.shape[(i0 + 1) % 12] * fr) + Math.sin(h.t * 3 + a * 3) * 0.3;
      if (d <= rr - 1.2) pset(h.x + xx, h.y + yy, d < rr * 0.5 ? PAL.shadow : PAL.ink);
      else if (d <= rr) pset(h.x + xx, h.y + yy, PAL.violetDeep);
      else if (d <= rr + 1.4 && ((xx * 7 + yy * 13) & 7) === 0) pset(h.x + xx, h.y + yy, W.cloth ? W.cloth.pl : PAL.hudFaint);
    }
    if (h.eye && Math.floor(h.t * 5) % 7 !== 0) { pset(h.x - 2, h.y, PAL.danger); pset(h.x + 2, h.y, PAL.danger); }
    // 已缝的针：X 形
    h.marks.forEach((m, i) => {
      const a = m + (i * Math.PI) / h.max, l = h.r - 1;
      const c = threadColor(i);
      line(h.x - Math.cos(a) * l, h.y - Math.sin(a) * l, h.x + Math.cos(a) * l, h.y + Math.sin(a) * l, c);
      line(h.x - Math.cos(a + Math.PI / 2) * l, h.y - Math.sin(a + Math.PI / 2) * l, h.x + Math.cos(a + Math.PI / 2) * l, h.y + Math.sin(a + Math.PI / 2) * l, c);
    });
    // 剩余针数：小点
    for (let i = 0; i < h.st; i++) pset(h.x - (h.st - 1) + i * 2, h.y + h.r + 3, PAL.moonDim);
  }
}
function drawZones(layer) { for (const z of W.zones) { const d = ZONES[z.kind]; if (d && d.draw && (d.layer || 0) === layer) d.draw(z); } }
function drawAllies() { for (const a of W.allies) { const d = ALLIES[a.kind]; if (d && d.draw) d.draw(a); } }

// 程序化绘制大型形体：fn(dx,dy) 返回打包颜色或 0，自动描边，支持闪白与染色
const RS_W = 96;
const RS_BUF = new Uint32Array(RS_W * RS_W);
function rasterShape(cx, cy, hw, hh, fn, o = {}) {
  const w = hw * 2 + 1, h = hh * 2 + 1;
  if (w > RS_W || h > RS_W) return;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) RS_BUF[y * w + x] = fn(x - hw, y - hh) || 0;
  const at = (x, y) => (x >= 0 && y >= 0 && x < w && y < h ? RS_BUF[y * w + x] : 0);
  const ox = Math.round(cx) - hw, oy = Math.round(cy) - hh;
  const ol = o.outline === undefined ? PAL.ink : o.outline;
  if (ol) for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) if (!at(x, y) && (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1))) pset(ox + x, oy + y, ol);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let c = RS_BUF[y * w + x];
    if (!c) continue;
    if (o.flash) c = PAL.white; else if (o.tint) c = mixC(c, o.tint, o.tintAmt);
    if (o.dither !== undefined && o.dither < 1) pdither(ox + x, oy + y, c, o.dither); else pset(ox + x, oy + y, c);
  }
}
// 敌人当前的染色参数
function tintOf(e) {
  if (e.flash > 0) return { flash: true };
  if (e.freeze > 0) return { tint: PAL.iceLight, tintAmt: 0.55 };
  if (e.chill > 0) return { tint: PAL.ice, tintAmt: 0.3 };
  if (e.burn && e.burn.t > 0) return { tint: PAL.fire, tintAmt: 0.15 };
  if (e.rot > 0) return { tint: PAL.rot, tintAmt: 0.25 };
  return {};
}

// Boss 通用：入场、受控上限、换阶段
function bossInit(e, intro) {
  e.boss = true; e.heavy = true; e.intro = intro || 2.0; e.phase = 1; e.atk = null; e.atkT = 0; e.idle = 1.6; e.last = '';
  W.bosses.push(e);
}
// 选择下一个招式（不连续重复）
function bossPick(e, table) {
  const opts = table.filter((a) => a.id !== e.last && (!a.ok || a.ok(e)));
  const a = makeRng((Math.random() * 1e9) >>> 0).weighted(opts, (x) => x.w);
  e.last = a.id; e.atk = a.id; e.atkT = 0; e.st = 0;
  return a;
}
// Boss 被打倒（每个分身都会调用；全部倒下才算胜利）
function bossDown(e) {
  if (P.dead || W.endKind === 'dead') return; // 先倒下的一方输：Boss 随后被灼烧烧死也不算胜利
  const left = W.bosses.filter((b) => b.alive);

  slowmo(1.4, 0.25);
  flash('#ffffff', 0.6);
  shake(6); hitstop(12);
  for (let i = 0; i < 4; i++) setTimeout(() => { fluff(e.x + frand(-10, 10), e.y + frand(-10, 10), 16, PAL[e.def.color]); ring(e.x, e.y, 4, 40 + i * 10, 0.6, PAL.goldLight); }, i * 140);
  W.eproj.length = 0; W.tele.length = 0;
  for (const o of W.enemies) if (o.alive && !o.boss) killEnemy(o, { kind: 'unravel' });
  pactResolve();
  later(0.12, () => banner('天亮了', { size: 26, y: 78, c: PAL.goldLight, shade: PAL.gold, dur: 2.4, sub: e.def.name + '被补进了夜里', subC: PAL.moon }));
  SFX.victory();
  Music.stop();
  Save.data.stats.bossKills[Patch.boss] = (Save.data.stats.bossKills[Patch.boss] || 0) + 1;

  Run.result = finalizeRun(true);
}

}

    if (e.phase === 1 && e.hp < e.maxHp * 0.5) { e.phase = 2; banner('蛾后振翅', { size: 14, y: 40, c: PAL.lavenderLight, shade: PAL.violet }); SFX.bossIntro(); shake(3); }
    const p2 = e.phase === 2;
    // 悬停：在定点附近轻轻上下浮动
    const hover = () => { e.vx = (e.hx - e.x) * 3; e.vy = (e.hy + Math.sin(e.t * 2.4) * 2.5 - e.y) * 3; };

      if (e.st === 0) { e.st = 1; let nx, ny, k = 0; do { nx = frand(34, ARENA - 34); ny = frand(30, ARENA * 0.62); } while (dist2(nx, ny, e.x, e.y) < 50 * 50 && k++ < 10); e.hx = nx; e.hy = ny; }

// 点在三角形内时返回到最外侧边（BC）的相对距离 c，否则 null
function triW(px, py, ax, ay, bx, by, cx, cy) {
  const d = (by - cy) * (ax - cx) + (cx - bx) * (ay - cy);
  const a = ((by - cy) * (px - cx) + (cx - bx) * (py - cy)) / d;
  const b = ((cy - ay) * (px - cx) + (ax - cx) * (py - cy)) / d;
  const c = 1 - a - b;
  if (a < 0 || b < 0 || c < 0) return null;
  return { c: a };
}

// ---------- 剪婆 ----------
// 画一片刃：从 (x,y) 沿 ang 方向，长 len
function drawBlade(x, y, ang, len, col, edge, wide = 2.2) {
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
  for (let i = 0; i <= len; i++) {
    const w = i < len * 0.7 ? wide : wide * (1 - (i - len * 0.7) / (len * 0.3));
    for (let k = -Math.ceil(w); k <= Math.ceil(w); k++) {
      if (Math.abs(k) > w) continue;
      const px = x + dx * i + nx * k, py = y + dy * i + ny * k;
      pset(px, py, k >= w - 1 ? edge : col);
    }
  }
}

function drawShearsBody(e, angA, angB, oneBlade) {

  const edge = t.flash ? PAL.white : PAL.steel;
  const L = oneBlade ? BLADE_L : SHEARS_L;

  for (let i = -10; i <= 10; i++) pdither(e.x + i, e.y + 14, PAL.shadow, 0.4);

  for (const a of angs) {

    else { e.boss = true; e.heavy = true; e.intro = 0; e.phase = 1; e.idle = 0.6 + e.gen * 0.4 + frand(0, 1.6); e.atk = null; W.bosses.push(e); const a = frand(0, TAU); e.dx = Math.cos(a); e.dy = Math.sin(a); }
    e.spin = 0; e.drop = 1;
    e.splitAt = gen === 0 ? 0.66 : gen === 1 ? 0.5 : -1;
  },
  update(e, dt) {
    if (e.intro > 0) { e.intro -= dt; e.vx = 60; e.vy = 30; if (e.x > 50) { e.vx = 0; e.vy = 0; } e.spin += dt * 4; return; }
    if (e.splitAt > 0 && e.hp < e.maxHp * e.splitAt) { tangleSplit(e); return; }
    e.spin += dt * (e.rolling ? 10 : 1.2);
    if (e.dizzy > 0) { e.dizzy -= dt; e.vx = e.vy = 0; if (e.dizzy <= 0) { e.atk = null; e.idle = frand(1.8, 2.4) - e.gen * 0.3; } return; }
    if (e.rolling > 0) {
      // 翻滚：沿预警方向冲，碰墙反弹，身后拖出乱线
      const spd = 105 + e.gen * 15;
      e.vx = e.dx * spd; e.vy = e.dy * spd;
      if (e.x <= e.r + 0.5 && e.dx < 0) e.dx = -e.dx;
      if (e.x >= ARENA - e.r - 0.5 && e.dx > 0) e.dx = -e.dx;
      if (e.y <= e.r + 0.5 && e.dy < 0) e.dy = -e.dy;
      if (e.y >= ARENA - e.r - 0.5 && e.dy > 0) e.dy = -e.dy;
      e.drop -= dt;
      if (e.drop <= 0) { e.drop = 0.18; if (e.lx !== undefined) addZone({ kind: 'strand', x0: e.lx, y0: e.ly, x1: e.x, y1: e.y, dur: 5 }); e.lx = e.x; e.ly = e.y; }
      e.rolling -= dt;
      if (e.rolling <= 0) { e.rolling = 0; e.lx = undefined; e.dizzy = 1.5 + (e.gen === 0 ? 0.3 : 0); e.vx = e.vy = 0; shake(1.5); }
      return;
    }
    e.vx = e.vy = 0;
    if (!e.atk) {
      e.idle -= dt;
      if (e.idle <= 0) { bossPick(e, [{ id: 'unravel', w: 2 }, { id: 'roll', w: 3 }]); SFX.warn(); }
      return;
    }
    e.atkT += dt;
    const T = e.atkT;
    if (e.atk === 'unravel') {
      if (e.st === 0) { e.st = 1; tele({ kind: 'circle', x: e.x, y: e.y, r: e.r + 8, dur: 0.55, owner: e, grow: true }); }
      if (T > 0.55 && e.st === 1) {
        e.st = 2;
        const n = e.gen === 0 ? 12 : e.gen === 1 ? 8 : 5, off = frand(0, TAU);
        for (let i = 0; i < n; i++) enemyShot(e.x, e.y, off + (i / n) * TAU, 42, { kind: 'orb', life: 4 });
        if (e.gen === 0 && e.hp < e.maxHp * 0.85) for (let i = 0; i < n; i++) enemyShot(e.x, e.y, off + ((i + 0.5) / n) * TAU, 28, { kind: 'orb', life: 5 });
        SFX.shoot(panOf(e.x));
      }
      if (T > 1.0) { e.atk = null; e.idle = frand(1.6, 2.2) - e.gen * 0.2; }
    } else if (e.atk === 'roll') {
      if (e.st === 0) {
        e.st = 1; e.ra = Math.atan2(P.y - e.y, P.x - e.x);
        tele({ kind: 'line', x0: e.x, y0: e.y, x1: e.x + Math.cos(e.ra) * 200, y1: e.y + Math.sin(e.ra) * 200, w: e.r, dur: 0.75, owner: e });
      }
      if (T > 0.75) { e.dx = Math.cos(e.ra); e.dy = Math.sin(e.ra); e.rolling = 1.0 + e.gen * 0.1; e.atk = 'rolling'; thump(auNow(), 0.3, 90, 50, 0.3); }
    }
  },
  draw(e) {
    const t = tintOf(e);
    const r = e.r, sp = e.spin;
    if (e.dizzy > 0) for (let i = 0; i < 3; i++) { const a = e.anim * 6 + (i * TAU) / 3; pset(e.x + Math.cos(a) * (r + 3), e.y - r - 2 + Math.sin(a) * 2, PAL.thunderLight); }
    for (let i = -r; i <= r; i++) pdither(e.x + i, e.y + r + 2, PAL.shadow, 0.45);
    rasterShape(e.x, e.y, r, r, (dx, dy) => {
      const d2 = dx * dx + dy * dy;
      if (d2 > r * r + r * 0.6) return 0;
      // 绕着滚动轴的条纹
      const u = (dx * Math.cos(sp) + dy * Math.sin(sp)) / r;
      const v = (-dx * Math.sin(sp * 0.7) + dy * Math.cos(sp * 0.7)) / r;
      const band = Math.sin(u * 7 + v * 3 + sp * 2);
      if (d2 > (r - 1.2) * (r - 1.2)) return PAL.yarnDark;
      if (band > 0.55) return PAL.yarnLight;
      if (band < -0.6) return PAL.yarnDark;
      return (dx + dy) % 5 === 0 ? PAL.yarnLight : PAL.yarn;
    }, t);
    // 线头
    const a = sp * 0.5;
    line(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r, e.x + Math.cos(a) * (r + 5), e.y + Math.sin(a) * (r + 5) + 2, PAL.yarnLight);
    // 从乱线里探出来的一双眼睛，盯着你
    if (!t.flash) {
      const la = Math.atan2(P.y - e.y, P.x - e.x), lx = Math.round(Math.cos(la)), ly = Math.round(Math.sin(la));
      const es = e.gen === 2 ? 1 : 2, ey = e.y - Math.round(r * 0.15), gap = Math.max(2, Math.round(r * 0.32));
      const shut = e.dizzy > 0 || Math.floor(e.anim * 4) % 18 === 0;
      for (const sxx of [-1, 1]) {
        const cx = e.x + sxx * gap;
        if (shut) { rectFill(cx - es, ey, es * 2 + 1, 1, PAL.ink); continue; }
        rectFill(cx - es, ey - es, es * 2 + 1, es * 2 + 1, PAL.ink);
        pset(cx + lx * (es > 1 ? 1 : 0), ey + ly * (es > 1 ? 1 : 0), e.atk ? PAL.dangerLight : PAL.white);
      }
    }
  },
};
// 乱线团分裂
function tangleSplit(e) {
  e.alive = false;
  const hp = e.hp;
  burst(e.x, e.y, 20, [PAL.yarn, PAL.yarnLight, PAL.moon], 90, 0.5);
  shake(4); hitstop(5); thump(auNow(), 0.5, 100, 40, 0.4);
  if (e.gen === 0) banner('散开了', { size: 14, y: 40, c: PAL.yarnLight, shade: PAL.yarn });
  for (let i = 0; i < 2; i++) {
    const c = spawnEnemy('tangleKing', clamp(e.x + (i ? 6 : -6), 12, ARENA - 12), e.y, { gen: e.gen + 1 });
    c.hp = c.maxHp = hp / 2;
    c.kx = (i ? 1 : -1) * 70; c.ky = frand(-40, 40);
  }
}

// 生成 Boss 并登场
function spawnBoss(type) {
  const e = spawnEnemy(type, ARENA / 2, -20, { hpMul: Patch.bossHpMul || 1 });
  W.bossMax = e.maxHp;
  W.bossName = e.def.name;
  if (discover('boss', type)) newFind('boss', type);
  banner(e.def.name, { size: 22, y: 70, c: PAL.moon, shade: PAL.moonDim, dur: 2.0, sub: e.def.title, subC: PAL.goldLight });
  SFX.bossIntro();
  return e;
}

// 生成一块底布：布纹 + 随机的一目刺纹样 + 布边
function genClothBG(cloth, rng) {
  const bg = new Uint32Array(ARENA * ARENA);
  const base = cloth.pb, dark = mixC(base, PAL.ink, 0.1), slub = mixC(base, cloth.pl, 0.35);
  for (let y = 0; y < ARENA; y++) for (let x = 0; x < ARENA; x++) {
    const n = rng.next();
    bg[y * ARENA + x] = n < 0.035 ? slub : ((x + (y >> 1)) & 3) === 0 && n < 0.5 ? dark : base;
  }
  setTarget(bg, ARENA, ARENA);
  const g = 6, col = mixC(cloth.pl, base, 0.3);
  const N = Math.floor(ARENA / g);
  const rows = [], cols = [];
  for (let i = 0; i <= N; i++) { rows.push(rng.chance(0.5) ? 1 : 0); cols.push(rng.chance(0.5) ? 1 : 0); }
  for (let r = 1; r < N; r++) for (let j = 0; j < N; j++) if ((j + rows[r]) % 2 === 0) for (let x = j * g + 1; x < (j + 1) * g; x++) pset(x, r * g, col);
  for (let c = 1; c < N; c++) for (let j = 0; j < N; j++) if ((j + cols[c]) % 2 === 0) for (let y = j * g + 1; y < (j + 1) * g; y++) pset(c * g, y, col);
  // 布边：内侧一圈虚线
  const hem = mixC(col, PAL.moon, 0.18);
  for (let i = 1; i < ARENA - 1; i++) if (i % 4 < 2) { pset(i, 1, hem); pset(i, ARENA - 2, hem); pset(1, i, hem); pset(ARENA - 2, i, hem); }
  resetTarget();
  return bg;
}

    Patch.table = pick.map((t) => ({ t, w: SPAWN_W[t] }));
    let holes = Patch.tutorial ? 1 : Run.depth === 0 || cell.type === 'elite' ? 2 : 3;
    // 精英布：精英本身就是主角，破洞吐得慢一些
    if (cell.type === 'elite') Patch.interval *= 1.5;
    if (cell.mod === 'gilded') Patch.interval *= 0.85;
    if (cell.mod === 'rush') Patch.interval *= 0.68;
    holes += N.holes + (Run.extraHole ? 1 : 0);
    Run.extraHole = false;
    const spots = [];
    for (let i = 0; i < holes; i++) {
      let best = null;
      for (let tries = 0; tries < 40; tries++) {
        const x = rng.range(28, ARENA - 28), y = rng.range(26, ARENA - 30);
        if (dist2(x, y, P.x, P.y) < 46 * 46) continue;
        if (spots.some((s) => dist2(s.x, s.y, x, y) < 54 * 54)) continue;
        best = { x, y }; break;
      }
      if (!best) best = { x: rng.range(28, ARENA - 28), y: rng.range(26, 70) };
      spots.push(best);
      W.holes.push(makeHole(best.x, best.y, 3));
    }
    for (const h of W.holes) h.timer = 0.6 + rng.range(0, 0.6);
    if (cell.type === 'elite') {
      const pool2 = ELITE_POOL[Math.min(Run.depth, ELITE_POOL.length - 1)];
      const type = cell.gleaner ? 'gmoth' : rng.pick(pool2);
      const names = Object.keys(AFFIXES);
      rng.shuffle(names);
      const affixes = cell.gleaner ? ['gilded'] : names.slice(0, 1 + (Run.depth >= 3 ? 1 : 0) + N.affix);
      later(1.0, () => {
        const e = spawnEnemy(type, ARENA / 2, 46, { elite: affixes, emerge: 0.9 });
        Patch.elite = e;
        if (cell.gleaner && Save.data.lost.length) { e.gleaner = Save.data.lost[0]; banner('拾遗蛾', { size: 18, y: 60, c: PAL.gold, shade: PAL.goldDark, sub: '它叼着你遗落的香囊', subC: PAL.moon }); }
        else banner('精英', { size: 16, y: 60, c: PAL.gold, shade: PAL.goldDark, sub: affixes.map((a) => AFFIXES[a].name).join(' · '), subC: PAL.moon });
        burst(e.x, e.y, 16, PAL.gold, 60, 0.5);
        SFX.bossIntro();
      });
    }
    Music.play('battle');
    if (cell.type === 'battle') banner(W.cloth.name + ' · ' + ['', '一', '两', '三', '四', '五'][W.holes.length] + '处破洞', { size: 12, y: 150, c: PAL.moon, shade: PAL.moonDim, dur: 1.6, sub: cell.mod ? MODS[cell.mod].name + '：' + MODS[cell.mod].desc.split('：')[1] : '', subC: PAL.gold });
    if (cell.mod && discover('mod', cell.mod)) newFind('mod', cell.mod);
  }
  fire('onPatchStart');
  if (Run.pact && Run.pact.done) Run.pact = null; // 上一场已结算的约不再显示
  if (Run.pact && !Run.pact.active) activatePact(cell.type === 'boss');
  W.active = true;
  hudPactText();
}

// 破洞里爬出敌人
function spawnFromHole(h) {
  const rng = FX_RNG;
  const pick = rng.weighted(Patch.table, (x) => (x.t === 'bbug' && W.enemies.some((e) => e.type === 'bbug') ? 0 : x.w));
  const g = GROUP[pick.t] || [1, 1];
  const n = rng.int(g[0], g[1]);
  for (let i = 0; i < n; i++) {
    const a = rng.range(0, TAU);
    spawnEnemy(pick.t, h.x + Math.cos(a) * 2, h.y + Math.sin(a) * 2, { emerge: 0.5 + i * 0.12 });
  }
  burst(h.x, h.y, 5, PAL.violetDeep, 30, 0.3);
  if (auGate('holeSpawn', 0.3)) noise(auNow(), 0.2, 0.05, { type: 'lowpass', f: 400, f2: 150, pan: panOf(h.x) });
}

// 检查是否清场
function checkPatchClear() {
  if (W.ending || !W.active) return;
  if (Patch.type === 'battle' && W.holes.every((h) => h.mended)) patchCleared();
  if (Patch.type === 'elite' && Patch.elite && !Patch.elite.alive) {
    for (const h of W.holes) if (!h.mended) { h.mended = true; embroiderFlower(h.x, h.y, threadColor(0)); }
    patchCleared();
  }
}

// 清场：残余敌人散成线，结算蛛约
function patchCleared() {
  W.ending = true; W.endKind = 'clear'; W.endT = 0;
  const rest = W.enemies.filter((e) => e.alive);
  rest.forEach((e, i) => later(0.06 + i * 0.045, () => { if (e.alive) killEnemy(e, { kind: 'unravel' }); }));
  for (const b of W.eproj) { b.dead = true; burst(b.x, b.y, 2, PAL.dangerLight, 20, 0.2); }
  W.tele.length = 0;
  slowmo(0.35, 0.4);
  banner('补好了', { size: 22, y: 64, c: PAL.moon, shade: PAL.moonDim, dur: 1.5 });
  SFX.mended();
  Music.setIntensity(0.1);
  fire('onPatchClear');
  pactResolve();
  Run.stats.patches++;
  markPatchDone();
}

// 每帧的布块逻辑：压力、刷怪、精英死亡、蛛约计时、结束流程
function updatePatch(dt) {
  W.pst.time += dt;
  if (!W.ending) {
    Patch.pressure = 1 + Math.max(0, W.t - 16) * 0.03;
    if (Patch.type === 'elite') checkPatchClear();
    if (Run.pact && Run.pact.active) pactTick(dt);
  } else {
    W.endT += dt;
    if (W.endKind === 'clear' && W.endT > 1.7) { W.active = false; showPatchReward(); }
    else if (W.endKind === 'dead' && W.endT > 2.2) { W.active = false; endRun(false); }
    else if (W.endKind === 'boss' && W.endT > 3.0) { W.active = false; endRun(true); }
  }
  // 音乐强度：场上敌人越多越满
  if (!W.ending) {
    const n = W.enemies.length;
    Music.setIntensity(Patch.type === 'boss' ? 0.85 : clamp(0.3 + n / 26 + (Run.hearts <= 1 ? 0.2 : 0), 0.25, 1));
  }
}

// 战斗世界每步更新
function worldStep(dt) {
  W.t += dt;
  for (let i = W.later.length - 1; i >= 0; i--) if (W.t >= W.later[i].t) { const l = W.later[i]; W.later.splice(i, 1); l.fn(); }
  updateZones(dt);
  updatePlayer(dt);
  updateKnots(dt);
  updateEnemies(dt);
  updateEProj(dt);
  updatePProj(dt);
  updatePickups(dt);
  updateHoles(dt);
  updateAllies(dt);
  updateTele(dt);
  fire('tick', dt);
  updatePatch(dt);
  fxUpdate(dt);
  tutorialTick(dt);
}

// Boss 血条：场地顶端一根正在被拆开的线
function drawBossBar() {
  const b = bossBar();
  if (!b || W.endKind === 'boss') return;
  const w = ARENA - 40, x = 20, y = 5;
  const f = Math.round((b.hp / b.max) * w);

// ==== 17_run.js ====
// 单局：开局、百衲被地图、布块之间的选择、蛛约、结算、断点续玩

const Run = {
  active: false, seed: '0', night: 1, depth: 0,
  threads: ['plain'], skill: 'overlock', charms: [], items: [], itemMap: {}, combos: [],
  hearts: 4, bonusHearts: 0, buttons: 0, silk: 0, patterns: 0,
  pact: null, sachet: null, stats: {}, boss: 'mothQueen', finds: [], quilt: {}, map: null, pos: { c: 0, r: 3 }, path: [],
  shopRolls: 0, ambush: false, extraHole: false, pactBonus: 0, godMode: false, time: 0,
};
const BOSS_LIST = ['mothQueen', 'shears', 'tangleKing'];

// 生成一个条目实例
function makeItem(kind, id, lvl, ref) {
  const def = kind === 'thread' ? THREADS[id] : kind === 'skill' ? SKILLS[id] : kind === 'charm' ? CHARMS[id] : COMBOS[id];
  return { kind, id, def, lvl: lvl || 0, st: ref ? ref.st || (ref.st = {}) : {} };
}

// 根据当前构筑重建条目表与属性，并播报新点亮的合绣
function rebuildBuild(silent) {
  const before = new Set(Run.combos);
  const items = [];
  for (const id of Run.threads) items.push(makeItem('thread', id, 0));
  if (Run.skill) items.push(makeItem('skill', Run.skill, 0));
  for (const c of Run.charms) items.push(makeItem('charm', c.id, c.lvl, c));
  const ids = new Set(Run.threads.concat([Run.skill], Run.charms.map((c) => c.id)));
  Run.combos = Object.keys(COMBOS).filter((k) => COMBOS[k].req.every((r) => ids.has(r)));
  for (const k of Run.combos) items.push(makeItem('combo', k, 0));
  Run.items = items;
  Run.itemMap = {};
  for (const it of items) Run.itemMap[it.id] = it;
  recomputeStats();
  if (!silent) for (const k of Run.combos) if (!before.has(k)) announceCombo(k);
}
// 合绣点亮的提示
function announceCombo(k) {
  const first = discover('combo', k, 2);
  if (first) Run.finds.push({ cat: 'combo', id: k });
  SFX.combo();
  if (W.active) banner('合绣 · ' + COMBOS[k].name, { size: 14, y: 46, c: PAL.gold, shade: PAL.goldDark, sub: first ? '新发现' : '', subC: PAL.moon });
  toast(`合绣「${COMBOS[k].name}」：${COMBOS[k].desc}`, 'gold');
}
// 新发现
function newFind(cat, id) { Run.finds.push({ cat, id }); }

// 获得绣片（已有则升为金绣）
function addCharm(id, opts = {}) {
  const ex = Run.charms.find((c) => c.id === id);
  if (ex) { ex.lvl = 1; }
  else Run.charms.push({ id, lvl: opts.golden ? 1 : 0, st: {} });
  if (discover('charm', id, 2) && !opts.quiet) newFind('charm', id);
  rebuildBuild();
  const it = itemOf(id);
  if (!ex && it && it.def.onAcquire) it.def.onAcquire(it);
  if (Run.hearts > S.maxHearts) Run.hearts = S.maxHearts;
  if (!opts.quiet) SFX.gain();
}
function removeCharm(id) { Run.charms = Run.charms.filter((c) => c.id !== id); rebuildBuild(); }
function upgradeCharm(id) { const c = Run.charms.find((x) => x.id === id); if (c) { c.lvl = 1; rebuildBuild(); } }
// 合股第二种线
function plyThread(id) {
  if (Run.threads.includes(id) || Run.threads.length >= 2) return;
  Run.threads.push(id);
  if (discover('thread', id, 2)) newFind('thread', id);
  rebuildBuild();
  SFX.gain();
}

// 开新的一夜
function newRun(o = {}) {
  const seed = o.seed !== undefined ? String(o.seed) : String((Math.random() * 4294967296) >>> 0);
  P.skillCharge = 0; P.shield = 0;
  Object.assign(Run, {
    firstRun: Save.data.stats.runs === 0, result: null,
    active: true, seed, night: o.night || 1, depth: 0,
    threads: [o.thread || 'plain'], skill: o.skill || 'overlock', charms: [], combos: [],
    hearts: 0, bonusHearts: 0, buttons: 0, silk: 0, patterns: 0,
    pact: null, sachet: null, finds: [], quilt: {}, shopRolls: 0, ambush: false, extraHole: false, pactBonus: 0, time: 0,
    stats: { kills: 0, knots: 0, bestCatch: 0, patches: 0, pactsWon: 0, pactsLost: 0, moons: 0 },
  });
  const rng = makeRng(hashStr(seed + ':map'));
  Run.map = genMap(rng);
  Run.boss = o.boss || rng.pick(BOSS_LIST);
  Run.pos = { c: 0, r: Run.map.R - 1 };
  Run.path = [];
  if (o.sachet !== undefined && o.sachet >= 0 && Save.data.pouch[o.sachet]) {
    Run.sachet = Object.assign({}, Save.data.pouch[o.sachet], { idx: o.sachet });
    Run.charms.push({ id: Run.sachet.id, lvl: Run.sachet.lvl >= 2 ? 1 : 0, st: {}, sachet: true });
  }
  if (o.charms) for (const c of o.charms) Run.charms.push({ id: c, lvl: 0, st: {} });
  rebuildBuild(true);
  Run.hearts = S.maxHearts;
  discover('thread', Run.threads[0], 2);
  discover('skill', Run.skill, 2);
  Save.data.stats.runs++;
  Save.data.last = { thread: Run.threads[0], skill: Run.skill, night: Run.night, sachet: o.sachet === undefined ? -1 : o.sachet };
  Save.write();
}

// 地图：3 列 × 4 行，左下进，右上是 Boss
function genMap(rng) {
  const C = 3, R = 4, cells = [];
  for (let r = 0; r < R; r++) { const row = []; for (let c = 0; c < C; c++) row.push({ c, r, d: c + (R - 1 - r), type: 'battle', cloth: rng.pick(CLOTHS).id, done: false }); cells.push(row); }
  const all = cells.flat();
  const byD = (d) => rng.shuffle(all.filter((x) => x.d === d));
  cells[R - 1][0].type = 'battle';
  cells[0][C - 1].type = 'boss';
  const d1 = byD(1); d1[0].type = 'battle'; d1[1].type = rng.pick(['event', 'spider', 'battle']);
  const d2 = byD(2); d2[0].type = 'battle'; d2[1].type = 'elite'; d2[2].type = rng.pick(['shop', 'event', 'battle']);
  const d3 = byD(3); d3[0].type = 'battle'; d3[1].type = rng.pick(['elite', 'battle']); d3[2].type = rng.pick(['shop', 'spider', 'event']);
  const d4 = byD(4); d4[0].type = 'rest'; d4[1].type = rng.pick(['shop', 'spider']);
  const free = all.filter((x) => x.d >= 2 && x.d <= 4 && x.type !== 'elite' && x.type !== 'rest');
  for (const need of ['shop', 'spider']) if (!all.some((x) => x.type === need)) { const cand = free.filter((x) => x.type !== 'shop' && x.type !== 'spider'); (cand.length ? rng.pick(cand) : rng.pick(free)).type = need; }
  // 相邻布块尽量不同色
  for (const x of all) { const nb = all.filter((y) => Math.abs(y.c - x.c) + Math.abs(y.r - x.r) === 1); let tries = 0; while (nb.some((y) => y.cloth === x.cloth) && tries++ < 6) x.cloth = rng.pick(CLOTHS).id; }
  // 布纹：部分战斗布带词条，地图上就能看到
  for (const x of all) if (x.type === 'battle' && x.d > 0 && rng.chance(0.42)) x.mod = rng.pick(Object.keys(MODS));
  if (Save.data.lost.length) {
    let el = all.filter((x) => x.type === 'elite');
    if (!el.length) el = all.filter((x) => x.d === 2 && x.type === 'battle');
    if (el.length) { const g = rng.pick(el); g.type = 'elite'; g.gleaner = true; }
  }
  return { C, R, cells };
}
function cellAt(c, r) { return Run.map.cells[r] && Run.map.cells[r][c]; }
function currentCell() { return cellAt(Run.pos.c, Run.pos.r); }
// 可以前往的下一块布
function nextCells() {
  const { c, r } = Run.pos, out = [];
  if (c + 1 < Run.map.C) out.push(cellAt(c + 1, r));
  if (r - 1 >= 0) out.push(cellAt(c, r - 1));
  return out;
}

// 布纹词条
const MODS = {
  moonlit: { name: '月明', glyph: '月', desc: '月光照着这块布：拾到的月丝翻倍。' },
  gilded: { name: '金线', glyph: '金', desc: '布里织着金线：每只虫都会多掉一枚纽扣，但破洞吐得更快。' },
  rush: { name: '急火', glyph: '急', desc: '火烧眉毛：破洞吐得凶得多，补好后挑绣片时多一个选项，且更容易出好货。' },
};
const CELL_INFO = {
  battle: { name: '战', title: '破布', desc: '用结把破洞补上。破洞会一直往外爬虫子。' },
  elite: { name: '精', title: '精英', desc: '一只带词缀的强敌。打倒它，挑更好的绣片，还可能合股第二种线。' },
  shop: { name: '铺', title: '货郎', desc: '挑担的货郎，用纽扣换绣片。' },
  spider: { name: '蛛', title: '喜蛛', desc: '喜蛛垂丝等你立约：押上手里的东西，换更大的回报。' },
  rest: { name: '歇', title: '歇脚', desc: '在月下歇一歇：回心，或者把一枚绣片绣成金的。' },
  event: { name: '奇', title: '奇遇', desc: '夜里总会碰上些说不清的东西。' },
  boss: { name: '王', title: '夜王', desc: '这一夜最深的破洞。' },
};

// 开局：直接走进左下角的起点战斗布
function startFirstPatch() { enterCell(cellAt(0, Run.map.R - 1)); }
// 走进一块布
function enterCell(cell) {
  Run.pos = { c: cell.c, r: cell.r };
  if (!Run.path.some((p) => p.c === cell.c && p.r === cell.r)) Run.path.push({ c: cell.c, r: cell.r });
  const t = cell.type;
  if (t === 'battle' || t === 'elite') { saveCheckpoint(true); startCombat(cell); }
  else if (t === 'boss') { if (!Run.pact || Run.pact.done) { saveCheckpoint(false, 'bossPact'); UI.pact(true); } else { saveCheckpoint(true); startCombat(cell); } }
  else { saveCheckpoint(false, t); openCellScreen(t); }
}
// 打开非战斗布块（或待选的奖励）对应的界面
function openCellScreen(t) {
  if (t === 'shop') UI.shop();
  else if (t === 'spider') UI.pact(false);
  else if (t === 'bossPact') UI.pact(true);
  else if (t === 'rest') UI.rest();
  else if (t === 'event') UI.event();
  else if (t === 'reward') UI.reward(false);
  else if (t === 'rewardElite') UI.reward(true);
  else goMap();
}
// 非战斗布块结束，回到地图
function finishCell() {
  const cell = currentCell();
  cell.done = true;
  Run.depth++;
  goMap();
}
// 战斗布块清场的当下：记账并写断点（之后的清场动画里刷新页面也不会重打这块布）
function markPatchDone() {
  const cell = currentCell();
  if (cell.done) return;
  cell.done = true;
  Run.quilt[cell.c + ',' + cell.r] = thumbOf(W.bg);
  Run.depth++;
  Run.stats.time = Run.time;
  if (cell.type === 'elite' && Patch.elite && Patch.elite.gleaner) recoverSachet(Patch.elite.gleaner);
  saveCheckpoint(false, cell.type === 'elite' ? 'rewardElite' : 'reward');
}
// 清场动画结束：再存一次（带上动画里捡到的纽扣），然后挑绣片
function showPatchReward() {
  const cell = currentCell();
  saveCheckpoint(false, cell.type === 'elite' ? 'rewardElite' : 'reward');
  UI.reward(cell.type === 'elite');
}
// 底布缩略图（每 5 像素取 1）
function thumbOf(bg) {
  const t = new Uint32Array(36 * 36);
  for (let y = 0; y < 36; y++) for (let x = 0; x < 36; x++) t[y * 36 + x] = bg[(y * 5 + 2) * ARENA + x * 5 + 2];
  return t;
}

// 奖励：按稀有度权重抽绣片；已有的会以「升金绣」出现
function rollCharms(rng, n, weights, exclude = new Set()) {
  const pool = [];
  for (const id of Save.data.unlocked.charms) {
    const def = CHARMS[id];
    if (!def || exclude.has(id)) continue;
    const own = Run.charms.find((c) => c.id === id);
    if (own && own.lvl) continue;
    if (own && own.sachet) continue;
    pool.push({ id, w: weights[def.r] * (own ? 0.45 : 1), up: !!own });
  }
  const out = [];
  while (out.length < n && pool.length) { const p = rng.weighted(pool, (x) => x.w); out.push(p); pool.splice(pool.indexOf(p), 1); }
  return out;
}
function rewardOffers(elite, roll = 0) {
  const rng = makeRng(hashStr(Run.seed + ':reward:' + Run.depth + ':' + roll));
  const sb = itemOf('sewingBox');
  const cur = currentCell();
  const rush = !!(cur && cur.mod === 'rush');
  const n = 3 + (sb ? lv(sb, 1, 2) : 0) + (rush ? 1 : 0);
  const offers = rollCharms(rng, n, elite || rush ? [0, 30, 50, 20] : [0, 66, 27, 7]);
  for (const o of offers) discover('charm', o.id, 1);
  return offers;
}
// 合股可选的线
function plyOptions() { return Save.data.unlocked.threads.filter((t) => !Run.threads.includes(t)); }

// 货郎的货
function priceOf(r, up) {
  const m = itemOf('miser');
  const disc = m ? lv(m, 0.75, 0.6) : 1;
  return Math.max(1, Math.round([0, 14, 24, 36][r] * (up ? 0.7 : 1) * disc));

function shopStock() {

// 从当前位置出发，是不是每条路都要先遇到 Boss 才会遇到战斗
function nextCombatIsBoss() {
  const walk = (c, r) => {
    const outs = [];
    if (c + 1 < Run.map.C) outs.push(cellAt(c + 1, r));
    if (r - 1 >= 0) outs.push(cellAt(c, r - 1));
    for (const x of outs) {
      if (x.type === 'battle' || x.type === 'elite') return false;
      if (x.type !== 'boss' && !walk(x.c, x.r)) return false;
    }
    return true;
  };
  return walk(Run.pos.c, Run.pos.r);
}

// 蛛约事件：受伤、冲刺、断线、拾取、打结
function pactEvent(type, data) {
  const p = Run.pact;

  const c = p.cond;
  if (type === 'hurt') { p.hurts++; if (c === 'untouched' || (c === 'fewHits' && p.hurts > 1)) pactBreak('受伤了'); }
  else if (type === 'dash' && c === 'grounded') pactBreak('冲刺了');
  else if (type === 'cut' && c === 'unbroken') pactBreak('线断了');
  else if (type === 'pickup' && c === 'frugal') pactBreak('捡了纽扣');
  else if (type === 'knot') {
    if (c === 'greatnet' && data.n >= 6) { if (!p.ok) toast('蛛约达成条件：大网', 'gold'); p.ok = true; }
    if (c === 'manyknots' && data.src !== 'echo') p.count++;
    if (c === 'fullmoons' && data.moon) { p.count++; if (p.count === 3) toast('蛛约达成条件：三轮满月', 'gold'); }
  }
  hudPactText();
}

function pactBreak(reason) {
  const p = Run.pact;

  else if (s.kind === 'sachet' && Run.sachet) { if (keepAll) msg = '留后手保住了香囊'; else { loseSachet(); msg = '香囊遗落在夜里'; } }
  Run.stats.pactsLost++;

  toast('断约 · ' + reason + '，' + msg + '　' + FX_RNG.pick(SPIDER_LOSE), 'red');

// 把香囊放进「遗落」名单（最多记三个，更早的就真的找不回来了）；返回给玩家看的说明
function pushLost(s) {
  const lost = Save.data.lost;
  lost.push({ id: s.id, lvl: s.lvl });
  if (lost.length > 3) { const gone = lost.shift(); return `香囊「${CHARMS[s.id].name}」遗落在夜里；更早遗落的「${CHARMS[gone.id].name}」再也找不回来了`; }
  return `香囊「${CHARMS[s.id].name}」遗落在夜里。之后会有一只拾遗蛾叼着它出现`;
}
// 香囊遗落：从口袋里移除，交给拾遗蛾
function loseSachet() {
  const s = Run.sachet;
  if (!s || s.lost) return '';
  s.lost = true;
  const pouch = Save.data.pouch;
  if (s.idx !== undefined && pouch[s.idx] && pouch[s.idx].id === s.id) pouch.splice(s.idx, 1);
  const msg = pushLost(s);
  Run.charms = Run.charms.filter((c) => !c.sachet);
  rebuildBuild();
  Save.write();
  return msg;
}
// 打倒拾遗蛾：取回它叼着的香囊；口袋满了就先留在它那里
function recoverSachet(g) {
  const lost = Save.data.lost;
  const i = lost.findIndex((x) => x.id === g.id && x.lvl === g.lvl);
  if (i < 0) return;
  if (Save.data.pouch.length >= 3) { toast(`口袋里已经有三个香囊，「${CHARMS[g.id].name}」还留在夜里`, 'red'); return; }
  lost.splice(i, 1);
  Save.data.pouch.push({ id: g.id, lvl: g.lvl });
  Save.write();
  toast(`取回了香囊「${CHARMS[g.id].name}」Lv${g.lvl}`, 'gold');
  SFX.pactWin();
}

// ---------- 结算 ----------
// 一局的月丝：香囊满级加成、通关奖励、几更倍率；输了只带回一半。返回 [结算前, 带回]
function silkOutcome(silk, night, sachet, win) {
  if (sachet && !sachet.lost && sachet.lvl >= 3) silk = Math.round(silk * 1.25);
  if (win) silk += 20 + 8 * (night - 1);
  silk = Math.round(silk * NIGHTS[night].silk);
  return [silk, win ? silk : Math.floor(silk / 2)];
}
// 结束这一夜：先落盘再显示结算
function endRun(win) {
  if (!Run.result) { if (!Run.active) return; Run.result = finalizeRun(win); }
  W.active = false;
  Music.play('calm');
  UI.results(Run.result);
}
// 把这一夜的结果写进存档（只做一次），返回结算界面要用的数据
function finalizeRun(win) {
  if (Run.result) return Run.result;
  Run.active = false;
  const sd = Save.data;
  const [silk, banked] = silkOutcome(Run.silk, Run.night, Run.sachet, win);
  sd.silk += banked; sd.silkTotal += banked;
  const st = sd.stats;
  st.kills += Run.stats.kills; st.knots += Run.stats.knots; st.bestCatch = Math.max(st.bestCatch, Run.stats.bestCatch); st.time += Run.time;
  if (win) { st.wins++; if (!st.fastest || Run.time < st.fastest) st.fastest = Math.round(Run.time); }
  let nightUnlock = 0;
  if (win) { sd.night.best = Math.max(sd.night.best, Run.night); if (Run.night >= sd.night.max && Run.night < 5) { sd.night.max = Run.night + 1; nightUnlock = sd.night.max; } }
  // 花样：解锁未解锁的绣片
  const unlocked = [];
  const rng = makeRng(hashStr(Run.seed + ':patterns'));
  for (let i = 0; i < Run.patterns + (win ? 1 : 0); i++) {
    const locked = Object.keys(CHARMS).filter((id) => !sd.unlocked.charms.includes(id));
    if (!locked.length) break;
    const id = rng.pick(locked);
    sd.unlocked.charms.push(id); unlocked.push(id);
  }
  // 成就解锁
  const ach = [];
  if (Run.stats.bestCatch >= 12 && !sd.ach.bigNet) { sd.ach.bigNet = 1; if (!sd.unlocked.charms.includes('mirrorNeedle')) { sd.unlocked.charms.push('mirrorNeedle'); ach.push('一结圈住 12 只敌人：解锁「镜针」'); } }
  if (Run.stats.moons >= 10 && !sd.ach.moons) { sd.ach.moons = 1; if (!sd.unlocked.charms.includes('kaleido')) { sd.unlocked.charms.push('kaleido'); ach.push('一夜打出 10 个满月结：解锁「万花」'); } }
  // 香囊：赢了升级，输了遗落
  let sachetMsg = '';
  if (Run.sachet && !Run.sachet.lost) {
    const s = Run.sachet, pouch = sd.pouch;
    if (win) { const lvNew = Math.min(3, s.lvl + (s.won ? 0 : 1)); if (pouch[s.idx] && pouch[s.idx].id === s.id) pouch[s.idx].lvl = lvNew; sachetMsg = `香囊「${CHARMS[s.id].name}」升到 Lv${lvNew}`; }
    else { if (pouch[s.idx] && pouch[s.idx].id === s.id) pouch.splice(s.idx, 1); s.lost = true; sachetMsg = pushLost(s); }
  } else if (Run.sachet && Run.sachet.lost) sachetMsg = `香囊「${CHARMS[Run.sachet.id].name}」遗落在夜里`;
  // 拼布被
  const img = quiltImage(win);
  sd.gallery.unshift({ t: Date.now(), win, night: Run.night, boss: Run.boss, img });
  if (sd.gallery.length > 12) sd.gallery.length = 12;
  sd.run = null;
  Save.write();
  return { win, silk, banked, unlocked, ach, nightUnlock, sachetMsg, img };
}

// ---------- 断点续玩 ----------
function primOnly(o) { const r = {}; for (const k in o) if (typeof o[k] === 'number' || typeof o[k] === 'boolean' || typeof o[k] === 'string') r[k] = o[k]; return r; }
// 缩略图（36×36）存成 RGB 的 base64，续玩后地图与拼布被不丢图
function thumbToStr(t) { const b = new Uint8Array(t.length * 3); for (let i = 0; i < t.length; i++) { b[i * 3] = t[i] & 255; b[i * 3 + 1] = (t[i] >> 8) & 255; b[i * 3 + 2] = (t[i] >> 16) & 255; } let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function strToThumb(str) { const s = atob(str), n = s.length / 3, t = new Uint32Array(n); for (let i = 0; i < n; i++) t[i] = packRGB(s.charCodeAt(i * 3), s.charCodeAt(i * 3 + 1), s.charCodeAt(i * 3 + 2)); return t; }
function saveCheckpoint(inPatch, open) {
  if (!Run.active) return;
  const quilt = {};
  for (const k in Run.quilt) quilt[k] = thumbToStr(Run.quilt[k]);
  // 深拷贝：之后任何一次写盘都不会把断点之后的变化混进来
  Save.data.run = JSON.parse(JSON.stringify({
    open: open || '', quilt, firstRun: !!Run.firstRun,
    seed: Run.seed, night: Run.night, depth: Run.depth, pos: Run.pos, path: Run.path,
    map: Run.map.cells.flat().map((c) => ({ t: c.type, cl: c.cloth, d: c.done ? 1 : 0, g: c.gleaner ? 1 : 0, m: c.mod || '' })),
    threads: Run.threads, skill: Run.skill, charms: Run.charms.map((c) => ({ id: c.id, lvl: c.lvl, sachet: c.sachet ? 1 : 0, st: primOnly(c.st || {}) })),
    hearts: Run.hearts, bonusHearts: Run.bonusHearts, buttons: Run.buttons, silk: Run.silk, patterns: Run.patterns,
    pact: Run.pact ? JSON.parse(JSON.stringify(Run.pact)) : null, sachet: Run.sachet, stats: Run.stats, boss: Run.boss,
    inPatch: !!inPatch, finds: Run.finds, shopRolls: Run.shopRolls, ambush: Run.ambush, extraHole: Run.extraHole, pactBonus: Run.pactBonus, time: Run.time,
  }));
  Save.write();
}
// 从存档恢复；进行中的战斗从头开始，挂着的蛛约算违约
function resumeRun() {
  const d = Save.data.run;
  if (!d) return false;
  try {
    Object.assign(Run, {
      active: true, seed: d.seed, night: d.night, depth: d.depth, pos: d.pos, path: d.path,
      threads: d.threads, skill: d.skill, charms: d.charms.map((c) => ({ id: c.id, lvl: c.lvl, sachet: !!c.sachet, st: c.st || {} })),
      hearts: d.hearts, bonusHearts: d.bonusHearts || 0, buttons: d.buttons, silk: d.silk, patterns: d.patterns || 0,
      pact: d.pact, sachet: d.sachet, stats: d.stats, boss: d.boss, finds: d.finds || [], quilt: {}, shopRolls: d.shopRolls || 0, firstRun: !!d.firstRun, result: null,
      ambush: d.ambush, extraHole: d.extraHole, pactBonus: d.pactBonus || 0, time: d.time || 0, combos: [],
    });
    const C = 3, R = 4, cells = [];
    for (let r = 0; r < R; r++) { const row = []; for (let c = 0; c < C; c++) { const m = d.map[r * C + c]; row.push({ c, r, d: c + (R - 1 - r), type: m.t, cloth: m.cl, done: !!m.d, gleaner: !!m.g, mod: m.m || '' }); } cells.push(row); }
    Run.map = { C, R, cells };
    for (const k in d.quilt || {}) { try { Run.quilt[k] = strToThumb(d.quilt[k]); } catch (e) { /* 坏图就不要了 */ } }
    P.skillCharge = 0;
    rebuildBuild(true);
    if (d.inPatch) {
      if (Run.pact && !Run.pact.done) { Run.pact.active = true; pactBreak('中途离开'); }
      const cell = currentCell();
      startCombat(cell);
    } else if (d.open) { Scene.set('map'); Music.play('map'); openCellScreen(d.open); }
    else goMap();
    return true;
  } catch (e) {
    console.warn('resume failed', e);
    Save.data.run = null; Save.write();
    return false;
  }
}
// 放弃这一夜（算作失败）
function abandonRun() { if (!Run.active) return; W.active = false; endRun(false); }

// 绣片徽章：带针脚边的圆章，中间一个字
const TAG_COLOR = { 结: 'moon', 线: 'steel', 冲: 'iceDark', 元: 'fire', 扣: 'gold', 心: 'crimson', 灵: 'lilac', 约: 'crimsonDark', 奇: 'jade' };
function badge(kind, id, lvl = 0, big = false, locked = false) {
  let ch = '？', col = HEX.hudDim, ring = HEX.moonDim;
  if (!locked) {
    if (kind === 'charm') { const d = CHARMS[id]; ch = d.name[0]; col = HEX[TAG_COLOR[d.tag]] || HEX.moon; ring = lvl ? HEX.gold : HEX[RARITY[d.r].c]; }
    else if (kind === 'thread') { const d = THREADS[id]; ch = d.glyph; col = HEX[d.color]; ring = HEX[d.dark]; }
    else if (kind === 'skill') { const d = SKILLS[id]; ch = d.glyph; col = HEX.cobalt; ring = HEX.moon; }
    else if (kind === 'combo') { const d = COMBOS[id]; ch = d.name[0]; col = HEX.goldDark; ring = HEX.gold; }
  }

function rarityName(r) { return RARITY[r].name; }

// 显示一个屏：html 字符串；返回根元素
function showScreen(name, html, opts = {}) {
  const root = $ui();
  // 同一屏重绘时记住焦点，键盘玩家不用重新找位置
  const prev = document.activeElement;
  const keep = UI.screen === name && prev && prev.dataset && prev.dataset.act ? [prev.dataset.act, prev.dataset.arg || ''] : null;
  root.innerHTML = `<div class="screen ${opts.cls || ''}" data-screen="${name}">${html}</div>`;
  root.classList.add('on');
  root.classList.toggle('dim', !!opts.dim);
  UI.screen = name;
  UI.openedAt = performance.now();
  UI.back = opts.back || null;
  Input.uiHandler = uiKey;
  clearActions();
  const el = root.firstElementChild;
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || b.classList.contains('disabled')) return;
    auInit();
    const fn = UI.acts && UI.acts[b.dataset.act];
    if (fn) { fn(b.dataset.arg, b); }
  });
  el.addEventListener('mouseover', (e) => { const b = e.target.closest('[data-nav]'); if (b && b !== document.activeElement && Input.device !== 'touch') { b.focus({ preventScroll: true }); } });
  el.addEventListener('focusin', (e) => { const b = e.target.closest('[data-nav]'); if (b && auGate('uifocus', 0.04)) SFX.ui('tick'); if (b && b.dataset.hint !== undefined && UI.onFocus) UI.onFocus(b); });
  UI.acts = opts.acts || {};
  // 默认聚焦
  requestAnimationFrame(() => {
    let f = null;
    if (keep) f = [...el.querySelectorAll(`[data-act="${keep[0]}"]`)].find((x) => (x.dataset.arg || '') === keep[1]) || null;
    f = f || el.querySelector('[data-focus]') || el.querySelector('[data-nav]:not(.disabled)');
    if (f && Input.device !== 'touch') f.focus({ preventScroll: true });
  });
  return el;
}
function hideScreen() {
  const root = $ui();
  root.innerHTML = '';
  root.classList.remove('on', 'dim');
  UI.screen = null; UI.back = null; UI.acts = {};
  Input.uiHandler = null;
  clearActions();
}

// 键盘/手柄导航：方向键按空间位置找下一个可聚焦元素
function uiKey(e) {
  if (!UI.screen) return false;
  const code = e.code;
  const root = $ui();
  const items = [...root.querySelectorAll('[data-nav]')].filter((x) => !x.disabled && x.offsetParent !== null);
  const cur = document.activeElement && items.includes(document.activeElement) ? document.activeElement : null;
  if (code === 'Escape' || code === 'Backspace') { if (UI.back) { SFX.ui('back'); UI.back(); } return true; }
  if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
    // 刚打开的界面先不吃确认键：防止战斗里连按冲刺误选了奖励
    if (e.repeat || performance.now() - (UI.openedAt || 0) < 350) return true;
    if (cur) { cur.click(); return true; }
    if (items[0]) { items[0].focus(); return true; }
    return true;
  }
  const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0] };
  const dir = dirs[code];
  if (!dir) return false;
  if (!cur) { if (items[0]) items[0].focus(); return true; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = 1e9;
  for (const it of items) {
    if (it === cur) continue;
    const q = it.getBoundingClientRect(), qx = q.left + q.width / 2, qy = q.top + q.height / 2;
    const dx = qx - cx, dy = qy - cy;
    const along = dx * dir[0] + dy * dir[1];
    if (along <= 4) continue;
    const across = Math.abs(dx * dir[1]) + Math.abs(dy * dir[0]);
    const score = along + across * 2.2;
    if (score < bs) { bs = score; best = it; }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); }
  return true;
}

// ---------- 提示 ----------
function toast(msg, kind = '') {
  let box = document.getElementById('toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); positionHud(); }
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3200);
}
function toastPact() { const p = Run.pact; if (p) toast(`蛛约生效：${PACT_CONDS[p.cond].name}`, 'gold'); }

// 战斗中的文字条：蛛约进度与新手提示
const HUDT = { pact: '', hint: '' };
function hudPactText() {
  const p = Run.pact;
  let s = '';
  if (p && (p.active || (p.done && W.active))) {
    const c = PACT_CONDS[p.cond];
    let st = '';
    if (p.done) st = p.failed ? '已断约' : '已约成';
    else if (p.cond === 'swift') st = `${Math.max(0, Math.ceil(c.limit(p.boss) - p.startT))} 秒`;
    else if (p.cond === 'manyknots') st = `${p.count}/${c.need(p.boss)}`;
    else if (p.cond === 'fullmoons') st = `${p.count}/3`;
    else if (p.cond === 'greatnet') st = p.ok ? '已达成' : '未达成';
    else if (p.cond === 'fewHits') st = `受伤 ${p.hurts}/1`;
    else st = '守约中';
    s = `蛛约 · ${c.name}　${st}`;
  }
  HUDT.pact = s;
  syncHudText();
}
function setHint(s) { HUDT.hint = s || ''; syncHudText(); }
function syncHudText() {
  const el = document.getElementById('hud');
  if (!el) return;
  const show = W.active && !UI.screen;
  el.innerHTML = show ? `${HUDT.pact ? `<div class="hud-pact${Run.pact && Run.pact.failed ? ' bad' : Run.pact && Run.pact.done ? ' good' : ''}">${esc(HUDT.pact)}</div>` : ''}${HUDT.hint ? `<div class="hud-hint">${esc(HUDT.hint)}</div>` : ''}` : '';

}

// 卡片上提示可能的合绣
function comboHint(id) {
  const ids = new Set(Run.threads.concat([Run.skill], Run.charms.map((c) => c.id)));
  for (const k in COMBOS) {
    const r = COMBOS[k].req;
    if (r.includes(id) && r.every((x) => x === id || ids.has(x)) && !Run.combos.includes(k)) {
      return `<div class="combo-hint">✦ 与「${nameOf(r.find((x) => x !== id))}」合绣：${seenLevel('combo', k) >= 2 ? COMBOS[k].name : '？？'}</div>`;
    }
  }
  return '';
}
function nameOf(id) { return (CHARMS[id] || THREADS[id] || SKILLS[id] || {}).name || id; }

// 货郎
UI.shop = function () {
  let stock = shopStock();
  const sold = new Set();
  const render = () => {
    const rr = 4 + Run.shopRolls * 2;
    const goods = stock.map((g, i) => {
      const can = Run.buttons >= g.price && !sold.has(i);
      let inner = '';
      if (g.type === 'charm') { const d = CHARMS[g.id]; inner = `<div class="card-top">${badge('charm', g.id, g.up ? 1 : 0, true)}<span class="rar">${g.up ? '升为金绣' : rarityName(d.r) + ' · ' + TAGS[d.tag]}</span></div><h4>${d.name}</h4><p>${esc(fmtDesc(d.desc, g.up ? -1 : 0))}</p>${comboHint(g.id)}`; }
      else if (g.type === 'heal') inner = `<div class="card-top"><span class="badge big" style="--bc:${HEX.crimson};--br:${HEX.crimsonLight}">心</span></div><h4>缝补</h4><p>回复 2 颗心。</p>`;
      else if (g.type === 'gold') inner = `<div class="card-top"><span class="badge big gold" style="--bc:${HEX.goldDark};--br:${HEX.gold}">金</span></div><h4>金线</h4><p>把一枚普通绣片绣成金绣（下一屏选）。</p>`;
      else if (g.type === 'ply') inner = `<div class="card-top"><span class="badge big" style="--bc:${HEX.cobalt};--br:${HEX.moon}">股</span></div><h4>合股</h4><p>再合进一种线（下一屏选）。</p>`;
      return `<button class="card shopcard ${sold.has(i) ? 'sold' : ''} ${can ? '' : 'disabled'}" data-nav data-act="buy" data-arg="${i}">${inner}<div class="price">${sold.has(i) ? '已售' : g.price + ' 纽扣'}</div></button>`;
    }).join('');
    showScreen('shop', `
      <div class="panel wide">
        <h2>挑担货郎<small>你有 ${Run.buttons} 枚纽扣</small></h2>
        <div class="cards shop">${goods}</div>
        <div class="row2"><button class="btn ghost ${Run.buttons >= rr ? '' : 'disabled'}" data-nav data-act="reroll">换一批（${rr}）</button><button class="btn" data-nav data-act="leave">离开</button></div>
      </div>`, {
      dim: true, back: () => { hideScreen(); finishCell(); },
      acts: {
        buy: (i) => {
          i = +i; const g = stock[i];
          if (sold.has(i) || Run.buttons < g.price) return SFX.ui('deny');
          if (g.type === 'charm') { Run.buttons -= g.price; addCharm(g.id); sold.add(i); SFX.ui('buy'); render(); }
          else if (g.type === 'heal') { if (Run.hearts >= S.maxHearts) return SFX.ui('deny'); Run.buttons -= g.price; heal(2); sold.add(i); render(); }
          else if (g.type === 'gold') { if (!Run.charms.some((c) => !c.lvl)) return SFX.ui('deny'); pickCharm('选一枚绣成金绣', (c) => !c.lvl, (id) => { Run.buttons -= g.price; upgradeCharm(id); sold.add(i); SFX.ui('buy'); render(); }, render); }
          else if (g.type === 'ply') pickThread((id) => { Run.buttons -= g.price; plyThread(id); sold.add(i); render(); }, render);
        },
        reroll: () => { if (Run.buttons < rr) return SFX.ui('deny'); Run.buttons -= rr; Run.shopRolls++; stock = shopStock(); sold.clear(); SFX.ui('buy'); render(); },
        leave: () => { SFX.ui('back'); hideScreen(); finishCell(); },
      },
    });
  };
  render();
};

    dim: true, back: cancel, acts: { pick: (id) => { SFX.ui('ok'); done(id); }, cancel: () => { SFX.ui('back'); cancel(); } },

}

UI.event = function () {
  const key = eventFor();
  const ev = EVENTS[key];
  if (discover('event', key)) newFind('event', key);
  const rng = makeRng(hashStr(Run.seed + ':eventroll:' + Run.depth));
  const opts = ev.opts.map((o, i) => {
    const ok = !o.can || o.can();
    return `<button class="btn opt ${ok ? '' : 'disabled'}" data-nav ${i === 0 && ok ? 'data-focus' : ''} data-act="opt" data-arg="${i}"><b>${esc(o.label)}</b><small>${esc(o.desc)}</small></button>`;
  }).join('');
  showScreen('event', `<div class="panel"><h2>${esc(ev.title)}</h2><p class="lead">${esc(ev.text)}</p><div class="opts">${opts}</div></div>`, {
    dim: true,
    acts: {
      opt: (i) => {
        const o = ev.opts[+i];
        if (o.can && !o.can()) return SFX.ui('deny');
        SFX.ui('ok');
        const msg = o.run(rng);
        // 结果一出就记账，关掉页面再回来不能换个选项重来
        currentCell().done = true; Run.depth++; saveCheckpoint(false);
        showScreen('event', `<div class="panel"><h2>${esc(ev.title)}</h2><p class="lead">${esc(msg)}</p><div class="row2"><button class="btn primary" data-nav data-focus data-act="ok">继续</button></div></div>`, {
          dim: true, acts: { ok: () => { SFX.ui('ok'); hideScreen(); goMap(); } },
        });
      },
    },
  });
};

// 蛛约
UI.pact = function (bossCell) {
  const leave0 = () => { hideScreen(); if (bossCell) { saveCheckpoint(true); startCombat(currentCell()); } else finishCell(); };
  if (Run.pact && !Run.pact.done) {
    showScreen('pact', `<div class="panel pact"><div class="spider-head"><img class="spider" src="${spriteURL(SPR.spider, 5)}" alt=""><div><h2>喜蛛<small>你身上已经挂着「${PACT_CONDS[Run.pact.cond].name}」之约</small></h2></div></div><p class="lead">一次只能挂一个约。先去把它兑现了，再来找它。</p><div class="row2"><button class="btn" data-nav data-focus data-act="leave">离开</button></div></div>`, {
      dim: true, back: leave0, acts: { leave: () => { SFX.ui('back'); leave0(); } },
    });
    return;
  }
  // 喜蛛之后如果每条路都直通夜王，就按夜王战的条件来立
  const boss = bossCell || nextCombatIsBoss();
  const conds = pactOffers(boss);
  const stakes = stakeOptions();
  let ci = 0, si = stakes.length ? 0 : -1;
  const leave = leave0;
  const render = () => {
    const cond = conds[ci], c = PACT_CONDS[cond], mult = pactMult(cond);
    const st = stakes[si];
    const out = st ? stakeOutcome(st, mult) : null;
    showScreen('pact', `
      <div class="panel wide pact">
        <div class="spider-head"><img class="spider" src="${spriteURL(SPR.spider, 5)}" alt=""><div><h2>${bossCell ? '喜蛛垂在王座下' : '喜蛛'}<small>${bossCell ? '最后一次，押点什么吗？' : boss ? '前面就是夜王了：这一约在夜王战里兑现。' : '押上手里的东西，换更大的回报。'}</small></h2></div></div>
        <h3>约什么</h3>
        <div class="chips">${conds.map((k, i) => `<button class="chip ${i === ci ? 'on' : ''}" data-nav ${i === ci ? 'data-focus' : ''} data-act="cond" data-arg="${i}"><b>${PACT_CONDS[k].name}</b><small>×${pactMult(k)}</small></button>`).join('')}</div>
        <p class="lead">${esc(c.text(boss))}</p>
        <h3>押什么</h3>
        <div class="chips">${stakes.length ? stakes.map((s, i) => `<button class="chip ${i === si ? 'on' : ''}" data-nav data-act="stake" data-arg="${i}"><b>${esc(s.name)}</b></button>`).join('') : '<p class="note">你身上还没有能押的东西。</p>'}</div>
        ${out ? `<div class="outcome"><div class="win">约成：${esc(out.win)}</div><div class="lose">断约：${esc(out.lose)}</div></div>` : ''}
        <div class="row2"><button class="btn ghost" data-nav data-act="leave">${bossCell ? '不押，直接开打' : '不立约，离开'}</button><button class="btn primary ${st ? '' : 'disabled'}" data-nav data-act="make">立约</button></div>
      </div>`, {
      dim: true, back: leave,
      acts: {
        cond: (i) => { ci = +i; SFX.ui('tick'); render(); },
        stake: (i) => { si = +i; SFX.ui('tick'); render(); },
        make: () => { if (!st) return SFX.ui('deny'); makePact(cond, st, boss); toast(`立约「${c.name}」，押上${st.name}`, 'gold'); leave(); },
        leave: () => { SFX.ui('back'); leave(); },
      },
    });
  };
  render();
};

// 暂停：只在战斗中或地图屏响应；restore 是关掉暂停后要回到的界面
function openPause(restore) {
  if (UI.screen === 'pause' || (!Run.active && !W.active) || W.ending) return;
  if (restore === undefined) {
    if (UI.screen && UI.screen !== 'map') return; // 货郎、奇遇等界面上不响应暂停键
    restore = UI.screen === 'map' ? () => UI.map() : null;
  }
  Game.paused = true;
  const reopen = () => { UI.screen = null; openPause(restore || null); };
  const resume = () => { SFX.ui('ok'); Game.paused = false; hideScreen(); if (restore) restore(); };
  showScreen('pause', `
    <div class="panel narrow">
      <h2>暂停</h2>
      <div class="menu-col">
        <button class="btn primary" data-nav data-focus data-act="resume">继续</button>
        <button class="btn" data-nav data-act="build">构筑</button>
        <button class="btn" data-nav data-act="settings">设置</button>
        <button class="btn" data-nav data-act="help">操作说明</button>
        <button class="btn danger" data-nav data-act="quit">放弃这一夜</button>
      </div>
    </div>`, {
    dim: true,
    back: resume,
    acts: {
      resume,
      build: () => UI.build(reopen),
      settings: () => UI.settings(reopen),
      help: () => UI.help(reopen),
      quit: () => confirmBox('放弃这一夜算作失败：月丝只能带走一半，带着的香囊会遗落。确定吗？', () => { Game.paused = false; hideScreen(); abandonRun(); }, reopen),
    },
  });
}

function findLabel(f) {

// ==== 21_hud.js ====
// 抬头信息（像素绘制）与触屏按键：心、纽扣、月丝、冲刺、针法、破洞、蛛约、暂停

// 布局结果（缓冲坐标），由 layout() 填写
const LAY = {
  portrait: true, touch: false,
  top: { x: 0, y: 0, w: 0 },       // 场地上方一行
  bottom: { x: 0, y: 0, w: 0 },    // 场地下方一行
  left: null, right: null,         // 横屏时的左右栏
  dash: { x: 0, y: 0, r: 0 }, skill: { x: 0, y: 0, r: 0 }, pause: { x: 0, y: 0, r: 0 },
  joyHome: { x: 0, y: 0 },
};

// 数字 + 图标
function hudCount(spr, n, x, y, col) {
  blit(spr, x + spr.w / 2, y + spr.h / 2);
  text(String(n), x + spr.w + 3, y + (spr.h - 5) / 2, col || PAL.moon);
  return spr.w + 3 + textW(String(n)) + 6;
}
// 画心
function hudHearts(x, y, rtl) {
  const n = S.maxHearts, step = 8;
  for (let i = 0; i < n; i++) {
    const hx = rtl ? x - (i + 1) * step : x + i * step;
    const full = i < Run.hearts;
    const pulse = full && Run.hearts === 1 && Math.floor(Game.time * 3) % 2 === 0;
    blit(full ? SPR.heart : SPR.heartEmpty, hx + 4, y + 3 - (pulse ? 1 : 0), { noOutline: !full });
  }
  if (P.shield > 0) circleStroke(rtl ? x - n * step - 5 : x + n * step + 3, y + 3, 3, PAL.copperLight);
  return n * step;
}
// 冲刺次数：一根根小针
function hudDash(x, y) {
  for (let i = 0; i < S.dashCharges; i++) {
    const have = i < P.dashCharges;
    const prog = !have && i === P.dashCharges ? P.dashCD / S.dashCD : 0;
    drawNeedle(x + i * 8 + 3, y + 4, -Math.PI / 3, 9, have ? PAL.moon : PAL.hudFaint, { eye: have ? PAL.gold : PAL.hudFaint });
    if (prog > 0) for (let k = 0; k < Math.round(prog * 7); k++) pset(x + i * 8 + k, y + 10, PAL.moonDim);
  }
  return S.dashCharges * 8 + 4;
}
// 针法：一个圆章，周围是充能的点
function hudSkill(cx, cy, r) {
  const cost = skillCost(), ch = P.skillCharge, ready = ch >= cost;
  const blink = ready && Math.floor(Game.time * 4) % 2 === 0;
  circleFill(cx, cy, r, PAL.ink);
  circleFill(cx, cy, r - 1, ready ? (blink ? PAL.goldDark : PAL.cobaltDark) : PAL.hudFaint);
  const sk = SKILLS[Run.skill];
  if (sk) { const size = Math.max(10, Math.round(r * 1.35)); const m = glyphMask(sk.glyph, size, false, true, size < 12 ? 1 : 0); drawGlyph(m, cx - m.w / 2, cy - m.h / 2, ready ? PAL.goldLight : PAL.moon, PAL.ink); }
  for (let i = 0; i < cost; i++) {
    const a = -Math.PI / 2 + (i / cost) * TAU;
    pset(cx + Math.cos(a) * (r + 2), cy + Math.sin(a) * (r + 2), i < ch ? (ready ? PAL.gold : PAL.moon) : PAL.hudFaint);
  }
}
// 破洞进度
function hudHoles(x, y) {
  if (Patch.type === 'boss' || !W.holes.length) return 0;
  let i = 0;
  for (const h of W.holes) {
    const hx = x + i * 9;
    if (h.mended) { pset(hx + 3, y + 3, PAL.gold); pset(hx + 2, y + 3, PAL.moon); pset(hx + 4, y + 3, PAL.moon); pset(hx + 3, y + 2, PAL.moon); pset(hx + 3, y + 4, PAL.moon); }
    else { circleFill(hx + 3, y + 3, 3, PAL.ink); circleFill(hx + 3, y + 3, 2, PAL.violetDeep); for (let k = 0; k < h.max - h.st; k++) pset(hx + 1 + k * 2, y + 3, PAL.moon); }
    i++;
  }
  return i * 9;
}
// 连击
function hudCombo(x, y) {
  if (W.combo < 2 || W.t - W.lastKnotT > 1.6) return;
  const lv = 1 - (W.t - W.lastKnotT) / 1.6;
  text('x' + (W.combo + 1), x, y, lv > 0.4 ? PAL.gold : PAL.goldDark, PAL.ink, W.combo >= 4 ? 2 : 1);
}
// 暂停按钮
function hudPause() {
  const b = LAY.pause;
  if (!b.r) return;
  circleFill(b.x, b.y, b.r, PAL.ink);
  circleStroke(b.x, b.y, b.r, PAL.hudFaint);
  rectFill(b.x - 2, b.y - 2, 1, 5, PAL.moonDim); rectFill(b.x + 1, b.y - 2, 1, 5, PAL.moonDim);
}

// 触屏按键：摇杆、穿刺、针法
function drawTouch() {
  if (!LAY.touch) return;
  const j = Input.joy;
  const toB = (v) => (v * Gfx.dpr) / Gfx.ps;
  if (j.id !== null) {
    const ox = toB(j.ox), oy = toB(j.oy), kx = toB(j.x), ky = toB(j.y);
    const R = toB(Input.joyR);
    circleStrokeDither(ox, oy, R, PAL.moonDim, 0.6);
    circleStroke(ox, oy, 2, PAL.moonDim);
    const dx = kx - ox, dy = ky - oy, d = Math.hypot(dx, dy) || 1, m = Math.min(d, R);
    circleFill(ox + (dx / d) * m, oy + (dy / d) * m, Math.max(4, R * 0.36), PAL.moonDeep);
    circleStroke(ox + (dx / d) * m, oy + (dy / d) * m, Math.max(4, R * 0.36), PAL.moon);
  } else if (W.active && !W.ending) {
    const h = LAY.joyHome;
    circleStrokeDither(h.x, h.y, toB(Input.joyR), PAL.hudFaint, 0.5);
    circleDither(h.x, h.y, 3, PAL.hudFaint, 0.6);
  }
  // 穿刺
  const d = LAY.dash, pressed = Input.btnTouch.dash !== null, ok = P.dashCharges > 0;
  circleFill(d.x, d.y, d.r, pressed ? PAL.moonDeep : PAL.ink);
  circleStroke(d.x, d.y, d.r, ok ? PAL.moon : PAL.hudFaint);
  if (!ok) { const prog = P.dashCD / S.dashCD; const n = Math.round(TAU * d.r); for (let i = 0; i < n * prog; i++) { const a = -Math.PI / 2 + (i / n) * TAU; pset(d.x + Math.cos(a) * d.r, d.y + Math.sin(a) * d.r, PAL.moonDim); } }
  drawNeedle(d.x, d.y, -Math.PI / 4, d.r * 1.1, ok ? PAL.moon : PAL.moonDeep);
  if (S.dashCharges > 1) text(String(P.dashCharges), d.x + d.r - 4, d.y - d.r, PAL.moon);
  // 针法
  const s = LAY.skill;
  hudSkill(s.x, s.y, s.r);
  if (Input.btnTouch.skill !== null) circleStroke(s.x, s.y, s.r + 1, PAL.moon);
}

// 整个抬头信息（onMap 为真时只画心与资源，例如在地图上）
function drawHud(onMap) {
  setOrigin(0, 0);
  if (LAY.portrait) {
    const t = LAY.top;
    hudHearts(t.x, t.y, false);
    let x = t.x + t.w - 2;
    const sw = textW(String(Run.silk)) + SPR.iconSilk.w + 3, bw = textW(String(Run.buttons)) + SPR.iconBtn.w + 3;
    x -= sw; hudCount(SPR.iconSilk, Run.silk, x, t.y, PAL.moonDim);
    x -= bw + 8; hudCount(SPR.iconBtn, Run.buttons, x, t.y, PAL.gold);
    const b = LAY.bottom;
    let bx = b.x;
    if (onMap) { setOrigin(0, 0); hudPause(); return; }
    bx += hudDash(bx, b.y) + 4;
    if (!LAY.touch) { hudSkill(bx + 7, b.y + 4, 6); bx += 20; }
    bx += hudHoles(bx, b.y) + 6;
    if (Run.pact && Run.pact.active) blit(SPR.spider, b.x + b.w - 6, b.y + 3, {});
  } else {
    const l = LAY.left, r = LAY.right;
    hudHearts(l.x + l.w, l.y, true);
    hudCount(SPR.iconBtn, Run.buttons, r.x, r.y, PAL.gold);
    hudCount(SPR.iconSilk, Run.silk, r.x, r.y + 10, PAL.moonDim);
    if (onMap) { setOrigin(0, 0); hudPause(); return; }
    hudDash(l.x + l.w - S.dashCharges * 8 - 2, l.y + 12);
    if (!LAY.touch) hudSkill(l.x + l.w - 12, l.y + 38, 10);
    hudHoles(r.x, r.y + 22);
    if (Run.pact && Run.pact.active) blit(SPR.spider, r.x + 5, r.y + 38, {});
  }
  setOrigin(Gfx.ax, Gfx.ay);
  hudCombo(4, ARENA - 9);
  setOrigin(0, 0);
  hudPause();
  drawTouch();
}

// HTML 文字条放到场地附近
function positionHud() {
  const el = document.getElementById('hud');
  if (!el) return;
  const k = Gfx.ps / Gfx.dpr;
  const left = Gfx.ax * k, top = Gfx.ay * k, w = ARENA * k;
  el.style.left = left + 'px';
  el.style.width = w + 'px';
  const side = (Gfx.ax - 8) * k;
  el.classList.toggle('side', !LAY.portrait && side >= 150);
  if (LAY.portrait) el.style.top = (top + w + 16 * k) + 'px';
  else if (side >= 150) { const lx = left + w + 10 * k; el.style.left = lx + 'px'; el.style.width = Math.min(260, window.innerWidth - lx - 12) + 'px'; el.style.top = (top + 56 * k) + 'px'; }
  else el.style.top = (top + 4 + (W.bosses.length ? 22 * k : 0)) + 'px';
  // 提示气泡：战斗中放在场地下方（竖屏）或左侧栏（横屏）
  const ts = document.getElementById('toasts');
  if (ts) {
    if (Scene.name !== 'combat') { ts.style.cssText = ''; }
    else if (LAY.portrait) { ts.style.cssText = `top:${top + w + 46 * k}px;`; }
    else if (side >= 150) { ts.style.cssText = `left:${side / 2 + 4}px;top:${top + 70 * k}px;width:${Math.min(260, side - 12)}px;transform:translateX(-50%);`; }
  }
}

// 场景：标题（绣出来的标题与自动画圈的针）、百衲被地图、拼布结算图、新手引导

const Scene = {
  name: 'title', t: 0, mapHover: null,
  titleBG: null, quiltBG: null,
  demo: null,
  trans: 0,
  set(n) { if (this.name !== n) { this.name = n; this.t = 0; this.trans = 0.32; } if (n === 'title' || n === 'map') { W.active = false; syncHudText(); } positionHud(); },
};

// 整屏的拼布底：一块块不同颜色的布 + 一目刺 + 缝线
function genQuiltBG(seed) {
  const buf = new Uint32Array(SBW * SBH);
  const rng = makeRng(seed);
  const cell = 44;
  setTarget(buf, SBW, SBH);
  const ox = (Gfx.ax % cell) - cell, oy = (Gfx.ay % cell) - cell;
  for (let gy = oy; gy < SBH; gy += cell) for (let gx = ox; gx < SBW; gx += cell) {
    const cl = rng.pick(CLOTHS);
    const base = mixC(cl.pb, PAL.outer, 0.45), ln = mixC(cl.pl, PAL.outer, 0.45);
    rectFill(gx, gy, cell, cell, base);
    const g = 6, rows = [], cols = [];
    for (let i = 0; i < 9; i++) { rows.push(rng.chance(0.5) ? 1 : 0); cols.push(rng.chance(0.5) ? 1 : 0); }
    for (let r = 1; r < cell / g; r++) for (let j = 0; j < cell / g; j++) if ((j + rows[r]) % 2 === 0) for (let x = j * g + 1; x < (j + 1) * g; x++) pset(gx + x, gy + r * g, ln);
    for (let c = 1; c < cell / g; c++) for (let j = 0; j < cell / g; j++) if ((j + cols[c]) % 2 === 0) for (let y = j * g + 1; y < (j + 1) * g; y++) pset(gx + c * g, gy + y, ln);
    // 缝线
    for (let i = 0; i < cell; i++) { pset(gx + i, gy, PAL.ink); pset(gx, gy + i, PAL.ink); if (i % 4 < 2) { pset(gx + i, gy + 1, PAL.outerHem); pset(gx + 1, gy + i, PAL.outerHem); } }
  }
  resetTarget();
  return buf;
}
// 场地外的底：深色布 + 场地四周的布边
function genOuterBG() {
  const buf = Gfx.outer;
  buf.fill(PAL.outer);
  setTarget(buf, SBW, SBH);
  const g = 8;
  for (let y = 0; y < SBH; y += g) for (let x = 0; x < SBW; x += g) if (((x / g) + (y / g)) % 2 === 0) { for (let i = 1; i < g; i++) pset(x + i, y, PAL.outerLine); } else { for (let i = 1; i < g; i++) pset(x, y + i, PAL.outerLine); }
  const ax = Gfx.ax, ay = Gfx.ay;
  rectFill(ax - 3, ay - 3, ARENA + 6, ARENA + 6, PAL.ink);
  for (let i = -3; i < ARENA + 3; i++) if ((i & 3) < 2) { pset(ax + i, ay - 4, PAL.outerHem); pset(ax + i, ay + ARENA + 3, PAL.outerHem); pset(ax - 4, ay + i, PAL.outerHem); pset(ax + ARENA + 3, ay + i, PAL.outerHem); }
  resetTarget();
}

// ---------- 标题 ----------
// 自动画圈的演示针：沿着花瓣曲线移动，线自交就打结（只为好看，不计分）
function demoInit() {
  Scene.demo = { th: makeThread('demo'), t: 0, knots: [], moths: [] };
  const d = Scene.demo;
  for (let i = 0; i < 9; i++) d.moths.push({ x: frand(20, ARENA - 20), y: frand(90, ARENA - 20), a: frand(0, 9), alive: true, rt: 0 });
}
function demoUpdate(dt) {
  const d = Scene.demo;
  d.t += dt;
  const t = d.t * 0.9;
  const cx = ARENA / 2, cy = 128;
  const x = cx + Math.sin(t * 1.0) * 62 + Math.sin(t * 2.3) * 14;
  const y = cy + Math.sin(t * 1.6 + 1) * 34 + Math.cos(t * 2.9) * 8;
  d.px = d.x; d.py = d.y; d.x = x; d.y = y;
  if (d.px !== undefined) d.face = Math.atan2(y - d.py, x - d.px);
  threadPush(d.th, x, y, 230, 40, (poly) => {
    const area = Math.abs(polyArea(poly));
    const c = polyCentroid(poly);
    d.knots.push({ poly, cx: c[0], cy: c[1], t: 0, area });
    let n = 0;
    for (const m of d.moths) if (m.alive && pointInPoly(m.x, m.y, poly)) { m.alive = false; m.rt = 2.5; n++; fluff(m.x, m.y, 6, PAL.moth); }
    if (AU.ready && Scene.name === 'title') { pluck(scaleNote(5 + (d.knots.length % 6), 50), auNow(), n ? 0.16 : 0.08, { rev: 0.4, kind: 'harp' }); }
  });
  for (const k of d.knots) k.t += dt;
  d.knots = d.knots.filter((k) => k.t < 0.6);
  for (const m of d.moths) {
    m.a += dt;
    if (!m.alive) { m.rt -= dt; if (m.rt <= 0) { m.alive = true; m.x = frand(20, ARENA - 20); m.y = frand(90, ARENA - 20); } continue; }
    m.x += Math.sin(m.a * 1.3) * 8 * dt; m.y += Math.cos(m.a * 1.1) * 6 * dt;
  }
}
function demoDraw() {
  const d = Scene.demo;
  for (const m of d.moths) if (m.alive) blit(Math.floor(m.a * 8) % 2 ? SPR.moth0 : SPR.moth1, m.x, m.y);
  drawThreadLine(d.th, d.x, d.y, [PAL.moon]);
  for (const k of d.knots) {
    const p = k.poly, sc = 1 - 0.5 * Math.min(1, k.t / 0.1);
    for (let i = 0; i < p.length; i += 2) {
      const ax = k.cx + (p[i] - k.cx) * sc, ay = k.cy + (p[i + 1] - k.cy) * sc;
      const bx = k.cx + (p[(i + 2) % p.length] - k.cx) * sc, by = k.cy + (p[(i + 3) % p.length] - k.cy) * sc;
      if (k.t < 0.1) line(ax, ay, bx, by, PAL.white); else pdither(ax, ay, PAL.moon, 1 - k.t / 0.6);
    }
  }
  if (d.x !== undefined) drawNeedle(d.x, d.y, d.face || 0, 9, PAL.moon);
}
