<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">公司 Agent 自动化测试整体流程</title>
  <desc id="desc">展示正在接入的 Gerrit 前置分析、已经接入的整体能力、Workflow Mock 可本地模拟的两条核心工作流，以及正在接入的长日志分析和自动提单。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9ec"/>
      <stop offset="1" stop-color="#f1e6d0"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3df"/>
      <stop offset="1" stop-color="#dce8cc"/>
    </linearGradient>
    <linearGradient id="orangePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d8"/>
      <stop offset="1" stop-color="#f5dcc0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6d604a" flood-opacity=".18"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#6c8254"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#d58232"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #344036; }
      .group-title { font-size: 34px; font-weight: 700; }
      .group-note { font-size: 21px; fill: #667064; }
      .node-title { font-size: 23px; font-weight: 650; text-anchor: middle; }
      .node-note { font-size: 18px; fill: #6d746c; text-anchor: middle; }
      .lane-title { font-size: 25px; font-weight: 700; }
      .legend { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #6b746a; }
    </style>
  </defs>

  <rect width="1800" height="1300" rx="34" fill="url(#paper)"/>
  <path d="M45 84H1755" stroke="#d8cbb2" stroke-width="2"/>
  <text x="70" y="58" font-size="27" font-weight="700">Agent 自动化测试：整体能力、接入状态与本地模拟范围</text>
  <g transform="translate(1130 30)">
    <circle cx="10" cy="12" r="9" fill="#71885b"/><text class="legend" x="30" y="20">已接入</text>
    <circle cx="150" cy="12" r="9" fill="#e38a32"/><text class="legend" x="170" y="20">正在接入</text>
    <rect x="310" y="2" width="20" height="20" rx="4" fill="none" stroke="#5682a7" stroke-width="3" stroke-dasharray="5 4"/>
    <text class="legend" x="342" y="20">可本地模拟</text>
  </g>

  <!-- 正在接入的前置流程 -->
  <g filter="url(#shadow)">
    <rect x="55" y="110" width="1690" height="235" rx="28" fill="url(#orangePanel)" stroke="#e7b978" stroke-width="2"/>
  </g>
  <text class="group-title" x="85" y="157">正在接入的前置流程</text>
  <text class="group-note" x="85" y="188">在核心执行之前，先根据版本改动决定本次需要测试什么。</text>

  <g>
    <rect x="85" y="220" width="235" height="85" rx="18" fill="#fffaf0" stroke="#dea257" stroke-width="2"/>
    <text class="node-title" x="202" y="257">发现新版本</text><text class="node-note" x="202" y="286">发版监测</text>
    <path d="M322 262H355" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>

    <rect x="365" y="220" width="235" height="85" rx="18" fill="#fffaf0" stroke="#dea257" stroke-width="2"/>
    <text class="node-title" x="482" y="257">Gerrit 差异</text><text class="node-note" x="482" y="286">比较前后版本</text>
    <path d="M602 262H635" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>

    <rect x="645" y="220" width="235" height="85" rx="18" fill="#fffaf0" stroke="#dea257" stroke-width="2"/>
    <text class="node-title" x="762" y="257">改动 JSON</text><text class="node-note" x="762" y="286">整理模块与范围</text>
    <path d="M882 262H915" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>

    <rect x="925" y="220" width="235" height="85" rx="18" fill="#fffaf0" stroke="#dea257" stroke-width="2"/>
    <text class="node-title" x="1042" y="257">回归判断</text><text class="node-note" x="1042" y="286">P0／P1／P2</text>
    <path d="M1162 262H1195" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>

    <rect x="1205" y="220" width="235" height="85" rx="18" fill="#fffaf0" stroke="#dea257" stroke-width="2"/>
    <text class="node-title" x="1322" y="257">创建测试任务</text><text class="node-note" x="1322" y="286">模块与测试量</text>
    <path d="M1442 262H1475" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>

    <rect x="1485" y="220" width="230" height="85" rx="18" fill="#fff6e7" stroke="#b96f45" stroke-width="3"/>
    <text class="node-title" x="1600" y="257">负责人确认</text><text class="node-note" x="1600" y="286">◆ 必须人工确认</text>
  </g>

  <path d="M900 345V384" stroke="#d58232" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <!-- 已接入整体能力 -->
  <g filter="url(#shadow)">
    <rect x="55" y="395" width="1690" height="635" rx="28" fill="url(#greenPanel)" stroke="#a9bd8c" stroke-width="2"/>
  </g>
  <text class="group-title" x="85" y="445">已经接入的整体能力</text>
  <text class="group-note" x="85" y="476">实际工作中已经使用的能力范围，大于下面能够公开、本地模拟的部分。</text>

  <g>
    <rect x="85" y="510" width="205" height="82" rx="17" fill="#fbfdf5" stroke="#8ca36f" stroke-width="2"/>
    <text class="node-title" x="187" y="545">版本初始化</text><text class="node-note" x="187" y="574">SDK 与平台环境</text>
    <path d="M292 551H320" stroke="#6c8254" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <rect x="330" y="510" width="205" height="82" rx="17" fill="#fbfdf5" stroke="#8ca36f" stroke-width="2"/>
    <text class="node-title" x="432" y="545">编译准备</text><text class="node-note" x="432" y="574">SDK／TestCase／AXP</text>
    <path d="M537 551H565" stroke="#6c8254" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <rect x="575" y="510" width="205" height="82" rx="17" fill="#fbfdf5" stroke="#8ca36f" stroke-width="2"/>
    <text class="node-title" x="677" y="545">读取任务</text><text class="node-note" x="677" y="574">测试单与问题单</text>
    <path d="M782 551H810" stroke="#6c8254" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <rect x="820" y="510" width="205" height="82" rx="17" fill="#fbfdf5" stroke="#8ca36f" stroke-width="2"/>
    <text class="node-title" x="922" y="545">SOC 烧录</text><text class="node-note" x="922" y="574">版本与测试产物</text>
    <path d="M1027 551H1055" stroke="#6c8254" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <rect x="1065" y="510" width="205" height="82" rx="17" fill="#fbfdf5" stroke="#8ca36f" stroke-width="2"/>
    <text class="node-title" x="1167" y="545">执行测试</text><text class="node-note" x="1167" y="574">Agent 观察板端</text>
    <path d="M1272 551H1300" stroke="#6c8254" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <rect x="1310" y="510" width="205" height="82" rx="17" fill="#fbfdf5" stroke="#8ca36f" stroke-width="2"/>
    <text class="node-title" x="1412" y="545">报告与记录</text><text class="node-note" x="1412" y="574">保存结果与证据</text>
    <path d="M1517 551H1545" stroke="#6c8254" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <rect x="1555" y="510" width="160" height="82" rx="17" fill="#f8fcf0" stroke="#668356" stroke-width="3"/>
    <text class="node-title" x="1635" y="545">钉钉通知</text><text class="node-note" x="1635" y="574">单向反馈</text>
  </g>

  <!-- 本地模拟子集 -->
  <rect x="85" y="630" width="1630" height="350" rx="24" fill="#f8fbf4" fill-opacity=".78" stroke="#5682a7" stroke-width="4" stroke-dasharray="12 9"/>
  <text class="lane-title" x="115" y="680">Workflow Mock：可以在本地模拟的核心子集</text>
  <text class="small" x="115" y="711">共用 Jenkins、Init、Jira、SOC、Notify 五个 Docker 实例，以及相同的版本初始化、编译、烧录和报告能力。</text>

  <rect x="115" y="748" width="1570" height="92" rx="18" fill="#edf4fa" stroke="#8fb0c9" stroke-width="2"/>
  <text class="lane-title" x="145" y="786">问题单验证</text>
  <text class="node-title" x="500" y="789">读取问题单</text>
  <path d="M615 794H700" stroke="#5682a7" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="node-title" x="825" y="789">准备步骤与附件</text>
  <path d="M950 794H1035" stroke="#5682a7" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="node-title" x="1160" y="789">SOC 验证</text>
  <path d="M1275 794H1360" stroke="#5682a7" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="node-title" x="1490" y="789">验证报告</text>

  <rect x="115" y="864" width="1570" height="92" rx="18" fill="#edf4fa" stroke="#8fb0c9" stroke-width="2"/>
  <text class="lane-title" x="145" y="902">固定版本测试</text>
  <text class="node-title" x="500" y="905">读取 Test Plan</text>
  <path d="M615 910H700" stroke="#5682a7" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="node-title" x="825" y="905">准备测试任务</text>
  <path d="M950 910H1035" stroke="#5682a7" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="node-title" x="1160" y="905">SOC 执行用例</text>
  <path d="M1275 910H1360" stroke="#5682a7" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text class="node-title" x="1490" y="905">回写结果</text>

  <path d="M900 1030V1069" stroke="#d58232" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <!-- 后置与独立能力 -->
  <g filter="url(#shadow)">
    <rect x="55" y="1080" width="1320" height="165" rx="26" fill="url(#orangePanel)" stroke="#e7b978" stroke-width="2"/>
  </g>
  <text class="lane-title" x="85" y="1122">正在接入的后置流程</text>
  <g>
    <text class="node-title" x="205" y="1186">日志包</text>
    <path d="M285 1180H365" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <text class="node-title" x="495" y="1186">算法预处理</text>
    <path d="M605 1180H685" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <text class="node-title" x="815" y="1186">Agent 分析</text>
    <path d="M915 1180H995" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <text class="node-title" x="1115" y="1186">提单 JSON</text>
    <path d="M1215 1180H1270" stroke="#d58232" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <text class="node-title" x="1315" y="1186">自动提单</text>
  </g>

  <rect x="1410" y="1080" width="335" height="165" rx="26" fill="#edf4fa" stroke="#8fb0c9" stroke-width="2"/>
  <text class="lane-title" x="1440" y="1122">独立辅助能力</text>
  <text x="1440" y="1164" font-size="21">• 客户问题质量分析</text>
  <text x="1440" y="1202" font-size="21">• 测试设计辅助</text>
  <text class="small" x="1440" y="1230">结论仍需人工确认</text>
</svg>
